# Authority links: prefix of a KG id -> URL template ({id} = local part after the prefix).
authority_links:
  Q: "https://www.wikidata.org/wiki/{qid}"
  chebi: "https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:{id}"
  hgnc: "https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:{id}"
  mondo: "http://purl.obolibrary.org/obo/MONDO_{id}"
  doid: "http://purl.obolibrary.org/obo/DOID_{id}"
  hp: "http://purl.obolibrary.org/obo/HP_{id}"
  efo: "http://www.ebi.ac.uk/efo/EFO_{id}"
  uberon: "http://purl.obolibrary.org/obo/UBERON_{id}"
  cl: "http://purl.obolibrary.org/obo/CL_{id}"
  chembl: "https://www.ebi.ac.uk/chembl/explore/compound/{id}"
  lei: "https://search.gleif.org/#/record/{id}"
  gbif: "https://www.gbif.org/species/{id}"
  ncbitaxon: "https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id={id}"
  uniprot: "https://www.uniprot.org/uniprotkb/{id}"
  mesh: "https://meshb.nlm.nih.gov/record/ui?ui={id}"
  unii: "https://precision.fda.gov/uniisearch/srs/unii/{id}"
  ucdp: "https://ucdp.uu.se/conflict/{last}"
  pubchem: "https://pubchem.ncbi.nlm.nih.gov/compound/{last}"
  glottolog: "https://glottolog.org/resource/languoid/id/{id}"
  openalex: "https://openalex.org/{last}"
  gppd: "https://datasets.wri.org/dataset/globalpowerplantdatabase"
  usgs_myb: "https://www.usgs.gov/centers/national-minerals-information-center"

# External-id literal values -> URL template ({v} = the value; for "PREFIX:code" values the map key is the prefix).
value_links:
  "unichem:drugbank_id": "https://go.drugbank.com/drugs/{v}"
  "eml:drugbank_id": "https://go.drugbank.com/drugs/{v}"
  "hgnc:ensembl_gene_id": "https://www.ensembl.org/id/{v}"
  "hgnc:ncbi_gene_id": "https://www.ncbi.nlm.nih.gov/gene/{v}"
  "chembl:atc_code": "https://atcddd.fhi.no/atc_ddd_index/?code={v}"
  "eml:atc_code": "https://atcddd.fhi.no/atc_ddd_index/?code={v}"
  "gleif:opencorporates_id": "https://opencorporates.com/companies/{v}"
  "OMIM": "https://omim.org/entry/{v}"
  "MESH": "https://meshb.nlm.nih.gov/record/ui?ui={v}"
  "ICD10WHO": "https://icd.who.int/browse10/2019/en#/{v}"
  "NCIT": "https://evsexplore.semantics.cancer.gov/evsexplore/concept/ncit/{v}"
  "UMLS": "https://uts.nlm.nih.gov/uts/umls/concept/{v}"
