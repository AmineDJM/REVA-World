# Coverage map of the 35 non-negotiable invariants (architecture §24.1).
#
# For every invariant: where it is enforced (file + symbol: DB constraint/trigger/
# function, code, import-linter contract, policy, document) and the pytest node
# ids that fail if it is broken. Validated by tests/invariants/test_coverage_map.py
# (35 entries, every node id collected by pytest, every enforcement file exists
# and contains its symbol). The human-readable table is docs/data_constitution.md.
#
# status:
#   proven             the cited tests fail if the invariant is broken on every V1 path
#   partially_proven   tested for some paths; `gaps` says what is not, `owner` who closes it
#   unproven           no test proves it; `owner` and `reason` required
#   not_applicable_v1  V1 has no path where it can be violated; `reason` required
# Parametrized tests are cited without their parameter suffix. A test marked
# xfail is cited under `xfail` (never under `tests`) and keeps the status partial.
schema: reva-invariant-coverage/1
spec: "architecture §24.1 Non-negotiable invariants"
constitution: docs/data_constitution.md
invariants:
  - id: 1
    text: No published numerical result without complete provenance or an explicit missing-provenance blocker.
    status: proven
    reason: >-
      Estimates cannot be published without a provenance activity reaching verified raw bytes; the provenance
      API walks every result to raw artifacts and selectors. UI drill-through is covered separately by ui/e2e (agent F).
    enforcement:
      - {file: migrations/versions/0003_belief_graph.py, symbol: "ops.check_publication", kind: db_function}
      - {file: migrations/versions/0003_belief_graph.py, symbol: "publication_verified", kind: db_trigger}
      - {file: migrations/versions/0001_kernel.py, symbol: "meta.artifact_is_verified", kind: db_function}
      - {file: migrations/versions/0002_evidence.py, symbol: "evidence.check_acquisition_artifact", kind: db_function}
      - {file: src/reva/evidence/ingest.py, symbol: "publish_acquisition", kind: code}
      - {file: src/reva/api/routes/provenance.py, symbol: "router", kind: code}
    tests:
      - tests/security/test_roles_grants.py::test_publication_rejects_estimates_without_provenance
      - tests/security/test_roles_grants.py::test_publication_rejects_unverified_artifacts
      - tests/security/test_roles_grants.py::test_acquisition_requires_verified_raw_bytes
      - tests/security/test_roles_grants.py::test_observation_must_agree_with_its_acquisition
      - tests/security/test_roles_grants.py::test_provenance_cycles_rejected
      - tests/security/test_db_hardening.py::test_sim_cannot_attach_provenance_to_source_activities
