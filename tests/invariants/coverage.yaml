  - id: 30
    text: No external egress, LLM or scientific computation beyond the configured budget.
    status: partially_proven
    reason: >-
      Daily egress budgets (registry/policies/budgets.yaml) are enforced through the persistent ledger
      ops.budget_ledger on every live provider request path in src/reva: CLI `reva ingest --live`, worker
      ingest jobs (which scheduled ingests enqueue) and autonomy discovery reserve before the first request,
      ingest runs meter every request against the ledger (top-up under the lock or refusal without calling
      the transport) and settle actual requests/bytes afterwards; fixture runs are never charged. Budgets are
      keyed by registered source keys (connector -> descriptor source_key via budget_source_key; accounts
      from one account_key function); an unknown source or a limit of 0 is refused. Every egress reservation
      takes one advisory lock, so racing ingest/discovery reservations cannot exceed a shared cap; days are
      UTC on the database clock. Connector repair and the scheduler make no provider request themselves.
      Per-run request budgets stop the connector runner, LLM drafting is capped per day in the persistent ledger (budgets.yaml llm.scenario_drafts), external
      runner budgets must be bounded and CPU threads are explicitly budgeted.
    gaps: >-
      Operator scripts outside src/reva (scripts/live_source_checks.py, scripts/demo_workflow.py in live
      mode) create live clients against fresh throwaway databases without reserving against a persistent
      ledger; they are bounded only by per-run FetchBudget defaults (the static path scan covers src/reva
      only). The `requests` unit counts logical provider requests: the HTTP client's bounded internal retries
      (max_attempts) and redirects (max_redirects) per request are not charged separately. A run that crashes
      before settling keeps its reservation counted (fails closed, may under-use the budget).
    owner: "agent I (scripts/live_source_checks.py, scripts/demo_workflow.py) with lead (evidence/runner.py)"
    enforcement:
      - {file: src/reva/operations/budgets.py, symbol: "def reserve_ingest", kind: code}
      - {file: src/reva/operations/budgets.py, symbol: "class MeteredHttp", kind: code}
      - {file: src/reva/operations/budgets.py, symbol: "def account_key", kind: code}
      - {file: src/reva/operations/budgets.py, symbol: "BUDGET_LOCK_KEY", kind: code}
      - {file: src/reva/operations/budgets.py, symbol: "DAY_START_SQL", kind: code}
      - {file: src/reva/autonomy/budget.py, symbol: "reserve_egress", kind: code}
