  - id: 13
    text: No source-family duplicates counted as independent evidence.
    status: partially_proven
    reason: >-
      V1 never pools or vote-counts: selection chooses one lineage by preference, agreeing duplicates (same
      lineage family) neither change the value nor narrow/upgrade its uncertainty, stay visible as alternatives
      and are flagged; each estimate names exactly one observation. Evaluator independence is enforced for gates.
    gaps: >-
      evidence.source.lineage_family and evidence.effect.dependency_family are recorded but no code consumes them
      (there is no pooling/meta-analysis in V1); a family-aware independence rule must be added and tested before
      any multi-source combination or evidence-weighting is introduced.
    owner: "lead (belief/evidence) when pooling or evidence weighting is implemented"
    enforcement:
      - {file: src/reva/belief/selection.py, symbol: "select_report", kind: code}
      - {file: src/reva/belief/selection.py, symbol: "multiple_lineages_same_source", kind: code}
