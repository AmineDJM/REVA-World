      - {file: migrations/versions/0006_operations.py, symbol: "CREATE TABLE ops.budget_ledger", kind: db_table}
      - {file: registry/policies/budgets.yaml, symbol: "per_source_daily_requests", kind: policy}
      - {file: src/reva/evidence/runner.py, symbol: "request budget exhausted", kind: code}
      - {file: src/reva/autonomy/discovery.py, symbol: "budget.max_requests", kind: code}
