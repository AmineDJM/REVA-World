# Deterministic offline checks for every pull request and push to main.
#
# * Actions are pinned by full commit SHA (tag in the trailing comment; re-resolved
#   with `git ls-remote` on 2026-10-15). The PostGIS service is pinned by digest
#   (same digest as compose.yaml).
# * Nothing here contacts a data provider: pytest deselects `live` (and `perf`)
#   tests, and the pytest/e2e steps run behind an unreachable HTTP(S) proxy so a
#   stray provider request fails instead of silently going live. Live provider
#   checks are in live-smoke.yml (scheduled/manual only).
# * Package registries (PyPI, npm, Docker Hub, GHCR, Playwright CDN, Ubuntu apt)
#   are contacted only by install/audit/build steps.
# * render.yaml uses `autoDeployTrigger: checksPass`, so on main these checks gate
#   the Render deploy that Render itself performs (no Render credentials here).
# Local equivalents: `make lint typecheck registry blueprint test ui e2e` (docs/dev/ci_check.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every main commit is checked (Render waits on it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  static:
    name: lint, types, boundaries, contracts, blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (strict, kernel + ports)
        run: uv run mypy -p reva.kernel -p reva.ports
      - name: Import boundaries (import-linter)
        run: uv run python scripts/verify_imports.py
      - name: Registry, JSON Schemas, scenario example, OpenAPI
        run: uv run python scripts/validate_contracts.py
      - name: Render Blueprint (cached official schema + REVA rules; no download)
        run: uv run python scripts/validate_blueprint.py

  tests:
    name: pytest (PostgreSQL 17 + PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # postgis/postgis:17-3.5 (same digest as compose.yaml). Credentials are the
        # throwaway local ones from .env.example, which tests/conftest.py reads.
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_DB: reva
          POSTGRES_USER: reva_owner
          POSTGRES_PASSWORD: local_reva_owner_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reva_owner -d reva"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Local-only configuration (CI throwaway credentials)
        # REVA_MIGRATION_DATABASE_URL=postgresql://reva_owner:...@127.0.0.1:5432/reva and the
        # runtime role passwords; the db fixture creates its own reva_test_<hex> database.
        # REVA_ROLE_CONNECTION_LIMIT stays unset: -1 (unlimited) outside production.
        run: cp .env.example .env
      - name: Tools for the backup/restore test (age, age-keygen)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends age
      - name: Upgrade from the previous migration (0006 -> head) on a fresh database
        env:
          REVA_PG_CONTAINER: ${{ job.services.postgres.id }}
          REVA_MIGRATION_DATABASE_URL: postgresql://reva_owner:local_reva_owner_only@127.0.0.1:5432/reva_upgrade
          REVA_DB_NAME: reva_upgrade
        run: |
          docker exec "$REVA_PG_CONTAINER" psql -U reva_owner -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE reva_upgrade"
          uv run alembic upgrade 0006_operations
          test "$(uv run alembic current 2>/dev/null | awk 'NF{print $1}' | tail -1)" = 0006_operations
          # Head is applied by the real pre-deploy entrypoint, as on Render (API service env).
          REVA_PROCESS_ROLE=api uv run python scripts/bootstrap_runtime.py
          test "$(uv run alembic current 2>/dev/null | awk 'NF{print $1}' | tail -1)" = "$(uv run alembic heads 2>/dev/null | awk 'NF{print $1}' | tail -1)"
          docker exec "$REVA_PG_CONTAINER" psql -U reva_owner -d postgres -c "DROP DATABASE reva_upgrade WITH (FORCE)"
      - name: pytest (offline; live and perf deselected)
        env:
          # The runner's pg_dump (16) is older than the server (17): the backup/restore
          # test runs pg_dump/pg_restore inside the service container instead.
          REVA_PG_CONTAINER: ${{ job.services.postgres.id }}
          # Network guard: any proxied HTTP(S) request outside localhost fails fast.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: >-
          uv run --offline pytest -q -m "not live and not perf" -p no:cacheprovider
          --junitxml=var/junit.xml -o junit_family=xunit1
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: var/junit.xml
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test -- --run
      - run: npm --prefix ui run build
      - name: npm audit (runtime dependencies, high and above)
        run: npm --prefix ui audit --omit=dev --audit-level=high
      - name: UI licence scan (production dependencies; strong copyleft fails)
        working-directory: ui
        run: >-
          npx --yes license-checker@25.0.1 --production --summary --excludePrivatePackages
          --failOn "GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later"

  e2e:
    name: UI end-to-end (Playwright, Chromium) against a disposable stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # postgis/postgis:17-3.5 (same digest as compose.yaml)
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_DB: reva
          POSTGRES_USER: reva_owner
          POSTGRES_PASSWORD: local_reva_owner_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reva_owner -d reva"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --frozen --all-extras
      - run: npm --prefix ui ci
      - name: Browser location (scripts/e2e_stack.py otherwise defaults to the dev container's /opt/pw-browsers)
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/pw-browsers" >> "$GITHUB_ENV"
      - name: Chromium for the locked @playwright/test version (+ system dependencies)
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: Playwright suite (scripts/e2e_stack.py builds the UI, loads offline fixtures, serves API + worker, tears down)
        env:
          # Scheduler/invalidation are off in the stack; the guard catches any other egress.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: uv run --offline python scripts/e2e_stack.py --run
      - name: Upload Playwright failure artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Python dependency vulnerabilities and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Export the locked runtime requirements (with hashes)
        run: |
          mkdir -p var
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o var/requirements.txt
      - name: pip-audit (runtime lock)
        run: uvx pip-audit@2.10.1 --strict --disable-pip -r var/requirements.txt
      - name: Python licence scan (runtime dependencies; strong copyleft fails)
        run: >-
          uv run --no-dev --with pip-licenses==5.5.5 pip-licenses --summary
          --ignore-packages reva-world
          --fail-on "GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later"

  image:
    name: Docker image build + non-root smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build --build-arg "REVA_GIT_COMMIT=${GIT_SHA}" -t reva-world:ci .
      - name: Non-root smoke
        run: |
          docker run --rm --network none -e REVA_ENV=test reva-world:ci sh -c '
            set -e
            test "$(id -u)" != 0
            python -c "import reva.api.app, reva.operations.worker, reva.cli.bootstrap"
            test -f /app/src/reva/api/static/index.html
            ! command -v gcc
            ! touch /app/src/write-probe 2>/dev/null
            echo smoke-ok'
      - name: Image size
        run: docker image inspect reva-world:ci --format '{{.Size}}'
