claim_year_semantics:
  rule: attained_once
  derivation: verbatim
  citation:
    source_id: nl_aow_7a
    legal_reference: AOW art. 7a lid 1, closing sentence
    locator: Op pensioengerechtigden die in een bepaald kalenderjaar de pensioengerechtigde leeftijd hebben bereikt
      zijn de pensioengerechtigde leeftijd en de aanvangsleeftijd in de kalenderjaren daarna niet van toepassing.
  note: A person who reached the AOW age of a calendar year stays eligible; the higher age of later years is not
    re-applied (e.g. born August 1950 - 65 years 3 months reached in November 2015 - stays eligible in January 2016
    when the 2016 age is 65 years 6 months).
