notes: Official consolidated text from wetten.overheid.nl (Algemene Ouderdomswet, art. 7a, 'Geldend van 01-07-2026').
  The AOW age is fixed per calendar year in the law up to 2025; for 2026 onwards it is set yearly by regulation
  using the life-expectancy formula of art. 7a(2). Those regulation values are NOT archived, so the in-force path
  has no row after 2025 (coverage gap, never extrapolated).
model_lever:
  age_kind: state_pension_age
  rationale: The AOW pensioengerechtigde leeftijd is the only age at which the state old-age pension starts (no
    early claim).
  qualification: The AOW age has no early-claim route, but the pension-receipt drop is approximated by LFS
    inactivity (proxy of unknown direction), while AOW entitlement is residence-based rather than tied to leaving
    the labour force.
