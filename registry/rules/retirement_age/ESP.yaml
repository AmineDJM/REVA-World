- path_id: pre_2013_counterfactual
  label: 'Counterfactual: ordinary age 65 in every year (no Ley 27/2011 phase-in)'
  status: counterfactual
  description: The 65-year age that DT 7ª keeps for the long-contribution track, applied to every year and both
    tracks.
- path_id: law_in_force
  label: LGSS art. 205.1.a and DT 7ª phase-in (2013-2027)
  status: in_force
  description: Short-contribution track 65 + 1 month (2013) -> 67 (2027 onwards); long-contribution track 65.
