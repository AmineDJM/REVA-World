schema: reva-retirement-age-rules/1
version: 1.0.0
review_status: maintainer_review_pending
transcription: transcribed from law text by an agent; maintainer review pending
country: ESP
notes: Official consolidated text (BOE, Real Decreto Legislativo 8/2015, Ley General de la Seguridad Social, 'Última
  actualización, publicada el 03/10/2026'). The ordinary retirement age depends on the calendar year of retirement
  AND on the contribution record (two tracks); the phase-in started in 2013 (Ley 27/2011). No row is given for years
  before 2013 in the in-force path (coverage starts 2013).
model_lever:
  age_kind: normal_pension_age
  track: short_contribution
  rationale: Ordinary retirement age for persons with fewer contribution years than the DT 7ª threshold. Persons
    above the threshold keep 65; REVA has no data on the share of each track, so applying the short-track age to
    the whole population overstates the affected population; results are labelled qualified.
