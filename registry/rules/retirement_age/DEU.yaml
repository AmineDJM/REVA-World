notes: Official consolidated text from gesetze-im-internet.de (Bundesministerium der Justiz; the site labels its
  table of contents 'nichtamtlich'). Regelaltersgrenze (normal pension age, general old-age pension with the 5-year
  qualifying period) 65 -> 67 by cohort 1947-1964 (RV-Altersgrenzenanpassungsgesetz 2007, now SGB VI § 235 and §
  35). Exceptions (Altersteilzeit agreed before 2007, Bergbau Anpassungsgeld; long-insured early claim from 63 with
  35 years, § 36/§ 236; 45-year and disability pensions) are NOT represented in the lever path.
model_lever:
  age_kind: normal_pension_age
  rationale: The Regelaltersgrenze is the earliest age at which a person with only the general 5-year qualifying
    period can claim an old-age pension. Persons with 35+ insurance years can claim from 63 with deductions (§ 36/§
    236), an age the 2007 reform did not raise for most cohorts; the model's affected population therefore overstates
    the population actually constrained, and the result is labelled qualified.
  qualification: Upper side for the affected population - the early claim from 63 with 35 insurance years (§ 36 /
    § 236) and other early routes are not modelled, so persons who can claim before the Regelaltersgrenze are counted
    as affected; employment and recipient changes are overstated by an unknown amount. Read the central value as
    'alternative routes not modelled', not as an unqualified central estimate.
