schema: reva-retirement-age-rules/1
country: FRA
version: "1.0.0"
review_status: maintainer_review_pending
transcription: "transcribed from law text by an agent; maintainer review pending"
notes: >-
  Légifrance refused automated retrieval (HTTP 403 bot challenge, 2026-10-15), so the official
  text was read from the codes.droit.org consolidated edition of the Code de la sécurité sociale
  (generated from the Légifrance LEGI open data; edition 2026-10-14) and cross-checked against the
  official information page service-public.fr F14043 (DILA, "Vérifié le 14 août 2026"). Full-rate
  ages for the 1951-1955 transition cohorts are not in the consolidated code any more (abrogated
  wording is excluded from positive law); they are taken from a statutory pension fund's table
  (IRCEC, 2022), a secondary source, and marked secondary_table. Exceptions (carrières longues,
  disability, hardship) are NOT represented: the rows are the general statutory ages.
model_lever:
  age_kind: minimum_pension_age
  rationale: >-
    The general minimum age at which an old-age pension can be claimed (âge d'ouverture du droit,
    CSS art. L161-17-2). This is the age whose increase Rabaté & Rochut evaluate for the 2010 reform.
  qualification: Early routes are not modelled and not transcribed - long-career early retirement (retraite
    anticipée pour carrière longue), disability and incapacity (inaptitude) routes. Persons who would use them are
    counted as affected by the general minimum age, so the affected population, the employment change and the
    recipients change are overstated where those routes apply (same issue as Germany's 63-with-35-years route).
