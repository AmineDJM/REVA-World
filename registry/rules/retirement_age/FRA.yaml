paths:
  - path_id: pre_2010_counterfactual
    label: "Counterfactual: minimum age 60 and full-rate age 65 kept for all cohorts (no Loi n° 2010-1330)"
    status: counterfactual
    description: >-
      The rule applicable to cohorts born before 1 July 1951 extended to every later cohort. Used as
      the no-reform reference of the 2010 back-test.
  - path_id: law_2010_as_amended_2011
    label: "Loi n° 2010-1330 (9 Nov 2010), accelerated by Loi n° 2011-1906 (LFSS 2012), without the 2023 reform"
    status: enacted_superseded
    description: >-
      Minimum age 60 -> 62 by cohort 1951 (2nd half) - 1955 in steps of 4-5 months as applied after the
      LFSS 2012 acceleration (décret n° 2011-2034); 62 for every later cohort; full-rate age 65 -> 67.
      Counterfactual for cohorts born from 1 September 1961 (the 2023 reform applies to them).
  - path_id: law_2023_as_enacted
    label: "Loi n° 2023-270 (14 Apr 2023) art. 10 and décret n° 2023-436 (3 Jun 2023), as enacted"
    status: enacted_superseded
    description: Minimum age 62 -> 64 by 3 months per cohort, cohorts born from 1 September 1961 to 1968.
  - path_id: law_in_force_2026
    label: "Law in force: L161-17-2 as amended by Loi n° 2025-1403 (LFSS 2026), suspension of the 2023 increase"
    status: in_force
    description: >-
      Cohorts born 1 January 1963 - 31 March 1965 keep 62 years 9 months; the 3-month steps resume for
      later cohorts, reaching 64 for cohorts born from 1 January 1969. Cross-checked with service-public.fr
      F14043 (verified 14 August 2026).
