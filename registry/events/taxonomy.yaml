properties:
  # time
  - {pid: P585, family: time, role: point_in_time}
  - {pid: P580, family: time, role: start}
  - {pid: P582, family: time, role: end}
  - {pid: P571, family: time, role: inception}
  - {pid: P576, family: time, role: dissolved}
  - {pid: "ucdp:start_date", family: time, role: start, note: "UCDP: date of the first battle-related death"}
  - {pid: "ucdp:episode_end", family: time, role: episode_end, note: "UCDP: last date of an episode"}
  - {pid: "unpk:start_date", family: time, role: start}
  - {pid: "unpk:end_date", family: time, role: end}
  # place
  - {pid: P276, family: place, role: location}
  - {pid: P17, family: place, role: country}
  - {pid: P131, family: place, role: admin_area}
  - {pid: "ucdp:location", family: place, role: country, note: "UCDP location: government(s) whose territory is disputed"}
  - {pid: "unpk:mission_country", family: place, role: country}
  - {pid: "unpk:hq_location", family: place, role: location}
  # participants (out: the event is the subject; in: the event is the object)
  - {pid: P710, family: participant, role: participant}
  - {pid: P1344, family: participant, role: participant, direction: in, note: "X participant in event"}
  - {pid: P1344, family: participant, role: belligerent, direction: in, source_key: cow.data, note: "COW war participation spell (side, initiator, outcome coded)"}
  - {pid: P607, family: participant, role: belligerent, direction: in, note: "X participated in conflict"}
  - {pid: P664, family: participant, role: organizer}
  - {pid: P137, family: participant, role: operator}
  - {pid: P1346, family: participant, role: winner}
  - {pid: P1891, family: participant, role: signatory}
  - {pid: "untc:party", family: participant, role: party}
  - {pid: "untc:former_party", family: participant, role: former_party}
  - {pid: "ucdp:primary_party", family: participant, role: belligerent}
  - {pid: "ucdp:secondary_party", family: participant, role: supporting_party}
  - {pid: "ucdp:nonstate_side", family: participant, role: belligerent}
  - {pid: "unpk:contributed_personnel_to", family: participant, role: contributor, direction: in}
  # structure (context, never causal)
  - {pid: P361, family: structure, role: part_of}
  - {pid: P527, family: structure, role: has_part}
  - {pid: P155, family: structure, role: follows}
  - {pid: P156, family: structure, role: followed_by}
  - {pid: P793, family: structure, role: significant_event}

dataset_kinds:
  - id_prefix: "ucdp:conflict:"
    source_key: ucdp.downloads
    type: armed_conflict
    label_en: UCDP/PRIO armed conflict
    coded_type_property: "ucdp:conflict_type"
    coded_type_map: {interstate: interstate_armed_conflict, intrastate: intrastate_armed_conflict,
                     internationalized intrastate: intrastate_armed_conflict, extrasystemic: extrasystemic_armed_conflict}
    coded_properties: ["ucdp:conflict_type", "ucdp:incompatibility", "ucdp:territory_name", "ucdp:intensity_level"]
    note: UCDP codes a conflict-year when ≥ 25 battle-related deaths occur; types per the UCDP/PRIO codebook.
  - id_prefix: "cow:war:"
    source_key: cow.data
    type: war
    label_en: Correlates of War war
    interval_from_incoming: [P1344]
    note: COW Inter-/Extra-State War v4.0; event dates are not coded at war level here (participation spells are).
  - id_prefix: "unpk:mission:"
    source_key: un.psdata
    type: peacekeeping_mission
    label_en: UN peace operation
    coded_properties: ["unpk:initial_mandate", "unpk:lead_entity"]
    note: UN Peace and Security Data Hub (CC BY 3.0 IGO); includes special political missions present in the files.
  - id_prefix: "untc:treaty:"
    source_key: untc.mtdsg
    type: treaty
    label_en: UN-deposited multilateral treaty (UNTC)
    coded_properties: ["untc:mtdsg_number"]
    note: Treaties not yet mapped to a Wikidata item (untc:treaty:<MTDSG>).
  - id_prefix: ""
    marker_property: "untc:mtdsg_number"
    source_key: untc.mtdsg
    type: treaty
    label_en: UN-deposited multilateral treaty (UNTC, Wikidata-keyed)
    coded_properties: ["untc:mtdsg_number"]
    note: Treaties A-TREATIES mapped to their Wikidata item (registry/entities/treaty_qids.json); recognised by UNTC's MTDSG number statement even when no Wikidata snapshot is loaded.

derived:
  cshapes_independence:
    enabled: true
    type: independence
    label_en: independence (CShapes status change)
    method: reva.events.cshapes_status_change/1
    caveat: >-
      Derived by REVA: CShapes 2.0 codes polity periods with a status (colony, protectorate, mandate, occupied,
      independent). A period coded 'independent' that follows a period with another status is shown as an
      independence event dated at the start of that period. It is not a source-reported event record, and it is
      not a claim about why the status changed.
