    coded_type_map: {interstate: interstate_armed_conflict, intrastate: intrastate_armed_conflict,
                     internationalized intrastate: intrastate_armed_conflict, extrasystemic: extrasystemic_armed_conflict}
    coded_properties: ["ucdp:conflict_type", "ucdp:incompatibility", "ucdp:territory_name", "ucdp:intensity_level"]
    note: UCDP codes a conflict-year when ≥ 25 battle-related deaths occur; types per the UCDP/PRIO codebook.
  - id_prefix: "cow:war:"
    source_key: cow.data
    type: war
    label_en: Correlates of War war
    interval_from_incoming: [P1344]
    note: COW Inter-/Extra-State War v4.0; event dates are not coded at war level here (participation spells are).
  - id_prefix: "unpk:mission:"
    source_key: un.psdata
    type: peacekeeping_mission
    label_en: UN peace operation
    coded_properties: ["unpk:initial_mandate", "unpk:lead_entity"]
    note: UN Peace and Security Data Hub (CC BY 3.0 IGO); includes special political missions present in the files.
  - id_prefix: "untc:treaty:"
    source_key: untc.mtdsg
    type: treaty
    label_en: UN-deposited multilateral treaty (UNTC)
    coded_properties: ["untc:mtdsg_number"]
    note: Treaties not yet mapped to a Wikidata item (untc:treaty:<MTDSG>).
  - id_prefix: ""
    marker_property: "untc:mtdsg_number"
    source_key: untc.mtdsg
    type: treaty
    label_en: UN-deposited multilateral treaty (UNTC, Wikidata-keyed)
    coded_properties: ["untc:mtdsg_number"]
    note: Treaties A-TREATIES mapped to their Wikidata item (registry/entities/treaty_qids.json); recognised by UNTC's MTDSG number statement even when no Wikidata snapshot is loaded.

  # dataset agents of the causality work split (prefixes and kinds as documented in their docs/dev pages)
  # Verified by EVMAP on the agents' real fixtures loaded together (tests/integration/test_events_dataset_kinds.py).
  # Records of these namespaces that are NOT events (never typed): `ncei_hazards:volcano:*` (a place),
  # `archigos:leader:*` / `reign:leader:*` (persons), `ties:outcome:*` / `eusanct:outcome:*` /
  # `eusanct:policy_result:*` and `<campaign>:outcome` (coded outcomes), `eusanctionsmap:regime:*` and
  # `ofac:program:*` (regimes / programs), `sanctions:org:*` (organisations), `ecrises:condition:*` (conditions),
  # `icb:pc:*` (protracted-conflict groupings).
  - id_prefix: "ptcoup:"
    source_key: powell_thyne.coups
    type: coup
    label_en: coup (Powell & Thyne)
    coded_properties: ["coup:outcome", "coup:event_type"]
    note: A-COUPS (docs/dev/v3_a_coups.md); successful and failed attempts, outcome coded verbatim.
  - id_prefix: "archigos:coup:"
    source_key: archigos.leaders
    type: coup
    label_en: coup (Archigos 4.1 irregular removal by the military or other government actors)
    coded_properties: ["coup:event_type", "coup:perpetrator_type"]
    note: >-
      A-COUPS; the coup Archigos codes behind an irregular exit. A successful Powell & Thyne coup of the same state
      and day is linked by `coup:same_state_and_day_as` (context), not by `same_as`.
  - id_prefix: "archigos:exit:"
    source_key: archigos.leaders
    type: leader_removal
    label_en: removal of a leader (Archigos 4.1 exit Irregular or Foreign)
    coded_properties: ["archigos:exit_manner"]
    note: A-COUPS; the effect end of Archigos' coded coup -> removal claims.
  - id_prefix: "ncei_hazards:earthquake:"
    source_key: noaa.ncei_hazards
    type: earthquake
    label_en: earthquake (NOAA NCEI)
    coded_properties: ["ncei:magnitude"]
  - id_prefix: "ncei_hazards:tsunami:"
    source_key: noaa.ncei_hazards
    type: tsunami
    label_en: tsunami event (NOAA NCEI)
    coded_properties: ["ncei:tsunami_cause", "ncei:tsunami_validity"]
  - id_prefix: "ncei_hazards:eruption:"
    source_key: noaa.ncei_hazards
    type: volcanic_eruption
    label_en: volcanic eruption (NOAA NCEI)
    coded_properties: ["ncei:vei"]
  - id_prefix: "ties:case:"
    source_key: ties.unc
    type: sanction_episode
    label_en: sanction case (TIES)
    coded_properties: ["ties:issue", "ties:final_outcome"]
  - id_prefix: "eusanct:case:"
    source_key: eusanct.kondata
    type: sanction_episode
    label_en: sanction case (EUSANCT)
    coded_properties: ["eusanct:issue", "eusanct:final_outcome"]
  - id_prefix: ""
    marker_property: "ecrises:crisis_type"
    source_key: null
    type: event
    label_en: crisis chronology record (Laeven-Valencia, Reinhart-Rogoff, JST, ESRB; A-ECRISES)
    coded_type_property: "ecrises:crisis_type"
    coded_type_map: {"banking crisis": banking_crisis, "systemic banking crisis": banking_crisis,
                     "currency crisis": currency_crisis,
                     "sovereign debt crisis (default or restructuring)": sovereign_debt_crisis,
                     "sovereign debt restructuring": sovereign_debt_crisis,
                     "sovereign domestic debt default": sovereign_debt_crisis,
                     "sovereign external debt default or restructuring": sovereign_debt_crisis,
                     "inflation crisis": inflation_crisis, "systemic financial crisis": financial_crisis,
                     "episode of elevated financial stress (not systemic)": financial_stress_episode}
    coded_properties: ["ecrises:crisis_type"]
    note: >-
      A-ECRISES (docs/dev/v3_a_ecrises.md); coded values verbatim from the connector. An unmapped new value falls
      back to the generic `event` type (the integration test refuses that on the fixtures).
  - id_prefix: ""
    marker_property: "causdata:event_type"
    source_key: null
    type: event
    label_en: expert-coded crisis/conflict record (ICB, COW MID, UCDP; CAUSDATA)
    coded_type_property: "causdata:event_type"
    coded_type_map: {international_crisis: international_crisis, foreign_policy_crisis: foreign_policy_crisis,
                     crisis_trigger: crisis_trigger, crisis_response: crisis_response, crisis_outcome: null,
                     protracted_conflict: null, militarized_interstate_dispute: militarized_interstate_dispute,
                     militarized_incident: militarized_incident, dispute_outcome: null,
                     armed_conflict_episode: armed_conflict_episode, conflict_termination: null,
                     peace_agreement: peace_agreement, state_code: null}
    note: CAUSDATA (docs/dev/v3_causdata.md) types each record with causdata:event_type; outcomes and terminations are coded outcomes, not events.
  - id_prefix: ""
    marker_property: "contention:event_type"
    source_key: null
    type: event
    label_en: contention record (NAVCO, MEC, Mass Mobilization; A-CONTENTION)
    coded_type_property: "contention:event_type"
    coded_type_map: {resistance_campaign: resistance_campaign, contentious_episode: protest, protest: protest,
                     state_repression: state_repression, state_response: state_response, coded_outcome: null}
    note: A-CONTENTION (docs/dev/v3_a_contention.md); campaign outcomes are coded outcomes, not events.

derived:
  cshapes_independence:
    enabled: true
    type: independence
    label_en: independence (CShapes status change)
    method: reva.events.cshapes_status_change/1
    caveat: >-
      Derived by REVA: CShapes 2.0 codes polity periods with a status (colony, protectorate, mandate, occupied,
      independent). A period coded 'independent' that follows a period with another status is shown as an
      independence event dated at the start of that period. It is not a source-reported event record, and it is
      not a claim about why the status changed.
