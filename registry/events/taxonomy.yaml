# REVA event taxonomy (owner: EVENTS; code: src/reva/events/taxonomy.py, view: src/reva/events/view.py).
#
# Which KG entities are events, of which type, and what each statement property means for an event.
# * `wikidata_classes`: every QID was confirmed by a recorded lookup (labels + P279 claims + revision + raw sha256)
#   in registry/events/_recorded/wikidata_verification.json (`python -m reva.events.verify`); a unit test refuses
#   a class without such a record. An item is of a type when one of its P31 claims (any non-deprecated rank, not
#   only the truthy ones) reaches one of these classes through recorded P279 chains (KG statements first,
#   recorded lookups as fallback). A class is mapped to one type only.
# * `roles`: typical participant roles (fr/en). `properties`: the role of each statement property in the view
#   (family time | place | participant | structure | coded; `direction: in` = the event is the statement's
#   object; `source_key` = a source-specific role overriding the generic one).
# * `dataset_kinds`: dataset records that are events by construction (UCDP conflicts, COW wars, UN peace
#   operations, UNTC treaties). `derived`: events REVA derives from coded periods (CShapes), always labelled so.
# Nothing here is causal: participation, place, time and structure are context.
version: 1
schema: reva-events-taxonomy/1

roles:
  - {id: participant, label_en: participant, label_fr: participant}
  - {id: actor, label_en: actor, label_fr: acteur}
  - {id: belligerent, label_en: belligerent, label_fr: belligérant}
  - {id: supporting_party, label_en: supporting party (with troops), label_fr: partie en soutien (avec troupes)}
  - {id: target, label_en: target, label_fr: cible}
  - {id: victim, label_en: victim, label_fr: victime}
  - {id: perpetrator, label_en: perpetrator, label_fr: auteur}
  - {id: organizer, label_en: organizer, label_fr: organisateur}
  - {id: operator, label_en: operator, label_fr: opérateur}
  - {id: signatory, label_en: signatory, label_fr: signataire}
  - {id: party, label_en: party (treaty), label_fr: partie (traité)}
  - {id: former_party, label_en: former party (treaty), label_fr: ancienne partie (traité)}
  - {id: candidate, label_en: candidate, label_fr: candidat}
  - {id: winner, label_en: winner, label_fr: vainqueur}
  - {id: contributor, label_en: personnel contributor, label_fr: contributeur en personnel}
  - {id: former_ruler, label_en: former ruling state, label_fr: ancien État souverain}
  - {id: sender, label_en: sender (sanctions), label_fr: émetteur (sanctions)}

