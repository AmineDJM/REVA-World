  - {pid: P131, family: place, role: admin_area}
  - {pid: "ucdp:location", family: place, role: country, note: "UCDP location: government(s) whose territory is disputed"}
  - {pid: "unpk:mission_country", family: place, role: country}
  - {pid: "unpk:hq_location", family: place, role: location}
  - {pid: "ncei:country", family: place, role: country, note: "NOAA NCEI: country of the hazard record (QID when mapped)"}
