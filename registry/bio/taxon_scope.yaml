# V4BIO taxon scope (owner: V4BIO). Which parts of the GBIF Backbone Taxonomy get full species lists in the KG.
# This is REVA's SELECTION of what to load, not a source fact: the KG statements about each taxon are GBIF's.
#
# species_groups: every accepted species-rank usage classified under these backbone keys is listed through
#   ChecklistBank dataset 53147 (= GBIF backbone with its keys) and loaded with its genus. `load: false` groups are
#   declared but not loaded by default (raw-archive bound <= 150 MB on this machine): run them on a bigger machine with
#   `uv run reva atlas ingest atlas.gbif_backbone --option groups=<key>,<key>` (see docs/dev/v4_v4bio.md). The
#   backbone includes fossil species (e.g. Mammalia: 21,100 accepted species of which GBIF flags 6,323 extant).
# species: curated keys (crops, livestock, pathogens, model organisms, iconic / threatened species), each read
#   from GBIF /species/{key}; loaded ONLY if GBIF's canonicalName, rank (SPECIES) and status (ACCEPTED) equal the
#   entry (else refused and reported). Keys were looked up once (2026-10-17) with GBIF's species/match (strict,
#   EXACT + ACCEPTED only); names GBIF treats as synonyms or does not know are listed under `not_loaded` with GBIF's
#   own answer (no guessing, no accepted-name substitution).
version: "2026-10-17"
species_groups:
  - {gbif_key: 359, name: Mammalia, load: true}
  - {gbif_key: 212, name: Aves, load: true}
  - {gbif_key: 131, name: Amphibia, load: false}
  - {gbif_key: 11592253, name: Squamata, load: false}
  - {gbif_key: 11418114, name: Testudines, load: false}
  - {gbif_key: 11493978, name: Crocodylia, load: false}
