source_key: ties.unc
title: Threat and Imposition of Economic Sanctions (TIES) dataset, version 4.1 (case level, 1945-2005)
provider_url: https://sanctions.web.unc.edu/
lineage_family: ties
rights:
  licence: "no licence stated (public academic download, no registration; citation requested)"
  attribution: >-
    Morgan, T. Clifton, Navin Bapat, and Yoshiharu Kobayashi. 2014. "The Threat and Imposition of Sanctions:
    Updating the TIES dataset." Conflict Management and Peace Science 31(5): 541-558.
  licence_evidence: >-
    sanctions.web.unc.edu (read 2026-10-16): "Please use the following citation when using TIES: Morgan, T.
    Clifton, Navin Bapat, and Yoshi Kobayashi. 2014 ..."; no licence, terms of use or registration published.
metadata:
  allowed_hosts: [sanctions.web.unc.edu, cran.r-project.org]
  open_licence: false
  redistribution: not stated; flagged for maintainer review (cited on every row)
  files:
    - https://sanctions.web.unc.edu/wp-content/uploads/sites/18834/2021/04/TIESv4-1.xls
  codebook: https://sanctions.web.unc.edu/wp-content/uploads/sites/18834/2021/04/tiesusersmanualv4.pdf
