# V5 (agent PRED-VINTAGE): DBnomics public API, used for the IMF World Economic Outlook historical releases
# (one DBnomics dataset per WEO vintage, IMF/WEO:2008-04 .. IMF/WEO:2024-10).
# Connector src/reva/adapters/connectors/atlas_vintage_weo.py (atlas.vintage_weo_dbn -> vintage_weo.weo_dbnomics).
source_key: dbnomics.api
title: DBnomics API (IMF World Economic Outlook database releases, by vintage)
provider_url: https://db.nomics.world/IMF
lineage_family: imf_weo
rights:
  licence: "IMF Copyright and Usage terms (data redistributed by DBnomics under the provider's terms)"
  licence_url: https://www.imf.org/external/terms.htm
  attribution: "International Monetary Fund, World Economic Outlook database (historical releases); via DBnomics (CEPREMAP)"
  open_licence: false
  restriction: "IMF terms: free use with attribution; not an open licence"
metadata:
  allowed_hosts: [api.db.nomics.world]
  api: https://api.db.nomics.world/v22/series/IMF/WEO:<YYYY-MM>
  authentication: none
  cadence: "a new WEO vintage twice a year (April, October); DBnomics last indexed IMF/WEO on 2025-05-15"
  notes: >-
    The IMF's own vintage pages (www.imf.org/.../weo-database/<year>/<month>) answer 403 Access Denied (Akamai) to
    non-browser clients; DBnomics serves the same release files. DBnomics keeps neither the release day nor the
    "Estimates Start After" column (see docs/dev/v5_pred_vintage.md).
