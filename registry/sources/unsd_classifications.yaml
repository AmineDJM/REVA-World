# V4 (agent V4LINK): UN Statistics Division classifications and correspondence tables.
# Connector: src/reva/adapters/connectors/atlas_unsd_classif.py -> KG classification codes (HS 2022/2017/1992,
# CPC 2.1, ISIC Rev.4, SITC Rev.4), their hierarchies (v4link:class_parent) and UNSD concordances
# (v4link:corresponds_to). No atlas table.
source_key: unsd.classifications
title: UNSD classifications on economic statistics (structures and correspondence tables)
provider_url: https://unstats.un.org/unsd/classifications/Econ
lineage_family: unsd_classifications
rights:
  licence: United Nations terms of use (free download, no account)
  licence_url: https://www.un.org/en/about-us/terms-of-use
  attribution: >-
    United Nations Statistics Division, Classifications on economic statistics
    (https://unstats.un.org/unsd/classifications/Econ). HS descriptions: Harmonized System nomenclature
    (c) World Customs Organization -- UNSD states no separate redistribution licence (flagged on every HS value).
metadata:
  allowed_hosts: [unstats.un.org]
  files: >-
    HSCodeandDescription.xlsx, SITCCodeandDescription.xlsx, CPC_Ver_2_1_english_structure.txt,
    ISIC_Rev_4_english_structure.Txt, CPC21-HS2017.csv, cpc21-isic4.txt (+ readme), HS2022 to HS2017 / HS1992 /
    SITC Rev.4 conversion and correlation tables (xlsx); about 3.7 MB per run
  authentication: none
  cadence: quarterly check (UNSD revises correspondence tables rarely)
