# V5 (agent PRED-HF): BIS Data Portal bulk downloads (daily series). Connector
# src/reva/adapters/connectors/atlas_hf_bis.py (atlas tables bis.cbpol_d, bis.cbpol_d_series, bis.eer_d).
# The monthly/quarterly BIS series come from the SDMX API under source key bis.stats (A-FISCAL, atlas_bis.py).
source_key: bis.bulk
title: BIS bulk downloads — daily central bank policy rates and daily effective exchange rates (flat CSV zips)
provider_url: https://data.bis.org/bulkdownload
lineage_family: bis
rights:
  licence: "BIS terms of permitted use of BIS statistics (use unrestricted provided the BIS is cited as source)"
