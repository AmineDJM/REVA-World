    not an official BIS translation; your use of the statistics must not be potentially misleading [...]; if the
    statistics will be used in a commercial publication or product, their inclusion in the publication or product
    will not result in any additional charge to subscribers or other users; [...] No other use is permissible.
  licence_checked: "2026-10-17"
metadata:
