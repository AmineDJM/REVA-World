metadata:
  allowed_hosts: [markets.newyorkfed.org, www.newyorkfed.org]
  files:
    effr: https://markets.newyorkfed.org/api/rates/unsecured/effr/last/0.json
    obfr: https://markets.newyorkfed.org/api/rates/unsecured/obfr/last/0.json
    sofr: https://markets.newyorkfed.org/api/rates/secured/sofr/last/0.json
  authentication: none
  cadence: "daily (EFFR/OBFR ~9:00 a.m. ET, SOFR ~8:00 a.m. ET, business day after the effective date)"
  revision_policy: >-
    Same-day revision at approximately 2:30 p.m. ET only if the change exceeds one basis point; footnoted
    (API revisionIndicator).
