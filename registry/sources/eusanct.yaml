# V3 (agent A-SANCTIONS): EUSANCT dataset (EU, US and UN sanction threats and impositions, 1989-2015), case level.
# Connector: src/reva/adapters/connectors/atlas_sanctions.py (atlas.eusanct) -> atlas tables eusanct.dyad_year,
# eusanct.country_year + KG statements (source_key eusanct.kondata).
source_key: eusanct.kondata
title: "EUSANCT: Does Supranational Coercion Work? (case-level dataset 1.0, 1989-2015)"
provider_url: https://doi.org/10.48606/10
lineage_family: eusanct
rights:
  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  attribution: >-
    Weber, Patrick M.; Schneider, Gerald (2021): EUSANCT: Does Supranational Coercion Work? Onset, Impact and
    Effectiveness of EU Sanctions. Universität Konstanz. DOI 10.48606/10. Weber P.M., Schneider G. (2020)
    Post-cold war sanctioning by the EU, the UN, and the US: Introducing the EUSANCT dataset. Conflict
    Management and Peace Science.
  licence_evidence: >-
    KonDATA (RADAR) record https://kondata.uni-konstanz.de/radar/en/dataset/lCfLfgbpdRKseQvp (read 2026-10-16):
    "Rights statement for the dataset: This work is licensed under CC BY 4.0".
metadata:
  allowed_hosts: [kondata.uni-konstanz.de, cran.r-project.org]
  files:
    - https://kondata.uni-konstanz.de/radar/de/dataset/lCfLfgbpdRKseQvp/datasetBinaryTreeStream
  access_note: >-
    RADAR serves the whole dataset as one tar generated on request (64.8 MB; tar header mtimes = download time,
    so every download has a different sha256). Only the member EUSANCT_Dataset_Case-level.csv is parsed.
  code_crosswalk: COW state numbers via StateCodeCrosswalk (as TIES); senders EU / US / UN coded per case.
  personal_data: >-
    none ingested: identity (*_id), "other" free text, comments and links are not parsed.
  authentication: none
  cadence: static release (2021)
