# V4 (agent V4INDUSTRY): GLEIF LEI API (Level 1 "who is who" + Level 2 "who owns whom"), connector atlas.gleif.
source_key: gleif.api
title: GLEIF Global LEI Index API (api.gleif.org, v1)
provider_url: https://www.gleif.org/en/lei-data/gleif-api
lineage_family: gleif
rights:
  licence: CC0-1.0
  licence_url: https://www.gleif.org/en/meta/lei-data-terms-of-use
  attribution: "Global Legal Entity Identifier Foundation (GLEIF), Global LEI Index, api.gleif.org (CC0 1.0)"
  terms: >-
    GLEIF LEI data (LEI records, relationship records, reporting exceptions) are published free of charge under CC0 1.0;
    the GLEIF terms ask users not to imply GLEIF endorsement.
metadata:
  allowed_hosts: [api.gleif.org]
  api_docs: https://documenter.getpostman.com/view/7679680/SVYrrxuU
  authentication: none
  rate_limit: "60 requests per minute per client (GLEIF API documentation); the connector paces requests >= 1.1 s apart"
  cadence: Golden Copy published 3 times a day (meta.goldenCopy.publishDate on every response)
  editorial_status: >-
    Data submitted by legal entities and validated by LEI issuers (LOUs) against registration authorities; corroboration
    level per record (FULLY_CORROBORATED / PARTIALLY_CORROBORATED / ENTITY_SUPPLIED_ONLY). Level 2 parents are
    accounting-consolidation parents reported by the child entity.
  bulk_note: >-
    The Golden Copy bulk files (several GB) are never downloaded in this container; only API aggregations
    (pagination totals) and bounded selections (seed LEIs, largest groups) are fetched.
