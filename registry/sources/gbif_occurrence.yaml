# V4 (agent V4ECO): GBIF occurrence index read through GBIF's own aggregations (GraphQL countryCode facets with
# nested speciesKey cardinality; species API). Connector src/reva/adapters/connectors/atlas_gbif_occ.py ->
# atlas tables gbif_occ.country_group, gbif_occ.country_year, gbif_occ.country_iucn, gbif_occ.taxon_country and
# KG statements gbif_occ:recorded_in / gbif_occ:measured_by / gbif:iucn_red_list_category.
source_key: gbif.occurrence
title: GBIF occurrence index — records and distinct species per country, taxon group, year and IUCN category (facets)
provider_url: https://www.gbif.org/occurrence/search
lineage_family: gbif
rights:
  licence: "GBIF data user agreement; aggregate counts over records licensed CC0 1.0 / CC BY 4.0 / CC BY-NC 4.0"
  licence_url: https://www.gbif.org/terms
  attribution: "GBIF.org (<retrieval date>) GBIF Occurrence Search, https://www.gbif.org"
  terms_quote: >-
    Occurrence records are published under CC0 1.0, CC BY 4.0 or CC BY-NC 4.0 (global licence facet at
    2026-10-17: CC BY 4.0 2,747,164,695; CC BY-NC 4.0 653,036,870; CC0 1.0 446,272,040 records). REVA stores
    only GBIF's aggregate counts (facts), never record content; part of the counted records are non-commercial.
  iucn_categories: >-
    The IUCN Red List category per species comes from GBIF dataset 19491596-35ae-4a91-9a98-85cf505f1bd3
    ("The IUCN Red List of Threatened Species"), whose GBIF record states licence CC BY 4.0 (checked 2026-10-17).
metadata:
  allowed_hosts: [graphql.gbif.org, api.gbif.org]
  authentication: none (GBIF downloads and SQL downloads need an account and are not used)
  method: >-
    POST https://graphql.gbif.org/graphql occurrenceSearch(predicate) facet countryCode(size 300) with count and
    occurrences.cardinality.speciesKey; GET https://api.gbif.org/v1/species/{key} and /iucnRedListCategory.
  filter: "occurrenceStatus=PRESENT; basisOfRecord not in (FOSSIL_SPECIMEN, LIVING_SPECIMEN)"
  approximate: distinct species = Elasticsearch cardinality aggregation (HyperLogLog++), approximate above a few thousand
  caveat: occurrence records reflect sampling effort and data mobilisation, not abundance or population size
  cadence: monthly (the index changes continuously; each run is a dated snapshot)
