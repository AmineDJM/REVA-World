# V6 (agent PRED-ENERGY): EIA Short-Term Energy Outlook archives (past issues' Excel data files).
# Connector src/reva/adapters/connectors/atlas_vintage_steo.py (atlas.vintage_steo -> vintage_steo.steo_archive).
# Same host as eia.opendata_bulk (current STEO bulk file); a separate key keeps the archive budget apart.
source_key: eia.steo_archive
title: U.S. EIA Short-Term Energy Outlook archives (Excel data file of each past monthly issue)
provider_url: https://www.eia.gov/outlooks/steo/outlook.php
lineage_family: eia_steo
rights:
  licence: "U.S. public domain"
  licence_url: https://www.eia.gov/about/copyrights_reuse.php
  attribution: "Source: U.S. Energy Information Administration (EIA), Short-Term Energy Outlook (archived issues)."
  terms_quote: >-
    U.S. government publications are in the public domain and are not subject to copyright protection. You may
    use and/or distribute any of our data, files, databases, reports, graphs, charts, and other information
    products that are on our website
  licence_checked: "2026-10-17"
metadata:
  allowed_hosts: [www.eia.gov]
  files:
    archives_page: https://www.eia.gov/outlooks/steo/outlook.php
    issue_data_file: https://www.eia.gov/outlooks/steo/archives/<mon><yy>_base.xlsx
  authentication: none
  cadence: "monthly STEO issue (release date listed on the archives page)"
  not_used: >-
    .xls data files of issues before July 2013 (binary Excel; the project has no reader); PDF reports; issues
    outside January/April/July/October (raw-archive budget; widen ISSUE_MONTHS on a bigger machine).
