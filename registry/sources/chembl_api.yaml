# V6 (agent V6DRUGS): ChEMBL web services (approved drugs, mechanisms, targets, approved indications) + the release's
# chembl_uniprot_mapping.txt. Connector: src/reva/adapters/connectors/atlas_drugs_chembl.py (atlas.chembl_drugs).
source_key: chembl.api
title: ChEMBL web services and release FTP (approved drugs, mechanisms of action, targets, indications)
provider_url: https://www.ebi.ac.uk/chembl/
lineage_family: chembl
rights:
  licence: CC BY-SA 3.0
  licence_url: https://creativecommons.org/licenses/by-sa/3.0/
  sharealike: true
  attribution: >-
    ChEMBL, EMBL-EBI; release number displayed per statement (source_revision). REQUIRED.ATTRIBUTION of the release:
    "If ChEMBL is incorporated into other works, we ask that the ChEMBL IDs are preserved, and that the release
    number of ChEMBL is clearly displayed." Citation: Mendez D et al., Nucleic Acids Res. 2019 47(D1):D930-D940,
    DOI 10.1093/nar/gky1075. ATC codes inside ChEMBL records are WHOCC material (non-commercial terms, flagged).
metadata:
  allowed_hosts: [www.ebi.ac.uk, ftp.ebi.ac.uk]
  endpoints:
    - https://www.ebi.ac.uk/chembl/api/data/status.json
    - https://www.ebi.ac.uk/chembl/api/data/molecule.json?max_phase=4
    - https://www.ebi.ac.uk/chembl/api/data/mechanism.json?max_phase=4
    - https://www.ebi.ac.uk/chembl/api/data/target.json?target_chembl_id__in=...
    - https://www.ebi.ac.uk/chembl/api/data/drug_indication.json?max_phase_for_ind=4
    - https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/chembl_uniprot_mapping.txt
  release_checked: ChEMBL_37 (2026-05-01); 4,225 approved molecules, 3,814 approved-drug mechanisms, 8,683 approved indications
  licence_basis: LICENSE (CC BY-SA 3.0 Unported) and REQUIRED.ATTRIBUTION in ChEMBLdb/latest, checked 2026-10-17
  authentication: none
  cadence: quarterly (ChEMBL releases)
