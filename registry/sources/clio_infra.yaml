source_key: clio_infra.dataverse
title: Clio-Infra historical indicators (DataverseNL collection clioinfra)
provider_url: https://clio-infra.eu/
lineage_family: clio_infra
rights:
  licence: CC0 1.0 or CC BY-SA 4.0 (per dataset record; recorded on every row)
  licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  attribution: "Clio-Infra (clio-infra.eu), IISH / Utrecht University; DataverseNL collection clioinfra"
metadata:
  allowed_hosts: [dataverse.nl, objectstore.surf.nl]
  search: https://dataverse.nl/api/search?q=*&subtree=clioinfra&type=dataset
