# Engine-side facts about variables (agent PRED-ENGINE). Labels, definitions and curated atlas links of effect
# variables live in PRED-EFFECT's registry/effects/variables.yaml; this file only says what the propagation needs:
#
# * geo: "global" (one world value, e.g. a world commodity price) or "country" (one value per country; the
#   default for every atlas concept and every variable not listed here). A global cause feeds country-level
#   effects of every country of interest; a country-level cause feeds only its own country.
# * plugin_inputs: which (kind, id, unit) a simulator plugin consumes. Matching is by identifier only.
schema_version: "1.0.0"
variables:
  - {kind: atlas_concept, id: resources.energy.eia.crude_oil_production, geo: global,
     note: "the decision engine uses this concept at geography WLD for world crude production (EIA world aggregate)"}
  - {kind: variable, id: oil_price.global, geo: global,
     note: "PRED-EFFECT variable: world crude oil price in USD (registry/effects/variables.yaml)"}
plugins:
  economic.io_price:
    label_fr: "Modèle de prix entrées-sorties (FIGARO), poussée des coûts au premier tour"
    inputs:
      - {kind: variable, id: oil_price.global, unit: percent}
    assumption_fr: >-
      Le prix de sortie de toute la branche B « Industries extractives » (NACE B05-B09) de chaque économie du
      tableau varie comme le prix du brut : borne haute, car B contient aussi le charbon, les minerais métalliques
      et les carrières. Répercussion intégrale (θ = 1), premier tour, prix de base, coefficients fixes.
  economic.crude_exposure:
    label_fr: "Exposition comptable à la valeur frontière du brut (HS 2709)"
    inputs:
      - {kind: variable, id: oil_price.global, unit: percent}
    assumption_fr: >-
      Les prix frontière du brut importé et exporté varient comme le prix du brut (multiplicateur 1 + Δ %),
      quantités fixes, une période comptable annuelle ; ce n'est ni une perte de PIB ni une inflation.
  social.retirement_age:
    label_fr: "Modèle d'âge de la retraite (règles légales transcrites, projection par cohortes)"
    inputs:
      - {kind: variable, id: pension.minimum_pension_age, unit: months}
    assumption_fr: >-
      Projection conditionnelle sous hypothèses énoncées (pas une prévision), résultats « qualifiés » : les voies
      de départ anticipé (carrières longues, invalidité) ne sont pas modélisées ; réponse de l'emploi tirée de la
      littérature citée (registry/assumptions/retirement_employment_response.yaml).
