  # V7 BEAT-ENERGY: current-month nowcast families (h = 0), issued ONLY by reva.cli.beat_energy --seal at the
  # pre-registered W1 offsets (7..28 days after a STEO release, while that STEO is the latest; quarterly STEO issue
  # months), never by the weekly job (issued_by). Declared nowcasts (FIX7 rule): the reference month is partly
  # elapsed at issue; resolution on EIA's monthly average as first published as history in a later STEO.
  - key: eia.wti_monthly_nowcast
    concept_id: null
    labels: {fr: "Prix du WTI (moyenne du mois en cours, $/baril)", en: "WTI crude oil spot price (current-month average, $/barrel)"}
    definition: "EIA Short-Term Energy Outlook series WTIPUUS (monthly average of daily spot prices), the month of the STEO issue in force (nowcast), historical periods only (steo_observed)."
    definition_source: src/reva/adapters/connectors/atlas_eia_steo.py
    dataset_key: atlas.eia_steo.steo_observed
    indicator: STEO.WTIPUUS.M
    owner_agent: BEAT-ENERGY
    geos: [{provider_geo: USA, key: WTI-STEO, label_fr: "WTI (série STEO de l'EIA)", label_en: "WTI (EIA STEO series)"}]
