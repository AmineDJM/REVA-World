    definition: "Domestic currency per US dollar, period average (IMF ER XDC_USD, PA_RT; ex-IFS)."
    definition_source: registry/atlas/catalog/imf.yaml (imf.exchange_rate_lcu_per_usd_avg)
    dataset_key: atlas.imf.er
    indicator: "XDC_USD|PA_RT"
    frequency: A
    value_rule: cell
    unit: "national currency per US dollar"
