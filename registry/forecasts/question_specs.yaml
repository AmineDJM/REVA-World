    definition_source: src/reva/adapters/connectors/atlas_eia_steo.py
    dataset_key: atlas.eia_steo.steo_observed
    indicator: STEO.BREPUUS.M
    owner_agent: BEAT-ENERGY
    geos: [{provider_geo: USA, key: BRENT-STEO, label_fr: "Brent (série STEO de l'EIA)", label_en: "Brent (EIA STEO series)"}]
    frequency: M
    value_rule: cell
    unit: "dollars per barrel"
    nowcast: true
    issued_by: reva.cli.beat_energy --seal (registry/forecasts/beat_energy/protocol.yaml, W1 h0 winners)
    questions:
      - {type: quantity, horizons: [0]}
    publication_lag_days: 45
    void_after_days: 365
    backtest_lag_periods: 1
    resolution_note: >-
      First EIA STEO release (atlas.eia_steo steo_observed) registered after sealing in which the month is a
