    frequency: A
    value_rule: cell
    unit: "% per annum"
    panel: g20_plus
    questions:
      - {type: binary, horizons: [1], threshold_rule: above_last_observed}
      - {type: quantity, horizons: [1]}
    publication_lag_days: 200
    void_after_days: 760
    backtest_lag_periods: 1
    resolution_note: First IMF MFS_IR release (atlas.imf.mfs_ir) registered after sealing that publishes the year.

