# Prospective forecast registry: question families (V5, agent PRED-REGISTRY).
#
# Each family turns one atlas series into dated questions for the next 1-12 months / 1-8 quarters / current and
# next calendar year, one question per (family, country, reference period, type, quarterly cycle). The generator
# (reva.evaluation.registry.questions) only creates a question when the declared atlas table is registered, the
# country's series is fresh enough and the reference period is after the last observed period; everything else is
# listed in the generation report with its reason (never filled in).
#
# Resolution: the value of the declared cell in the FIRST version of the declared atlas table registered AFTER the
# forecasts were sealed in which the cell is published as an observation (never a projection), checked from the end
# of the reference period; a question with no such value by `void_after_days` after the period end is void (typed,
# never scored). A value already present as an observation in the table version pinned at issue makes the question
# "not prospective" (never scored).
#
# Families whose table has not landed yet (`dataset_key` of a connector not ingested, or `awaiting` for a source
# with no connector) are kept here: the scheduled regeneration (`forecast_registry:issue`, weekly) picks them up
# as soon as their table is registered.

schema: reva-forecast-question-specs/1
version: "1.0.0"
interval_level: 0.8

panels:
  # G20 member economies (EU excluded: not a country) + the two most populous African economies not in the G20.
  g20_plus: [ARG, AUS, BRA, CAN, CHN, DEU, FRA, GBR, IDN, IND, ITA, JPN, KOR, MEX, RUS, SAU, TUR, USA, ZAF, NGA, EGY]
  eu_big: [DEU, FRA, ITA, ESP, NLD, POL, BEL, SWE, AUT, IRL]

families:
  # ------------------------------------------------------------------ available now (live atlas tables)
  - key: weo.cpi_inflation
    concept_id: imf.inflation_cpi_avg
    labels: {fr: "Inflation (IPC, moyenne annuelle)", en: "Inflation (CPI, annual average)"}
    definition: "Annual percent change of the period-average consumer price index (IMF WEO PCPIPCH)."
    definition_source: registry/atlas/catalog/imf.yaml (imf.inflation_cpi_avg)
    dataset_key: atlas.imf.weo
    indicator: PCPIPCH
    frequency: A
    value_rule: cell
    unit: "% change (CPI, period average)"
    panel: g20_plus
    questions:
      - {type: quantity, horizons: [0, 1]}
    reference_forecasters: [forecast.reference_imf_weo]
    publication_lag_days: 120
    void_after_days: 760
    backtest_lag_periods: 1
    resolution_note: >-
      Resolved by the first IMF World Economic Outlook vintage (atlas.imf.weo) in which the year is an actual
      (after the WEO's LATEST_ACTUAL_ANNUAL_DATA boundary), normally the April WEO of the following year.

  - key: weo.gdp_growth
    concept_id: imf.gdp_real_growth
    labels: {fr: "Croissance du PIB réel", en: "Real GDP growth"}
    definition: "Annual percent change of GDP at constant prices (IMF WEO NGDP_RPCH)."
    definition_source: registry/atlas/catalog/imf.yaml (imf.gdp_real_growth)
    dataset_key: atlas.imf.weo
    indicator: NGDP_RPCH
    frequency: A
    value_rule: cell
    unit: "% change (constant prices)"
    panel: g20_plus
    questions:
      - {type: quantity, horizons: [0, 1]}
    reference_forecasters: [forecast.reference_imf_weo]
    publication_lag_days: 120
    void_after_days: 760
    backtest_lag_periods: 1
    resolution_note: First WEO vintage in which the year is an actual (see weo.cpi_inflation).

  - key: weo.unemployment
    concept_id: imf.unemployment_rate
    labels: {fr: "Taux de chômage", en: "Unemployment rate"}
    definition: "Unemployed persons as a percent of the labour force, national definitions as compiled by the IMF WEO (LUR)."
    definition_source: registry/atlas/catalog/imf.yaml (imf.unemployment_rate)
    dataset_key: atlas.imf.weo
    indicator: LUR
    frequency: A
    value_rule: cell
    unit: "% of labour force"
    panel: g20_plus
    questions:
      - {type: quantity, horizons: [0, 1]}
    reference_forecasters: [forecast.reference_imf_weo]
    publication_lag_days: 120
    void_after_days: 760
    backtest_lag_periods: 1
    resolution_note: First WEO vintage in which the year is an actual (see weo.cpi_inflation).

  - key: fao.cpi_inflation_yoy
    concept_id: null
    labels: {fr: "Inflation des prix à la consommation (IPC général, glissement annuel)", en: "Consumer price inflation (general CPI, year on year)"}
    definition: >-
      Derived by REVA: 100 x (I_t / I_(t-12) - 1) where I is FAOSTAT item 23012 "Consumer Prices, General Indices
      (2015 = 100)" (element 6125 "Value"), both months read from the same table version.
    definition_source: FAOSTAT CP raw file ConsumerPriceIndices_E_All_Data_(Normalized).csv (item label verbatim)
    dataset_key: atlas.fao.cp
    indicator: "23012|6125"
    frequency: M
    value_rule: yoy_pct_from_index
    unit: "% (year on year)"
    panel: g20_plus
    questions:
      - {type: quantity, horizons: [1, 3, 6, 12]}
    publication_lag_days: 240
    void_after_days: 540
    backtest_lag_periods: 7
    resolution_note: >-
      First FAOSTAT CP release (atlas.fao.cp) registered after sealing that publishes both the month and the same
      month one year earlier; FAOSTAT flags (E estimated, I imputed) are kept with the outcome.

  - key: fao.food_inflation
    concept_id: null
    labels: {fr: "Inflation des prix alimentaires (glissement annuel)", en: "Food price inflation (year on year)"}
    definition: 'FAOSTAT item 23014 "Food price inflation", element 6121 "Value", unit "%".'
    definition_source: FAOSTAT CP raw file ConsumerPriceIndices_E_All_Data_(Normalized).csv (labels verbatim)
    dataset_key: atlas.fao.cp
    indicator: "23014|6121"
    frequency: M
    value_rule: cell
    unit: "%"
    panel: g20_plus
    questions:
