  # ------------------------------------------------------------------ V6 PRED-FIN: finance families (daily sources)
  # Research forecasts only: every question carries the disclaimer of reva.models.forecasting.finance_models
  # (not investment advice, not a trading signal). Benchmarks are issued as baselines (`forecasters`); candidates
  # (`candidates`) are only back-tested (reva.evaluation.finance_backtest) and join `forecasters` only on a
  # (family, horizon) cell where they beat the random walk with a Holm-corrected DM-HLN test — see
  # docs/dev/v6_pred_fin.md. Market forward points, OIS, fed-funds and Brent futures are licensed (CME/ICE/LSEG):
  # no market-implied benchmark is open, so the forward is a CIP proxy from central-bank policy rates.
  - key: fin.fx_eurusd_month_end
    concept_id: finance.daily.eur_ref_usd
    labels: {fr: "Taux de référence BCE, USD pour un euro (fin de mois)", en: "ECB reference rate, USD per EUR (month end)"}
    definition: >-
      ECB euro foreign exchange reference rate: units of US dollar (USD) per 1 euro. ECB: "All currencies quoted
      against the euro (base currency)"; "The reference rates are published for information purposes only." Value
      of the month = the rate of the last day of the month the ECB published (derived by REVA, month_end_of_daily).
    definition_source: registry/atlas/catalog/daily_markets.yaml (finance.daily.eur_ref_usd)
    dataset_key: atlas.ecb.fx_ref
    indicator: EUR_REF|currency=USD
    owner_agent: PRED-FIN
    geos: [{provider_geo: U2, key: EUR-USD, label_fr: "Zone euro (EUR/USD)", label_en: "Euro area (EUR/USD)"}]
    frequency: M
    value_rule: month_end_of_daily
    unit: "USD per EUR"
    questions: &fin_level_questions
      - {type: quantity, horizons: [1, 3, 12]}
      - {type: interval, horizons: [1, 3, 12]}
      - {type: binary, horizons: [1, 3, 12], threshold_rule: above_last_observed}
    publication_lag_days: 5
    void_after_days: 120
    backtest_lag_periods: 1
    resolution_note: >-
      Rate of the last day of the month published in the first atlas.ecb fx_ref version registered after sealing that
      also publishes a later day (a TARGET closing day has no rate: the last published day counts).
    finance:
      kind: fx
      scale: log
      generic_baselines: true
      forecasters: [fin.rw_histvol, fin.fx_forward_cip]
      candidates: [fin.garch11, fin.ppp_reversion]
      inputs:
        rate_base: &rate_xm {dataset_key: atlas.bis.cbpol_d, indicator: CBPOL, provider_geo: XM, lag_days: 7}
        rate_quote: {dataset_key: atlas.bis.cbpol_d, indicator: CBPOL, provider_geo: US, lag_days: 7}
        cpi_base: &cpi_ea {dataset_key: atlas.eurostat.hicp_m, indicator: "prc_hicp_minr|unit=I25|coicop18=TOTAL", provider_geo: EA, frequency: M, lag_days: 20}
        cpi_quote: {dataset_key: atlas.imf.cpi_m, indicator: "CPI|coicop_1999=_T|type_of_transformation=IX", provider_geo: USA, frequency: M, lag_days: 45}

