  # Policy-rate decisions at the next scheduled meetings (binary). Meeting decision days come from the central
  # banks' published calendars (atlas.cbcal.meetings, connector atlas.cb_calendars); the question asks whether the
  # level in force 7 days after the decision day (ECB changes take effect the following Wednesday; Fed and BoE
  # sooner) moved from the level in force at issue. Value = move in the asked direction (percentage points);
  # event = strictly above 0. An unscheduled move between issue and that day counts (stated in every question).
  - key: fin.fomc_hike
    concept_id: finance.daily.fed_funds_target_upper
    labels: {fr: "FOMC : hausse de la borne haute de la fourchette cible", en: "FOMC: increase of the upper limit of the target range"}
    definition: >-
      New York Fed EFFR record, API field targetRateTo: upper limit of the FOMC target range. Value = level in force on
      the decision day + 7 days minus the level in force at issue (derived by REVA, meeting_change).
    definition_source: registry/atlas/catalog/daily_markets.yaml (finance.daily.fed_funds_target_upper)
    dataset_key: atlas.nyfed.rates_d
    indicator: EFFR|field=targetRateTo
    owner_agent: PRED-FIN
    geos: [{provider_geo: US, key: FOMC, label_fr: "États-Unis (FOMC)", label_en: "United States (FOMC)"}]
    frequency: M
    value_rule: meeting_change
    threshold: "0"
    unit: "percentage points"
    questions: [{type: binary, horizons: [1, 2], threshold_rule: above_fixed}]
    publication_lag_days: 3
    void_after_days: 120
    backtest_lag_periods: 1
    resolution_note: >-
      targetRateTo of the latest EFFR record dated on or before the level day, in the first atlas.nyfed rates_d version
      registered after sealing that also publishes a record dated on or after that day. NY Fed Terms of Use notice applies.
    finance: &fomc_fin
      kind: meeting
      body: FOMC
      direction: up
      resolution_offset_days: 7
      generic_baselines: false
      forecasters: [fin.meeting_base_rate, fin.meeting_momentum]
      candidates: [fin.taylor_logit]
      calendar: {dataset_key: atlas.cbcal.meetings, indicator: "POLICY_DECISION|body=FOMC", provider_geo: US}
      inputs:
        # the lower limit (before 2008-12-16: the target rate) gives 2000-2026 history; both limits move together
        history: {dataset_key: atlas.nyfed.rates_d, indicator: "EFFR|field=targetRateFrom", provider_geo: US, lag_days: 1}
        inflation: {dataset_key: atlas.imf.cpi_m, indicator: "CPI|coicop_1999=_T|type_of_transformation=YOY_PCH_PA_PT", provider_geo: USA, frequency: M, lag_days: 45}

  - key: fin.fomc_cut
    concept_id: finance.daily.fed_funds_target_upper
    labels: {fr: "FOMC : baisse de la borne haute de la fourchette cible", en: "FOMC: decrease of the upper limit of the target range"}
    definition: >-
      New York Fed EFFR record, API field targetRateTo: upper limit of the FOMC target range. Value = level in force at
      issue minus the level in force on the decision day + 7 days (derived by REVA, meeting_change).
    definition_source: registry/atlas/catalog/daily_markets.yaml (finance.daily.fed_funds_target_upper)
