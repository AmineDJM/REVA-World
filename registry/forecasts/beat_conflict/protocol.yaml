binding: docs/roadmap/v7_beat_official.md
statement: >-
  Pre-registered before W1 or W3 is evaluated. Only the tests listed under `family` can produce a win: ONE
  Holm-Bonferroni family (alpha 0.05) over all of them, one-sided p for "the first model has the lower expected
  loss"; a declared test that is not evaluable or still pending counts with p = 1. Densities are compared with
  densities (CRPS on log1p deaths), points with points (MSLE), probabilities with probabilities (Brier, log loss);
  never a point against a density. Everything is a country-month RISK ESTIMATE from aggregate UCDP counts, never a
  prediction of a specific attack, actor or person. Wins and losses are reported exactly in
  docs/dev/v7_beat_conflict.md.
