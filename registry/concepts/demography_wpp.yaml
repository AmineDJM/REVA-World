# Demography concepts of the UN World Population Prospects 2024 dataset inputs (V3 agent SIMWORLD),
# read by demography.cohort_component@1.1.0 (data_source un_wpp2024) and social.retirement_age@1.1.0.
# Fetched by the reviewed built-in connector un.wpp (src/reva/adapters/connectors/un_wpp_demography.py)
# and stored as dataset inputs (Parquet), never as scalar observations.
#
# Separate concepts from the Eurostat ones (demography.population.jan1_age_sex, ...): the population
# universe and the measurement method differ (WPP: de facto resident population reconstructed by the UN
# Population Division's model from censuses, surveys and registers; Eurostat: usually resident population,
# registered events). Release pinning is per (concept, subject), so the two sources never displace each other.
# Published versions are immutable: changing meaning requires a new version.
concepts:
  - concept_id: demography.wpp.population.jan1_age_sex
    version: "1.0.0"
    kind: quantity
    labels: {en: "Population on 1 January by single age and sex (UN WPP 2024 estimate)"}
    definition: >-
      UN DESA Population Division, World Population Prospects 2024, file
      WPP2024_Population1JanuaryBySingleAgeSex_Medium_1950-2023: population on 1 January by single age
      0-99 and the open group 100+, by sex (published in thousands with three decimals; stored as exact
      persons). Estimates 1990-2023 only (no projection year). A model-based reconstruction, not a census
      count or register extract: the UN reconciles censuses, surveys and vital registration with its own
      cohort-component model.
    owner: reva-maintainers
    semantic_profile:
      population_universe: de_facto_population_un_wpp
      temporal_support: "point:01-01"
      spatial_support: country_or_area_un_wpp
      aggregation: point_in_time_stock
      scale_type: stock
      unit_ref: unit.persons
      permitted_transformations: [identity, sum_disjoint_leaf_cells]
      missingness: [unavailable]
      measurement_method: model_based_estimate_un_wpp2024
  - concept_id: demography.wpp.deaths.age_sex
    version: "1.0.0"
    kind: quantity
    labels: {en: "Deaths by single age and sex, calendar year (UN WPP 2024 estimate)"}
    definition: >-
      UN WPP 2024, file WPP2024_DeathsBySingleAgeSex_Medium_1950-2023: deaths during the calendar year by
      single age at death 0-99 and 100+, by sex (thousands, three decimals; stored as exact persons).
      Estimates 1990-2023. Model-based (UN life tables applied to the reconstructed population), not
      registered deaths.
    owner: reva-maintainers
    semantic_profile:
      population_universe: de_facto_population_un_wpp
      temporal_support: calendar_year
      spatial_support: country_or_area_un_wpp
      aggregation: period_flow_total
      scale_type: flow
      unit_ref: unit.persons
      permitted_transformations: [identity, sum_disjoint_leaf_cells]
      missingness: [unavailable]
      measurement_method: model_based_estimate_un_wpp2024
  - concept_id: demography.wpp.live_births.mother_age5_newborn_sex
    version: "1.0.0"
    kind: quantity
    labels: {en: "Live births by five-year age group of the mother and by newborn sex, calendar year (UN WPP 2024 estimate)"}
    definition: >-
      UN WPP 2024: births during the calendar year by five-year age group of the mother (10-14 .. 50-54;
      file WPP2024_Fertility_by_Age5, Medium variant, estimate years only) and total births (Demographic
      Indicators). Births by newborn sex are DERIVED by REVA as Births x SRB / (100 + SRB) (male) and
      Births minus male (female) from the WPP total births and the WPP sex ratio at birth (published to one
      decimal); derived cells say so in their derivation column. Model-based estimates, not registered births.
    owner: reva-maintainers
    semantic_profile:
      population_universe: de_facto_population_un_wpp
      temporal_support: calendar_year
      spatial_support: country_or_area_un_wpp
      aggregation: period_flow_total
      scale_type: flow
      unit_ref: unit.persons
      permitted_transformations: [identity, sum_disjoint_leaf_cells]
      missingness: [unavailable]
      measurement_method: model_based_estimate_un_wpp2024
  - concept_id: demography.wpp.indicators_summary
    version: "1.0.0"
    kind: quantity
    labels: {en: "UN WPP 2024 summary demographic indicators by year (diagnostics)"}
    definition: >-
      UN WPP 2024 Demographic Indicators (Medium file, estimate years 1990-2023): total population on
      1 January, births, deaths (total, male, female), net migration (persons), sex ratio at birth, total
      fertility rate, life expectancy at birth (total, male, female) and crude net migration rate, each in
      its own unit (unit column). Used only for diagnostics (e.g. REVA's residual migration next to WPP's
      net migration) and for the births-by-sex derivation; never as a projection assumption.
    owner: reva-maintainers
    semantic_profile:
      population_universe: de_facto_population_un_wpp
      temporal_support: calendar_year
      spatial_support: country_or_area_un_wpp
      # one row per (year, indicator) with its own unit column; no single scale or unit applies
      aggregation: not_applicable
      scale_type: intensive
      permitted_transformations: [identity]
      missingness: [unavailable]
      measurement_method: model_based_estimate_un_wpp2024
