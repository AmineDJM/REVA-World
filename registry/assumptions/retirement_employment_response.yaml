# Literature parameters: employment response to raising the minimum / statutory pension age.
# Consumed by PEN (social.retirement_age@1.0.0) as a STATED SCENARIO ASSUMPTION with a sensitivity
# grid (docs/dev/v2_literature.md), never as a reviewed evidence claim. Validated by
# registry/assumptions/schema.json and tests/unit/test_assumptions_registry.py.
#
# Fetched texts are NOT archived in the repository (licensing unclear for most); only the SHA-256 of
# the exact bytes received is recorded. Some publisher/repository pages are dynamic, so a later fetch
# may legitimately produce different bytes.
schema_version: "1.0.0"
registry_key: retirement_employment_response
title: Employment response to an increase in the pension eligibility age
description: >-
  Quasi-experimental estimates of how raising the early/normal/statutory pension age changed
  employment (and pension receipt) of the affected ages. The quantity most transferable across
  countries is derived per entry: the share of people kept out of pension receipt (or retirement)
  by the reform who are employed instead (employment effect / drop in pension receipt). Absolute
  percentage-point effects depend strongly on pre-reform employment and bunching at the threshold
  and should not be transferred directly.
curation:
  curated_by: "agent LIT (automated extraction; REVA V2 roadmap)"
  curated_at: "2026-10-15T01:20:00Z"
  review_status: maintainer_review_pending
  statement: >-
    No human has reviewed these extractions. Each number below was read in the text whose digest is
    recorded; values marked evidence=secondary_compilation were read in a later paper that reports
    the cited study's number with a primary locator, not in the cited study itself.
quote_normalisation: >-
  Unicode NFC normalisation, then:
  Quotes are verbatim after whitespace collapsing, re-joining words split across lines, expanding
  typographic ligatures dropped by text extraction (e.g. 'eect' -> 'effect') and joining table
  cells of one printed row with single spaces or ' | '. Minus signs are kept as printed (U+2212
  or U+2013 where the source used them).

entries:
  # ------------------------------------------------------------------ Austria, ERA
  - id: staubli_zweimuller_2013_aut
    citation: >-
      Staubli, S. and Zweimüller, J. (2013). Does raising the early retirement age increase
      employment of older workers? Journal of Public Economics 108, 17–32.
    doi: "10.1016/j.jpubeco.2013.09.003"
    url: "https://doi.org/10.1016/j.jpubeco.2013.09.003"
    accessed_at: "2026-10-15T01:03:36Z"
    verification_status: verified_from_text
    metadata_check:
      source: crossref
      url: "https://api.crossref.org/works/10.1016/j.jpubeco.2013.09.003"
      accessed_at: "2026-10-15T01:01:48Z"
      sha256: 8805b221866a9281d91456d26b812678ec48d0cd117fb6c3f6b3ba5cb57b2283
      bytes: 10665
      abstract_in_record: false
    country: AUT
    period: "1997–2010 (treatment period); placebo 1987–2000"
    design: "Difference-in-differences across birth cohorts (OLS, linear probability), administrative social-security data"
    method_family: quasi_experimental
    policy_change: "Early retirement age (ERA) raised from 60 to 62 for men and from 55 to 58.25 for women (2000 and 2004 reforms)"
    population: "Men aged 57–64 and women aged 52–59 (specification 2); effect = being below the cohort-specific new ERA"
    text_sources:
      - id: pmc3851570_xml
        kind: author_accepted_manuscript
        title: "NIHPA author manuscript PMC3851570 (NIHMS526007) of the same article"
        doi: "10.1016/j.jpubeco.2013.09.003"
        url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=3851570&retmode=xml"
        accessed_at: "2026-10-15T01:03:36Z"
        sha256: 01c8272f83fc549eb73424b894bdef093d922655e5c3385b831d7d85765844e9
        bytes: 183086
        media_type: "text/xml"
        archived: false
        licence_note: "PMC author manuscript; 'available for text mining' and fair use per the PMC record; not redistributed."
    values:
      - name: employment_effect_men
        value: 9.75
        unit: percentage_points
        as_printed: "9.75"
        standard_error: 0.30
        standard_error_as_printed: "(0.30)"
        confidence_interval: null
        definition: "Change in the probability of being employed when below the (raised) ERA, men, with controls"
        population: "Men aged 57–64, 1997–2010"
        verification: verified_from_text
        evidence: primary
        text_source: pmc3851570_xml
        locator: "Table 3 'Main effects', Panel B 'Employment', column (2); also the abstract"
        quote: "B. Employment I(age<ERA) | 12.09*** (0.45) | 9.75*** (0.30) | 7.50*** (0.47) | −0.17 (0.17) | 18.91*** (0.50) | 11.00*** (0.34) | 9.26*** (0.38) | −0.03 (0.12)"
        notes: "Abstract: 'We find that raising the ERA increased employment by 9.75 percentage points among affected men and by 11 percentage points among affected women.' Pre-policy employment mean (men 60–61, 2000): 8.76."
      - name: employment_effect_women
        value: 11.00
        unit: percentage_points
        as_printed: "11.00"
        standard_error: 0.34
        standard_error_as_printed: "(0.34)"
        confidence_interval: null
        definition: "Change in the probability of being employed when below the (raised) ERA, women, with controls"
        population: "Women aged 52–59, 1997–2010"
        verification: verified_from_text
        evidence: primary
        text_source: pmc3851570_xml
        locator: "Table 3 'Main effects', Panel B 'Employment', column (6)"
        quote: "B. Employment I(age<ERA) | 12.09*** (0.45) | 9.75*** (0.30) | 7.50*** (0.47) | −0.17 (0.17) | 18.91*** (0.50) | 11.00*** (0.34) | 9.26*** (0.38) | −0.03 (0.12)"
        notes: "Pre-policy employment mean (women 55–58.2, 2000): 27.56."
      - name: pension_receipt_effect_men
        value: -24.85
        unit: percentage_points
        as_printed: "−24.85"
        standard_error: 0.46
        standard_error_as_printed: "(0.46)"
        confidence_interval: null
        definition: "Change in the probability of claiming retirement benefits when below the (raised) ERA, men"
        population: "Men aged 57–64, 1997–2010"
        verification: verified_from_text
        evidence: primary
        text_source: pmc3851570_xml
        locator: "Table 3, Panel A 'Retirement benefits', column (2)"
        quote: "A. Retirement benefits I(age<ERA) | −26.34*** (0.61) | −24.85*** (0.46) | −21.12*** (0.93) | 1.03*** (0.22) | −34.45*** (1.04) | −24.63*** (0.94) | −22.06***(1.13) | 0.19 (0.28)"
      - name: pension_receipt_effect_women
        value: -24.63
        unit: percentage_points
        as_printed: "−24.63"
        standard_error: 0.94
        standard_error_as_printed: "(0.94)"
        confidence_interval: null
        definition: "Change in the probability of claiming retirement benefits when below the (raised) ERA, women"
        population: "Women aged 52–59, 1997–2010"
        verification: verified_from_text
        evidence: primary
        text_source: pmc3851570_xml
        locator: "Table 3, Panel A 'Retirement benefits', column (6)"
        quote: "A. Retirement benefits I(age<ERA) | −26.34*** (0.61) | −24.85*** (0.46) | −21.12*** (0.93) | 1.03*** (0.22) | −34.45*** (1.04) | −24.63*** (0.94) | −22.06***(1.13) | 0.19 (0.28)"
    derived:
      - name: employment_share_of_pension_drop_men
        op: ratio
        numerator: employment_effect_men
        denominator: pension_receipt_effect_men
        sign: -1
        value: 0.392
        unit: share
        rounding: 3
        meaning: "Share of men kept out of pension receipt by the ERA increase who are employed instead"
      - name: employment_share_of_pension_drop_women
        op: ratio
        numerator: employment_effect_women
        denominator: pension_receipt_effect_women
        sign: -1
        value: 0.447
        unit: share
        rounding: 3
        meaning: "Share of women kept out of pension receipt by the ERA increase who are employed instead"
    notes: >-
      Unemployment rose by 12.51 pp (men) and 11.77 pp (women) in the same table (Panel C, columns 2
      and 6): a large share of the delayed pensioners moved to unemployment insurance. Specification
      (1) without controls gives 12.09 pp for men; the text states 'roughly 45% of men who delay
      claiming continue to work' for that specification.

