# Plausibility benchmarks for the IO cost-push price model (economic.io_price@1.0.0, agent IO).
# These are published first-round estimates of how an oil/energy price increase feeds into producer
# and consumer prices. They are BENCHMARKS for sanity checks of model output, not calibration targets
# and not reviewed evidence. Validated by registry/assumptions/schema.json and
# tests/unit/test_assumptions_registry.py. Texts are not archived; only their SHA-256 at access.
schema_version: "1.0.0"
registry_key: io_energy_passthrough_benchmarks
title: Published input-output estimates of energy/oil price pass-through to prices
description: >-
  First-round (direct + indirect, no second-round wage/margin effects) price effects of an energy or
  oil price increase computed with input-output tables, plus one macro-model cross-check that is
  flagged as not IO-based. Shock definitions differ (all energy products vs. oil and gas vs. EUR per
  barrel of oil); compare like with like and read each entry's policy_change and notes.
curation:
  curated_by: "agent LIT (automated extraction; REVA V2 roadmap)"
  curated_at: "2026-10-15T01:20:00Z"
  review_status: maintainer_review_pending
  statement: >-
    No human has reviewed these extractions. Each number was read in the text whose digest is
    recorded. Derived elasticities are REVA computations (value / shock size) shown for comparison
    only; they assume linearity, which a Leontief price model satisfies but the sources' other
    channels may not.
quote_normalisation: >-
  Unicode NFC normalisation, then:
  Quotes are verbatim after whitespace collapsing, re-joining words split across lines or columns of
  a two-column layout, and joining table cells of one printed row with single spaces.

