    not_verified: "No DOI found in Crossref for ECB Occasional Paper 113; bibliographic data taken from the PDF itself."
    notes: >-
      The shock raises ALL energy products by 10%, including electricity and gas, so it is an
      upper-side benchmark for a crude-only shock in a model that does not force refined products
      and electricity to move with crude. The authors state the static assumptions 'suggest that the
      results will tend to overestimate the effects' while ignoring indirect effects on non-energy
      imports biases them down (Annex 2.7, pdf p.119-120). Energy branch itself: +4.88% for a 10% shock
      (Table 11). Data year 2005; energy cost shares have changed since.

