# Dataset variable -> REVA relation (agent CAUSDATA). Owner: CAUSDATA. Read by the CAUSDATA connectors
# (src/reva/adapters/connectors/atlas_icb.py, atlas_mid.py, atlas_ucdp_term.py): the `definitions` of a dataset are
# the Codebook.definitions passed to reva.causal.load_dataset_claims, verbatim (see `conventions.quotes`).
# Each mapping says whether a variable becomes a T1 causal claim (reva_kind: claim, closed vocabulary of
# registry/causal/relations.yaml) or a non-causal context statement, and WHY, with the codebook's own words.
# Generated from the pinned codebook PDFs (sha256 in `documents`); edit the mapping decisions, not the quotes.
version: 1
maintainer: CAUSDATA
updated: '2026-10-16'
conventions:
  quotes: 'Codebook text quoted verbatim from the provider PDF (pdftotext -layout of the pinned file): whitespace normalised
    to single spaces, page-number lines dropped, a hyphen at a line end joined to the next line (the hyphen is kept). pdf_page
    is the 1-based physical page of the pinned PDF.'
  claim: reva_kind 'claim' = a T1 causal claim delivered through reva.causal.load_dataset_claims (docs/dev/v3_causal_interface.md);
    the codebook_term names the definitions entry passed in Codebook.definitions.
  context: reva_kind 'context' = a KG statement (kg.statement) that is NOT causal (issue, participant, part_of, follows, attribute);
    it is never shown with causal wording.
  coded_issue: 'A dataset''s coded issue (MID revision type, UCDP incompatibility) is what is at stake / sought, not a cause:
    context family, never a claim (roadmap principle 3).'
  no_join_claims: 'REVA never creates a causal claim by joining two datasets: when one codebook says ''terminated by a peace
    agreement'' and another lists agreements, the pairing is a context statement, not a claim.'
