# Evidence grading of causal claims (agent CAUSCORE; spec docs/roadmap/v3_causality.md, principle 5).
#
# Deterministic, ordinal, no probabilities. Every grade row in kg.causal_grade records this file's `version`
# and sha256 and the ids of the rules that produced it (the deciding grade rule plus the fact rules for tier,
# temporal check, corroboration and contestation), so a grade can always be explained and re-derived.
#
# Changing any rule = bump `version`; the grader then writes new grade rows for every claim (new inputs).
# Old grade rows are never edited: kg.causal_grade_current shows the latest row of each claim.
#
# Changelog
#   1  (2026-10-16, CAUSCORE) initial table.
#   2  (2026-10-17, CAUSFIX, findings of the Wikidata causal harvest docs/dev/v3_causwd.md; report
#      docs/dev/v3_causfix.md):
#      * tier (audit H1, docs/dev/review_v3_causal_audit.md): a reference made only of non-source snaks —
#        "imported from Wikimedia project" (P143), "Wikimedia import URL" (P4656), "inferred from" (P3452),
#        "based on heuristic" (P887), plus P813 retrieval dates — is a pointer, not a source -> T4, with the fact
#        rule tier.T4.non_source_references_only (reva.causal.grading.NON_SOURCE_REF_PIDS / kg_tier; was T3).
#      * corroboration (audit H2): such a reference's upstream key is `community:<source root>` (the editing
#        community, never independent; was imported_from:<Q> / refhash); a verbatim quotation (P1683) is keyed
#        `quote:<sha of the text>`, so two references quoting the same text count once.
#      * attribution (audit H3): a claim qualified "statement supported by" (P3680) is asserted by that party,
#        not by Wikidata (rule grade.D.attributed, fact attribution.supported_by; the wording names the party);
#        a "nature of statement" (P5102) qualifier (allegedly, hypothetically, rarely ...: values kept verbatim
#        and shown, not interpreted) caps the claim likewise (grade.D.nature_qualified, fact nature.qualified).
#        Both are kept out of chain composition.
#      * certainty (audit H4): a claim whose source codes the event or link as doubtful (scope.source_validity[]
#        entry with certainty: doubtful — generic interface declared by AUDFIX, docs/dev/v3_audfix.md; e.g. NCEI
#        tsunami validity 0-2, cause code 2) is graded D (grade.D.source_doubtful, fact certainty.doubtful).
#      * structure (audit L7): self-loops (consistency.self_loop) and claims inside a causal cycle
#        (consistency.cycle, strongly connected component of the asserted causal graph of the origin) carry a
#        fact; their grade is unchanged, chain composition does not traverse them. Relations listed in
#        relations.yaml `chain_excluded` (coded_outcome, audit L6) are neither traversed nor cycle-checked.
#      * tier: WDQS rows (source key wikidata.wdqs) were read without their references: "references unknown",
#        not "unreferenced". The loader defers them (no claim, no tier invented; ClaimLoadReport.deferred_counts
#        ["references_unknown"]) until an entity snapshot of the statement (wikidata.wbapi) is loaded.
#      * temporal: an endpoint dated only by its inception (P571, no P580/P585) is an entity (state, polity,
#        organisation), not an event: its existence span [inception .. P576/P582 end, open without one] is
#        compared, never its founding date. consistent / inconsistent only when the whole span decides the
#        order, else undetermined (fact temporal.entity_dated_by_inception). When the effect is such an entity
#        and the claim carries its own P585 / P580 qualifier, that is the effect time (temporal.claim_time_qualifier).
#        Event-to-event claims are unchanged.
#      * the loader rejects a row the database refuses (per statement, with the constraint as reason) instead of
#        aborting the whole load; chain search does not traverse class items (reva.causal.graph.class_nodes).
#      * (SAMEAS, report docs/dev/v3_sameas.md) corroboration resolves evidenced event identity: claims whose
#        cause and effect are in the same `events:same_as` clusters (registry/events/same_as_rules.yaml; shared
#        identifier or provider-published crosswalk, never name/date matching) assert the same link, so two
#        independent sources coding the same pair of events under their own record ids corroborate each other
#        (fact corroboration.via_same_as). Records joined by a link declared `independent_sources: false` (one
#        record derived from the other, e.g. EUSANCT cases taken over from TIES) share the upstream key
#        `lineage:<link>` and count once. Section `identity` below.
#   3  (2026-10-17, FIXA, second audit docs/dev/review_v3_causal_audit2.md; report docs/dev/v3_fixa.md):
#      * sourcing circumstances (audit2 N2): a Wikidata claim qualified "sourcing circumstances" (P1480: presumably,
#        possibly, ...; values kept verbatim, shown with their KG label or "Qn (libellé non chargé)", never
#        interpreted) is hedged by Wikidata itself: grade capped at D (grade.D.sourcing_hedged, fact
#        nature.sourcing_circumstances) and kept out of chain composition, like P3680 / P5102. Scope qualifiers
#        P518 / P1001 / P1011 / P1012 / P1013 are worded "(applies to: ...)" (fact scope.qualified; grade unchanged).
#      * coded outcomes dated by the cause's own end (audit2 N7): when a relation of the `outcome` lane links a record
#        to its outcome and the outcome's date window equals the cause's end window, the order "start before end" is
#        true by construction: the temporal detail says `reason: effect_dated_by_cause_end` (fact
#        temporal.effect_dated_by_cause_end) and such a "consistent" check does not count toward A (condition
#        effect_dated_by_cause_end: false on grade.A.expert_consistent_corroborated). The check value is kept.
#      * Wikidata DOI references (audit2 N11; docs/roadmap/v3_causality.md: T2 = "scholarly reference with a citation
#        stored verbatim — only when such a reference arrives through a source's own references"): the tier stays T2,
#        but a community-edited statement whose only evidence is that reference is not an expert finding — REVA has
#        not checked that the cited work asserts the link. Uncorroborated it is capped at C (grade.C.t2_wikidata_single,
#        fact tier.T2.wikidata_reference); corroborated by an independent source group it follows the T1/T2 rules.
#
# Inputs of a claim:
#   tier            T1..T4 (T5/T6 never reach this table: candidates are not graded)
#   temporal_check  consistent | overlapping | inconsistent | undetermined
#   corroborated    corroboration >= corroborated_min (independent source groups, the claim's own included)
#   contested       a denying claim, an explicit `contests`, or a source qualifier (P1310 statement disputed by)
#   attributed      a P3680 "statement supported by" qualifier (version 2)
#   nature_qualified a P5102 "nature of statement" qualifier (version 2)
#   doubtful        scope.source_validity has an entry with certainty: doubtful (version 2)
#   hedged          a P1480 "sourcing circumstances" qualifier (version 3)
#   effect_dated_by_cause_end  an outcome-lane claim whose effect window equals the cause's end window (version 3)
#   community_edited the claim restates a community-edited (Wikidata) statement (version 3)
version: "3"
corroborated_min: 2

# Event identity used by corroboration (reva.causal.identity): the grader reads the current `events:same_as`
# statements of the origin and resolves each claim's cause and effect to their cluster (connected component,
# at most reva.causal.identity.MAX_CLUSTER records; a larger one is left unresolved and reported).
identity:
  resolve_same_as: true
  same_as_property: "events:same_as"

# Rules are evaluated in order; the first whose `when` matches decides the grade. Each condition key must
# hold (lists = one of). Every combination of inputs must be decided (checked by the unit tests).
rules:
  - id: grade.E.temporal_inconsistent
    grade: E
    when: {temporal_check: [inconsistent]}
    reason:
      en: "The cause starts after the effect, beyond date precision: the claim is temporally inconsistent."
      fr: "La cause commence après l'effet, au-delà de la précision des dates : l'affirmation est temporellement incohérente."
  - id: grade.E.contested_uncorroborated
    grade: E
    when: {contested: true, corroborated: false}
    reason:
      en: "The claim is contested by a source and not corroborated by an independent one."
      fr: "L'affirmation est contestée par une source et n'est pas corroborée par une source indépendante."
  - id: grade.D.attributed
    grade: D
    when: {attributed: true}
    reason:
      en: "Wikidata records this claim as made by a named party (P3680 statement supported by): it is that party's assertion, not a sourced finding."
      fr: "Wikidata indique que cette affirmation est le fait d'une partie nommée (P3680 déclaration soutenue par) : c'est l'affirmation de cette partie, pas un constat sourcé."
  - id: grade.D.nature_qualified
    grade: D
    when: {nature_qualified: true}
    reason:
      en: "Wikidata qualifies the nature of this statement (P5102: e.g. alleged, hypothetical, rare); REVA does not grade it above D."
      fr: "Wikidata qualifie la nature de cette déclaration (P5102 : par ex. allégation, hypothèse, rareté) ; REVA ne la note pas au-dessus de D."
  - id: grade.D.sourcing_hedged
    grade: D
    when: {hedged: true}
    reason:
      en: "Wikidata itself hedges this statement (P1480 sourcing circumstances: e.g. presumably, possibly); REVA does not grade it above D."
      fr: "Wikidata nuance lui-même cette déclaration (P1480 circonstances de la source : par ex. vraisemblablement, peut-être) ; REVA ne la note pas au-dessus de D."
  - id: grade.D.source_doubtful
    grade: D
    when: {doubtful: true}
    reason:
      en: "The source itself codes the event or the link as doubtful (its own validity / certainty code)."
      fr: "La source elle-même code l'événement ou le lien comme douteux (son propre code de validité / certitude)."
  - id: grade.C.t2_wikidata_single
    grade: C
    when: {tier: [T2], community_edited: true, corroborated: false}
    reason:
      en: "A Wikidata statement citing a scholarly work (DOI/ISBN), not corroborated: REVA has not checked that the work asserts this link, so it is not graded like an expert dataset."
      fr: "Déclaration Wikidata citant un travail savant (DOI/ISBN), non corroborée : REVA n'a pas vérifié que ce travail affirme ce lien ; elle n'est donc pas notée comme un jeu de données expert."
  - id: grade.A.expert_consistent_corroborated
    grade: A
    when: {tier: [T1, T2], temporal_check: [consistent], corroborated: true, effect_dated_by_cause_end: false}
    reason:
      en: "Expert-coded or scholarly source, consistent in time, corroborated by an independent source."
      fr: "Source experte (jeu de données codé ou référence savante), cohérente dans le temps, corroborée par une source indépendante."
  - id: grade.B.expert
    grade: B
    when: {tier: [T1, T2]}
    reason:
      en: "Expert-coded or scholarly source (not both corroborated and time-consistent)."
      fr: "Source experte (jeu de données codé ou référence savante), sans être à la fois corroborée et cohérente dans le temps."
  - id: grade.B.t3_corroborated
    grade: B
    when: {tier: [T3], corroborated: true}
    reason:
      en: "Referenced Wikidata statement corroborated by an independent source."
      fr: "Déclaration Wikidata référencée, corroborée par une source indépendante."
  - id: grade.C.t3_single
    grade: C
    when: {tier: [T3]}
    reason:
      en: "Referenced Wikidata statement, single independent source."
      fr: "Déclaration Wikidata référencée, une seule source indépendante."
  - id: grade.D.t4
    grade: D
    when: {tier: [T4]}
    reason:
      en: "Wikidata statement without a source reference (community-edited, unsourced)."
      fr: "Déclaration Wikidata sans référence à une source (édition communautaire, non sourcée)."

# Fact rules: attached to every grade to say what the grade rule saw.
facts:
  tier.T1:
    en: "Tier T1: expert-coded research dataset with a codebook definition."
    fr: "Niveau T1 : jeu de données de recherche codé par des experts, avec définition du codebook."
  tier.T2:
    en: "Tier T2: scholarly reference cited verbatim (DOI/ISBN) through the source's own references."
    fr: "Niveau T2 : référence savante citée telle quelle (DOI/ISBN) via les références de la source."
  tier.T3:
    en: "Tier T3: Wikidata causal statement with references."
    fr: "Niveau T3 : déclaration causale Wikidata avec références."
  tier.T4:
    en: "Tier T4: Wikidata causal statement without a source reference."
    fr: "Niveau T4 : déclaration causale Wikidata sans référence à une source."
  tier.T4.non_source_references_only:
    en: "Its only references are pointers, not sources: imported from a Wikimedia project (P143 / P4656), inferred from another item (P3452) or based on a heuristic (P887)."
    fr: "Ses seules références sont des renvois, pas des sources : importation depuis un projet Wikimedia (P143 / P4656), inférence depuis un autre élément (P3452) ou heuristique (P887)."
  temporal.consistent:
    en: "The cause starts before the effect, beyond date precision."
    fr: "La cause commence avant l'effet, au-delà de la précision des dates."
  temporal.overlapping:
    en: "The start dates overlap at their precision: the order cannot be decided."
    fr: "Les dates de début se chevauchent à leur précision : l'ordre ne peut pas être établi."
  temporal.inconsistent:
    en: "The cause starts after the effect, beyond date precision."
    fr: "La cause commence après l'effet, au-delà de la précision des dates."
  temporal.undetermined:
    en: "The order in time cannot be established (a start date is missing or out of range, or an entity's existence span does not decide it)."
    fr: "L'ordre dans le temps ne peut pas être établi (date de début manquante ou hors plage, ou durée d'existence d'une entité non décisive)."
  temporal.entity_dated_by_inception:
    en: "The cause or effect is an entity dated by its inception (P571), not an event: its whole existence span was compared, not its founding date."
    fr: "La cause ou l'effet est une entité datée par sa création (P571), pas un événement : toute sa durée d'existence a été comparée, pas sa date de fondation."
  temporal.claim_time_qualifier:
    en: "The effect time is the claim's own time qualifier (P585 point in time / P580 start time)."
    fr: "Le moment de l'effet est le qualificatif temporel de l'affirmation elle-même (P585 date / P580 début)."
  corroboration.single:
    en: "One independent source group asserts this link."
    fr: "Un seul groupe de sources indépendantes affirme ce lien."
  corroboration.corroborated:
    en: "Several independent source groups assert this link (sources sharing an upstream count once)."
    fr: "Plusieurs groupes de sources indépendantes affirment ce lien (les sources partageant une origine comptent une fois)."
  corroboration.via_same_as:
    en: "Corroboration counted a claim made about another record of the same events, joined by an evidenced same_as link (shared identifier or provider crosswalk, never name or date matching)."
    fr: "La corroboration compte une affirmation portant sur un autre enregistrement des mêmes événements, relié par un lien same_as fondé sur une preuve (identifiant partagé ou table de correspondance du fournisseur, jamais par nom ou date)."
  attribution.supported_by:
    en: "Wikidata names who makes this claim (P3680 statement supported by); Wikidata does not assert it itself."
    fr: "Wikidata nomme l'auteur de cette affirmation (P3680 déclaration soutenue par) ; Wikidata ne l'affirme pas lui-même."
  nature.qualified:
    en: "Wikidata qualifies the nature of this statement (P5102); the qualifier is shown verbatim."
    fr: "Wikidata qualifie la nature de cette déclaration (P5102) ; le qualificatif est montré tel quel."
  nature.sourcing_circumstances:
    en: "Wikidata qualifies the sourcing circumstances of this statement (P1480, e.g. presumably, possibly); the value is shown verbatim and the claim is not composed into chains."
    fr: "Wikidata qualifie les circonstances de la source de cette déclaration (P1480, par ex. vraisemblablement, peut-être) ; la valeur est montrée telle quelle et l'affirmation n'est pas composée dans une chaîne."
  scope.qualified:
    en: "Wikidata restricts the scope of this statement (P518 applies to part, P1001 jurisdiction, P1011 excluding, P1012 including, P1013 criterion); the restriction is worded with the claim."
    fr: "Wikidata restreint la portée de cette déclaration (P518 s'applique à la partie, P1001 juridiction, P1011 à l'exclusion de, P1012 y compris, P1013 critère) ; la restriction est énoncée avec l'affirmation."
  temporal.effect_dated_by_cause_end:
    en: "The outcome is dated by the cause's own end date: \"the cause starts before the effect\" holds by construction and is not independent temporal evidence (it does not count toward grade A)."
    fr: "L'issue est datée par la date de fin de la cause elle-même : « la cause commence avant l'effet » est vrai par construction et n'est pas une preuve temporelle indépendante (ne compte pas pour la note A)."
  tier.T2.wikidata_reference:
    en: "The scholarly work (DOI/ISBN) is cited in a reference of a community-edited Wikidata statement; REVA has not checked that the work asserts this link."
    fr: "Le travail savant (DOI/ISBN) est cité dans une référence d'une déclaration Wikidata communautaire ; REVA n'a pas vérifié que ce travail affirme ce lien."
  certainty.doubtful:
    en: "The source codes the event or the link as doubtful; its code and label are shown."
    fr: "La source code l'événement ou le lien comme douteux ; son code et son libellé sont montrés."
  consistency.self_loop:
    en: "The claim says an item causes itself (self-loop): reported in the consistency report, never composed into a chain."
    fr: "L'affirmation dit qu'un élément se cause lui-même (boucle) : signalée dans le rapport de cohérence, jamais composée dans une chaîne."
  consistency.cycle:
    en: "The claim lies on a causal cycle asserted by the sources: reported, kept, and never composed into a chain."
    fr: "L'affirmation fait partie d'un cycle causal affirmé par les sources : signalée, conservée, jamais composée dans une chaîne."
  contest.none:
    en: "No source contests this claim."
    fr: "Aucune source ne conteste cette affirmation."
  contest.contested:
    en: "A source contests or denies this claim; the dissent is kept and shown."
    fr: "Une source conteste ou nie cette affirmation ; le désaccord est conservé et montré."

# Temporal check (reva.causal.temporal): event start = P580 start time, else P585 point in time, else P571
# inception; event end = P582, else P585, else P576. Each date is the window of its precision (year 1929 ->
# 1929-01-01..1929-12-31; decade -> the decade; century and coarser widened one unit each side, as kg).
# Version 2: a start read from P571 marks an entity; its existence span is compared (see the changelog).
temporal:
  start_properties: [P580, P585, P571]
  end_properties: [P582, P585, P576]
