datasets:
  # ------------------------------------------------------------------------------------------------ UCDP dyad termination
  ucdp_term_dyad:
    source_key: ucdp.downloads
    dataset: term_dyad
    dataset_revision: v4-2024 (4.2024002)
    file: UCDPConflictTerminationDataset_v4_2024_Dyad.csv
    codebook_document: ucdp_term_codebook
    codebook_name: UCDP Conflict Termination Dataset Codebook v.4 2024 (dyad level)
    citation: 'Kreutz, Joakim (2010). How and when armed conflicts end: Introducing the UCDP Conflict Termination dataset.
      Journal of Peace Research 47(2): 243-250.'
    definitions:
      d_outcome:
        text: d outcome The coding of outcomes are based on the final year of activity and first year of non-activity. While
          the dataset include some information (i.e. ceasefires and peace agreements) outside this window, it does not follow
          warring party devel-opment beyond this time period. 1= Peace agreement 2= Ceasefire 3= Victory for Side A /Government
          Side 4= Victory for Side B /Non-State Side 5= Low activity (some, but less than 25 battle-deaths in subsequent year(s))
          6= Actor ceases to exist
        document: ucdp_term_codebook
        pdf_page: 8
      d_outcome=1:
        text: 1 = Peace agreement A peace agreement, or the first or last in a series of agreements, concerned with resolving
          or regulating the incompatibility – completely or a central part of – which is signed and/or accepted by all or
          the main parties active in last year of conflict. The agreement is signed either during the last year of active
          conflict or the first year of inactivity.
        document: ucdp_term_codebook
        pdf_page: 3
      d_outcome=2:
        text: 2 = Ceasefire agreement Ceasefire agreements, or the first or last in a series of agreements, does not include
          any resolution of the incompatibility. Typically, ceasefires are but con-cerned with ending the use of force by
          the warring sides but they can also offer amnesty for participation in the conflict (”guns for peace”). The agreement
          is signed and/or accepted either during the last year of active conflict or the first year of inactivity. In cases
          when a ceasefire agreement is immediately followed by a more comprehensive agreement (peace agreement), the latter
          is considered the main cause of termination.
        document: ucdp_term_codebook
        pdf_page: 3
      d_outcome=3:
        text: 3 = Victory for Side A (government side) Side A (the government side) manages to comprehensively defeat or eliminate
          the opposition, who may succumb to the power of the other through capitulation or public announcement.
        document: ucdp_term_codebook
        pdf_page: 4
      d_outcome=4:
        text: 4 = Victory for Side B (non-state side) Side B (the rebel side) manages to oust the government, or comprehensively
          defeat or eliminate the opposition, who may succumb to the power of the other through capitulation or public announcement.
        document: ucdp_term_codebook
        pdf_page: 4
      d_outcome=5:
        text: 5 = Low activity Conflict activity continues but does not reach the UCDP threshold with regard to fatalities.
          There is no information in this dataset regarding the group-specific circumstance for when fighting reduces to below
          the UCDP battle-death thresh-old. In some cases it may be because of successful military operations by the counterpart
          (similar to victory), but it could also be for a strategic reorientation towards the use of nonviolent or nonfatal
          methods, to explore the possibility of negotiations, organizational reorganization, or intra-rebel fighting, or
          a combi-nation of these factors.
        document: ucdp_term_codebook
        pdf_page: 4
      d_outcome=6:
        text: 6 = Actor ceases to exist This means that conflict activity continues but at least one of the parties ceases
          to exist or becomes another conflict actor. For states, this means for example when Hyderabad became incorporated
          into India in 1948 (ending Hyderabad (government) conflict), when Soviet Union no longer included the territory
          of subsequent Azerbaijan (ending Soviet Union (Nagorno-Karabakh) conflict), or when no central government could
          be identified by UCDP (Somalia in 1996 and 2002). For rebel organizations, changing the party is not simply a name
          change but an organizational change such as forming an alliance of many rebel groups (such as in El Salvador 1981)
          or changing territorial aims (such as Russia (Chechnya) becoming Russia (Caucasus Emirate) in 2008.
        document: ucdp_term_codebook
        pdf_page: 4
      episode:
        text: A conflict episode, thus, is defined as a continuous period of active conflict years in the UCDP-PRIO armed
          conflict dataset. A conflict episode ends when an active year is followed by a year in which there are fewer than
          25 battle-related deaths. In the event that armed activity over the same incompatibility (for conflicts) and involving
          the same warring sides (dyadic), this is coded as a new episode.
        document: ucdp_term_codebook
        pdf_page: 2
      outcome_window:
        text: The coding of outcomes are based on the final year of activity and first year of non-activity. While the dataset
          include some information (i.e. ceasefires and peace agreements) outside this window, it does not follow warring
          party development beyond this time period. For example, the Algerian rebel group GIA is coded as terminated by low
          activity in 2003, even though it continued with occasional attacks in 2004 and 2005. By 2010, remaining members
          of the group had joined AQIM who was still fighting, but since this occurred outside of the window coded in the
          dataset, this doesn’t change the ”low activity” outcome.
        document: ucdp_term_codebook
        pdf_page: 2
      d_cfiredate:
        text: d cfiredate The date of a ceasefire in the dyad at, or after, the end of the dyad episode but prior to the onset
          of the next dyad episode.
        document: ucdp_term_codebook
        pdf_page: 9
      d_peagdate:
        text: d peagdate The date of a peace agreement in the dyad at, or after, the end of the dyad episode but prior to
          the onset of the next dyad episode.
        document: ucdp_term_codebook
        pdf_page: 9
    values:
      d_outcome:
        1: Peace agreement
        2: Ceasefire
        3: Victory for Side A /Government Side
        4: Victory for Side B /Non-State Side
        5: Low activity (some, but less than 25 battle-deaths in subsequent year(s))
        6: Actor ceases to exist
    mappings:
    - variables:
      - d_outcome
      - d_epterm
      - d_ependdate
      - d_ependprec
      reva_kind: claim
      causal: true
      relation: coded_outcome
      codebook_term: d_outcome=<value>
      cause: ucdp:dyadepisode:<d_epid>
      effect: ucdp:dyadepisode:<d_epid>:termination (ucdp:dyadepisode:<d_epid>:termination:<year> per terminal row when
        the source codes several)
      why: The coded way the dyad episode ended (same outcome categories as the conflict level, CAUSDATA term_conflict). The
        conflict-level file is CAUSDATA's; the dyad file adds one termination per warring dyad (e.g. which rebel group was
        defeated or signed). Outcome 5 keeps its verbatim caveat in the delivered definitions. An episode coded with
        several terminal rows (d_epterm = 1) keeps every row as the source states (scope source_duplicate_terminal_rows;
        claims whose coded outcomes differ contest each other, scope contested_by_source) - REVA chooses none (FIXB,
        audit2 N6). d_ependprec 6 (year assigned) is year precision with the typed note source_date_certainty; 7 (year
        missing) is a typed missing date, never the placeholder 31 December (audit2 N10).
    - variables:
      - d_cfiredate
      - d_peagdate
      reva_kind: context
      causal: false
      predicate: ucdpterm:dyad_ceasefire_date / ucdpterm:dyad_peace_agreement_date (time, on the termination)
      why: 'Dates of a ceasefire / peace agreement in the dyad "at, or after, the end of the dyad episode but prior to the
        onset of the next": dated facts about the dyad, not a coded cause; no agreement id is given, so no link to an agreement
        record is made.'
    - variables:
      - side_a_id
      - side_b_id
      reva_kind: context
      causal: false
      predicate: P710 participant (ucdp:actor:<id>, side qualifier)
      why: The warring sides of the dyad (participation).
    - variables:
      - conflict_id
      - d_epno
      reva_kind: context
      causal: false
      predicate: P361 part of ucdp:conflict:<id>; P155 follows the previous dyad episode
      why: Structure and order only.
    - variables:
      - incompatibility
      reva_kind: context
      causal: false
      predicate: causdata:coded_issue
      why: The contested issue, not a cause (as CAUSDATA).
  # ------------------------------------------------------------------------------------------------ COW wars v4
  cow_inter:
    source_key: cow.data
    dataset: cow_inter
    dataset_revision: '4.0'
    file: Inter-StateWarData_v4.0.csv
    codebook_document: cow_inter_codebook
    codebook_name: COW Inter-State War Data v4.0 codebook (Sarkees)
    citation: 'Sarkees, Meredith Reid and Frank Wayman (2010). Resort to War: 1816-2007. Washington DC: CQ Press.'
    definitions:
      Outcome:
        text: 'Outcome: coded as: 1 = Winner 2 = Loser 3 = Compromise/Tied 4 = The war was transformed into another type
          of war 5 = The war is ongoing as of 12/31/2007 6 = Stalemate 7 = Conflict continues at below war level 8 = changed
          sides'
        document: cow_inter_codebook
        pdf_page: 4
      transformation:
        text: Thus, if a war changes so that one or more of the parties doing the bulk of the fighting changes, the initial
          war ends and the conflict is transformed into a war of a second type.
        document: cow_inter_codebook
        pdf_page: 2
      TransFrom:
        text: 'TransFrom - the War# of a preceding war that was transformed into this inter-state war: -8 = Not applicable'
        document: cow_inter_codebook
        pdf_page: 4
      TransTo:
        text: TransTo - the WarNum of the war that this war transformed into, -8=Not applicable
        document: cow_inter_codebook
        pdf_page: 4
      Initiator:
        text: Initiator - whether the state initiated the war 1 = Yes 2 = No
        document: cow_inter_codebook
        pdf_page: 4
    values:
      Outcome: {1: Winner, 2: Loser, 3: Compromise/Tied, 4: The war was transformed into another type of war,
                5: The war is ongoing as of 12/31/2007, 6: Stalemate, 7: Conflict continues at below war level,
                8: changed sides}
      WarType: {1: Inter-state war}
    mappings:
      - variables: [Outcome]
        reva_kind: claim
        causal: true
        relation: coded_outcome
        codebook_term: Outcome
        cause: cow:war:<WarNum>
        effect: cowwar:outcome:<WarNum>:<ccode>:<k> (outcome of the war for one state participant record)
        why: The codebook codes the outcome of the war for each state participant record (one record per participant,
          two when the state changed sides). Same treatment as the MID dispute outcome and the ICB actor outcome
          (CAUSDATA). Code 5 (ongoing as of 12/31/2007) is no outcome -> no claim; -9 / missing -> no claim.
      - variables: [TransTo, TransFrom]
        reva_kind: context
        causal: false
        predicate: cowwar:transformed_into / cowwar:transformed_from
        why: '"the initial war ends and the conflict is transformed into a war of a second type": a change of category of
          the same conflict (who does the bulk of the fighting), i.e. continuity and sequence, not one war causing another.
          Stored as context (structure family: followed_by / follows), each direction from the row that codes it.'
      - variables: [Initiator]
        reva_kind: context
        causal: false
        predicate: qualifier initiator_code on the outcome record; atlas_cow's P1344 participation qualifiers
        why: Which participant began the war is a participant role, not a cause of the war.
  cow_extra:
    source_key: cow.data
    dataset: cow_extra
    dataset_revision: '4.0'
    file: Extra-StateWarData_v4.0.csv
    codebook_document: cow_extra_codebook
    codebook_name: COW Extra-State War Data v4.0 codebook (Sarkees)
    citation: 'Sarkees, Meredith Reid and Frank Wayman (2010). Resort to War: 1816-2007. Washington DC: CQ Press.'
    definitions:
      Outcome:
        text: 'Outcome: coded as: 1 – Side A wins 2 - Side B wins 3 - Compromise 4 - The war was transformed into another
          type of war 5 - The war is ongoing as of 12/31/2007 6 - Stalemate 7 - Conflict continues at below war level'
        document: cow_extra_codebook
        pdf_page: 8
      TransFrom:
        text: 'TransFrom - the War# of a preceding war that was transformed into this extra-state war: -8 = Not applicable'
        document: cow_extra_codebook
        pdf_page: 8
      TransTo:
        text: TransTo - the War# of the war that this war transformed into, -8=Not applicable
        document: cow_extra_codebook
        pdf_page: 8
      Initiator:
        text: Initiator – Did the participant on Side A initiate the war? 0=no, 1=yes
        document: cow_extra_codebook
        pdf_page: 8
    values:
      Outcome: {1: Side A wins, 2: Side B wins, 3: Compromise, 4: The war was transformed into another type of war,
                5: The war is ongoing as of 12/31/2007, 6: Stalemate, 7: Conflict continues at below war level}
      WarType: {2: Colonial War, 3: Imperial War}
    mappings:
      - variables: [Outcome]
        reva_kind: claim
        causal: true
        relation: coded_outcome
        codebook_term: Outcome
        cause: cow:war:<WarNum>
        effect: cowwar:outcome:<WarNum>
        why: War-level outcome (identical on every participant record of the war in v4.0; checked, a disagreement is
          reported and withholds the claim). Code 5 (ongoing) -> no claim.
      - variables: [TransTo, TransFrom]
        reva_kind: context
        causal: false
        predicate: cowwar:transformed_into / cowwar:transformed_from
        why: Category change of the same conflict (see cow_inter), context only.
      - variables: [Initiator]
        reva_kind: context
        causal: false
        predicate: attribute only
        why: Participant role, not a cause.
  cow_intra:
    source_key: cow.data
    dataset: cow_intra
    dataset_revision: '4.1'
    file: Intra-StateWarData_v4.1.csv
    codebook_document: cow_intra_codebook
    codebook_name: COW Intra-State War Data v4.1 codebook (Sarkees)
    citation: 'Sarkees, Meredith Reid and Frank Wayman (2010). Resort to War: 1816-2007. Washington DC: CQ Press.'
    version_note: v4.1, not v5.1. Intra-state v5.1 (Dixon and Sarkees 2016) renumbers wars and reuses numbers for other
      wars (e.g. 856 is "Eighth Colombia" in v4.1 and "Romanian War of 1989" in v5.1), while the inter-/extra-/non-state
      v4.0 files, atlas_cow's cow:war:<n> entities and PA-X's CowWar all use the v4 numbering. Mixing would join
      different wars under one id; v5.1 is a follow-up under its own namespace. Evidence archived (FIXB, audit2 N8) -
      atlas.cowwars 1.1.0 fetches the provider's Intra-State-Wars-v5.1.zip (sha256
      b2d1f4892d3cbb02604cf8e506c5c2c3e87fb85df75276f69b1089e67fb25236 on 2026-10-17; it also holds the v5.1 codebook
      with its "Changes since Guide" list) and reports v51_numbering_check from those bytes (334 v4.1 wars, 420 v5.1
      wars, 295 shared numbers, 39 v4.1 numbers absent from v5.1, 28 shared numbers whose v5.1 war starts in
      another year).
    definitions:
      Outcome:
        text: 'Outcome: coded as: 1 - Side A wins 2 - Side B wins 3 - Compromise 4 - The war was transformed into another
          type of war 5 - The war is ongoing as of 12/31/2007 6 - Stalemate 7 - Conflict continues at below war level'
        document: cow_intra_codebook
        pdf_page: 8
      transformation:
        text: However if the intervener takes over the bulk of the fighting, the war ceases to be an intra-state war and
          is transformed into a war of a different classification.
        document: cow_intra_codebook
        pdf_page: 4
      TransFrom:
        text: 'TransFrom - the WarNum of a preceding war that was transformed into this intra-state war: -8 = Not applicable'
        document: cow_intra_codebook
        pdf_page: 7
      TransTo:
        text: TransTo - the WarNum of the war that this war transformed into, -8=Not applicable
        document: cow_intra_codebook
        pdf_page: 8
      Initiator:
        text: Initiator - the name of the participant that began the war
        document: cow_intra_codebook
        pdf_page: 7
    values:
      Outcome: {1: Side A wins, 2: Side B wins, 3: Compromise, 4: The war was transformed into another type of war,
                5: The war is ongoing as of 12/31/2007, 6: Stalemate, 7: Conflict continues at below war level}
      WarType: {4: Civil war for central control, 5: Civil war over local issues, 6: Regional internal, 7: Intercommunal}
    mappings:
      - variables: [Outcome]
        reva_kind: claim
        causal: true
        relation: coded_outcome
        codebook_term: Outcome
        cause: cow:war:<WarNum>
        effect: cowwar:outcome:<WarNum>
        why: War-level outcome (identical on every record of the war; checked). Code 5 (ongoing) -> no claim.
      - variables: [TransTo, TransFrom]
        reva_kind: context
        causal: false
        predicate: cowwar:transformed_into / cowwar:transformed_from
        why: '"the war ceases to be an intra-state war and is transformed into a war of a different classification":
          continuity of one conflict under another category, context only.'
      - variables: [CcodeA, CcodeB]
        reva_kind: context
        causal: false
        predicate: P710 participant (cow:<ccode>, side qualifier)
        why: State participants of the intra-state war (participation, not causation).
      - variables: [Initiator]
        reva_kind: context
        causal: false
        predicate: cowwar:initiator_name (string)
        why: Participant role, not a cause.
  cow_nonstate:
    source_key: cow.data
    dataset: cow_nonstate
    dataset_revision: '4.0'
    file: Non-StateWarData_v4.0.csv
    codebook_document: cow_nonstate_codebook
    codebook_name: COW Non-State War Data v4.0 codebook (Sarkees)
    citation: 'Sarkees, Meredith Reid and Frank Wayman (2010). Resort to War: 1816-2007. Washington DC: CQ Press.'
    definitions:
      Outcome:
        text: 'Outcome: coded as: 1 - Side A wins 2 - Side B wins 3 - Compromise 4 - The war was transformed into another
          type of war 5 - The war is ongoing as of 12/31/2007 6 - Stalemate 7 - Conflict continues at below war level'
        document: cow_nonstate_codebook
        pdf_page: 3
      TransFrom:
        text: TransFrom - the WarNum of a preceding war which was transformed into this war, -8=Not applicable
        document: cow_nonstate_codebook
        pdf_page: 3
      TransTo:
        text: TransTo - the WarNum of the war that this war transformed into, -8=Not applicable
        document: cow_nonstate_codebook
        pdf_page: 3
      Initiator:
        text: 'Initiator - the side, which began combat: A or B'
        document: cow_nonstate_codebook
        pdf_page: 3
    values:
      Outcome: {1: Side A wins, 2: Side B wins, 3: Compromise, 4: The war was transformed into another type of war,
                5: The war is ongoing as of 12/31/2007, 6: Stalemate, 7: Conflict continues at below war level}
      WarType: {8: wars between or among non-state entities that take place in non-state territory,
                9: wars between NSAs that take place across state borders}
    mappings:
      - variables: [Outcome]
        reva_kind: claim
        causal: true
        relation: coded_outcome
        codebook_term: Outcome
        cause: cow:war:<WarNum>
        effect: cowwar:outcome:<WarNum>
        why: War-level outcome. Code 5 (ongoing) -> no claim.
      - variables: [TransTo, TransFrom]
        reva_kind: context
        causal: false
        predicate: cowwar:transformed_into / cowwar:transformed_from
        why: Category change of the same conflict, context only.
  # ------------------------------------------------------------------------------------------------ PA-X v10
  pax:
    source_key: pax.peaceagreements
    dataset: pax
    dataset_revision: v10
    file: pax_data_2257_agreements_v10.csv
    codebook_document: pax_codebook
    codebook_name: PA-X Codebook, Version 10 (PeaceRep, University of Edinburgh)
    citation: 'Bell, C., & Badanjak, S. (2019). Introducing PA-X: A new peace agreement database and dataset. Journal of
      Peace Research, 56(3), 452-466.'
    definitions:
      peace_agreement:
        text: 'Peace Agreement: formal, publicly available document, produced after discussion with conflict protagonists
          and mutually agreed to by some or all of them, addressing conflict with a view to ending it'
        document: pax_codebook
        pdf_page: 15
      conflict:
        text: 'Conflict: armed violence, causing more than 25 conflict-related deaths in one year'
        document: pax_codebook
        pdf_page: 15
      UcdpCon:
        text: UcdpCon Uppsala Conflict Data Program Conflict ID. Note that the Conflict IDs applied are from 2017 and onward,
          after the UCDP introduced a new system of conflict designation. It is possible that this field is empty this
          happens in cases of conflicts not registered in the UCDP conflict data.
        document: pax_codebook
        pdf_page: 24
      CowWar:
        text: 'CowWar Correlates of War: War Number. Many PA-X agreements come from peace processes in conflicts that do
          not meet the high battle-related deaths criterion of the Correlates of War project, so the war numbers are not
          provided for many of the agreements.'
        document: pax_codebook
        pdf_page: 25
      UcdpAgr:
        text: UcdpAgr Uppsala Conflict Data Program peace agreement ID.
        document: pax_codebook
        pdf_page: 24
      peace_process:
        text: 'Peace or Transition Process: a formal attempt to bring political and/or military protagonists of conflict,
          to some sort of mutual agreement as to how to end the conflict, defined broadly as continuing through phases of
          mediation, unless formally terminated, or a new process has been formally created, taking context into account.'
        document: pax_codebook
        pdf_page: 15
      PP:
        text: 'PP: Peace Process Number The number code for the peace process'
        document: pax_codebook
        pdf_page: 17
      Dat:
        text: 'Dat: Date Signed Listed in the dataset as YYYY-MM-DD The date on which the agreement was signed or agreed.'
        document: pax_codebook
        pdf_page: 18
      Stage_imp:
        text: 'Imp: Implementation/renegotiation. Aiming to implement an earlier agreement. Note that this category does
          not include ceasefires.'
        document: pax_codebook
        pdf_page: 20
      Stage_pre:
        text: 'Pre: Pre-negotiation/process. Agreements that aim to get parties to the point of negotiating over the
          incompatibilities at the heart of the conflict. Note that these agreements can happen at any time in a process
          (even after a comprehensive peace agreement has been signed), if parties have moved back into ‘talking about
          how they are going to talk’. Therefore, this characterization does not imply temporal precedence.'
        document: pax_codebook
        pdf_page: 20
      OthAgr:
        text: 'OthAgr: Other Agreement Names of any other agreements that the document in question mentions, as found in
          the text.'
        document: pax_codebook
        pdf_page: 23
      Contp:
        text: 'Contp: Conflict type Type of conflict the agreement is addressing:'
        document: pax_codebook
        pdf_page: 16
    mappings:
      - variables: [UcdpCon]
        reva_kind: context
        causal: false
        predicate: pax:ucdp_conflict (pax:agt:<AgtId> -> ucdp:conflict:<UcdpCon>)
        why: 'A PA-X peace agreement is a document "addressing conflict with a view to ending it" and UcdpCon codes which
          (UCDP) conflict. That says what the agreement addresses, not that it is a reaction to or caused by the conflict
          (same reading as the causal audit M6 for the UCDP Peace Agreement Dataset, docs/dev/review_v3_causal_audit.md).
          Connector 1.0.0 delivered these as reaction_to claims; 1.1.0 keeps them as context and its empty complete
          delivery retracts the 1.0.0 claims.'
      - variables: [CowWar]
        reva_kind: context
        causal: false
        predicate: pax:cow_war (pax:agt:<AgtId> -> cow:war:<CowWar>, COW v4 numbering)
        why: 'Same definition and decision as UcdpCon. PA-X cites Sarkees & Wayman (2010): the v4 numbering (checked: e.g.
          856 "Eighth Colombia" in COW intra-state v4.1).'
      - variables: [UcdpAgr]
        reva_kind: context
        causal: false
        predicate: pax:ucdp_agreement_id (identifier; same_as rule pax_ucdp_agreement_id in registry/events/same_as_rules.yaml)
        why: PA-X's own coding of the UCDP Peace Agreement Dataset id of the same document - identity evidence (same_as),
          not a causal link.
      - variables: [PP, PPName]
        reva_kind: context
        causal: false
        predicate: P361 part of pax:process:<PP>
        why: Membership of a peace process, structure only.
      - variables: [Stage, StageSub]
        reva_kind: context
        causal: false
        predicate: pax:stage (string)
        why: '"Imp: Aiming to implement an earlier agreement" names no agreement (OthAgr gives free-text names "as found
          in the text"); "Pre" explicitly "does not imply temporal precedence". No link between agreements is coded, so
          none is made (no name matching).'
      - variables: [Contp]
        reva_kind: context
        causal: false
        predicate: causdata:coded_issue
        why: Type of conflict the agreement addresses (government / territory ...), a coded issue, not a cause.
  # ------------------------------------------------------------------------------------------------ IDMC GIDD
  idmc_disasters:
    source_key: idmc.gidd
    dataset: idmc_disasters
    dataset_revision: GIDD disasters 2025-05-13
    file: IDMC_GIDD_Disasters_Internal_Displacement_Data.xlsx (sheet 1_Disaster_Displacement_data)
    codebook_document: idmc_readme
    codebook_name: 'IDMC Global Internal Displacement Database (GIDD) - Disasters, README sheet'
    citation: 'Internal Displacement Monitoring Centre. Global Internal Displacement Database - Disasters. IDMC.
      https://www.internal-displacement.org/database/displacement-data/'
    definitions:
      disaster_displacement:
        text: 'Disaster displacement: Refers to situations where people are forced to leave their homes or places of
          habitual residence as a result, or in anticipation of the negative impact of natural hazards.'
        document: idmc_readme
        cell: README!A24
      disaster_internal_displacements:
        text: 'Disaster Internal Displacements raw: Total number of internal displacements reported (not rounded), as a
          result of disasters over the reporting year. Units are recorded as ''internal displacement flows'' or ''internal
          displacement movements''.'
        document: idmc_readme
        cell: README!A46
      displacement_occurred:
        text: 'Displacement Occurred: This field contains values that represent if preventive evacuations were reported.
          These evacuations are the result of existing early warning systems.'
        document: idmc_readme
        cell: README!A52
      event_id:
        text: 'Event ID: Unique identifier for events as assigned by IDMC.'
        document: idmc_readme
        cell: README!A51
      event_codes:
        text: 'Event Codes (Code:Type): Unique codes such as the GLIDE number and other database-specific codes used to
          identify and track specific events across various databases.'
        document: idmc_readme
        cell: README!A50
      date_of_event:
        text: 'Date of Event (Start): Approximate start date of the event.'
        document: idmc_readme
        cell: README!A44
      event_name:
        text: 'Event Name: Common or official event name for the event, if available. Otherwise, events are coded based
          on the country, type of hazard, location, and event start date.'
        document: idmc_readme
        cell: README!A43
    mappings:
      - variables: [Event ID, Disaster Internal Displacements (Raw), ISO3, Year]
        reva_kind: claim
        causal: true
        relation: has_effect
        codebook_term: disaster_displacement
        cause: idmc:event:<Event ID> (the disaster event; idmc:event:r<row key> when IDMC gives no Event ID)
        effect: idmc:displacement:<event key>:<ISO3>:<Year> (the internal displacements the row reports)
        why: 'The README defines the figure as internal displacements "as a result of disasters" and disaster displacement
          as people "forced to leave their homes ... as a result, or in anticipation of the negative impact of natural
          hazards": the source attributes the displacement to the event (has_effect, polarity promotes). A row without a
          positive figure would give no claim (none in the 2025-05-13 file). Rows whose displacement is (also) in
          anticipation of the hazard give NO claim (FIXB, audit2 N4; next mapping).'
      - variables: [Displacement occurred, Event Name]
        reva_kind: context
        causal: false
        predicate: idmc:displacement_in_anticipation_of (idmc:displacement:<event key>:<ISO3>:<Year> -> idmc:event:<key>)
        why: 'README A24 counts displacement "as a result, or in anticipation of the negative impact of natural hazards"
          and A52 flags rows where "preventive evacuations were reported. These evacuations are the result of existing
          early warning systems." For a row flagged "Displacement reporting preventive evacuations", or whose IDMC-coded
          event name describes a hazard risk, a threat, a false alarm or a pre-emptive / preventive move, the figure
          includes displacement in anticipation of a hazard that may never have struck, which IDMC does not separate
          from displacement by an impact. No relation of registry/causal/relations.yaml fits (has_effect asserts an
          effect of the hazard event; reaction_to / precipitated assert that the event provoked or triggered it, while
          A52 attributes the evacuations to early warning systems), so these rows are context only (basis, the
          verbatim flag and both README passages in the qualifiers; the figure stays on the displacement record).
          Need recorded for the causal core in docs/dev/v3_fixb.md.'
      - variables: [Event Codes (Code:Type)]
        reva_kind: context
        causal: false
        predicate: idmc:glide_number / idmc:event_code (identifiers)
        why: Cross-database identifiers (GLIDE, IFRC appeal ids, government ids) - identity evidence, never causal.
      - variables: [Hazard Category, Hazard Type, Hazard Sub Type]
        reva_kind: context
        causal: false
        predicate: idmc:hazard (string, CRED EM-DAT classification)
        why: Attribute of the event (its type), not a cause.
