# Published results the event-study engine must reproduce BEFORE it produces any new estimate
# (docs/roadmap/v5_prediction_engine.md, PRED-EVENTSTUDY). Agent PRED-EVENTSTUDY, 2026-10-17.
#
# Each target: the publication (citation verbatim, URL, sha256 of the file read, retrieval date), the published
# numbers as printed with a verbatim (whitespace-normalised) quote of the row they appear in, the exact
# specification REVA runs, the data REVA uses (atlas snapshot series), the documented differences with the
# original, and a tolerance DECLARED HERE BEFORE THE FIRST RUN (changing a tolerance after seeing a result is
# not allowed: bump the target id instead and keep the old outcome in the report).
#
# Publication files are archived by `reva estimate replicate --archive-papers <dir>` into the artifact store
# (namespace raw, rights: copyright of the authors/publisher, not redistributed); they are not in the repository.
