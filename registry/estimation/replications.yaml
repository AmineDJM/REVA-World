  - id: lv2020_output_loss
    citation: >-
      Laeven, L. and Valencia, F. (2020), 'Systemic Banking Crises Database II', IMF Economic Review 68, 307-361,
      doi:10.1057/s41308-020-00107-3 (data file: electronic supplementary material 1). (c) IMF.
    url: https://static-content.springer.com/esm/art%3A10.1057%2Fs41308-020-00107-3/MediaObjects/41308_2020_107_MOESM1_ESM.xlsx
    file_sha256: "from the atlas cells (raw_sha256 of atlas.laeven_valencia.sbcd output_loss cells)"
    locator: "data file, sheet of crisis episodes, column 'Output loss 1/' and footnote 1/"
    design: per_crisis_computation
    published:
      series: series:laeven_valencia.sbcd.output_loss
      definition_quote: >-
        In percent of GDP. Output losses are computed as the cumulative sum of the differences between actual and
        trend real GDP over the period [T, T+3], expressed in percent of trend real GDP, with T denoting the
        starting year of the crisis. The trend is computed by applying an HP filter (λ=100) to the GDP series over
        [T-20, T-1].  No output losses are reported for crises in transition economies that took place during the
        period of transition to market economies.
    specification: >-
      PRIMARY (declared before the first run): for each crisis with a published output loss, log real GDP over
      [T-20, T-1] (the contiguous available span ending at T-1, at least 4 years), HP trend (lambda = 100);
      trend extrapolated to T..T+3 at the HP trend's growth rate of year T-1 (tau[T-1] - tau[T-2]); loss =
      sum over k = 0..3 of 100 x (trend[T+k] - actual[T+k]) / trend[T+k]; negative totals truncated at 0 (the
      published file reports 0 for such crises). Real GDP: IMF WEO real GDP growth (NGDP_RPCH, chained into an
      index; LV name the WEO as their source) when it covers [T-4, T+3]; else WDI GDP constant 2015 US$
      (NY.GDP.MKTP.KD). SENSITIVITY (reported, not used for the verdict): WDI only; trend extrapolated at the
      mean trend growth over the window.
    data:
      primary: series:imf.weo.NGDP_RPCH
      fallback: series:wb.wdi_econ.NY.GDP.MKTP.KD
    differences: >-
      The extrapolation rule is not stated in the footnote (REVA's reading, declared above). LV computed with the
      WEO vintage of 2017-2018 (and WDI where WEO was missing); REVA uses the WEO and WDI vintages of the pinned
      atlas snapshot (later revisions, different base years). Transition-economy crises have no published loss
      and are not compared.
    tolerance:
      rule: >-
        PASS when, over crises with both a published and a REVA value (at least 80), the Spearman rank
        correlation is >= 0.75 and the median absolute difference is <= 10 percentage points of trend GDP.
      min_n: 80
      min_spearman: 0.75
      max_median_abs_diff: 10.0

  - id: cs2007_table2_all
    citation: >-
      Cerra, V. and Saxena, S. C. (2007), 'Growth dynamics: the myth of economic recovery', BIS Working Papers
      No 226 (March 2007); published as Cerra and Saxena (2008), American Economic Review 98(1), 439-457.
    url: https://www.bis.org/publications/working-paper-226-growth-dynamics-myth-economic-recovery.pdf
    file_sha256: 80c2b0841bcb14e2b4e3c121630b82925fab15846898bb47fcd6f3605138bb00
    retrieved_at: "2026-10-17"
    locator: "Table 2: Characteristics of recessions, row 'All country episodes', World Bank columns (pdf p. 18)"
    design: recession_episodes
    published:
      quote: "All country episodes –7.5 1.62 637 –7.5 1.78 928"
      definition_quote: >-
        For the sample of World Bank and Penn World Tables growth rates, we calculated the average cumulative loss
        and average length of recessions (defined as years of negative growth).
      sample_quote: >-
        unbalanced panels of annual observations spanning 192 countries from 1960 to 2001 for the World Bank
        dataset
      mean_cumulative_loss: -7.5
      mean_duration_years: 1.62
      n_episodes: 637
    specification: >-
      Annual real GDP growth (WDI NY.GDP.MKTP.KD.ZG, annual %), every crosswalk country, years 1960-2001. A
      recession is a maximal run of consecutive years with negative growth; its cumulative loss is the sum of the
      growth rates over the run (percent of GDP), its duration the run length. Means over all episodes.
    data:
      outcome: series:wb.wdi_econ.NY.GDP.MKTP.KD.ZG
    differences: >-
      The paper used the WDI vintage of about 2005 (192 countries); REVA uses the WDI release of the pinned
      snapshot (revised national accounts, new base year 2015, more back-filled country-years). Whether a run cut
      by the sample edges counts is not stated; REVA counts it.
    tolerance:
      rule: >-
        PASS when the mean cumulative loss is within 1.5 percentage points of -7.5, the mean duration within 0.25
        years of 1.62, and the number of episodes within 20 % of 637.
      loss_abs: 1.5
      duration_abs: 0.25
      n_rel: 0.20
