    citation: >-
      Jordà, Ò., Schularick, M. and Taylor, A. M. (2011, revised), 'When Credit Bites Back: Leverage, Business
      Cycles, and Crises', NBER Working Paper 17621 (published 2013 in the Journal of Money, Credit and Banking
      45(s2), 3-28).
    url: https://www.nber.org/system/files/working_papers/w17621/w17621.pdf
    file_sha256: ea3021153056f7709c6421d9ad1c2b664b5dfd4a6f09eb93dc6350345a528ed4
    retrieved_at: "2026-10-17"
    locator: "Table 4: Unconditional Recession Paths, Normal v. Financial Bins (pdf p. 16); peaks: Table 1 (p. 8)"
    design: event_sample_bins
    published:
      unit: "Log real GDP per capita (relative to Year 0, x100)"
      horizons: [1, 2, 3, 4, 5]
      quotes:
        N: "Normal recession (N) -2.0∗ -0.0 2.0∗ 3.3∗ 4.5∗ (0.2) (0.3) (0.4) (0.6) (0.7)"
        F: "Financial recession (F) -2.7∗ -3.1∗ -2.5∗ -0.9 1.0 (0.3) (0.6) (0.8) (1.1) (1.2)"
        n: "Observations, Normal 173 173 173 173 173 Observations, Financial 50 50 50 50 50"
      coefficients:
        N: {point: [-2.0, -0.0, 2.0, 3.3, 4.5], se: [0.2, 0.3, 0.4, 0.6, 0.7], n: 173}
        F: {point: [-2.7, -3.1, -2.5, -0.9, 1.0], se: [0.3, 0.6, 0.8, 1.1, 1.2], n: 50}
    specification: >-
      For every business-cycle peak of Table 1 (14 countries, 298 peaks, classified N/F by the authors), the
      dependent variable is 100 x (ln y[peak+h] - ln y[peak]), h = 1..5, y = real GDP per capita. OLS on the two
      mutually exclusive bin dummies without constant (= bin means), classical OLS standard errors. Exclusions
      quoted from the paper: "the war windows 1914–18 and 1939–45 are excluded, as are data corresponding to peaks
      which are within 5 years of the wars looking forwards, or 2 years looking backwards" and "excluding the
      recessions starting in 2007–08 for which the windows do not yet have complete data" (implemented as: drop a
      peak p when [p-2, p+5] meets 1914-1918 or 1939-1945, or p+5 > 2008; this reproduces the paper's counts
      173 N + 50 F = 223 exactly).
    data:
      outcome: series:jst.macrohistory.rgdpbarro
      outcome_label: "JST R6 rgdpbarro: real GDP per capita (index, 2005=100), Barro-Ursúa based"
    differences: >-
      The paper uses the Barro-Ursúa (2008) per-capita GDP data of 2011; REVA uses the JST Macrohistory Database
      R6 (2021) series rgdpbarro, which extends and revises it. The peak dates are the paper's (Table 1), not
      re-dated by REVA. Standard errors: the paper does not state the estimator; REVA uses classical OLS.
    tolerance:
      rule: >-
        PASS when every one of the 10 published coefficients is reproduced within 2 published standard errors
