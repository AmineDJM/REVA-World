  # ---- A-CULTURE: Olympic Games medal tables 1896-2026 (English Wikipedia {{Medals table}}, CC BY-SA 4.0,
  # counts cite the IOC), atlas table olympics.medal_tables (src/reva/adapters/connectors/atlas_olympics.py).
  # provider_geo = IOC NOC code; historical NOCs (URS, GDR, FRG, EUN, TCH, YUG, ...) unmapped, never given to successors.
  - id: culture.olympic_gold_medals_summer
    labels: {fr: "Médailles d'or olympiques (Jeux d'été)", en: "Olympic gold medals (Summer Games)"}
    definition: "Number of gold medals won by the country's National Olympic Committee at the Summer Olympic Games held in the period's year, as listed in the Games' medal table."
    unit: count
    domain: culture
    subdomain: olympics
    source_order:
      - "olympics.medal_tables.gold|season=summer"
    provider_declared: true
    notes: "Source: English Wikipedia medal-table articles (community-edited; each table cites the IOC medal table or Official Report; revision id per cell). Only medal-winning NOCs (and the host) appear: no row means no medal or no participation, never a reported zero. NOC codes map to present-day countries by IOC code continuity (territory may differ, e.g. GER 1896-1936). Tokyo 2020 is dated 2021 (held_in)."
