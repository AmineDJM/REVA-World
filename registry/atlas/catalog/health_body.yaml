# Atlas catalog: human body and diseases -- burden (agent V4HEALTH). Provider-declared concepts, not human-reviewed.
# Series: who.ghe.ghe.<measure>|sex=TOTAL|age=TOTAL|cause=<WHO GHE cause code> (src/reva/adapters/connectors/atlas_who_ghe.py).
# Concepts cover the 27 GHE cause groups of levels 0-2 (every year 2000-latest); level 3-5 causes exist for the latest year
# only and are queried as series. French labels are REVA translations of the WHO English cause titles (the English
# title is WHO's, verbatim). GHE causes are WHO categories, not Disease Ontology / Mondo classes (no ICD code per
# cause in the API; never matched by name).
domain: health_body
labels: {fr: "Corps humain et maladies (charge de morbidité)", en: "Human body and diseases (burden)"}
maintainer: V4HEALTH
concepts:
  - id: health_body.ghe.deaths.all_causes
    labels: {"fr": "Décès : Toutes causes (OMS, GHE)", "en": "Deaths: All Causes (WHO GHE)"}
    definition: "WHO Global Health Estimates, number of deaths attributed to the GHE cause 'All Causes' (cause code 0, level 0), all ages, both sexes; modelled estimates comparable across countries, with WHO uncertainty bounds for the counts in flags.low/high."
    unit: "deaths"
    domain: health_body
    subdomain: mortality_by_cause
    theme: health_body
    source_order: ["who.ghe.ghe.deaths|sex=TOTAL|age=TOTAL|cause=0"]
    provider_declared: true
  - id: health_body.ghe.deaths_rate100k.all_causes
