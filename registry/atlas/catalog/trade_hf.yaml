  en: Sub-annual merchandise trade
maintainer: V6TRADEHF
concepts:
- id: trade_hf.goods_exports_world_usd_m
  labels:
    fr: Exportations de marchandises vers le monde (mensuel, FMI IMTS, dollars US)
    en: Merchandise exports to the world (monthly, IMF IMTS, US dollars)
  definition: 'IMF IMTS series name "Exports of goods, Free on board (FOB), US dollar", counterpart G001 World, monthly.'
  unit: US dollars
  domain: trade_hf
  subdomain: goods
  theme: trade
  source_order:
  - imf.imts_world_m.XG_FOB_USD|partner=G001
  provider_declared: true
  notes: Bilateral monthly cells are in atlas imf.imts_m (flags.partner_iso3); annual cells in imf.imts.
- id: trade_hf.goods_imports_world_usd_m
  labels:
    fr: Importations de marchandises du monde (mensuel, FMI IMTS, dollars US)
    en: Merchandise imports from the world (monthly, IMF IMTS, US dollars)
  definition: 'IMF IMTS series name "Imports of goods, Cost insurance freight (CIF), US dollar", counterpart G001 World, monthly.'
  unit: US dollars
  domain: trade_hf
  subdomain: goods
  theme: trade
  source_order:
  - imf.imts_world_m.MG_CIF_USD|partner=G001
  provider_declared: true
  notes: Exports FOB and imports CIF; their difference is not the BOP goods balance.
