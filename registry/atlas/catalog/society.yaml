    of Christians'').'
  unit: '%'
  domain: society
  subdomain: religion
  theme: culture
  value_kind: numeric
  source_order:
  - rcs.dem2.CHRPC
  provider_declared: true
  notes: 'RCS-Dem 2.0 (Brown & James 2019), OSF doi:10.17605/OSF.IO/7SR4M. Percent of the total population (0-100) as published;
