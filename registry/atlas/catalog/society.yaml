# Society & culture concepts of the atlas (agent A-SOCIETY). Provider-declared, not human-reviewed.
# Tables: rcs.dem2 (RCS-Dem 2.0, religion shares 1700s-2015), wrp.national (World Religion Project 1945-2010),
# hief.hief and sscp.frac_v1 (fractionalisation), cdpd.cdpd_v1 (death penalty status 1800-2022), who.gho_violence
# (WHO homicide estimates), ti.cpi (Corruption Perceptions Index 2012-2025), oecd.sigi2023 (SIGI + legal-framework
# variables), parlgov.elections (party vote shares and seats, 37 countries; no catalog concept: per-party series are
# addressed by key 'parlgov.elections.vote_share|election=<parliament|ep>|party=<id>').
#
# Not duplicated here (already catalogued by other agents, same series): internet users / mobile and broadband
# subscriptions (ITU via WDI: wb.it.net.user.zs, wb.it.cel.sets.p2, wb.it.net.bbnd.p2; A-WB), international tourism
# arrivals / receipts (UN Tourism via WDI: wb.st.int.arvl, wb.st.int.rcpt.cd; A-WB), UNODC intentional homicides
# (wb.vc.ihr.psrc.p5; A-WB), women in parliament (politics.parliament.women_lower_chamber_pct; A-POL), turnout
# (politics.elections.turnout_parliamentary_lower, politics.vdem.turnout_*; A-POL), religions / ethnic groups /
# languages as text (factbook.text.*; A-FACTBOOK). Licence decisions per source: docs/dev/v3_a_society.md.
domain: society
concepts:
- id: society.religion.rcs.christians_pct
