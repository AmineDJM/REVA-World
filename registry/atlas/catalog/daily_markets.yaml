- id: prices.daily.ulsd_nyh_spot
  labels:
    en: Ultra-low sulfur No. 2 diesel spot price, New York Harbor (daily)
    fr: Prix spot du gazole n° 2 à très basse teneur en soufre, port de New York (quotidien)
  definition: 'EIA series EER_EPD2DXL0_PF4_Y35NY_DPG: New York Harbor Ultra-Low Sulfur No 2 Diesel Spot Price (Dollars per
    Gallon). EIA definition: No. 2 Diesel Fuel A gasoil type distillate for use in high speed diesel engines generally operated
    under uniform speed and load conditions, with distillation temperatures between 540-640 degrees Fahrenheit at the 90-percent
    recovery point; and the kinematic viscosities between 1.9-4.1 centistokes at 100 degrees Fahrenheit as defined in ASTM
    specification D975-93. Includes Type R-R diesel fuel used for railroad locomotive engines, and Type T-T for diesel-engine
    trucks. For pricing data: Ultra-Low Sulfur or On-Highway Diesel Fuel is No. 2 diesel fuel which has a sulfur level less
    than or equal to 15 ppm (parts per million); Low Sulfur Diesel Fuel is No. 2 diesel fuel which has a sulfur level greater
    than 15 and less than or equal to 500 ppm; and High Sulfur refers to No. 2 distillate (either diesel or fuel oil) which
    has a sulfur level greater than 500 ppm.'
  unit: Dollars per Gallon
  domain: daily_markets
  subdomain: energy_spot
  theme: prices
  source_order:
  - eia.spot_d.EIA_SPOT|series=EER_EPD2DXL0_PF4_Y35NY_DPG
  provider_declared: true
  notes: 'Daily closing spot price, one cell per trading day (atlas eia.spot_d). Prices sourced by EIA from Refinitiv, an
    LSEG business: licence review flagged on every value.'
  tags:
  - daily
  - energy
  - spot
