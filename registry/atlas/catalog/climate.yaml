- id: climate.attribution.findings_more_likely
  labels:
    en: 'Attribution study findings: extreme made more severe or likely by climate change'
    fr: 'Conclusions d''études d''attribution : extrême rendu plus intense ou probable par le changement climatique'
  definition: Number of study findings in Carbon Brief's attribution map, for extremes of a single year in the country, classified
    'More severe or more likely to occur' (derived count).
  unit: study findings
  domain: climate
  subdomain: attribution
  theme: climate
  value_kind: numeric
  source_order:
  - attribution_cb.findings.FINDINGS|class=more_severe_or_likely
  provider_declared: true
  notes: Carbon Brief, CC BY-NC-ND 4.0 (non-commercial, no derivatives). A count of studies, not of events; reflects research
    effort.
  tags:
  - carbonbrief
  - attribution
  - non_commercial
