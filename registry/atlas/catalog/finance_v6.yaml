# Atlas catalog 'finance_v6' (agent V6FINDATA, V6, 2026-10-17). Provider-declared concepts (not human-reviewed) for
# atlas_bis_fin.py, atlas_imf_fin.py, atlas_cb_balance.py, atlas_ff_factors.py; one source each (no cross-provider
# equivalence asserted). See docs/dev/v6_findata.md.
domain: finance_v6
labels:
  en: Finance - balance sheets, debt, reserves, banking
  fr: Finance - bilans, dette, réserves, banques
maintainer: V6FINDATA
concepts:
- id: finance.cb.total_assets_usd_monthly
  labels:
    en: 'Central bank total assets, US dollars (monthly, BIS)'
    fr: 'Actif total de la banque centrale, dollars US (mensuel, BRI)'
  definition: 'BIS WS_CBTA "Central bank, assets, total, BIS-spliced, break-adjusted" in US dollars (billions), monthly.'
  unit: US dollar (USD) x10^9
  domain: finance_v6
  subdomain: central_banks
  theme: finance
  source_order: ['bis.cbta.CBTA|freq=M|unit_measure=USD|transformation=B|comp_method=B']
  provider_declared: true
  notes: Monthly, quarterly and annual series are distinct indicators; national source per series in flags.data_comp.
  tags: [monthly, central_bank]
