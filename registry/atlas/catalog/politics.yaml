# Category labels written by A-POL are short forms of the providers' codebook texts (codebooks archived with the raw
# data); French labels are A-POL translations. Concepts list several sources only when the provider definitions match.
domain: politics
labels:
  fr: Politique et régimes politiques
  en: Politics and political regimes
maintainer: A-POL
concepts:
- id: politics.vdem.electoral_democracy
  labels:
    fr: Indice de démocratie électorale (V-Dem)
    en: Electoral democracy index (V-Dem)
  definition: 'To what extent is the ideal of electoral democracy in its fullest sense achieved? (Dahl''s polyarchy: elected
    officials, free and fair elections, freedom of expression, freedom of association, suffrage) (v2x_polyarchy). V-Dem index,
    interval scale from low (0) to high (1); point estimate (posterior median) of V-Dem''s Bayesian measurement model; country-year
    value is the day-weighted mean. 68% highest-posterior-density bounds are published as v2x_polyarchy_codelow / v2x_polyarchy_codehigh
    in the same table.'
  unit: index 0-1
  domain: politics
  subdomain: democracy_indices
  value_kind: numeric
  source_order:
  - vdem.indices.v2x_polyarchy
  provider_declared: true
  notes: 'Source V-Dem v16 (CC BY-SA 4.0: attribute V-Dem; share derived tables alike).'
  tags:
  - source:vdem
  - licence:CC-BY-SA-4.0
  - index
  - high_level
