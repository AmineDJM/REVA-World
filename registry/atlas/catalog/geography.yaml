- id: geography.disputed_area_ne10m
  labels:
    fr: Superficie des zones disputées (Natural Earth)
    en: Area of disputed areas (Natural Earth)
  definition: Area of a Natural Earth 1:10m disputed / breakaway / claim polygon, attached to the Admin-0 feature Natural
    Earth attaches it to (administering side in the de facto view); provider_geo is the Natural Earth BRK_A3 code and flags.ne_note
    quotes who administers and who claims.
  unit: km2
  domain: geography
  subdomain: disputes
  value_kind: numeric
  source_order:
  - naturalearth.admin0_10m_disputed.disputed_area_km2
  provider_declared: true
  notes: Several rows per country are possible (one per area, provider_geo distinguishes them). Not a judgement on any claim.
