  - id: health.deaths_share.cancer
    labels: {fr: "Part des décès dus aux cancers", en: "Share of deaths due to malignant neoplasms"}
    definition: "Percentage of all deaths due to malignant neoplasms (WHO GHE, both sexes)."
    unit: "% of total deaths"
    domain: health
    subdomain: causes_of_death
    source_order: ["who.gho.NCDMORTPERCENT|sex=SEX_BTSX|ghecauses=GHECAUSES_GHE061"]
    provider_declared: true
  - id: health.deaths_share.diabetes
    labels: {fr: "Part des décès dus au diabète", en: "Share of deaths due to diabetes"}
    definition: "Percentage of all deaths due to diabetes mellitus (WHO GHE, both sexes)."
    unit: "% of total deaths"
    domain: health
    subdomain: causes_of_death
    source_order: ["who.gho.NCDMORTPERCENT|sex=SEX_BTSX|ghecauses=GHECAUSES_GHE080"]
    provider_declared: true
  - id: health.deaths_share.chronic_respiratory
