    unit: per 100 000 population
    domain: health
    subdomain: environment
    source_order: ["who.gho.SDGWSHBOD|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.basic_drinking_water
    labels: {fr: "Accès à l'eau potable (au moins basique)", en: "Population using at least basic drinking-water services"}
    definition: "Share of the population using at least basic drinking-water services, total (WHO/UNICEF JMP)."
    unit: "%"
    domain: health
    subdomain: environment
