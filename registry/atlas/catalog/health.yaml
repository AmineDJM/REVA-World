    provider_declared: true
    notes: "Crude rates (SDG 3.4.2) by age group are in who.gho.SDGSUICIDE|sex=...|agegroup=..."
  - id: health.suicide_rate.crude
    labels: {fr: "Taux brut de suicide", en: "Crude suicide rate"}
    definition: "Suicide deaths per 100 000 population, all ages (WHO GHE, SDG 3.4.2, both sexes)."
    unit: per 100 000 population (crude)
    domain: health
