    unit: per 100 000 population (age-standardized)
    domain: health
    subdomain: environment
    source_order: ["who.gho.SDGAIRBODA|sex=SEX_BTSX|ghecause=GHECAUSE_GHE000000"]
    provider_declared: true
  - id: health.ambient_air_pollution_death_rate
    labels: {fr: "Mortalité attribuable à la pollution de l'air ambiant", en: "Death rate attributable to ambient air pollution"}
    definition: "Age-standardized deaths attributable to ambient air pollution per 100 000 population, all causes (WHO, both sexes)."
    unit: per 100 000 population (age-standardized)
    domain: health
    subdomain: environment
    source_order: ["who.gho.AIR_42|sex=SEX_BTSX|ghecause=GHECAUSE_GHE000000"]
    provider_declared: true
  - id: health.pm25_concentration
    labels: {fr: "Concentration de particules fines (PM2,5)", en: "Fine particulate matter (PM2.5) concentration"}
    definition: "Annual mean concentration of PM2.5, total (urban and rural) areas (WHO modelled, SDG 11.6.2)."
    unit: "µg/m³ (annual mean)"
    domain: health
    subdomain: environment
    source_order: ["who.gho.SDGPM25|residenceareatype=RESIDENCEAREATYPE_TOTL"]
    provider_declared: true
  - id: health.wash_death_rate
