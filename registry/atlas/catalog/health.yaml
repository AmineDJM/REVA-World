# Atlas catalog: health (agent A-HEALTHEDU). Provider-declared concepts, not human-reviewed.
# Series: who.gho.<GHO code>|<dimension>=<code>... (src/reva/adapters/connectors/atlas_who.py folds every
# GHO dimension into the indicator; SEX_BTSX = both sexes). Every WHO cell carries flags.estimate_class:
# who_comparable_estimate | country_reported | country_reported_with_who_estimates.
# wb.wdi_social.* fallbacks are World Bank redistributions of the SAME WHO/inter-agency series (same lineage,
# not independent evidence); they answer only where the WHO table has no cell for the country-year.
domain: health
labels: {fr: "Santé", en: "Health"}
maintainer: A-HEALTHEDU
concepts:
  - id: health.life_expectancy_birth
    labels: {fr: "Espérance de vie à la naissance", en: "Life expectancy at birth"}
    definition: "Average number of years a newborn would live if subject to the age-specific mortality rates of the year (WHO Global Health Estimates, both sexes)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000001|sex=SEX_BTSX"]
    provider_declared: true
    notes: "WHO GHE comparable estimates (2000-2023 in the 2026 vintage). Not the UN WPP series used by the World Bank (different model), hence no WDI fallback."
  - id: health.life_expectancy_birth.female
    labels: {fr: "Espérance de vie à la naissance (femmes)", en: "Life expectancy at birth (female)"}
    definition: "Life expectancy at birth, females (WHO Global Health Estimates)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000001|sex=SEX_FMLE"]
    provider_declared: true
  - id: health.life_expectancy_birth.male
    labels: {fr: "Espérance de vie à la naissance (hommes)", en: "Life expectancy at birth (male)"}
    definition: "Life expectancy at birth, males (WHO Global Health Estimates)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000001|sex=SEX_MLE"]
    provider_declared: true
  - id: health.life_expectancy_60
    labels: {fr: "Espérance de vie à 60 ans", en: "Life expectancy at age 60"}
    definition: "Average number of remaining years at age 60 (WHO Global Health Estimates, both sexes)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000015|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.healthy_life_expectancy_birth
    labels: {fr: "Espérance de vie en bonne santé à la naissance", en: "Healthy life expectancy (HALE) at birth"}
    definition: "Average number of years a newborn can expect to live in full health (WHO GHE, both sexes)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000002|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.healthy_life_expectancy_60
    labels: {fr: "Espérance de vie en bonne santé à 60 ans", en: "Healthy life expectancy (HALE) at age 60"}
    definition: "Average number of years a person aged 60 can expect to live in full health (WHO GHE, both sexes)."
    unit: years
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000007|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.adult_mortality_15_60
    labels: {fr: "Mortalité adulte (15-60 ans)", en: "Adult mortality rate (15-60)"}
    definition: "Probability of dying between ages 15 and 60 per 1000 population (WHO GHE, both sexes)."
    unit: "per 1000 population (probability of dying between 15 and 60)"
    domain: health
    subdomain: mortality
    source_order: ["who.gho.WHOSIS_000004|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.maternal_mortality_ratio
    labels: {fr: "Taux de mortalité maternelle", en: "Maternal mortality ratio"}
    definition: "Maternal deaths per 100 000 live births (UN MMEIG modelled estimates)."
    unit: per 100 000 live births
    domain: health
    subdomain: maternal_child
    source_order: ["who.gho.MDG_0000000026", "wb.wdi_social.SH.STA.MMRT"]
    provider_declared: true
    notes: "Comparable MMEIG estimates. WHO's separate country-reported series (MDG_0000000032, 1987-2009, text values) is the concept health.maternal_mortality_ratio.country_reported and is never mixed in."
  - id: health.maternal_mortality_ratio.country_reported
    labels: {fr: "Taux de mortalité maternelle (déclaré par les pays)", en: "Maternal mortality ratio (country-reported)"}
    definition: "Maternal mortality ratio as reported by countries to WHO (not adjusted for comparability)."
    unit: per 100 000 live births
    domain: health
    subdomain: maternal_child
    value_kind: text
    source_order: ["who.gho.MDG_0000000032"]
    provider_declared: true
    notes: "WHO serves these values as display text only (NumericValue null): kept as value_text, never parsed. Country-reported, not comparable across countries."
  - id: health.under5_mortality
    labels: {fr: "Mortalité des moins de 5 ans", en: "Under-five mortality rate"}
    definition: "Probability of dying by age 5 per 1000 live births (UN IGME, both sexes, all wealth quintiles)."
    unit: per 1000 live births
    domain: health
    subdomain: maternal_child
    source_order: ["who.gho.MDG_0000000007|sex=SEX_BTSX|agegroup=AGEGROUP_YEARSUNDER5|wealthquintile=WEALTHQUINTILE_TOTL", "wb.wdi_social.SH.DYN.MORT"]
    provider_declared: true
    notes: "UN IGME estimates are not the official statistics of some countries (WHO row comments say so, kept in flags.comments). Wealth-quintile rows (household surveys) are separate series."
  - id: health.infant_mortality
    labels: {fr: "Mortalité infantile", en: "Infant mortality rate"}
    definition: "Probability of dying between birth and age 1 per 1000 live births (UN IGME, both sexes)."
    unit: per 1000 live births
    domain: health
    subdomain: maternal_child
    source_order: ["who.gho.MDG_0000000001|sex=SEX_BTSX|agegroup=AGEGROUP_MONTHS0-11", "wb.wdi_social.SP.DYN.IMRT.IN"]
    provider_declared: true
  - id: health.neonatal_mortality
    labels: {fr: "Mortalité néonatale", en: "Neonatal mortality rate"}
    definition: "Deaths in the first 28 days per 1000 live births (UN IGME)."
    unit: per 1000 live births
    domain: health
    subdomain: maternal_child
    source_order: ["who.gho.WHOSIS_000003|sex=SEX_BTSX|agegroup=AGEGROUP_DAYS0-27", "wb.wdi_social.SH.DYN.NMRT"]
    provider_declared: true
  - id: health.ncd_mortality_30_70
    labels: {fr: "Probabilité de décès prématuré par MNT (30-70 ans)", en: "Probability of dying 30-70 from the four main NCDs"}
    definition: "Probability (%) of dying between exact ages 30 and 70 from cardiovascular disease, cancer, diabetes or chronic respiratory disease (WHO GHE, SDG 3.4.1, both sexes)."
    unit: "%"
    domain: health
    subdomain: causes_of_death
    source_order: ["who.gho.NCDMORT3070|sex=SEX_BTSX|agegroup=AGEGROUP_YEARS30-69"]
    provider_declared: true
    notes: "WHO flags 2020-2021 values as possibly underestimated where NCD deaths fell into 'other pandemic-related mortality' (kept in flags.comments)."
  - id: health.ncd_mortality_rate
    labels: {fr: "Mortalité par MNT standardisée", en: "Age-standardized NCD mortality rate"}
    definition: "Age-standardized death rate from noncommunicable diseases per 100 000 population (WHO GHE, both sexes)."
    unit: per 100 000 population (age-standardized)
    domain: health
    subdomain: causes_of_death
    source_order: ["who.gho.WHS2_131|sex=SEX_BTSX"]
    provider_declared: true
  - id: health.deaths_share.ncd
    labels: {fr: "Part des décès dus aux MNT", en: "Share of deaths due to noncommunicable diseases"}
    definition: "Percentage of all deaths due to noncommunicable diseases (WHO GHE, both sexes)."
    unit: "% of total deaths"
    domain: health
    subdomain: causes_of_death
    source_order: ["who.gho.NCDMORTPERCENT|sex=SEX_BTSX|ghecauses=GHECAUSES_GHE060"]
    provider_declared: true
  - id: health.deaths_share.communicable
    labels: {fr: "Part des décès dus aux maladies transmissibles, maternelles, périnatales et nutritionnelles", en: "Share of deaths due to communicable, maternal, perinatal and nutritional conditions"}
    definition: "Percentage of all deaths due to communicable, maternal, perinatal and nutritional conditions (WHO GHE, both sexes)."
