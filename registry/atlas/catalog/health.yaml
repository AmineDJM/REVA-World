    source_order: ["who.gho.SDGSUICIDE|sex=SEX_BTSX|agegroup=AGEGROUP_YEARSALL"]
    provider_declared: true
  - id: health.road_traffic_death_rate
    labels: {fr: "Taux de mortalité routière", en: "Road traffic death rate"}
    definition: "Estimated road traffic deaths per 100 000 population (WHO Global status report on road safety 2023; reference year 2021)."
    unit: per 100 000 population
    domain: health
    subdomain: injuries
    source_order: ["who.gho.RS_198"]
    provider_declared: true
    notes: "Single reference year (2021). Hong Kong and Macao: WHO serves display text '0.0' without a numeric value (kept as value_text)."
  - id: health.road_traffic_deaths
    labels: {fr: "Décès sur les routes (estimation)", en: "Estimated road traffic deaths"}
    definition: "Estimated number of road traffic deaths (WHO Global status report on road safety 2023; reference year 2021)."
    unit: deaths
    domain: health
    subdomain: injuries
    source_order: ["who.gho.RS_196"]
    provider_declared: true
  - id: health.air_pollution_death_rate
    labels: {fr: "Mortalité attribuable à la pollution de l'air (ambiante et domestique)", en: "Death rate attributable to household and ambient air pollution"}
