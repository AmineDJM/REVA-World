    definition: "Out-of-pocket expenditure as a percentage of current health expenditure (WHO GHED)."
    unit: "% of current health expenditure"
    domain: health
    subdomain: financing
    source_order: ["who.gho.GHED_OOPSCHE_SHA2011", "wb.wdi_social.SH.XPD.OOPC.CH.ZS"]
    provider_declared: true
