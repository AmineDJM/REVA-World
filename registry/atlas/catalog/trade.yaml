    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts.'
- id: trade.goods_balance.baci.section_xxi
  labels:
    fr: Solde commercial des biens — section SH XXI (Objets d'art, de collection ou d'antiquité) (BACI, dérivé)
    en: Goods trade balance — HS section XXI (Works of art, collectors' pieces and antiques) (BACI, derived)
  definition: Exports minus imports of goods, HS section XXI, chapters 97-97 (Works of art, collectors' pieces and antiques),
    both from the same CEPII BACI year file (FOB, thousand current US dollars). Positive = surplus (pays excédentaire), negative
    = deficit (pays déficitaire). Derived by REVA (flags.derived, both inputs cited).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
  source_order:
  - baci.hs92_country.BAL|section=XXI
  provider_declared: true
  notes: 'CEPII BACI HS92 V202601: reconciled estimates (CEPII harmonisation of exporter and importer declarations, CIF costs
    removed: FOB), exact sums of HS6 flows; 13 selected years (1995, 2000, 2005, 2010, 2015, 2017-2024). Codes follow UN Comtrade
    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts. Derived only when both exports and imports exist.'
  tags:
  - derived
