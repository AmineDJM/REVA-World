# Trade concepts of the atlas (agent A-TRADE). Provider-declared definitions, not human-reviewed.
# Tables: baci.* (src/reva/adapters/connectors/atlas_baci.py, CEPII BACI, Etalab 2.0), unctad.* (atlas_unctad.py,
# UNCTADstat, CC BY 3.0 IGO), oecd.batis_services (atlas_trade_batis.py, OECD-WTO BaTIS). Rules: reconciled (BACI),
# balanced (BaTIS) and reported (UNCTAD, IMF) statistics are separate concepts; *_balance concepts are REVA-derived
# (exports - imports of the same source, file and year; flags.derived cites both inputs). Bilateral series
# (partner in the indicator) are link-layer tables, not country concepts: see docs/dev/v3_a_trade.md.
# Every series string is checked against the fixture tables by tests/unit/test_atlas_trade.py.
domain: trade
labels:
  fr: Commerce international et investissement
  en: International trade and investment
maintainer: A-TRADE
concepts:
- id: trade.goods_exports.baci
  labels:
    fr: Exportations de biens (BACI, réconciliées)
    en: Goods exports (BACI, reconciled)
  definition: Value of goods exported by the country to all partners, all products, as reconciled by CEPII BACI (FOB, current
    US dollars, thousands).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
  source_order:
  - baci.hs92_country.X|section=TOTAL
  provider_declared: true
  notes: 'CEPII BACI HS92 V202601: reconciled estimates (CEPII harmonisation of exporter and importer declarations, CIF costs
    removed: FOB), exact sums of HS6 flows; 13 selected years (1995, 2000, 2005, 2010, 2015, 2017-2024). Codes follow UN Comtrade
    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts.'
  tags:
  - bilateral_detail:baci.hs92_pair_section
- id: trade.goods_imports.baci
  labels:
    fr: Importations de biens (BACI, réconciliées)
    en: Goods imports (BACI, reconciled)
  definition: Value of goods imported by the country from all partners, all products, as reconciled by CEPII BACI (FOB, current
    US dollars, thousands).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
  source_order:
  - baci.hs92_country.M|section=TOTAL
  provider_declared: true
  notes: 'CEPII BACI HS92 V202601: reconciled estimates (CEPII harmonisation of exporter and importer declarations, CIF costs
    removed: FOB), exact sums of HS6 flows; 13 selected years (1995, 2000, 2005, 2010, 2015, 2017-2024). Codes follow UN Comtrade
    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts.'
- id: trade.goods_balance.baci
  labels:
    fr: Solde commercial des biens (BACI, dérivé)
    en: Goods trade balance (BACI, derived)
  definition: Exports minus imports of goods, all products, both from the same CEPII BACI year file (FOB, thousand current
    US dollars). Positive = surplus (pays excédentaire), negative = deficit (pays déficitaire). Derived by REVA (flags.derived,
    both inputs cited).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
  source_order:
  - baci.hs92_country.BAL|section=TOTAL
  provider_declared: true
  notes: 'CEPII BACI HS92 V202601: reconciled estimates (CEPII harmonisation of exporter and importer declarations, CIF costs
    removed: FOB), exact sums of HS6 flows; 13 selected years (1995, 2000, 2005, 2010, 2015, 2017-2024). Codes follow UN Comtrade
    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts. Derived only when both exports and imports exist.'
  tags:
  - derived
