    fr: Exportations de biens — section SH XXI (Objets d'art, de collection ou d'antiquité) (BACI, réconciliées)
    en: Goods exports — HS section XXI (Works of art, collectors' pieces and antiques) (BACI, reconciled)
  definition: Value of goods exported by the country to all partners, HS section XXI, chapters 97-97 (Works of art, collectors'
    pieces and antiques), as reconciled by CEPII BACI (FOB, current US dollars, thousands).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
  source_order:
  - baci.hs92_country.X|section=XXI
  provider_declared: true
  notes: 'CEPII BACI HS92 V202601: reconciled estimates (CEPII harmonisation of exporter and importer declarations, CIF costs
    removed: FOB), exact sums of HS6 flows; 13 selected years (1995, 2000, 2005, 2010, 2015, 2017-2024). Codes follow UN Comtrade
    reporters: France includes Monaco, USA includes Puerto Rico and the US Virgin Islands, Switzerland includes Liechtenstein,
    Norway includes Svalbard and Jan Mayen. Not the same statistic as IMF IMTS (reported, CIF imports) or BOP goods (BPM6)
    -- separate concepts.'
  tags:
  - bilateral_detail:baci.hs92_pair_section
- id: trade.goods_imports.baci.section_xxi
  labels:
    fr: Importations de biens — section SH XXI (Objets d'art, de collection ou d'antiquité) (BACI, réconciliées)
    en: Goods imports — HS section XXI (Works of art, collectors' pieces and antiques) (BACI, reconciled)
  definition: Value of goods imported by the country from all partners, HS section XXI, chapters 97-97 (Works of art, collectors'
    pieces and antiques), as reconciled by CEPII BACI (FOB, current US dollars, thousands).
  unit: thousand US dollars (current)
  domain: trade
  subdomain: goods
