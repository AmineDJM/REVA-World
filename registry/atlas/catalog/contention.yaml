# Contention: protests, resistance campaigns, episodes of contention (agent A-CONTENTION). Provider-declared concepts
# (not human-reviewed). Atlas tables (all COMPUTED exact counts per country-year from expert-coded datasets, CC0):
# mmp.protests_cy (Mass Mobilization v5.1), navco.n13_cy (NAVCO 1.3), navco.n21_cy (NAVCO 2.1), mec.episodes_cy (MEC v3.0).
# Domain `contention` has no theme rule yet: every concept carries theme: politics. See docs/dev/v3_a_contention.md.
domain: contention
labels:
  fr: Contestation (manifestations, campagnes de résistance, répression)
  en: Contention (protests, resistance campaigns, repression)
maintainer: A-CONTENTION
concepts:
- id: contention.protests
  labels:
    fr: Manifestations contre le gouvernement (nombre, MMP)
    en: Protests against the government (MMP count)
  definition: 'Mass Mobilization Project v5.1 (Clark & Regan): protests are gatherings of 50 or more people making a demand
    of the government, coded from major newspapers; COMPUTED count per country-year (year = start year). Country-years MMP
    codes protest = 0 are provider-reported zeros; 1990-2020.'
  unit: count
  domain: contention
  subdomain: protest
  theme: politics
  value_kind: numeric
  source_order:
  - mmp.protests_cy.protests
  provider_declared: true
