    en: Maximalist resistance campaigns active (NAVCO 1.3 count)
  definition: 'NAVCO 1.3 (Chenoweth & Shay): consensus list of 622 maximalist resistance campaigns (regime change, anti-occupation,
    secession; >= 1,000 observed participants) 1900-2019; COMPUTED count per country-year; a campaign counts in every year
    from BYEAR to EYEAR (EYEAR = peak year, or end year when the peak is unknown). Only country-years with >= 1 campaign are
    listed; location = contemporary sovereign country named by the provider.'
  unit: count
  domain: contention
  subdomain: campaigns
  theme: politics
  value_kind: numeric
  source_order:
