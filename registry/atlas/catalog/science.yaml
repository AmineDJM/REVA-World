# Science & technology concepts of the atlas (agent A-SCI). Provider-declared, not human-reviewed.
# Generated (concept list) from the connectors' constants and the WIPO technology-field table; see
# docs/dev/v3_a_sci.md. Sources: OpenAlex (CC0), Nobel Prize Outreach API (CC0), WIPO IP Statistics bulk files and
# Global Innovation Index 2025 (CC BY 4.0, WIPO Open Access Policy). World Bank IP.JRN.ARTC.SC / TX.VAL.TECH.* and
# IP.PAT.* (WIPO via WDI) are catalogued by A-WB; UNESCO UIS R&D by A-HEALTHEDU.
domain: science
labels:
  fr: Science et technologie
  en: Science and technology
maintainer: A-SCI
concepts:
- id: sci.openalex.works
  labels:
    fr: Publications scientifiques (articles et revues, OpenAlex)
    en: Scholarly works (articles and reviews, OpenAlex)
  definition: 'Number of scholarly works of type article or review indexed by OpenAlex with publication year Y and at least
    one authorship affiliated to an institution in the country (OpenAlex authorships.countries; full counting: a work counts
    once for every country among its authors, so country counts do not sum to the world total).'
  unit: works
  domain: science
  subdomain: publications
  source_order:
  - openalex.works_country_year.works|type=article,review
  provider_declared: true
  notes: 'OpenAlex is a live index: counts are as indexed at retrieval (flags.retrieved_at) and drift as records are added,
    merged or re-attributed. Affiliation-country coverage is sparse before ~1990. Rows provider_geo ''_all_works'' (all matching
    works) and ''unknown'' (works without a country) are kept unmapped for shares and coverage. Not comparable with WDI IP.JRN.ARTC.SC
    (Scopus-based, fractional counting).'
  tags:
  - openalex
  - cc0
  - full_counting
