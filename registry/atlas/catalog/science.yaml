- id: sci.nobel.born.all
  labels:
    fr: Lauréats Nobel nés dans le pays — toutes catégories (par année)
    en: Nobel laureates born in the country — all categories (per award year)
  definition: 'Number of Nobel laureate-prize records (an individual laureate in one award year and category) whose birth
    place lies, in present-day borders, in the country (Nobel API birth.place.countryNow; e.g. born in Breslau, Germany, counts
    for Poland). Organisations have no birth place and are not counted. Period: the award year.'
  unit: laureate-prize records
  domain: science
  subdomain: nobel
  source_order:
  - nobel.laureates.born|category=all
  provider_declared: true
  notes: Counted by REVA from the complete Nobel Prize Outreach laureate list (api.nobelprize.org v2.1, CC0); flags.aggregation
    = count, computed_by = reva. A country without a row has no such laureate in the list (not a reported zero). Economic
    Sciences = Sveriges Riksbank Prize (from 1969). Prizes declined or restricted are counted and flagged (flags.includes_prize_status).
  tags:
  - nobel
  - cc0
  - count
- id: sci.nobel.born_total.all
  labels:
    fr: Lauréats Nobel nés dans le pays — toutes catégories (cumul depuis 1901)
    en: Nobel laureates born in the country — all categories (cumulative since 1901)
  definition: 'Number of Nobel laureate-prize records (an individual laureate in one award year and category) whose birth
    place lies, in present-day borders, in the country (Nobel API birth.place.countryNow; e.g. born in Breslau, Germany, counts
    for Poland). Organisations have no birth place and are not counted. Period: 1901 to the latest award year of the list
    (one cell).'
  unit: laureate-prize records
  domain: science
  subdomain: nobel
