    fr: Indice Planète vivante
  definition: The Living Planet Index (LPI) is a measure of the state of global biological diversity based on population trends
    of vertebrate species from around the world. The index value is measured relative to species' populations in 1970 (i.e.
    1970 = 1). (OWID / WWF & ZSL, quoted)
  unit: index (1970 = 1)
  domain: ecology
  subdomain: population_trends
  theme: ecology
  source_order:
