# Ecology and wildlife (agent V4ECO). Provider-declared concepts, not human-reviewed. Generated from the
# connectors' declared indicators (atlas_gbif_occ, atlas_fishstat) plus the V4ECO additions to atlas.un_sdg
# (Red List Index), atlas.owid (Living Planet Index) and atlas.fao (live-animal stocks). Sources and caveats:
# docs/dev/v4_v4eco.md. GBIF counts reflect sampling effort, never abundance.
domain: ecology
labels:
  fr: Écologie et faune
  en: Ecology and wildlife
maintainer: V4ECO
concepts:
- id: ecology.gbif.country_group.occurrences.all
  labels:
    en: 'GBIF occurrence records: all'
    fr: 'Observations enregistrées dans GBIF : tous les taxons'
  definition: Number of occurrence records in the GBIF index (all records) whose GBIF-interpreted countryCode is the country,
    at the snapshot date.
  unit: occurrence records
  domain: ecology
  subdomain: gbif_occurrences
  theme: ecology
  source_order:
  - gbif_occ.country_group.occurrences.all
  provider_declared: true
  notes: 'GBIF occurrence index, GraphQL countryCode facet (agent V4ECO, src/reva/adapters/connectors/atlas_gbif_occ.py).
    Filter: occurrenceStatus=PRESENT; basisOfRecord not in (FOSSIL_SPECIMEN, LIVING_SPECIMEN). occurrence records reflect
    sampling effort and data mobilisation, not abundance or population size.'
  tags:
  - gbif
  - biodiversity
  - snapshot
- id: ecology.gbif.country_group.distinct_species.all
  labels:
    en: 'Species with GBIF records: all'
    fr: 'Espèces avec observations GBIF : tous les taxons'
  definition: Number of distinct GBIF backbone species keys (speciesKey) among the occurrence records (all records) whose
    countryCode is the country; computed by GBIF's search engine with an approximate cardinality aggregation. Not a species
    checklist of the country.
  unit: species (distinct GBIF speciesKey)
  domain: ecology
  subdomain: gbif_species
  theme: ecology
  source_order:
  - gbif_occ.country_group.distinct_species.all
  provider_declared: true
  notes: 'GBIF occurrence index, GraphQL countryCode facet (agent V4ECO, src/reva/adapters/connectors/atlas_gbif_occ.py).
    Filter: occurrenceStatus=PRESENT; basisOfRecord not in (FOSSIL_SPECIMEN, LIVING_SPECIMEN). occurrence records reflect
    sampling effort and data mobilisation, not abundance or population size. Approximate (Elasticsearch HyperLogLog++).'
  tags:
  - gbif
  - biodiversity
