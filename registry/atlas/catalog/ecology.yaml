  provider_declared: true
  notes: 'Published LPI trends (WWF & ZSL, Living Planet Report 2026) for the world, IPBES regions and systems (freshwater,
    marine, terrestrial) via the OWID grapher chart ''global-living-planet-index''. Licence: CC BY 4.0 per OWID origin metadata;
    ZSL data-use policy: CC BY-SA 4.0 for published trends (stricter one applies). Regions/systems are LPI aggregates, not
    countries.'
