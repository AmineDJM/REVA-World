# Agent GAPHUNT: catalog of the gap-fill atlas sources (src/reva/adapters/connectors/atlas_gap_*.py).
# Each concept is one provider series, named per provider (never merged across providers here); cross-source
# equivalences are proposed to ATLASOPS in registry/atlas/source_order/_proposals_gaphunt.yaml. Generated, then reviewed.
domain: gapfill
labels:
  fr: Comblement de lacunes (instituts statistiques nationaux et régionaux)
  en: Gap fill (national and regional statistical offices)
maintainer: GAPHUNT
concepts:
- id: gapfill.spc.population_midyear
  labels:
    fr: Population estimée en milieu d'année (CPS)
    en: Mid-year population estimate (SPC)
  definition: SPC DF_POCKET 'Mid-year population estimate' (from SPC DF_POP_PROJ; census-based national estimates).
  unit: persons (SPC unit 'units')
  domain: gapfill
  subdomain: spc
  theme: population
  value_kind: numeric
  source_order:
  - spc.pocket.MIDYEARPOPEST
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.land_area
  labels:
    fr: Superficie terrestre (CPS)
    en: Land area (SPC)
  definition: SPC DF_POCKET 'Land area' (from DF_POP_DENSITY LANDAREA).
  unit: square kilometre
  domain: gapfill
  subdomain: spc
  theme: geography
  value_kind: numeric
  source_order:
  - spc.pocket.LAR
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.population_density
  labels:
    fr: Densité de population (CPS)
    en: Population density (SPC)
  definition: SPC DF_POCKET 'Population density' (mid-year population / land area, computed by SPC).
  unit: persons per square kilometre
  domain: gapfill
  subdomain: spc
  theme: population
  value_kind: numeric
  source_order:
  - spc.pocket.POPDENS
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.life_expectancy_male
  labels:
    fr: Espérance de vie à la naissance, hommes (CPS)
    en: Life expectancy at birth, male (SPC)
  definition: SPC DF_POCKET 'Life expectancy at birth - Male' (from DF_VITAL).
  unit: years
  domain: gapfill
  subdomain: spc
  theme: health
  value_kind: numeric
  source_order:
  - spc.pocket.LEBM
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted). No both-sexes value is published in the pocket summary.
- id: gapfill.spc.life_expectancy_female
  labels:
    fr: Espérance de vie à la naissance, femmes (CPS)
    en: Life expectancy at birth, female (SPC)
  definition: SPC DF_POCKET 'Life expectancy at birth - Female' (from DF_VITAL).
  unit: years
  domain: gapfill
  subdomain: spc
  theme: health
  value_kind: numeric
  source_order:
  - spc.pocket.LEBF
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.gdp_usd
  labels:
    fr: PIB à prix courants, USD (CPS)
    en: GDP, current prices, USD (SPC)
  definition: SPC DF_POCKET 'GDP, current price, in USD' (DF_NATIONAL_ACCOUNTS; national-currency GDP converted by SPC, conversion
    rate in flags.obs_comment).
  unit: thousand USD
  domain: gapfill
  subdomain: spc
  theme: economy
  value_kind: numeric
  source_order:
  - spc.pocket.GDPCUSD
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.gdp_lcu
