    fr: PIB à prix courants, monnaie nationale (CPS)
    en: GDP, current prices, national currency (SPC)
  definition: SPC DF_POCKET 'GDP, current prices, in local currency units'.
  unit: thousand units of national currency (named per cell)
  domain: gapfill
  subdomain: spc
  theme: economy
  value_kind: numeric
  source_order:
  - spc.pocket.GDPCDOM
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.gdp_per_capita_usd
  labels:
    fr: PIB par habitant, USD (CPS)
    en: GDP per capita, USD (SPC)
  definition: 'SPC DF_POCKET ''GDP, per capita, in USD'' (SPC: GDP in USD / mid-year population; formula in flags.obs_comment).'
  unit: USD per person
  domain: gapfill
  subdomain: spc
  theme: economy
  value_kind: numeric
  source_order:
  - spc.pocket.GDPCPCUSD
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.inflation
  labels:
    fr: Taux d'inflation (CPS)
    en: Inflation rate (SPC)
  definition: SPC DF_POCKET 'Inflation rate' (from SPC DF_CPI indicator INF, annual).
  unit: percent
  domain: gapfill
  subdomain: spc
  theme: economy
  value_kind: numeric
  source_order:
  - spc.pocket.INFRATE
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted). SPC does not state in the pocket summary whether this is the annual-average or the December-on-December
    change.
- id: gapfill.spc.merchandise_exports_usd
