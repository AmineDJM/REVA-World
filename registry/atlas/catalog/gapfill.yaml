  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.merchandise_trade_balance_usd
  labels:
    fr: Solde commercial des marchandises, USD (CPS)
