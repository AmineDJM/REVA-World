  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted). Not the balance-of-payments goods balance.
- id: gapfill.spc.government_revenue_gdp
  labels:
    fr: Recettes publiques, % du PIB (CPS)
    en: Government revenue, % of GDP (SPC)
  definition: SPC DF_POCKET 'Government revenue as percent of GDP (current prices)'; data source per cell (OECD Revenue Statistics,
