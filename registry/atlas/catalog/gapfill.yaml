    fr: Exportations de marchandises, USD (CPS)
    en: Merchandise exports, USD (SPC)
  definition: SPC DF_POCKET 'Exports' (International Merchandise Trade Statistics).
  unit: thousand USD
  domain: gapfill
  subdomain: spc
  theme: trade
  value_kind: numeric
  source_order:
  - spc.pocket.EXPUSD
  provider_declared: true
  notes: SPC PDH.Stat pocket summary (DF_POCKET); only cells whose DATA_YEAR is the cell year are kept (repeats of an older
    value are omitted).
- id: gapfill.spc.merchandise_imports_usd
