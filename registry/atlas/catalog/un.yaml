# UN atlas concepts (agent A-UN). Provider-declared, not human-reviewed: definitions are the
# providers' own (UN DESA Population Division WPP 2024 and International Migrant Stock 2024, UNSD SDG
# Global Database and Statistical Yearbook, UNHCR). Generated from the connector constants in
# src/reva/adapters/connectors/atlas_un.py (+ SDG headline indicators observed in the 2026-10-15 live run).
# Projections are separate concepts (suffix _proj_*) and separate series (indicator suffix |proj=medium or
# PopTotal|variant=<name>): a best-available lookup for an estimate never returns a projection.
# Only UN series are listed; equivalent World Bank series are named in notes (not independent lineages).
domain: un
labels:
  fr: Nations unies (population, migration, ODD, réfugiés, superficie)
  en: United Nations (population, migration, SDGs, refugees, area)
maintainer: agent A-UN (provider-declared, not human-reviewed)
concepts:
- id: un.wpp.population
  labels:
    fr: Population totale (1er juillet)
    en: Total population (1 July)
  definition: Total population, as of 1 July (UN World Population Prospects 2024 estimates, 1950-2023).
  unit: thousands
  domain: un
  subdomain: population
  source_order:
  - un_wpp.wpp2024_demo.TPopulation1July
  provider_declared: true
  notes: 'UN WPP 2024 estimate (model-based reconstruction from censuses, surveys and registers). Time reference: as of 1
    July. World Bank WDI SP.POP.TOTL reports the same quantity (largely from WPP: not independent); it is not merged here
    because WDI units/rounding differ (WDI persons vs WPP thousands).'
  tags:
  - wpp2024
  - estimate
- id: un.wpp.population_proj_medium
  labels:
    fr: Population totale (1er juillet) — projection (variante moyenne)
    en: Total population (1 July) — projection (medium variant)
  definition: 'Total population, as of 1 July: UN World Population Prospects 2024 medium-variant projection, 2024-2100. A
    projection, not an observation.'
  unit: thousands
  domain: un
  subdomain: population
  source_order:
  - un_wpp.wpp2024_demo.TPopulation1July|proj=medium
  provider_declared: true
  notes: 'Projection (flags.projection = true). Never mixed with estimates: separate concept and series.'
