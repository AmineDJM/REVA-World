- id: quality_of_life.whr_life_evaluation
  labels:
    fr: Évaluation de la vie (échelle de Cantril, moyenne 3 ans)
    en: Life evaluation (Cantril ladder, 3-year average)
  definition: 'Life evaluation (3-year average): national average answer to the Cantril ladder question (0 = worst possible
    life, 10 = best possible life), Gallup World Poll, averaged over three survey years.'
  unit: Cantril ladder score (0-10)
  domain: quality_of_life
  subdomain: wellbeing
  source_order:
  - whr.whr26_fig21.life_evaluation
  provider_declared: true
  notes: World Happiness Report 2026, Figure 2.1 data (free download; no explicit open licence). Period = the three-year Gallup
    World Poll window ending in the published Year. Gallup microdata not ingested.
