    fr: Indice de développement humain (IDH)
    en: Human Development Index (HDI)
  definition: Human Development Index (value) (UNDP HDR25 codebook short name 'hdi').
  unit: index (0-1)
  domain: quality_of_life
  subdomain: human_development
  source_order:
  - undp.hdr25.hdi
  provider_declared: true
  notes: UNDP Human Development Report 2025 complete time series (1990-2023); values as published in the 2025 edition (each
    edition revises the whole series).
