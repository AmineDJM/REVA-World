# Quality of life (agent A-QOL). Provider-declared concepts, not human-reviewed.
# Sources: UNDP HDR 2025 composite indices (CC BY 3.0 IGO; atlas table undp.hdr25) and Global MPI 2026
# (undp.gmpi2026); World Happiness Report 2026 Figure 2.1 (whr.whr26_fig21; free download, NO explicit open
# licence: rights.licence_status says so); World Inequality Database (wid.wid_key; CC BY 4.0 per OWID origin
# metadata, not stated by WID itself). Connectors: src/reva/adapters/connectors/atlas_{undp,whr,wid}.py.
# Not catalogued (see docs/dev/v3_a_qol.md): Global Peace Index (IEP: non-commercial licence behind a request
# form), Social Progress Index (no open licence found), cost of living (Numbeo/Expatistan proprietary; open
# price-level data = World Bank ICP, A-WB), World Bank PIP Gini (A-WB).
domain: quality_of_life
labels:
  fr: Qualité de vie
  en: Quality of life
maintainer: A-QOL
concepts:
- id: quality_of_life.hdi
