- id: labour.labour_income_share.ilo_modelled
  labels:
    fr: Part du revenu du travail dans le PIB — estimations modélisées OIT
    en: Labour income share of GDP — ILO modelled estimates
  definition: Labour income (employees' compensation plus imputed labour income of the self-employed) as a percentage of GDP
    (SDG 10.4.1), ILO modelled estimates.
  unit: '% of GDP'
  domain: labour
  subdomain: income
  source_order:
  - ilostat.lap_2gdp_noc_rt_a.LAP_2GDP_NOC_RT
  provider_declared: true
  notes: 'ILO modelled estimates (ILOSTAT ''ILO modelled estimates, Nov. 2025'' vintage): harmonised series covering every
    country, including imputed values where no national data exist (obs_status ''R'' marks real/observed national inputs per
    ILOSTAT); years after the vintage are ILO projections (flags.projection). Not the same concept as the national-estimate
    series; never mixed with it. obs_status ''I'' = imputation, ''M'' = model-based extrapolation (labels in flags).'
