# Labour concepts of the atlas (agent A-ILO). Provider-declared definitions, not human-reviewed.
# Tables: ilostat.<indicator id> (src/reva/adapters/connectors/atlas_ilo.py, ILOSTAT, CC BY 4.0),
# eurostat.earn_mw_cur and oecd.earnings_* (src/reva/adapters/connectors/atlas_wages_gapfill.py).
# Rules: ILO modelled estimates and national estimates are separate concepts (never in one source_order);
# a source_order only lists series of the same statistic and unit basis; currencies are never converted by
# REVA (USD / PPP cells are the provider's own conversions, named in each cell's unit).
# Not catalogued (not available as an open per-country series, see docs/dev/v3_a_ilo.md): real wage growth
# (ILO Global Wage Report series are not an ILOSTAT indicator).
# Edit with care: every series string must
# exist in its atlas table (tests/unit/test_atlas_ilo.py checks against the recorded fixtures).
domain: labour
labels:
  fr: Travail et salaires
  en: Labour and wages
maintainer: A-ILO
