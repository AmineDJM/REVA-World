  labels:
    fr: 'Changements territoriaux gagnés : secession (COW TC, nombre)'
    en: Territorial changes gained by secession (COW TC, count)
  definition: 'COMPUTED from COW Territorial Change v6, procedure ''Secession'': Secession refers to the dissolution of an
    existing end as a result of one or more parts of the entity leaving it in order to establish themselves as new independent
    entities.'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|procedure=secession
  provider_declared: true
