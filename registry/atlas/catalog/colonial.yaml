  definition: 'COMPUTED from COW Territorial Change v6, cases coded indep = 1: Independence refers to the termination of colonial
    rule over a dependency. This termination must involve the former dependency''s attaining effective control over its own
    foreign affairs and armed forces as wed as achieving some measure of diplomatic recognition.'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|independence=1
  provider_declared: true
- id: colonial.tc.gained.military_conflict
  labels:
    fr: Changements territoriaux gagnés avec conflit militaire (COW TC, nombre)
    en: Territorial changes gained with military conflict (COW TC, count)
  definition: 'COMPUTED from COW Territorial Change v6, cases coded conflict = 1: This is coded if there was military conflict
    between organized forces of both sides. Unorganized violence, such as riots, is not so classified. This variable is coded
    "1" for military conflict and "0" for no military conflict.'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|military_conflict=1
  provider_declared: true
