    fr: 'Changements territoriaux gagnés : conquest (COW TC, nombre)'
    en: Territorial changes gained by conquest (COW TC, count)
  definition: 'COMPUTED from COW Territorial Change v6, procedure ''Conquest'': Conquest occurs when armed force is the primary
    agent of the territorial change.'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|procedure=conquest
  provider_declared: true
- id: colonial.tc.gained.annexation
  labels:
    fr: 'Changements territoriaux gagnés : annexation (COW TC, nombre)'
    en: Territorial changes gained by annexation (COW TC, count)
  definition: 'COMPUTED from COW Territorial Change v6, procedure ''Annexation'': Annexation occurs when one political entity
    unilaterally extends its sovereignty over another political entity when the primary agent of change is diplomacy, although
    the implied threat of force may be involved.'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|procedure=annexation
  provider_declared: true
- id: colonial.tc.gained.cession
  labels:
    fr: 'Changements territoriaux gagnés : cession (COW TC, nombre)'
    en: Territorial changes gained by cession (COW TC, count)
  definition: 'COMPUTED from COW Territorial Change v6, procedure ''Cession'': Cession occurs when part of a political entity
    is yielded to another entity through plebiscite, purchase, compensating agreement, or as a consequence of hostilities.
    If the cession was total, then the change is coded as a "conquest."'
  unit: count
  domain: colonial
  subdomain: territorial_change
  theme: history
  value_kind: numeric
  source_order:
  - cowtc.changes_cy.gained|procedure=cession
  provider_declared: true
