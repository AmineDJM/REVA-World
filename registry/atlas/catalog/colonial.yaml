# Colonial history and decolonisation (agent A-COLONIAL). Provider-declared concepts (not human-reviewed), generated
# from the connectors' definitions. Atlas tables: coldat.dyads_v3 (COLDAT v3.0, CC0), icow.colhist_v11 (ICOW Colonial
# History 1.1), cowtc.changes_cy (COMPUTED counts, COW Territorial Change v6), cowtc.entity_status (COW entities list).
# icow.claims_prov101 (one indicator per dyadic claim) has no catalog concept. See docs/dev/v3_a_colonial.md.
domain: colonial
labels:
  fr: Histoire coloniale et décolonisation
  en: Colonial history and decolonisation
maintainer: A-COLONIAL
concepts:
- id: colonial.colonized_by.belgium
  labels:
    fr: 'Colonisé un jour par : Belgique (indicatrice COLDAT)'
    en: Ever colonized by Belgium (COLDAT dummy)
  definition: 'COLDAT v3.0 (Becker 2019): ''Dummy indicating whether country was ever colonized by colonizer.'' Colony: ''A
    colony is a territory whose domestic and/or foreign affairs are dominated by a European nation state, and whose population
    is constructed as inferior to the colonizer.'' Period = dataset coverage (1462 .. 2016-12-31).'
  unit: '1'
  domain: colonial
  subdomain: coldat
  theme: history
  value_kind: numeric
  source_order:
  - coldat.dyads_v3.colonized|colonizer=belgium
  provider_declared: true
- id: colonial.rule.belgium.max
  labels:
    fr: 'Domination coloniale : Belgique, période (agrégation par la dernière date, COLDAT)'
    en: Colonial rule by Belgium, spell (last date aggregation, COLDAT)
  definition: 'COLDAT v3.0: the colonial spell first year .. last year (period = [first year, last year + 1)). ''First year
    during which country was colonized by colonizer. Based on last date aggregation.'' / ''Last year during which country
    was colonized by colonizer. Based on last date aggregation.'' Instead of imposing a choice on researchers, I include mean
    aggregates, which aim at measurement accuracy, as well as last date aggregates, which aim at event consensuality, in COLDAT.'
  unit: category
  domain: colonial
  subdomain: coldat
  theme: history
  value_kind: text
  source_order:
  - coldat.dyads_v3.colonial_rule|colonizer=belgium|agg=max
