- id: colonial.icow.independence_year
  labels:
    fr: Année de l'indépendance (ICOW)
    en: Year of independence (ICOW)
  definition: 'ICOW Colonial History 1.1 (Hensel 2018): The date on which this state became independent -- i.e., acquired
    control of its own foreign policy, without being ruled by a foreign power. This takes the form YYYYMM, where the month
    is coded as 00 if ICOW does not currently have an estimated month when the state took its current form.'
  unit: year
  domain: colonial
  subdomain: icow_colonial_history
  theme: history
  value_kind: numeric
  source_order:
  - icow.colhist_v11.independence_year
  provider_declared: true
  notes: Cells are provider-coded per COW state (provider_geo cow:<code>); historical states keep iso3 null with their QID.
- id: colonial.icow.independence_from
  labels:
    fr: Indépendance obtenue de (ICOW)
    en: Independence gained from (ICOW)
  definition: 'ICOW Colonial History 1.1 (Hensel 2018): The COW country code for the state, empire, or other entity from which
    this state gained independence. This variable is coded as missing where the state did not gain independence from a COW
    system member (e.g., by unifying local units into a new state).'
  unit: category
  domain: colonial
  subdomain: icow_colonial_history
  theme: history
  value_kind: text
  source_order:
  - icow.colhist_v11.independence_from
  provider_declared: true
  notes: Cells are provider-coded per COW state (provider_geo cow:<code>); historical states keep iso3 null with their QID.
- id: colonial.icow.independence_violent
  labels:
    fr: Indépendance violente (ICOW, 0/1)
    en: Violent independence (ICOW, 0/1)
  definition: 'ICOW Colonial History 1.1 (Hensel 2018): An independence process is considered violent if it occurred through
    armed revolt by the entity, or if it occurred through armed conflict between the former ruler and another state (as when
    the entity in question is conquered or freed by a foreign power, or when it changed hands as part of a treaty ending a
    war). Coded attribute, not a causal claim: the violent episode is not identified.'
  unit: '1'
  domain: colonial
  subdomain: icow_colonial_history
  theme: history
  value_kind: numeric
  source_order:
  - icow.colhist_v11.independence_violent
  provider_declared: true
  notes: Cells are provider-coded per COW state (provider_geo cow:<code>); historical states keep iso3 null with their QID.
