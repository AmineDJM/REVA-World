# Food and agriculture (agent A-FAO). Provider-declared concepts, not human-reviewed.
# Source: FAOSTAT bulk downloads (FAO, CC BY 4.0), atlas tables fao.<domain> registered by
# src/reva/adapters/connectors/atlas_fao.py. Indicators are '<FAOSTAT item code>|<element code>' (plus
# '|sex=<code>|src=<code>' where FAOSTAT has those dimensions). wb.wdi_social.* fallbacks name World Bank WDI
# series that cite FAO as their source (A-WB tables). Multi-year (3-year average) and monthly FAOSTAT cells
# stay in the per-source tables only (the best-available view uses calendar-year cells).
domain: food_agriculture
labels:
  fr: Alimentation et agriculture
  en: Food and agriculture
maintainer: A-FAO
concepts:
- id: food_agriculture.food_supply_kcal
  labels:
    fr: Disponibilité alimentaire (kcal/personne/jour)
    en: Food supply (kcal/capita/day)
  definition: 'FAOSTAT Food Balances, Grand Total (2901), element Food supply (kcal/capita/day) (664): dietary energy available
    for human consumption per person per day.'
  unit: kcal per capita per day
  domain: food_agriculture
  subdomain: diet
  source_order:
  - fao.fbs.2901|664
  - fao.fbsh.2901|664
  provider_declared: true
  notes: 'FAOSTAT Food Balances: FBS (2010-, new methodology) first, then FBSH (1961-2013, old methodology); FBS wins the
    overlapping years 2010-2013. FAO warns that the two series are not strictly comparable (methodology break around 2010):
    read long series with that break in mind. FBS rows are estimated (E) or imputed (I) by FAO: flags.estimate_kind on every
    cell.'
