    fr: Valeur ajoutée agricole, forestière et halieutique (US$ courants)
    en: Agriculture, forestry and fishing value added (current US$)
  definition: FAOSTAT MK, Value Added (Agriculture, Forestry and Fishing) (22016), Value US$ (6110).
  unit: million US dollars
  domain: food_agriculture
  subdomain: economy
  source_order:
  - fao.mk.22016|6110
  provider_declared: true
- id: food_agriculture.agri_value_added_per_worker
  labels:
    fr: Valeur ajoutée agricole par travailleur
    en: Agriculture value added per worker
  definition: FAOSTAT Employment Indicators (OEA), indicator 21085, constant 2015 US$ (ILO modelled employment; FAOSTAT value
    added).
  unit: US dollars (constant 2015) per worker
  domain: food_agriculture
  subdomain: employment
  source_order:
  - fao.oea.21085|6228|sex=1|src=3047
  provider_declared: true
- id: food_agriculture.employment_agriculture_share
  labels:
    fr: Emploi dans l'agriculture (% de l'emploi total), estimations modélisées OIT (via FAO)
    en: Employment in agriculture (% of total employment), ILO modelled estimates (via FAO)
  definition: 'FAOSTAT Employment Indicators (OEA), indicator 21156, both sexes, source ILO modelled estimates (3043): ILO
    data redistributed by FAO.'
  unit: '%'
  domain: food_agriculture
  subdomain: employment
  source_order:
  - fao.oea.21156|6121|sex=1|src=3043
  - wb.wdi_social.SL.AGR.EMPL.ZS
  provider_declared: true
  notes: ILO modelled estimates as distributed by FAO (vintage of FAOSTAT's June 2026 update); A-ILO ingests ILOSTAT directly
    (labour.employment.agriculture.ilo_modelled, thousands). The World Bank series is the same ILO model (possibly another
    vintage).
- id: food_agriculture.employment_agrifood_systems
  labels:
    fr: Emploi dans les systèmes agroalimentaires (milliers)
    en: Employment in agrifood systems (thousands)
  definition: FAOSTAT OEA, Total employment in agrifood systems (21160), both sexes, FAO Model (3044).
  unit: thousand persons
  domain: food_agriculture
  subdomain: employment
  source_order:
  - fao.oea.21160|6199|sex=1|src=3044
  provider_declared: true
  notes: FAO model estimates (flag E).
- id: food_agriculture.rural_population_fao
  labels:
    fr: Population rurale (FAOSTAT, d'après ONU WPP/WUP)
    en: Rural population (FAOSTAT, from UN population estimates)
  definition: 'FAOSTAT Annual population (OA), Population - Est. & Proj. (3010), Rural population (551): UN DESA estimates
    redistributed by FAO (flag X).'
  unit: thousand persons
  domain: food_agriculture
  subdomain: rural
  source_order:
  - fao.oa.3010|551
  provider_declared: true
  notes: FAO-labelled copy of UN DESA figures; A-UN ingests UN population data at the source. Years after the UN estimates
    are projections.
