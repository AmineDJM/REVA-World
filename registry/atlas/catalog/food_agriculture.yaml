- id: food_agriculture.undernourishment_prevalence
  labels:
    fr: Prévalence de la sous-alimentation (ODD 2.1.1)
    en: Prevalence of undernourishment (SDG 2.1.1)
  definition: 'FAO SDG indicator 2.1.1 (SN_ITK_DEFC): percentage of the population whose habitual food consumption is insufficient
    to provide the dietary energy levels required to maintain a normal active and healthy life.'
  unit: '%'
  domain: food_agriculture
  subdomain: food_security
  source_order:
  - fao.sdgb.24000|6121
  - wb.wdi_social.SN.ITK.DEFC.ZS
  provider_declared: true
  notes: FAO estimates (flag E); each value is a 3-year average reported for its central year (FAO note per cell). Values
    below the reporting threshold are text ('<2.5') in value_text, never a number. World Bank WDI fallback (series sourced
    from FAO) when A-WB's table is present.
