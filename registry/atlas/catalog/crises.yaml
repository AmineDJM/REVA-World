- id: crises.ucdp_peace_agreements_signed
  labels:
    fr: Accords de paix signés (UCDP, calculé)
    en: Peace agreements signed (UCDP, computed)
  definition: 'COMPUTED by REVA from the UCDP Peace Agreement Dataset 22.2 (1975-2021): number of distinct peace agreements
    (''a formal agreement between at least two opposing primary warring parties, which addresses the disputed incompatibility'')
    whose incompatibility is located in the country (gwno), by year of signature. Only country-years with at least one agreement
    are listed.'
  unit: count
  domain: crises
  subdomain: peace_agreements
  theme: politics
  value_kind: numeric
  source_order:
  - ucdp.pa_cy.pa_signed
  provider_declared: true
