- id: media.daily.gdelt_goldstein_mean
  labels:
    en: GDELT mean Goldstein score of the country's event records (daily sample, media-coverage signal)
    fr: Score Goldstein moyen des enregistrements GDELT du pays (échantillon quotidien, signal de couverture médiatique)
  definition: 'MEDIA-COVERAGE SIGNAL, NOT EVENT COUNTS: arithmetic mean of GoldsteinScale over the records (flags.n), 4 decimals.
    Codebook: "Each CAMEO event code is assigned a numeric score from -10 to +10, capturing the theoretical potential impact
    that type of event will have on the stability of a country. [...] NOTE: this score is based on the type of event, not
    the specifics of the actual event record being recorded"'
  unit: Goldstein scale points (-10..+10)
  domain: media_signals
  subdomain: gdelt_events
  theme: politics
  source_order:
  - gdelt.events_cd.goldstein_mean
  provider_declared: true
  notes: GDELT 2.0, one 15-minute update per UTC day (slot 12:00 UTC; 1/96 sample of the records added that day), aggregated
    by ActionGeo_CountryCode (FIPS 10-4) and update day. Zero counts are no row; the day's _ALL row proves the file was read.
    Predictor only. Cite The GDELT Project (https://www.gdeltproject.org/).
  tags:
  - daily
  - media_signal
  - gdelt
  - conflict
- id: media.daily.gdelt_avgtone_mean
  labels:
    en: GDELT mean article tone of the country's event records (daily sample, media-coverage signal)
    fr: Tonalité moyenne des articles des enregistrements GDELT du pays (échantillon quotidien, signal de couverture médiatique)
  definition: 'MEDIA-COVERAGE SIGNAL, NOT EVENT COUNTS: arithmetic mean of AvgTone over the records (flags.n), 4 decimals.
    Codebook: "This is the average “tone” of all documents containing one or more mentions of this event during the 15 minute
    update in which it was first seen. The score ranges from -100 (extremely negative) to +100 (extremely positive)."'
  unit: tone score (-100..+100)
  domain: media_signals
  subdomain: gdelt_events
  theme: politics
  source_order:
  - gdelt.events_cd.avgtone_mean
  provider_declared: true
  notes: GDELT 2.0, one 15-minute update per UTC day (slot 12:00 UTC; 1/96 sample of the records added that day), aggregated
    by ActionGeo_CountryCode (FIPS 10-4) and update day. Zero counts are no row; the day's _ALL row proves the file was read.
    Predictor only. Cite The GDELT Project (https://www.gdeltproject.org/).
  tags:
  - daily
  - media_signal
  - gdelt
