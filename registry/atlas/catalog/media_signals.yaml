# Atlas catalog 'media_signals' (agent V6SIGNALS, V6, 2026-10-17). Provider-declared concepts (not human-reviewed)
# for atlas_gdelt.py: GDELT 2.0 event-record aggregates (gdelt.events_cd) and DOC 2.0 theme timelines
# (gdelt.doc_theme_d). MEDIA-COVERAGE SIGNALS, NOT EVENT COUNTS: predictors only. Generated from the connector
# constants (codebook definitions verbatim). See docs/dev/v6_signals.md.
domain: media_signals
labels:
  en: Media-coverage signals (GDELT)
  fr: Signaux de couverture médiatique (GDELT)
maintainer: V6SIGNALS
concepts:
- id: media.daily.gdelt_event_records
  labels:
    en: GDELT coded event records located in the country (daily sample, media-coverage signal)
    fr: Enregistrements d'événements codés par GDELT localisés dans le pays (échantillon quotidien, signal de couverture médiatique)
  definition: 'MEDIA-COVERAGE SIGNAL, NOT EVENT COUNTS: number of GDELT 2.0 event records whose ActionGeo_CountryCode is the
    country (codebook: "This is the 2-character FIPS10-4 country code for the location.") in the sampled 15-minute update
    of the day.'
  unit: event records
  domain: media_signals
  subdomain: gdelt_events
  theme: politics
  source_order:
  - gdelt.events_cd.records_all
  provider_declared: true
  notes: GDELT 2.0, one 15-minute update per UTC day (slot 12:00 UTC; 1/96 sample of the records added that day), aggregated
    by ActionGeo_CountryCode (FIPS 10-4) and update day. Zero counts are no row; the day's _ALL row proves the file was read.
    Predictor only. Cite The GDELT Project (https://www.gdeltproject.org/).
  tags:
  - daily
  - media_signal
  - gdelt
