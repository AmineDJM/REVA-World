# Atlas catalog of agent A-TREATIES: treaty participation per State (UNTC status pages, OHCHR dashboard).
# Generated from the connector treaty list (atlas_treaties.TREATIES / atlas_ohchr.ACRONYM_MTDSG). Not an open licence.
domain: treaties
labels:
  en: International treaty participation
  fr: Participation aux traités internationaux
maintainer: A-TREATIES
concepts:
- id: treaties.genocide.status
  labels:
    en: 'Genocide Convention (1948): participation status (UNTC)'
    fr: 'Convention pour la prévention et la répression du crime de génocide (1948) : statut de participation (UNTC)'
  definition: 'Status of the State in the UN Treaty Collection list for MTDSG IV-1 on the retrieval day, as the depositary
    lists it: party (an instrument of ratification/accession/succession/acceptance/approval is listed; entry into force for
    the State may be later), signatory (signature only), withdrawn (UNTC brackets the dates after a withdrawal/denunciation),
    signature_bracketed, listed_without_dates. Flags carry footnote numbers, a scheduled withdrawal date and whether declarations/reservations
    exist. States absent from the list have taken no action recorded by UNTC (no row is stored for them).'
  unit: status
  value_kind: text
  source_order:
  - untc.treaty_status.IV-1|status
  domain: treaties
  subdomain: human_rights
  theme: law
  provider_declared: true
  tags: &id001
  - treaty
  - IV-1
- id: treaties.genocide.consent
  labels:
    en: 'Genocide Convention (1948): consent to be bound (date and instrument, UNTC)'
    fr: 'Convention pour la prévention et la répression du crime de génocide (1948) : consentement à être lié (date et instrument,
      UNTC)'
  definition: Date (row period, one day) of the State's instrument expressing consent to be bound by MTDSG IV-1 as listed
    by UNTC; value_text = the instrument type from the table legend (ratification, accession, succession, acceptance, approval,
    formal_confirmation...). Bracketed (withdrawn) entries are kept and flagged. Withdrawal notification/effect dates are
    separate indicators (|action=withdrawal_notification, |action=withdrawal_effect).
  unit: status
  value_kind: text
  source_order:
  - untc.treaty_status.IV-1|action=consent
  domain: treaties
  subdomain: human_rights
  theme: law
  provider_declared: true
  tags: *id001
