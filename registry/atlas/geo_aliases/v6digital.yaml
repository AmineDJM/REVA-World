# Provider geography schemes of the V6DIGITAL atlas tables (agent V6DIGITAL, docs/dev/v6_digital.md).
# Both providers publish country NAMES only (no code). An alias is either an exact, verbatim match of the provider
# name to one crosswalk name field (label / iso_name / un_name / worldbank_name; generated, field named in `source`)
# or one of the few listed conventional names with its evidence. Never fuzzy. Names that are not crosswalk entities
# (Somaliland) stay unmapped (iso3 null, provider_geo kept).
schemes:
  # Access Now #KeepItOn STOP column `country` (a cell naming several countries separated by ";" is split by the connector).
