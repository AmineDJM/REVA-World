# Geography aliases of agent A-CULTURE: IOC National Olympic Committee codes -> crosswalk entities.
# Used by src/reva/adapters/connectors/atlas_olympics.py (provider_geo = the NOC code of the Wikipedia
# {{Medals table}} template, i.e. the IOC country code). No `base`: IOC codes are NOT ISO alpha-3 codes and
# several collide with other ISO/crosswalk keys (IOC CHI = Chile, crosswalk CHI = Channel Islands; IOC ANT =
# Antigua and Barbuda, ISO ANT = former Netherlands Antilles), so every code is listed explicitly.
#
# A code maps to the present-day country whose NOC uses it (IOC continuity): the territory represented may
# differ from today's (e.g. GER 1896-1936, AUT and HUN before 1918) -- rows carry that note in their flags.
# NOT mapped, kept as provider geographies (never assigned to a successor): URS, EUN, GDR, FRG, EUA, TCH,
# YUG, SCG, BOH, ANZ, RU1, ZZX, IOP, IOA, ROC (Republic of China 1956-1976 AND Russian Olympic Committee
# 2020-2022: ambiguous), OAR, AIN, EOR/ROT, BWI, RAU, AHO, SAA, MAL, NBO, RHO, NRH, VNM (South Vietnam).
scheme: ioc_noc
aliases:
  - {code: AFG, iso3: AFG, source: "IOC National Olympic Committee country code (olympics.com NOC list; Wikipedia 'List of IOC country codes', current NOCs table)"}
