# Agent A-LAW: provider geography schemes for WBL (KSV), SSPTW (page slug), Constitute (country_id) and CCP (COW code|name).
# Built by scratch script from the archived provider lists; reviewed entry by entry by the agent.
note: Agent A-LAW provider geography schemes. Every alias names its evidence; manual entries are agent decisions pending maintainer review. Unmapped provider geographies (historical states, Taiwan) are
  deliberately absent and stay unmapped (kept, listed) in the atlas tables.
schemes:
  wbl:
    base: iso3
    aliases:
    - code: KSV
      iso3: XKX
      source: 'WBL panel/2026 files: economy "Kosovo" carries "ISO Code" KSV (non-ISO); crosswalk Kosovo key XKX'
