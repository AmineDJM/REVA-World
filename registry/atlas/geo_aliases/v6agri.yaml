# Agent V6AGRI: geography scheme `usda_psd` = the `Country_Code` column of the USDA FAS PSD Online bulk files
# (psd_grains_pulses_csv.zip, psd_oilseeds_csv.zip). PSD codes are USDA's own 2-letter codes; most coincide with
# FIPS 10-4, some are older USDA codes (DM Benin, GU Guinea, PN Panama, RH Zimbabwe, TC United Arab Emirates ...).
# PSD publishes no crosswalk in the bulk files (the PSD API, which returns GENC codes, needs an api.data.gov key).
# Rule: an alias is kept only when TWO published facts agree: the PSD code equals the FIPS 10-4 code of a
# GeoNames countryInfo row (registry/atlas/reference/geonames_countryInfo.txt, sha256 c55f638cfaaf…) AND the PSD
# Country_Name equals that row's name exactly. Everything else stays unmapped (iso3 = null, provider_geo kept)
# and is listed below; no alias is made from a name alone.
# Unmapped (code: PSD name -- reason):
#   BE: Belgium-Luxembourg -- GeoNames FIPS BE = BEL 'Belgium' but PSD names 'Belgium-Luxembourg'
#   BM: Burma -- GeoNames FIPS BM = MMR 'Myanmar' but PSD names 'Burma'
#   CF: Congo (Brazzaville) -- GeoNames FIPS CF = COG 'Republic of the Congo' but PSD names 'Congo (Brazzaville)'
#   CG: Congo (Kinshasa) -- GeoNames FIPS CG = COD 'Democratic Republic of the Congo' but PSD names 'Congo (Kinshasa)'
#   CZ: Former Czechoslovakia -- not the FIPS 10-4 code of any GeoNames row
#   DM: Benin -- not the FIPS 10-4 code of any GeoNames row
#   E2: EU-15 -- not the FIPS 10-4 code of any GeoNames row
#   E4: European Union -- not the FIPS 10-4 code of any GeoNames row
#   EZ: Czech Republic -- GeoNames FIPS EZ = CZE 'Czechia' but PSD names 'Czech Republic'
#   GA: Gambia, The -- GeoNames FIPS GA = GMB 'Gambia' but PSD names 'Gambia, The'
#   GC: German Democratic Republic -- not the FIPS 10-4 code of any GeoNames row
#   GE: Germany, Federal Republic of -- not the FIPS 10-4 code of any GeoNames row
#   GU: Guinea -- not the FIPS 10-4 code of any GeoNames row
#   IV: Cote d'Ivoire -- GeoNames FIPS IV = CIV 'Ivory Coast' but PSD names 'Cote d'Ivoire'
#   KN: Korea, North -- GeoNames FIPS KN = PRK 'North Korea' but PSD names 'Korea, North'
#   KS: Korea, South -- GeoNames FIPS KS = KOR 'South Korea' but PSD names 'Korea, South'
#   MC: Macau -- GeoNames FIPS MC = MAC 'Macao' but PSD names 'Macau'
#   NA: Netherlands Antilles -- not the FIPS 10-4 code of any GeoNames row
#   NH: Vanuatu/New Hebrides -- GeoNames FIPS NH = VUT 'Vanuatu' but PSD names 'Vanuatu/New Hebrides'
#   NL: Netherlands -- GeoNames FIPS NL = NLD 'The Netherlands' but PSD names 'Netherlands'
#   PN: Panama -- not the FIPS 10-4 code of any GeoNames row
#   RB: Serbia -- not the FIPS 10-4 code of any GeoNames row
#   RH: Zimbabwe -- not the FIPS 10-4 code of any GeoNames row
#   SR: Serbia and Montenegro -- not the FIPS 10-4 code of any GeoNames row
#   TC: United Arab Emirates -- not the FIPS 10-4 code of any GeoNames row
#   UR: Union of Soviet Socialist Repu -- not the FIPS 10-4 code of any GeoNames row
#   YE: Yemen (Sanaa) -- not the FIPS 10-4 code of any GeoNames row
#   YO: Former Yugoslavia -- not the FIPS 10-4 code of any GeoNames row
#   YS: Yemen (Aden) -- not the FIPS 10-4 code of any GeoNames row
#   YU: Yugoslavia (>05/92) -- not the FIPS 10-4 code of any GeoNames row
#   ZZ: Other -- not the FIPS 10-4 code of any GeoNames row
schemes:
  usda_psd:
    base: null
    source: {kind: archived_reference, file: registry/atlas/reference/geonames_countryInfo.txt, column: fips, note: "PSD Country_Code == GeoNames FIPS 10-4 and PSD Country_Name == GeoNames country name (both required)"}
