# Geography aliases of agent A-HAZARDS: NCEI Global Historical Hazard Database country names -> crosswalk entities.
# NCEI publishes a free-text country name per record (earthquakes and tsunamis upper case, volcanoes title case); the
# connector upper-cases and space-normalises it (atlas_noaa_hazards.country_key) and looks it up in scheme
# `ncei_hazards` (base iso3, so aggregated rows can use the crosswalk key itself as provider_geo).
# Names were collected from the full NCEI record lists and the descriptor lists earthquake/countries, tsunami/countries,
# tsunami/runup/countries, volcano/countries and volcano/event-countries (hazard-service v1, read 2026-10-16).
# Two kinds of evidence: "exact normalised name match" (the NCEI name equals, after upper-casing, a crosswalk label /
# ISO / World Bank / UN / Comtrade name of exactly one entity) and "manual" (agent decision, reason given, maintainer
# review pending). NCEI names the PRESENT-DAY country of a location, also for ancient events.
# Deliberately absent (unmapped, kept with iso3 null): AFRICA, NORTH COAST (region, not a country); ARCTIC OCEAN (ocean); ATLANTIC OCEAN (ocean); BALTIC SEA (sea); BERING SEA (sea); DEAD SEA (lake/sea spanning several countries); EAST CHINA SEA (sea); INDIAN OCEAN (ocean); IRISH SEA (sea); KOREA (ambiguous (before or without the division into PRK/KOR; NCEI tsunami record)); NORTH SEA (sea); NORTHWEST PACIFIC OCEAN (ocean); PACIFIC OCEAN (ocean); SAINT MARTIN (FRENCH AND DUTCH TERRITORIES) (spans two crosswalk entities (MAF, SXM)); SOLOMON SEA (sea); TASMAN SEA (sea); UK TERRITORY (unspecified UK territory (records include Diego Garcia, Chagos, South Atlantic): no single entity); USA TERRITORY (unspecified US territory (records include Puerto Rico, Guam, Northern Mariana Islands, Virgin Islands): no single entity)
scheme: ncei_hazards
base: iso3
aliases:
  - code: "AFGHANISTAN"
    iso3: AFG
    source: "exact normalised name match: NCEI 'AFGHANISTAN' (descriptor earthquake/countries, earthquake records, descriptor volcano/countries) = crosswalk comtrade_reporter_label 'Afghanistan'"
  - code: "ALBANIA"
    iso3: ALB
    source: "exact normalised name match: NCEI 'ALBANIA' (descriptor earthquake/countries, earthquake records, descriptor tsunami/countries, descriptor tsunami/runup/countries, tsunami source records) = crosswalk comtrade_reporter_label 'Albania'"
