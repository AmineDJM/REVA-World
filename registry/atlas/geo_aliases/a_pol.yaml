# Provider geography schemes of the politics atlas tables (agent A-POL). Every mapping below is either
# the provider's own ISO 3166 alpha-3 code (scheme base) or an alias with the provider evidence quoted.
# Codes that do not name the same entity as a crosswalk key stay unmapped (kept, listed in each atlas
# table's manifest coverage.unmapped_provider_geo) and get a Wikidata QID from
# registry/entities/vdem_qids.json where one could be verified.
schemes:
  # V-Dem country_text_id (vdem.RData v16, raw sha256 39b412d39a061c18f20c98e4ad4d6355b05a0441df31be4ee9aec420dc3d95ea).
  # 176 of V-Dem's 202 units use ISO 3166 alpha-3 codes that are crosswalk keys (incl. XKX Kosovo).
  # V-Dem country units follow V-Dem's own continuity rules (DEU 1789-1870 = Kingdom of Prussia, RUS 1922-1991 =
  # USSR, ...); each atlas row says so in flags.vdem_histname.
  # Excluded: PSE -- V-Dem's unit "Palestine/West Bank" covers the West Bank only (Gaza is unit PSG), so it is
  # not the crosswalk entity PSE "State of Palestine".
  # Unmapped (not crosswalk keys): BDN BRW BVR DDR HDM HKS HRG HVR MCL MDN NSS OLD PPS PRM PSB PSG SAX SML SPD
  # SXN TSC TWN TWS VDR WRG YMD ZZB (historical states, sub-national units, Taiwan).
  vdem:
    base: iso3
    exclude: [PSE]
    aliases: {}
    source:
      kind: provider_data
      url: https://raw.githubusercontent.com/vdeminstitute/vdemdata/master/data/vdem.RData
      raw_sha256: 39b412d39a061c18f20c98e4ad4d6355b05a0441df31be4ee9aec420dc3d95ea
      retrieved_at: "2026-10-15T22:08:36Z"

  # LIED v6.9 unit keys '<countryn>|vdem=<id>' or '<countryn>|cow=<code>' (LIED_6.9.xlsx, raw sha256 4de421e6ab9636247e332b69cf3964b8c915e5ad797d3f2c4381185f78deefc7). Rule: a name maps through LIED's own
  # vdem id -> V-Dem v16 country_text_id when that is a crosswalk key (PSE excluded, see vdem), else by exact
  # crosswalk label, else by the three listed name matches. Unmapped keys (kept): Newfoundland|cow=21, Hanover|vdem=357, Hamburg|vdem=362, Brunswick|vdem=363, Bavaria|vdem=350, Germany, East|vdem=137, Oldenburg|vdem=364, Baden|vdem=349, Saxe-Weimar-Eisenach|vdem=365, Saxony|vdem=353, Wuerttemberg|vdem=355, Hesse-Kassel|vdem=358, Hesse-Darmstadt|vdem=359, Nassau|vdem=366, Mecklenburg-Schwerin|vdem=360, Sardinia|vdem=373, Papal states, the|vdem=361, Sicily|vdem=356, Modena|vdem=351, Parma|vdem=352, Tuscany|vdem=354, Zanzibar|vdem=236, Somaliland|vdem=139, Orange Free State|cow=556, Transvaal|cow=557, Natal|cow=558, Cape Colony|cow=559, Sahrawi|cow=601, Palestine/British Mandate|vdem=209, Palestine/West Bank|vdem=128, Palestine/Gaza|vdem=138, Yemen, South|vdem=23, Tibet|cow=711, Taiwan|vdem=48, Vietnam|vdem=35, Vietnam, South|vdem=35.
