# IMF data portal country codes (agent A-IMF), used by every IMF SDMX dataflow (WEO, BOP, IMTS,
# GFS, ER, MFS_IR, IL: codelists CL_WEO_COUNTRY / CL_BOP_COUNTRY / CL_IMTS_COUNTRY, all derived from
# IMF:CL_COUNTRY 1.6.0). Economies use ISO 3166-1 alpha-3, plus two IMF codes that name exactly a
# crosswalk entity. Everything else stays unmapped and is listed in each atlas table manifest:
# aggregates (G001 World, G110, GX123, U0xx UN regions, TXnnn "not specified"), IMF department
# areas (AFR, APD, EUR, MCD, WHD, SDS), TWN "Taiwan Province of China" (not a crosswalk entity),
# CWX "Curaçao and Sint Maarten" (a combined area; CUW and SXM are separate crosswalk entities),
# historical areas (ANT, CSK, DDR, SCG, SUN, VDR, YAR, YMD, YUG).
scheme: imf
base: iso3
aliases:
  KOS: XKX  # IMF "Kosovo, Republic of"; crosswalk XKX "Kosovo" (World Bank code, not ISO 3166)
  WBG: PSE  # IMF "West Bank and Gaza"; crosswalk PSE (worldbank_name "West Bank and Gaza", World Bank code PSE)
