# Geography aliases of agent A-INFRA (V3: submarine cables, air routes, airports, space, ports).
# Every alias names the provider row it was read from; anything not listed stays unmapped (kept, listed in
# each table's manifest). Nothing is guessed: historical states (GCAT SU, CSSR, CSFR, HKUK, TTPI),
# intergovernmental organisations (GCAT I-*), OpenFlights "West Bank" (one airport, Jerusalem Atarot) and
# OurAirports XP (Paracel Islands, disputed) / ZZ (unknown), NGA WPI QM/QW/XU (parts of UMI) and GCAT ESCN/ESIB
# (Canary / Balearic Islands, parts of Spain whose GCAT code E is already mapped) are deliberately NOT mapped.
schemes:
  # OurAirports iso_country: ISO 3166-1 alpha-2 plus XK (Kosovo).
  ourairports:
    base: iso2
    aliases:
      - code: XK
        iso3: XKX
        source: >-
          OurAirports countries.csv row: 302720,"XK","Kosovo","EU" (https://davidmegginson.github.io/ourairports-data/countries.csv,
          retrieved 2026-10-16). XKX is the crosswalk key of Kosovo.
    source: {kind: provider_data, url: "https://davidmegginson.github.io/ourairports-data/countries.csv", retrieved_at: "2026-10-16T00:15:00Z"}
  # NGA World Port Index countryCode: ISO 3166-1 alpha-2, except three US minor outlying islands coded QM (Midway
  # Islands), QW (Wake Island), XU (Johnston Atoll). All three are parts of ISO UM (UMI); mapping them would make three
  # provider geographies one country (the atlas refuses that: REVA must not sum or choose), so they stay unmapped.
  nga_wpi:
    base: iso2
    aliases: []
    source: {kind: provider_data, url: "https://msi.nga.mil/api/publications/world-port-index?output=csv", retrieved_at: "2026-10-16T18:11:46Z"}
  # OpenFlights airports.dat country names that the provider's own countries.dat spells differently
  # (all other names are mapped at run time through countries.dat name -> ISO alpha-2, provider data).
  openflights_name:
    base: null
    aliases:
      - {code: "Brunei", iso3: BRN, source: "OpenFlights countries.dat lists 'Brunei Darussalam','BN'; airports.dat uses 'Brunei' (e.g. Brunei International Airport BWN)"}
      - {code: "Burma", iso3: MMR, source: "countries.dat 'Myanmar','MM'; airports.dat 'Burma' (e.g. Yangon International RGN)"}
      - {code: "Cape Verde", iso3: CPV, source: "airports.dat 'Cape Verde' (e.g. Amilcar Cabral International SID); ISO 3166-1 CV Cabo Verde"}
      - {code: "Congo (Brazzaville)", iso3: COG, source: "countries.dat 'Congo Republic','CG'; airports.dat 'Congo (Brazzaville)' (Maya-Maya BZV)"}
      - {code: "Congo (Kinshasa)", iso3: COD, source: "countries.dat 'DR Congo','CD'; airports.dat 'Congo (Kinshasa)' (N'djili FIH)"}
      - {code: "East Timor", iso3: TLS, source: "airports.dat 'East Timor' (Presidente Nicolau Lobato DIL); ISO 3166-1 TL Timor-Leste"}
      - {code: "Faroe Islands", iso3: FRO, source: "airports.dat 'Faroe Islands' (Vagar FAE); ISO 3166-1 FO"}
      - {code: "Kyrgyzstan", iso3: KGZ, source: "airports.dat 'Kyrgyzstan' (Manas FRU); ISO 3166-1 KG"}
      - {code: "Macau", iso3: MAC, source: "airports.dat 'Macau' (Macau International MFM); ISO 3166-1 MO"}
      - {code: "Micronesia", iso3: FSM, source: "countries.dat 'Micronesia, Fed. Sts.','FM'; airports.dat 'Micronesia' (Chuuk TKK, Pohnpei PNI, Kosrae KSA, Yap YAP)"}
      - {code: "Saint Helena", iso3: SHN, source: "countries.dat 'St. Helena','SH'; airports.dat 'Saint Helena' (RAF Ascension Island ASI; ISO SH covers Ascension)"}
      - {code: "Saint Kitts and Nevis", iso3: KNA, source: "airports.dat 'Saint Kitts and Nevis' (Robert L. Bradshaw SKB); ISO 3166-1 KN"}
      - {code: "Saint Lucia", iso3: LCA, source: "airports.dat 'Saint Lucia' (Hewanorra UVF); ISO 3166-1 LC"}
      - {code: "Saint Pierre and Miquelon", iso3: SPM, source: "airports.dat 'Saint Pierre and Miquelon' (St Pierre FSP); ISO 3166-1 PM"}
      - {code: "Saint Vincent and the Grenadines", iso3: VCT, source: "airports.dat 'Saint Vincent and the Grenadines'; ISO 3166-1 VC"}
      - {code: "Svalbard", iso3: SJM, source: "countries.dat 'Svalbard and Jan Mayen Islands','SJ'; airports.dat 'Svalbard' (Svea ENSA, Ny-Alesund ENAS)"}
      - {code: "Swaziland", iso3: SWZ, source: "airports.dat 'Swaziland' (former name of Eswatini; ISO 3166-1 SZ)"}
      - {code: "Virgin Islands", iso3: VIR, source: "airports.dat 'Virgin Islands' = Cyril E. King STT/TIST and Henry E Rohlsen STX/TISX (US Virgin Islands; countries.dat 'United States Virgin Islands','VI')"}
      - {code: "Wallis and Futuna", iso3: WLF, source: "airports.dat 'Wallis and Futuna' (Hihifo WLS); ISO 3166-1 WF"}
    source: {kind: provider_data, url: "https://raw.githubusercontent.com/jpatokal/openflights/master/data/airports.dat", retrieved_at: "2026-10-16T00:15:00Z"}
