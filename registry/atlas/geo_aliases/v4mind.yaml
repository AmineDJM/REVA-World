# Provider geography schemes of the V4MIND atlas tables (agent V4MIND).
# Every alias is an exact crosswalk label match or a listed name match with its evidence (never a code-shape guess).
schemes:
  # Hofstede dimension data matrix (6-dimensions-for-website-2015-08-16.csv): the `ctr` column is Hofstede's own
  # 3-letter code, NOT ISO 3166 (CHI = China, BEN = Belgium Netherl, CAF = Canada French, MAC = Macedonia Rep,
  # SAL = El Salvador, ...): aliases are built from the `country` column only.
  # "Great Britain" is mapped to GBR (the United Kingdom entity): Hofstede publishes one national score under that name.
  # Unmapped on purpose (regions, sub-national groups, former state): AFE Africa East; AFW Africa West; ARA Arab countries; BEF Belgium French; BEN Belgium Netherl; CAF Canada French; GEE Germany East; SAW South Africa white; SWF Switzerland French; SWG Switzerland German.
