# Geography scheme of agent V6MIGR: IOM Missing Migrants Project 'country_of_incident' names -> crosswalk entities.
# MMP publishes a country NAME per incident (no code). Only EXACT equality after case-folding and whitespace
# collapsing (and decoding HTML character references such as &#039;) with one crosswalk name field (label / iso_name / un_name / worldbank_name / comtrade_reporter_label) of
# exactly one entity is accepted; no similarity matching. Generated from the HDX file
# iom-missing-migrants-project-data.csv (raw sha256 7e3b099fe58f7a6d59b5101befaa821477263ee0005dcb92ea818ba8ae5d6ad8, read 2026-10-17).
# Deliberately absent (kept unmapped, iso3 null): none at generation time; names added later by MMP stay unmapped until this file is regenerated.
