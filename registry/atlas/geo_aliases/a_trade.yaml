# Geo schemes of the trade atlas connectors (agent A-TRADE). Targets are crosswalk entity keys.
# Every alias is quoted from the provider's own code list (archived with each ingest); codes not listed
# stay unmapped and are listed in each atlas table manifest -- never guessed.
schemes:
  # CEPII BACI (src/reva/adapters/connectors/atlas_baci.py). BACI country codes are UN Comtrade reporter
  # codes (crosswalk field comtrade_reporter: 251 France, 842 USA, 699 India, 757 Switzerland, 579 Norway).
  # The aliases are ten territories whose BACI code (= their M49 code) is not a Comtrade reporter code in the
  # crosswalk; BACI's own country_codes file gives their ISO3. Kept unmapped (historical, combined or residual
  # areas): 58 "Belgium-Luxembourg (...1998)", 200 "Czechoslovakia (...1992)", 278 "Dem. Rep. of Germany
  # (...1990)", 280 "Fed. Rep. of Germany (...1990)", 490 "Other Asia, nes" (BACI iso3 S19), 530 "Netherlands
  # Antilles (...2010)", 697 "Europe EFTA, nes", 711 "Southern African Customs Union (...1999)", 736 "Sudan
  # (...2011)", 810 "USSR (...1990)", 849 "US Misc. Pacific Isds", 891 "Serbia and Montenegro (...2005)".
  baci:
    base: comtrade
    aliases:
      - {code: "16", iso3: ASM, source: "BACI country_codes_V202601.csv row '16,American Samoa,AS,ASM'"}
      - {code: "86", iso3: IOT, source: "BACI country_codes_V202601.csv row '86,Br. Indian Ocean Terr.,IO,IOT'"}
      - {code: "162", iso3: CXR, source: "BACI country_codes_V202601.csv row '162,Christmas Isds,CX,CXR'"}
      - {code: "166", iso3: CCK, source: "BACI country_codes_V202601.csv row '166,Cocos Isds,CC,CCK'"}
      - {code: "175", iso3: MYT, source: "BACI country_codes_V202601.csv row '175,Mayotte (Overseas France),YT,MYT'"}
      - {code: "238", iso3: FLK, source: "BACI country_codes_V202601.csv row '238,Falkland Isds (Malvinas),FK,FLK'"}
      - {code: "260", iso3: ATF, source: "BACI country_codes_V202601.csv row '260,Fr. South Antarctic Terr.,TF,ATF'"}
      - {code: "316", iso3: GUM, source: "BACI country_codes_V202601.csv row '316,Guam,GU,GUM'"}
      - {code: "574", iso3: NFK, source: "BACI country_codes_V202601.csv row '574,Norfolk Isds,NF,NFK'"}
      - {code: "612", iso3: PCN, source: "BACI country_codes_V202601.csv row '612,Pitcairn,PN,PCN'"}
