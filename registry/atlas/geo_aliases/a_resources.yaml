# Provider geography schemes of the A-RESOURCES atlas tables (agent A-RESOURCES, 2026-10-15).
#
# usgs_name: USGS country names (U.S. Department of State short forms) as written in the ScienceBase data releases
#   MCS2026_Commodities_Data.csv (column Country), 2024MYBv3_Production_table.csv (column 'Country (Short Form) or
#   Locality') and 2019_MYBviii_Table1_08-21-2025.csv (column Country). Every alias is an exact crosswalk label /
#   ISO name match (accents and punctuation folded) or a listed name match with its reason.
#   Not mapped on purpose (kept, listed in each manifest): 'China, Germany, and Russia', 'Other countries', 'World total'.
# eia: U.S. EIA International Energy Data (bulk INTL.zip) geography codes = ISO 3166-1 alpha-3 plus EIA codes;
#   XKS is EIA's Kosovo. Aggregates (WORL, OECD, OPEC, EU27, AFRC, ...) and historical areas (SUN Former U.S.S.R.,
#   YUG Former Yugoslavia, CSK Former Czechoslovakia, SCG Former Serbia and Montenegro, DDR Germany East, DEUW
#   Germany West, NLDA Netherlands Antilles) and HITZ Hawaiian Trade Zone, USIQ U.S. Pacific Islands, USOH U.S.
#   Territories, WAK Wake Island stay unmapped (kept, listed in each manifest).
