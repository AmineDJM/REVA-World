# Provider geography scheme of the V6DRUGS ClinicalTrials.gov atlas tables (agent V6DRUGS).
# ClinicalTrials.gov publishes location countries as English names (protocolSection.contactsLocationsModule.
# locations.country), no ISO code. Every alias below is an EXACT string equality between the published name and a
# name field of registry/entities/country_crosswalk.json (field named in `source`); nothing is fuzzy-matched.
# Names without an exact equal crosswalk name stay unmapped (iso3 null in the atlas rows) until a reviewed alias
# with evidence is added (owner decision, docs/dev/v6_drugs.md):
#   Aland Islands; Bonaire, Saint Eustatius and Saba ; Brunei; Burma; Federal Republic of Yugoslavia; French Southern and Antarctic Lands; Laos; Macau; Micronesia; Netherlands Antilles; North Korea; Palestinian Territories; Republic of the Congo; Reunion; Russia; Saint Martin; Serbia and Montenegro; South Korea; The Bahamas; The Gambia; Turkey (Türkiye); Vietnam; Virgin Islands
scheme: ctgov_country
