  # SSCP fractionalisation iso_num (ISO 3166 numeric, sscp_fractionalisation_extension.csv, doi:10.7910/DVN/EVCQXC,
  # MD5 a905a3d5f9bff1705357b68717916219). Unmapped: 158 Taiwan, 896 "Vietnam, North", 530 and 891 (rows without a
  # name; ISO numeric of the dissolved Netherlands Antilles and Serbia and Montenegro).
  soc_sscp:
    base: m49
    aliases:
      - {code: "689", iso3: XKX, source: "SSCP row '689,Kosovo,in_scope,347,KOS,...' (SSCP's own numeric code for Kosovo; README_project: SGS case list)"}
      - {code: "830", iso3: CHI, source: "SSCP row '830,Channel Islands,opportunistic,...' (ISO 3166 numeric 830 = Channel Islands, crosswalk CHI)"}
    source: {kind: provider_data, url: "https://dataverse.harvard.edu/api/access/datafile/14330927?format=original", md5: a905a3d5f9bff1705357b68717916219}

  # Transparency International CPI ISO3 column (CPI2025_Results.xlsx). TWN (Taiwan) stays unmapped.
  soc_ti:
    base: iso3
    aliases:
      - {code: KSV, iso3: XKX, source: "CPI2025_Results.xlsx sheet 'CPI Historical': 'Kosovo' carries ISO3 'KSV' (non-ISO, World Bank code)"}
    source: {kind: provider_data, url: "https://images.transparencycdn.org/images/CPI2025_Results.xlsx"}

  # OECD SDMX REF_AREA of the SIGI / GID-DB 2023 dataflows. Aggregates W, A, E, F, S, OECD, EU, G7, G20 and TWN stay unmapped.
  soc_oecd:
    base: iso3
    aliases:
      - {code: XKV, iso3: XKX, source: "OECD SDMX DSD_SIGI@DF_SIGI_2023 csvfilewithlabels: REF_AREA 'XKV' labelled 'Kosovo'"}
