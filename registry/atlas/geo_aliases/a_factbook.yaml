# Agent A-FACTBOOK: geography scheme of the CIA World Factbook (GEC codes = file names of the
# factbook/factbook.json mirror, upper case). GEC codes are the successors of FIPS 10-4: each alias below
# is the FIPS code of the same entity in GeoNames countryInfo (registry/atlas/reference/geonames_countryInfo.txt, sha256 c55f638cfaaf…,
# ATLASCORE scheme 'fips'), checked against the Factbook profile name.
# Deliberately NOT mapped (kept with iso3 = null, listed in each manifest):
#   partial territories: WE West Bank and GZ Gaza Strip (parts of PSE), SV Svalbard and JN Jan Mayen (parts of SJM),
#     UM US Pacific Island Wildlife Refuges, WQ Wake Island, BQ Navassa Island (parts of UMI);
#   not crosswalk entities: TW Taiwan (TWN is not in country_crosswalk.json), AX Akrotiri, DX Dhekelia,
#     AT Ashmore and Cartier Islands, CR Coral Sea Islands, IP Clipperton Island, PF Paracel Islands,
#     PG Spratly Islands;
#   aggregates / non-countries: EE European Union, XX World, OO/XO/XQ/ZH/ZN oceans.
# Unmapped at generation: AT, CR, UM, WQ, BQ, PF, PG, TW, AX, DX, EE, JN, SV, GZ, WE, IP, OO, XO, XQ, ZH, ZN, XX
# Scheme unsd_ama: UNSD AMA CountryID = UN M49 codes (base m49) plus Kosovo, which AMA lists as 412.
schemes:
  factbook_gec:
    base: null
    source: {kind: archived_reference, file: registry/atlas/reference/geonames_countryInfo.txt, column: fips, note: "GEC = FIPS 10-4 successor; aliases checked against Factbook profile names at mirror commit 144d6977b2b01ac1cbd220de754c0a005616760b"}
