  # ESRB European financial crises database: ISO 3166-1 alpha-2 codes (Greece is GR, not Eurostat EL), plus
  # 'UK' / 'UK*' for the United Kingdom, explained by the file's own note: '*The UK was excluded from the dataset in the
  # latest update including crises from 2019 onwards.'
  esrb:
    base: iso2
    aliases:
      - {code: "UK*", iso3: GBR, source: "ESRB fcdb20220120 'Systemic crises' column A 'UK*' with the sheet note '*The UK was excluded from the dataset in the latest update including crises from 2019 onwards.'"}
      - {code: "UK", iso3: GBR, source: "ESRB fcdb20220120 'Residual events' column A 'UK' (the same country as 'UK*' of the systemic sheet; ISO 3166 reserves UK for the United Kingdom)"}
