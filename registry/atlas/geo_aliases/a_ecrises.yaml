# Geography schemes of agent A-ECRISES (economic and financial crises). Generated from the provider files and
# reviewed by the agent; every alias says why. Nothing here is guessed: names that match a crosswalk name field
# exactly say which field; the others are agent-mapped with the reason (IMF naming conventions, renamed
# countries, spacing variants of the same file).
