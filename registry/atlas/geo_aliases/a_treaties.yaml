# Agent A-TREATIES geography aliases (UNTC participant names; OHCHR ISO3 area ids).
note: 'Agent A-TREATIES provider geography scheme ''untc'': participant names exactly as the UN Treaty Collection status pages
  write them -> crosswalk keys. Built from the 53 archived MTDSG pages (2026-10-16) by exact normalised match against the
  crosswalk''s un_name/label/iso_name/worldbank_name; one manual entry (Czech Republic). Non-State participants (European
  Union) are deliberately absent and stay unmapped (kept, listed). The OHCHR dashboard uses ISO3 (scheme ohchr below, base
  iso3).'
schemes:
  untc:
    base: null
    aliases:
    - code: Afghanistan
      iso3: AFG
      source: 'exact normalised name match: UNTC participant ''Afghanistan'' = crosswalk comtrade_reporter_label/iso_name/label/un_name/worldbank_name
        of AFG'
    - code: Albania
