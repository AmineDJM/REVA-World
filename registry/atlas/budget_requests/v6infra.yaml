# Budget request from agent V6INFRA (transport & logistics). Sizes measured 2026-10-17 (docs/dev/v6_infra.md).
# Merged by `python -m reva.atlas.budget_merge` (largest request per source, never the sum).
agent: V6INFRA
requests:
  - source_key: unece.unlocode
    # publications page (18 kB) + terms page (12 kB) + release ZIP (13.5 MB, one redirect) + Natural Earth admin-1
    # ZIP (14.9 MB, identical bytes to V4CLIMATE's archived copy) = 4-5 requests, ~29 MB per run (biannual).
    daily_requests: 10
    expected_bytes_per_day: 60000000
    reason: "UN/LOCODE official release + licence pages + Natural Earth admin-1: 5 requests per run, one retry"
  - source_key: imf.portwatch
    # 4 item metadata (~60 kB) + chokepoints daily CSV (9.1 MB) + date range + ~3 aggregated pages per year
    # 2019-2026 (24 x ~120 kB) + ports database (3 pages, ~0.6 MB) + chokepoints database + Natural Earth (14.9 MB)
    # = ~35 requests, ~28 MB per run (weekly).
    daily_requests: 80
    expected_bytes_per_day: 60000000
    reason: "IMF PortWatch: ~35 requests per run, one retry"
  - source_key: nga.wpi
    # atlas.nga_wpi 1.1.0: CSV (1.3 MB) + Natural Earth admin-1 ZIP (14.9 MB) = 2 requests per run.
    daily_requests: 6
    expected_bytes_per_day: 34000000
    reason: "WPI CSV + Natural Earth admin-1 for the KG ADM1 placement: 2 requests per run, one retry"
  - source_key: ourairports.data
    # atlas.ourairports 1.1.0: terms page + (fallback) repository LICENSE + countries.csv + airports.csv (12.7 MB)
    # + Natural Earth admin-1 ZIP (14.9 MB) = 4-5 requests, ~28 MB per run.
    daily_requests: 10
    expected_bytes_per_day: 60000000
    reason: "OurAirports + licence fallback + Natural Earth admin-1: 5 requests per run, one retry"
  - source_key: eurostat.dissemination
    # atlas.eurostat_transport: 7 JSON-stat requests (~1.2 MB) per run, on top of V4ECON's 8 and A-ILO/GAPHUNT.
    daily_requests: 140
    expected_bytes_per_day: 60000000
    reason: "existing 116 + 7 per V6INFRA run, one retry"
daily_totals_increase:
  http_requests_total: "+110"
  http_bytes_total: "+240_000_000"
notes: >-
  All sources are small bulk files or provider-side aggregations; nothing is paginated beyond the PortWatch
  aggregated queries (1,000 groups per page).
