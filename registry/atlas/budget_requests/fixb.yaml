# Budget request from agent FIXB (second causal audit, dataset side: docs/dev/v3_fixb.md). ATLASCORE merge rule:
# max(current, request) per source, never the sum. The three sources are re-ingested on 2026-10-17 after their
# first runs the same day; atlas.cowwars 1.1.0 also archives the COW intra-state v5.1 zip (0.9 MB, 1 request).
agent: FIXB
requests:
