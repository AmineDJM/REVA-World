# Budget request of agent NLQA (natural-language questions, POST /v1/ask). ATLASCORE merges requests into
# registry/policies/budgets.yaml.
# STATUS (2026-10-15): llm.nlqa is DEFERRED by ATLASCORE (it needs a migration for a separate LLM ledger).
# Decision in force: LLM questions reuse the existing V2 budget line llm.scenario_drafts and its ledger
# (accounts llm:scenario_drafts:{requests,tokens}, operation ids nl_draft:<sha256>:<attempt>, reserved
# before sending and settled with the provider-reported usage via reva.nl.service.call_providers). They
# are OFF by default (REVA_LLM_ENABLED and REVA_NLQA_LLM=1 both required). The entries below remain the
# request for when a dedicated line becomes possible.
agent: NLQA
requests:
  - source_key: llm.nlqa
    kind: llm_tokens            # an LLM section under `llm:` in budgets.yaml, not an HTTP source
    daily_requests: 300         # planner (1/question) + optional rephrase (1/question when asked)
    daily_tokens: 3000000       # measured planner prompt: ~7.5 kB system prompt + schema; reservation bound
                                # (bytes sent + 64 + max_output_tokens) ~ 10 000 tokens per request
    max_output_tokens: 1500
    reason: >-
      Translate a French/English question into a typed query plan (gpt-4.1, strict JSON schema, temperature 0)
      and optionally rephrase the composed answer (accepted only if every number/date/name is in the cited
      evidence). Answers are composed from sourced data only.
    needs_migration: >-
      The SECURITY DEFINER ledger functions of migration 0008_v2 (ops.reserve_llm_budget /
      ops.settle_llm_budget) hard-code the llm:scenario_drafts accounts and the nl_draft: operation-id
      prefix. A separate llm.nlqa line needs either a generalised function (account prefix parameter from an
      allow-list) or a sibling pair for llm:nlqa:* with operation ids nlqa:<sha256>:<attempt>.
  - source_key: wikidata.wbsearchentities
    daily_requests: 500
    expected_bytes_per_day: 5000000
    reason: >-
      Optional fallback identification of an entity absent from the REVA KG (MediaWiki action=wbsearchentities,
      one GET per unresolved lookup, <= 10 results, labelled "live Wikidata search, not in REVA's graph").
      Not wired: NLQA builds no HTTP client; it needs WDHARVEST's budget-metered Wikidata client to offer a
      wbsearchentities GET (injected as build_backends(search_get=...)); also capped in-process at 120/hour.
