    # atlas.bis_fin: 3 compact CSVs (~11 MB) + terms page = 4; A-FISCAL atlas.bis uses 7 on the same key
    daily_requests: 24
    expected_bytes_per_day: 30000000
    reason: "4 requests (~11 MB) per full run plus retry, alongside A-FISCAL's 7; BIS, no key"
  - source_key: bis.bulk
    # atlas.bis_fin_bulk: WS_CBTA + WS_GLI flat zips (2.7 MB) + terms page = 3; PRED-HF atlas.bis_daily uses 3
    daily_requests: 14
    expected_bytes_per_day: 8000000
    reason: "3 requests (~3 MB) per full run plus retry, alongside PRED-HF's 3; BIS bulk downloads, no key"
  - source_key: ecb.stats
    # atlas.ecb_fin: ILM (15.7 MB) + IRS (5.7 MB) + YC (12.7 MB) CSVs + 4 pages (~0.45 MB) = 7; PRED-HF uses 6
    daily_requests: 28
