# Budget request from agent V6FINDATA (V6, 2026-10-17). Merged by `python -m reva.atlas.budget_merge --write`.
# Finance connectors (docs/dev/v6_findata.md); one full run each per day at most, plus one retry, on top of the
# other agents' runs sharing these keys (max-merge, not sum: the limits below cover both).
agent: V6FINDATA
requests:
