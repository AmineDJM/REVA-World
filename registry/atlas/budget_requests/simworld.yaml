    expected_bytes_per_day: 6000000
    reason: >-
      built-in connector ilostat.labour_age5: 2 bulk indicator files (EMP_DWAP_SEX_AGE_RT_A 2.1 MB,
      EAP_DWAP_SEX_AGE_RT_A 2.8 MB) per refresh; fits in A-ILO's 60/day, stated for the record.
