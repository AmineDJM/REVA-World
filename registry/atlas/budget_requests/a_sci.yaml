# Budget request from agent A-SCI (science & technology atlas). Format of docs/dev/v3_atlas_interface.md section 5.
agent: A-SCI
requests:
  - source_key: openalex.api
    # group_by aggregates only (never per-work downloads). Default plan: 36 years (1990-2025) + 11 years x 4 domains
    # (2015-2025) = 80 queries; without an API key ~3 requests per query (first page + complement queries, OpenAlex
    # refuses cursor paging without a key): 230 requests / 2.7 MB in the live run of 2026-10-16.
    daily_requests: 400
    expected_bytes_per_day: 25000000
    reason: "monthly re-query of works per country x year (x domain); OpenAlex itself also meters per IP/API key"
  - source_key: nobelprize.api
    daily_requests: 5
    expected_bytes_per_day: 20000000
    reason: "one request returns every laureate (~4 MB); run after the October announcements"
  - source_key: wipo.ipstats_bulk
    daily_requests: 5
    expected_bytes_per_day: 60000000
    reason: "three bulk ZIPs (4 MB patents, 17 MB trademarks, 1.5 MB designs); checked monthly"
  - source_key: wipo.gii
    daily_requests: 3
    expected_bytes_per_day: 5000000
    reason: "one GII data workbook (~0.9 MB) per edition"
