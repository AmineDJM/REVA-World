# Budget request from agent PRED-VINTAGE (V5 vintages layer, 2026-10-17). Merged by
# `uv run python -m reva.atlas.budget_merge --write`.
agent: PRED-VINTAGE
requests:
  - source_key: dbnomics.api
    # atlas.vintage_weo_dbn: one series request per WEO vintage (33 vintages, 5 subjects x ~190 countries,
    # 1.0-1.7 MB each) = 33 requests, ~45 MB per full run; plus pagination headroom and one retry.
    daily_requests: 80
    expected_bytes_per_day: 100000000
    reason: "33 requests (~45 MB) per full run of the WEO vintages, plus retry; open API, no key"
  - source_key: philfed.data
    # atlas.vintage_philfed: 2 documentation PDFs (1 MB) + 4 RTDSM workbooks (1.7 MB) + release dates (8 kB)
    # + 2 SPF workbooks (0.7 MB) = 9 requests, ~3.4 MB.
    daily_requests: 20
    expected_bytes_per_day: 10000000
    reason: "9 requests (~3.4 MB) per full run plus one retry; open downloads, no key"
  - source_key: ecb.data_api
    # atlas.vintage_ecb_spf: one csvdata request (~0.6 MB).
    daily_requests: 6
    expected_bytes_per_day: 3000000
    reason: "1 request (~0.6 MB) per run plus retries; open API, no key"
  - source_key: imf.sdmx
    # atlas.vintage_weo_imf adds 4 WEO vintage requests (~2.5 MB each) to atlas.imf's 29.
    daily_requests: 70
    expected_bytes_per_day: 420000000
    reason: "atlas.vintage_weo_imf: +4 requests (~10 MB) on the IMF portal"
  - source_key: oecd.sdmx
    # atlas.vintage_oecd_rt: one request per edition year 1999..2026 = 28 requests (~0.3 MB each, ~8 MB).
    daily_requests: 120
    expected_bytes_per_day: 20000000
    reason: "atlas.vintage_oecd_rt: +28 small requests on sdmx.oecd.org (shared with A-FISCAL, A-ILO, A-SOCIETY, A-TRADE, V4MIND)"
daily_totals_increase:
  http_requests_total: "+306"
  http_bytes_total: "+553_000_000"
