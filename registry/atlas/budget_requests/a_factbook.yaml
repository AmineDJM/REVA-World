# Budget request from agent A-FACTBOOK (gap-filling sources with near-universal country coverage).
# ATLASCORE merges into registry/policies/budgets.yaml (src/reva/atlas/budget_merge.py).
# Connectors: src/reva/adapters/connectors/atlas_factbook.py (atlas.factbook, atlas.factbook_disputes; merged with A-LAW's legal fields) and
# src/reva/adapters/connectors/atlas_unsd_ama.py (atlas.unsd_ama). Live runs: docs/dev/v3_a_factbook.md.
agent: A-FACTBOOK
requests:
  - source_key: factbook.json
    # One merged connector (A-LAW's legal fields + A-FACTBOOK's figures/texts): atlas.factbook fetches the
    # 261 files at the pinned commit once for three tables (~9.8 MB, measured); atlas.factbook_disputes
    # fetches 259 files at the last mirror commit that still carried "Disputes - international"
    # (b1e7065, 2024-04-18; ~11.8 MB, measured): 520 requests for a full run, room for one retry.
    daily_requests: 900
    expected_bytes_per_day: 60000000
    reason: "one JSON per Factbook entity at two pinned mirror commits (520 requests, ~22 MB measured); source discontinued, one run total"
  - source_key: unsd.ama
    # 1 file-list JSON + 9 bulk XLSX (all countries, 1970-2024), ~14 MB per full run.
    daily_requests: 20
    expected_bytes_per_day: 40000000
    reason: "UNSD National Accounts AMA bulk downloads: 10 requests (~14 MB) per run, one retry; annual update (December)"
daily_totals_increase:
  http_requests_total: "+620"
  http_bytes_total: "+100_000_000"
