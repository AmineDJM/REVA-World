# Budget request from agent A-QOL (quality of life, environment, energy). ATLASCORE merges into
# registry/policies/budgets.yaml (per_source_daily_requests + daily totals). Bytes measured on live runs
# 2026-10-15 (docs/dev/v3_a_qol.md).
agent: A-QOL
requests:
  - source_key: undp.hdr
    # 3 bulk files: composite CSV (2.0 MB) + codebook XLSX (14 KB) + Global MPI tables XLSX (131 KB).
    daily_requests: 10
    expected_bytes_per_day: 7000000
    reason: "UNDP HDR composite indices + gMPI: 3 requests per run"
  - source_key: whr.figure21
    daily_requests: 5
    expected_bytes_per_day: 1000000
    reason: "World Happiness Report Figure 2.1 XLSX (134 KB): 1 request per run"
  - source_key: owid.compilations
    # energy CSV 9.2 MB + codebook, CO2 CSV 14.4 MB + codebook, 2 grapher charts (CSV + metadata) and one
    # full-metadata JSON per chart column (12): 20 requests, 25.1 MB per run.
    daily_requests: 50
    expected_bytes_per_day: 60000000
    reason: "OWID energy/CO2 GitHub CSVs + 2 grapher charts: 20 requests (~25 MB) per run"
  - source_key: wid.bulk
    # Byte ranges of one 882 MB archive: tail (128 KB) + WID_countries.csv + data and metadata members of the
    # ~230 crosswalk countries = ~465 requests and ~660 MB for a full refresh (largest member 9.4 MB). This
    # exceeds today's global daily byte cap (524 MB): request a monthly full run, or split over two days.
    daily_requests: 500
    expected_bytes_per_day: 680000000
    reason: "WID key inequality series for all countries: full refresh ~465 range requests / ~660 MB (monthly)"
daily_totals_increase:
  http_requests_total: "+565"
  http_bytes_total: "+748_000_000"
notes: >-
  WID is the only large item. If the daily byte total cannot be raised, a WID run limited to a country subset
  (WidConnector(countries=[...])) fits a smaller grant; the atlas table is then a subset vintage (the coverage
  note says which countries).
