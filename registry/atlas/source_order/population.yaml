# REVA headline concepts: population (agent ATLASOPS). Schema: _schema.json; loader: reva.atlas.source_order.
# Each listed series defines the same quantity as the concept; the first one that reports a (country,
# calendar year) answers, and the answer names it and lists every series consulted. Not blended, not imputed.
theme: population
concepts:
  - id: reva.population.total
    labels: {fr: "Population totale (au 1er juillet)", en: "Total population (1 July)"}
    definition: >-
      De facto mid-year population: all residents regardless of legal status or citizenship, as of 1 July
      of the year (UN WPP definition, also used by the World Bank WDI series).
    unit: persons
    series:
      - series: "un_wpp.wpp2024_demo.TPopulation1July"
        reported_unit: thousands
        scale: "1000"
        justification: >-
          UN World Population Prospects 2024 estimates (1950-2023), "Total population, as of 1 July" — the
          reference de facto mid-year series. Published in thousands; multiplied by 1000 exactly (the stored
          value keeps WPP's decimals). Projection years are a separate indicator (|proj=medium), never used here.
      - series: "wb.wdi_social.SP.POP.TOTL"
        justification: >-
          World Bank WDI "Population, total": "midyear estimates ... based on the de facto definition of
          population, which counts all residents regardless of legal status or citizenship" (WDI series
          metadata). The WDI takes the UN WPP for most economies (then the same quantity, same estimate) and
          national statistics (census, Eurostat, national statistical offices) for others: for those the
          value is a different estimate, often usually-resident (de jure) rather than de facto. It answers
          only where WPP has no estimate, and every switch from WPP to WDI in a country's series is flagged
          (source_break, with both values of the last year both report).
        caveats: >-
          Review V3b (2023, WDI vs WPP): 39 of 216 countries differ by more than 1 %, 11 by more than 5 % (VIR
          +22 %, MDA -20 %, CUW -17 %, ALB -14 %, TGO -12 %, QAT -11 %, TTO -9 %, ISR +6 %, SYC -6 %, POL -5 %,
          BGR -5 %): census-based national figures or another territorial scope. Countries whose scope differs
          are excluded below (not_equivalent_for); the others are answered with a source_break flag.
        not_equivalent_for:
          - iso3: [FRA]
            reason: >-
              Territorial scope: WPP "France" is metropolitan France (Corsica included); Guadeloupe, Martinique,
              French Guiana, Réunion and Mayotte are separate WPP locations (and separate REVA entities GLP, MTQ,
              GUF, REU, MYT). WDI France includes the overseas departments (2023: WDI 68,372,286 vs WPP
              66,438,822, +2.9 %). Splicing them adds the overseas departments to France from one year to the
              next (and counts them twice next to their own entities).
          - iso3: [MDA]
            reason: >-
              Territorial scope: WPP "Republic of Moldova" includes Transnistria; the WDI follows the National
              Bureau of Statistics of Moldova, which excludes the territories on the left bank of the Dniester
              (2023: WDI 2,457,783 vs WPP 3,067,070, -19.9 %; a spliced series falls 21.7 % from 2023 to 2024).
        cell_rules:
          - estimate_kind: projection_upstream
            year_after: 2023
            upstream: "UN WPP 2024, medium-variant projection (republished by the World Bank)"
            label: {fr: "projection (ONU WPP via la Banque mondiale)", en: "projection (UN WPP via World Bank)"}
            basis: >-
              WDI SP.POP.TOTL source note: "(1) United Nations Population Division. World Population Prospects:
              2024 Revision; (2) Census reports and other statistical publications from national statistical
              offices ...". WPP 2024 estimates end in 2023; later WPP years are projections. The WDI does not
              say per economy which source a value comes from, so every WDI value after 2023 is treated as
              possibly the WPP projection (review V3b: equal to it to the person for 129 of 216 countries in
              2024 and 120 of 216 in 2025; India 2025 = 1,463,865,525 = WPP medium variant).
          - estimate_kind: extrapolated
            footnote_matches: "(?i)^extrapolated"
            label: {fr: "extrapolation (Banque mondiale)", en: "extrapolation (World Bank)"}
            basis: >-
              The cell's own WDI footnote says so ("Extrapolated assuming the same growth rate as previous 6
              months" / "... as previous year"): not an estimate of the year.
    caveats: >-
      WPP estimates answer first (1950-2023). The WDI answers only where WPP has no estimate; WDI values after
      2023 are treated as the WPP 2024 projection the World Bank republishes (estimate_kind
      projection_upstream: excluded by default, shown flagged when projections are requested), WDI cells
      footnoted as extrapolated likewise. WPP and WDI differ in definition for some countries (national
      usually-resident figures, territorial scope): FRA and MDA are never answered by the WDI; every other
      switch of source within a country's series is flagged source_break with both values of the overlap year.
    not_equivalent:
      - series: "imf.weo.LP"
        reason: >-
          WEO population follows national definitions (resident or de facto, census-based or registry)
          compiled by IMF desks, and WEO years after the latest actual are projections. Kept as its own
          catalog concept (imf.population).
      - series: "geonames.countryinfo.population"
        reason: "A snapshot without a stated reference year: cannot be placed in a calendar year."
      - series: "gapminder.fasttrack.pop / hyde.hyde321.popc / maddison.mpd2023.pop"
        reason: >-
          Long-run historical compilations (back-casts, interpolations, different territorial bases);
          kept as history concepts.
      - series: spc.pocket.MIDYEARPOPEST
        reason: SPC's mid-year estimates are census-based national figures; SPC does not state whether they are de facto
          or de jure, so they cannot be declared the WPP de facto definition. Catalog concept gapfill.spc.population_midyear.
      - series: eurostat.nuts2_gapfill.demo_r_d2jan / cbs.bes_population.population_1_january
        reason: '1 January stocks, not mid-year populations: proposed as reva.population.total_1_january.'
    related_catalog_concepts: [un.wpp.population, imf.population, history.population_persons]

  - id: reva.population.density
    labels: {fr: "Densité de population", en: "Population density"}
    definition: "Mid-year population divided by land area (square kilometres of land, excluding inland water)."
    unit: persons per km2 of land area
    series:
      - series: "wb.wdi_social.EN.POP.DNST"
        justification: >-
          WDI "Population density (people per sq. km of land area)": "midyear population divided by land area
          in square kilometers" (WDI metadata) — exactly this definition.
        cell_rules:
          - estimate_kind: projection_upstream
            year_after: 2023
            upstream: "UN WPP 2024 medium-variant population (via the WDI population SP.POP.TOTL)"
            label: {fr: "projection (population ONU WPP via la Banque mondiale)", en: "projection (UN WPP population via World Bank)"}
            basis: >-
              The WDI density divides the WDI mid-year population (SP.POP.TOTL), which after 2023 is for most
              economies the UN WPP 2024 projection (see reva.population.total), by land area.
    derived:
      formula: ratio
      alternatives:
        - [{concept: reva.population.total}, {concept: reva.geography.land_area}]
      justification: >-
        Exact by definition: mid-year population divided by land area of the same country and calendar
        year, both from ONE provider (same_source, the default: the pair expands to the listed series of the
        same source, i.e. WDI SP.POP.TOTL / WDI AG.LND.TOTL.K2); both inputs are cited. Used only when the WDI
        does not report EN.POP.DNST for the cell.
    caveats: "A derived density uses the WDI population, never a WPP population divided by an FAO area."
    not_equivalent:
      - series: "un_wpp.wpp2024_demo.PopDensity"
        reason: >-
          The WPP file does not state whether its denominator is land or total surface area; kept as its own
          concept (un.wpp.population_density) until the definition is confirmed.
      - series: eurostat.nuts2_gapfill.demo_r_d3dens|unit=PER_KM2 / spc.pocket.POPDENS
        reason: Eurostat divides the average population of the year (mean of two 1 January stocks) by land area, not the
          mid-year population; SPC does not state its denominator. Catalog concepts only.
    related_catalog_concepts: [un.wpp.population_density]

  - id: reva.population.total_1_january
    labels:
      fr: Population au 1er janvier
      en: Population on 1 January
    definition: Usually resident population on 1 January of the year as published by national or regional statistical
      offices (registers or census-based estimates). A stock at the start of the year, not the mid-year population
      of reva.population.total.
    unit: persons
    series:
    - series: eurostat.nuts2_gapfill.demo_r_d2jan|unit=NR|sex=T|age=TOTAL
      justification: 'Eurostat demo_r_d2jan ''Population on 1 January'', both sexes, all ages: this definition.'
    - series: cbs.bes_population.population_1_january
      justification: 'CBS 83774ENG ''Population on 1 January'' of the Caribbean Netherlands (population register):
        this definition.'
    caveats: Filled for GLP, MTQ, GUF, REU, MYT, ALA, SJM (Eurostat) and BES (CBS); proposed so these entities have
      a population at all.
