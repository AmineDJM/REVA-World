# REVA headline concepts: labour (agent ATLASOPS). See population.yaml for the rules.
theme: labour
concepts:
  - id: reva.labour.unemployment_rate
    labels: {fr: "Taux de chômage (estimations modélisées OIT, 15 ans et plus)", en: "Unemployment rate (ILO modelled estimates, 15+)"}
    definition: >-
      Unemployed persons (without work, available and seeking work; ILO definition) as a percentage of the labour
      force aged 15+, from the ILO harmonised modelled estimates (every country, imputed where national data are
      missing).
    unit: "%"
    series:
      - series: "ilostat.une_2eap_sex_age_rt_a.UNE_2EAP_SEX_AGE_RT|sex=SEX_T|classif1=AGE_YTHADULT_YGE15"
        justification: "ILOSTAT 'Unemployment rate -- ILO modelled estimates', both sexes, ages 15+: the reference series."
        cell_rules:
          - estimate_kind: nowcast
            year_after: 2024
            unless_flag: obs_status
            upstream: "ILO modelled estimates (ILOEST), November 2025 vintage"
            label: {fr: "prévision immédiate de l'OIT (année du millésime)", en: "ILO nowcast (vintage year)"}
            basis: >-
              ILO modelled estimates, November 2025 vintage: years after the vintage (2026-2027) are flagged
              projections by the connector; the vintage year 2025 is a nowcast (ILOEST methodology: current-year
              values are nowcasts from partial-year and economic indicators), and no 2025 cell carries an ILO
              obs_status, while the benchmarked years carry obs_status R. Update year_after with the next vintage.
      - series: "wb.wdi_social.SL.UEM.TOTL.ZS"
        justification: >-
          WDI "Unemployment, total (% of total labor force) (modeled ILO estimate)" republishes the same ILO
          modelled series (possibly an earlier ILO vintage).
        caveats: "The WDI may carry an older ILO modelled vintage; values can differ slightly."
        cell_rules:
          - estimate_kind: projection_upstream
            year_after: 2024
            upstream: "ILO modelled estimates (republished by the World Bank)"
            label: {fr: "prévision ou projection de l'OIT (via la Banque mondiale)", en: "ILO nowcast or projection (via World Bank)"}
            basis: >-
              The WDI republishes an ILO modelled vintage that is not newer than ILOSTAT's (November 2025): a WDI
              value for 2025 or later is an ILO nowcast or projection, not an estimate benchmarked on observations.
    caveats: >-
      Modelled estimates include ILO imputations; ILO projection years are excluded, and so is the vintage year
      (2025, an ILO nowcast without obs_status; review V3b LAB-1) unless projections are requested.
    not_equivalent:
      - series: "ilostat.une_deap_sex_age_rt_a / wb SL.UEM.TOTL.NE.ZS"
        reason: "National estimates (national definitions and coverage): see reva.labour.unemployment_rate_national."
      - series: "imf.weo.LUR"
        reason: "WEO unemployment follows national definitions (for some countries registered unemployment)."
    related_catalog_concepts: [labour.unemployment_rate.ilo_modelled, imf.unemployment_rate]

  - id: reva.labour.unemployment_rate_national
    labels: {fr: "Taux de chômage (estimations nationales, 15 ans et plus)", en: "Unemployment rate (national estimates, 15+)"}
    definition: >-
      Unemployed persons as a percentage of the labour force aged 15+, as estimated by national sources
      (labour force surveys preferred) and compiled by the ILO.
    unit: "%"
    series:
      - series: "ilostat.une_deap_sex_age_rt_a.UNE_DEAP_SEX_AGE_RT|sex=SEX_T|classif1=AGE_YTHADULT_YGE15"
        justification: "ILOSTAT national estimates, both sexes, 15+ (youth/adult breakdown total): the reference series."
      - series: "ilostat.une_deap_sex_age_rt_a.UNE_DEAP_SEX_AGE_RT|sex=SEX_T|classif1=AGE_AGGREGATE_YGE15"
        justification: "Same ILOSTAT national series reported under the aggregate age classification (15+ total)."
      - series: "wb.wdi_social.SL.UEM.TOTL.NE.ZS"
        justification: >-
          WDI "Unemployment, total (% of total labor force) (national estimate)" is sourced from ILOSTAT's
          national estimates — the same definition.
    caveats: "Definitions, age bounds and coverage follow each national source (see each cell's flags)."
    related_catalog_concepts: [labour.unemployment_rate.national]
    not_equivalent:
      - series: eurostat.nuts2_gapfill.lfst_r_lfu3rt (15-74) / cbs.bes_labour.unemployment_rate (15-74) / spc.emprates.UNEMPRATE
        reason: Eurostat and CBS rates are for ages 15-74 (the listed ILOSTAT series cover 15+); SPC does not state the
          age band or the definition (census or survey). Catalog concepts only (gapfill.*.unemployment_rate*).

  - id: reva.labour.minimum_wage_monthly_lcu
    labels: {fr: "Salaire minimum mensuel (monnaie nationale, à une date de référence)", en: "Monthly minimum wage (national currency, at a reference date)"}
    definition: >-
      Statutory nominal gross monthly minimum wage in force at the provider's reference date, in the currency the
      provider reports (the answer keeps the cell's own unit; never converted).
    unit: national currency per month (named per cell)
    series:
      - series: "ilostat.ear_inee_cur_nb_a.EAR_INEE_CUR_NB|classif1=CUR_TYPE_LCU"
        justification: "ILOSTAT statutory nominal gross monthly minimum wage, local currency, at the ILO reference month."
        caveats: "ILOSTAT's local currency can be EUR for a non-euro country (Norway; see flags.notes)."
      - series: "eurostat.earn_mw_cur.earn_mw_cur|currency=NAC"
        justification: >-
          Eurostat monthly national minimum wages in national currency, value in force on 1 January / 1 July
          (semesters; the year view shows the July semester with its true period) — the same quantity at a
          reference date.
        caveats: "Eurostat NAC does not name the currency in the cell."
    caveats: >-
      Countries without a statutory national minimum wage have no value (never zero). The ILO notes give the
      type (national, sectoral, lowest occupational) per cell.
    not_equivalent:
      - series: "oecd.earnings_mw_curp.SM_WG|unit=NCU|pay_period=M|price_base=V"
        reason: "OECD averages the monthly minimum wage over the year: a different reference period (review V3 DATA-1)."
      - series: "oecd ... pay_period=A / pay_period=H"
        reason: "Annual or hourly minimum wages are different units; never converted with assumed hours."
      - series: insee.smic_dom.SMIC_HOURLY_GROSS
        reason: Insee publishes the overseas Smic per hour; converting to a monthly amount (x 151.67 h) would be a REVA
          computation. Catalog concept gapfill.insee.smic_hourly.
    related_catalog_concepts: [labour.minimum_wage.monthly.local_currency, labour.minimum_wage.monthly.national_currency.annual_average]

  - id: reva.labour.average_monthly_earnings_lcu
    labels: {fr: "Salaire mensuel moyen des salariés (monnaie nationale)", en: "Average monthly earnings of employees (national currency)"}
    definition: "Mean nominal monthly earnings of employees, all economic activities, national currency (ILO)."
    unit: national currency per month (named per cell)
    series:
      - series: "ilostat.ear_emta_sex_cur_nb_a.EAR_EMTA_SEX_CUR_NB|sex=SEX_T|classif1=CUR_TYPE_LCU"
        justification: "ILOSTAT mean nominal monthly earnings of employees, both sexes, local currency."
      - series: "ilostat.ear_emta_sex_eco_cur_nb_a.EAR_EMTA_SEX_ECO_CUR_NB|sex=SEX_T|classif1=ECO_SECTOR_TOTAL|classif2=CUR_TYPE_LCU"
        justification: "Same ILOSTAT mean earnings, from the by-economic-activity table, total of all sectors."
      - series: "ilostat.ear_emta_sex_eco_cur_nb_a.EAR_EMTA_SEX_ECO_CUR_NB|sex=SEX_T|classif1=ECO_AGGREGATE_TOTAL|classif2=CUR_TYPE_LCU"
        justification: "Same ILOSTAT mean earnings, by-activity table, aggregate total."
      - series: "ilostat.ear_emta_sex_eco_cur_nb_a.EAR_EMTA_SEX_ECO_CUR_NB|sex=SEX_T|classif1=ECO_ISIC4_TOTAL|classif2=CUR_TYPE_LCU"
        justification: "Same ILOSTAT mean earnings, by-activity table, ISIC Rev.4 total."
      - series: "ilostat.ear_emta_sex_eco_cur_nb_a.EAR_EMTA_SEX_ECO_CUR_NB|sex=SEX_T|classif1=ECO_ISIC3_TOTAL|classif2=CUR_TYPE_LCU"
        justification: "Same ILOSTAT mean earnings, by-activity table, ISIC Rev.3 total."
    not_equivalent:
      - series: "oecd.earnings_av_an_wage (average annual wages)"
        reason: "Annual wages per full-time-equivalent employee: a different unit and population; never divided by 12."
      - series: "ilostat.ear_emtm_sex_cur_nb_a (median)"
        reason: "Median, not mean, earnings."
    related_catalog_concepts: [labour.mean_monthly_earnings.local_currency]
