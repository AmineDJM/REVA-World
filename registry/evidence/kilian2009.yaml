  relevance_to_reva: >-
    The title states that oil price shocks are not alike and separates demand from supply shocks.
    REVA therefore does not attach one universal macroeconomic multiplier to a border-price
    increase: the crude exposure model is an assumption-conditioned accounting stress test, and a
    headline price shock is not automatically the modelled intervention.
