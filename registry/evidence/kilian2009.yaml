# Curated, human-reviewed qualitative card. It explains WHY the origin of an oil
# price shock matters for REVA's crude-exposure stress test. It deliberately
# contains NO effect coefficients: V1 has DOI metadata only (no lawful full text
# was retrieved), so quantitative fields are explicit 'not_extracted'.
status: reviewed
card:
  claim_id: kilian2009.oil_shock_origin_matters
  claim_version: 1
  question: >-
    Do oil price increases have one universal macroeconomic effect, or does the effect depend on
    the underlying shock (supply vs demand)?
  estimand: {missing: not_extracted}
  treatment: "Oil price shocks distinguished by origin (crude oil supply vs demand shocks)"
  comparator: {missing: not_extracted}
