# Seed list of the chemistry layer (owner: V4CHEM): the ChEBI entities REVA loads (with their is_a ancestors and the
# targets of their ChEBI relations) and resolves to PubChem compounds. Chosen for what the rest of REVA references:
# hydrocarbons and petroleum fractions (V4ENERGY), greenhouse gases (V4CLIMATE), fertilisers (V4ECO / food),
# minerals and ores, metals, plastics, cement, drugs (V4HEALTH).
#
# * `chebi` is the identifier (authoritative). `name` is the ChEBI name at curation time (release 256, 2026-10-06):
#   the connectors only *check* it and report a mismatch (renamed entity or curation error); they never select or map
#   anything by name.
# * `groups` is REVA curation metadata for this file (why the seed is here); it is NOT loaded as a statement.
# * `pubchem: false` skips the PubChem lookup (classes, roles, polymers without a standardised CID).
# * role_members: entities that ChEBI states `has_role` the role are added (one hop, ChEBI's own statements).
# * class_members: direct `is_a` children (depth 1) of the class, or every descendant with `depth: all`.
