# Anchor chains (owner: KGHIST): 20 connections the REVA path engine must be able to explain.
#
# These are ACCEPTANCE TESTS for the path engine (/v1/kg/path), not hard-coded paths. A chain passes when
# the engine, restricted to the hop properties below (minus `exclude` and the global `excluded_properties`),
# returns a simple path from `from` to `to` with at most `max_hops` hops such that
#   * every class in `require_all` labels at least one hop,
#   * every group in `require_any` has at least one class labelling at least one hop,
#   * when `via_any` is given, the path passes through at least one of those entities
#     (owner-named waypoints such as "via the Louisiana Purchase"; any route through them is accepted),
# and every hop cites its statement (Wikidata statement id + entity revision, or WDQS query sha + raw sha).
# Path engines are expected to search k shortest paths (k >= 10) under these filters, because the
# plain shortest path is often a present-day shortcut (e.g. diplomatic relations) or a hub hop.
#
# Wording rule (docs/roadmap/v3_world_graph.md): a path is "connected via" + property labels; never causal.
# `asserted_causation` hops (P828/P1542/...) may be shown only as "asserted by Wikidata".
#
# `expectation`:
#   path_expected       a witness path satisfying the constraints exists in the recorded Wikidata claims
#                       (registry/kg/queries/history/_recorded/snapshot_claims_*.json, checked offline by
#                       tests/unit/test_kg_queries_history.py) -> the full KG must find one too.
#   path_may_be_absent  Wikidata (as recorded) does not state the link the question is about; the engine must
#                       answer honestly ("no sourced path within N hops") or find one in other sources
#                       (e.g. UN General Assembly votes for the US position on decolonisation, KGGEOPOL).
#                       It must never invent a hop.
#
# `expected_facts`: statements the explanation should be able to cite, each backed by the recorded snapshot
# (subject, property, object or year).
#
# Entity QIDs were looked up in Wikidata (never typed from memory): `verified: enwiki_title_lookup` =
# wbgetentities by English Wikipedia title (title_lookup*.json.raw); `wdqs_label_lookup` = English label
# lookup through WDQS (label_lookup_1.srj). Retrieved 2026-10-15 through WDHARVEST's locked client.

