# Property requests from KGSCIECO (science / economy / nature). WDHARVEST merges them into
# registry/kg/properties.yaml (`python -m reva.kg.harvest merge-property-requests` checks every id and its
# datatype against Wikidata and takes the en/fr labels from the property entity itself).
# The KGSCIECO seed specs do not restrict `properties`, so once a property below is allow-listed its claims
# are kept automatically on the next (re-)harvest of those specs and of core.countries -- no spec edit needed.
# Ids and English labels were checked with the recorded label probe
# tests/fixtures/kg/scieco/qid_labels.json (see docs/dev/v3_kgscieco.md).

# ---------------------------------------------------------------- science / technology
- property: P138
  why: >-
    named after (theory/law/unit/element/discovery -> person or place), e.g. polonium -> Poland,
    curium -> Marie Curie, Doppler effect -> Christian Doppler, Halley's Comet -> Edmond Halley.
  reva_predicate: named_after
  inverse: eponym_of
  kind: entity
  group: science
  label_en: named after
  label_fr: nommé d'après
- property: P1027
  why: conferred by (award -> institution), e.g. Nobel Prize in Physics -> Royal Swedish Academy of Sciences.
  reva_predicate: conferred_by
  inverse: confers
  kind: entity
  group: science
  label_en: conferred by
  label_fr: décerné par
- property: P1924
  why: vaccine for (vaccine -> disease), e.g. rabies vaccine -> rabies.
  reva_predicate: vaccine_for
  inverse: prevented_by_vaccine
  kind: entity
  group: science
  label_en: vaccine for
  label_fr: vaccin contre
- property: P178
  why: developer (vaccine/technology/software -> organisation or person), e.g. a COVID-19 vaccine -> BioNTech.
  reva_predicate: developer
  inverse: developer_of
  kind: entity
  group: science
  label_en: developer
  label_fr: développeur
- property: P176
  why: manufacturer (vaccine/spacecraft/product -> company), e.g. a satellite -> its builder.
  reva_predicate: manufacturer
  inverse: manufacturer_of
  kind: entity
  group: science
  label_en: manufacturer
  label_fr: fabricant
- property: P619
  why: UTC date of spacecraft launch (space missions/satellites), dates the mission -> agency -> country chain.
  reva_predicate: launch_date
  inverse: null
  kind: time
  group: science
  label_en: UTC date of spacecraft launch
  label_fr: date de lancement
- property: P1686
  role: qualifier
  why: for work (qualifier of award received P166), e.g. the work a Nobel Prize was awarded for.
  label_en: for work
  label_fr: pour l'œuvre

