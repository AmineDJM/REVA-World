# KG property allow-list (owner: WDHARVEST). Only claims whose main property is listed here are loaded
# into kg.statement; qualifiers and references are reduced to the lists further down.
#
# Columns:
#   property        Wikidata property id
#   reva_predicate  REVA predicate name (snake_case, subject -> object direction)
#   inverse         name of the reverse direction for graph traversal (object -> subject); null when the
#                   object is a literal (no reverse edge)
#   kind            entity | time | quantity | monolingualtext | external_id | url | coordinate | string
#   group           thematic group (display / filtering only)
#   label_en/fr     the property's own Wikidata labels (fetched from the property entity with wbgetentities,
#                   see labels_source below); expected_en is the label WDHARVEST checked the id against
#   symmetric       true when the relation is symmetric (shares border with, diplomatic relation, ...)
#
# Honesty: Wikidata is community-edited (CC0); statements are 'community_edited', never 'verified'.
# Causal wording (P828/P1542/P1478/P1479/P1536/P1537) is shown only as "asserted by Wikidata".
# Deprecated-rank claims are dropped at extraction; preferred/normal rank is kept per statement.
# To request a property: registry/kg/property_requests/<agent>.yaml (see registry/kg/queries/README.md).

