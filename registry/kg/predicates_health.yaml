# Dataset predicates of the human-body / disease layer (owner: V4HEALTH). Not Wikidata properties: they are
# registered in the KG allow-list (kg.property / kg.property_version) by the connectors themselves through
# reva.kg.model.register_properties (src/reva/adapters/connectors/health_obo_common.py), like the language layer
# (registry/kg/predicates_lang.yaml). Families: registry/kg/relations_v4.d/v4health.yaml.
#
# Honesty:
# * Every statement is what the ontology / dataset file states, axiom by axiom (selector = file + term + relation
#   + filler). Nothing is inferred (no reasoner is run), nothing is matched by name.
# * NO predicate here is causal. An ontology relation that the Relation Ontology (RO) itself classifies under
#   "causally related to" (RO:0002410) -- e.g. "disease has infectious agent", "has material basis in germline
#   mutation in", DOID "has material basis in" (IDO:0000664, defined by DOID as "Relating the disease to it's
#   causation") -- is never a KG link: it is delivered to the causal loader as an attributed T1 claim
#   (docs/dev/v4_v4health.md, "Causal axioms").
# * gene-disease validity (ClinGen) is an association with a curated evidence classification, never causation.
# * A connection through these statements is a connection, not a cause (KGCORE path wording).
#
# `ro`: the Relation Ontology id the ontology file maps the relation to (definition quoted verbatim from the
# archived ro.obo in the report). `family`: the V4 relation family (informative; the binding mapping is the
# relations_v4.d drop-in).

version: 1
owner: V4HEALTH
predicates:
