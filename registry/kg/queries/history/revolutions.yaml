id: history.revolutions
domain: history
owner: KGHIST
description: >-
  Revolutions: instances of revolution (Q10931) or of a subclass (political revolution, ...). Snapshots
  keep country (P17), location (P276), start/end (P580/P582), participants (P710), part of (P361),
  cause/effect (asserted by Wikidata only) and the regime it replaced/produced (P1365/P1366 when
  present).
purpose: seed_entities
entity_kind: event
sparql: |
  SELECT DISTINCT ?item WHERE {
    ?item p:P31 ?item_p31 . ?item_p31 ps:P31/wdt:P279* wd:Q10931 ; wikibase:rank ?item_p31r . FILTER(?item_p31r != wikibase:DeprecatedRank)
  }
max_rows: 2000
expand_hops: 1
# WDQS-free selection (run --via api) when WDQS is throttled; same classes, CirrusSearch semantics.
api_search: {instance_of: [Q10931], subclass_depth: 3}
