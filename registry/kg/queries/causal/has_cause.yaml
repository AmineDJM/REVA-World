id: causal.has_cause
domain: causal
owner: CAUSWD
description: >-
  Every non-deprecated Wikidata P828 (has cause) statement: subject, statement id, object, rank — the full
  listing of this causal property (subject has cause object (cause = object, effect = subject)). Rows carry the statement id, so the CAUSWD driver re-reads
  the claims of prioritised subjects from wbgetentities snapshots (revision, references, qualifiers); the other
  rows are loaded as WDQS rows (revision explicitly unknown, references unknown — never "unreferenced").
  Causal statements are "asserted by Wikidata" only. Disabled for the generic runner: the stock statements
  path would snapshot every subject (tens of thousands of requests); run it with
  `python -m reva.causal_harvest wdqs` (bounded enrichment, at most one WDQS attempt per hour).
purpose: statements
entity_kind: event
enabled: false
sparql: |
  SELECT ?item ?statement ?object ?rank WHERE {
    ?item p:P828 ?statement .
    ?statement ps:P828 ?object ; wikibase:rank ?rank .
    FILTER(?rank != wikibase:DeprecatedRank)
    {{qid_filter}}
  }
columns: {subject: item, property: P828, object: object, statement: statement, rank: rank}
split: {by: qid_prefix, prefixes: ['1', '2', '3', '4', '5', '6', '7', '8', '9'], variable: item}
max_rows: 300000
timeout_seconds: 55
