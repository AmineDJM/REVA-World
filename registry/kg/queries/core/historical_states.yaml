id: core.historical_states
domain: core
owner: WDHARVEST
description: >-
  Historical countries/states: items with a non-deprecated P31 statement (any rank, not only the truthy
  best-rank value: many empires give preferred rank to another class) to historical country (Q3024240) or to
  one of its subclasses
  (former kingdoms, principalities, historical empires...). Runs after history.empires and history.colonies
  (KGHIST) so that items already seeded as country/empire/colony keep that more specific kind.
purpose: seed_entities
entity_kind: historical_state
sparql: |
  SELECT DISTINCT ?item WHERE {
    ?item p:P31 ?st . ?st ps:P31/wdt:P279* wd:Q3024240 ; wikibase:rank ?rank .
    FILTER(?rank != wikibase:DeprecatedRank)
  }
max_rows: 25000
depends_on: [core.sovereign_states, history.empires, history.colonies]
expand_hops: 1
# WDQS-free selection (run --via api): items linking to historical country whose own P31 contains it (direct
# instances only; subclass instances come from the WDQS query or KGHIST specs).
api_search: {instance_of: [Q3024240], discover: whatlinkshere}
