id: culture.currencies
domain: culture
owner: KGCULT
description: >-
  Currency entities: every item with an ISO 4217 code (P498) plus every object of a currency (P38)
  statement on a crosswalk country, with succession (replaces/replaced by), dates and issuer.
purpose: seed_entities
entity_kind: other
sparql: |
  SELECT DISTINCT ?item WHERE {
    { ?item wdt:P498 ?code . }
    UNION
    { VALUES ?country { {{values}} } ?country wdt:P38 ?item . }
  }
split: {by: values, source: countries, chunk_size: 250}
max_rows: 3000
expand_hops: 0
properties: [P31, P279, P498, P17, P571, P576, P580, P582, P1365, P1366, P155, P156]
notes: >-
  With chunk_size 250 the whole country list fits in one request (250 entities); the ISO 4217 branch
  is repeated in each chunk and de-duplicated by the harvester.
