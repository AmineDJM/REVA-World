id: culture.historical_state_languages
domain: culture
owner: KGCULT
description: >-
  Official language (P37) and language used (P2936) of historical countries (Q3024240), empires
  (Q48349), colonies (Q133156), protectorates (Q164142) and dependent territories (Q161243) - directly
  typed or typed by a subclass - with dates. Provides the
  empire/colony -> language hop of colonial-diffusion paths (e.g. Portuguese Empire -> Portuguese).
  The colony -> empire and country -> predecessor hops come from KGHIST specs.
purpose: statements
entity_kind: historical_state
sparql: |
  SELECT ?state ?statement ?prop ?language ?rank ?start ?end ?pit WHERE {
    VALUES (?p ?ps ?prop) { (p:P37 ps:P37 wd:P37) (p:P2936 ps:P2936 wd:P2936) }
    ?state ?p ?statement .
    ?statement ?ps ?language ; wikibase:rank ?rank .
    FILTER(?rank != wikibase:DeprecatedRank)
    FILTER EXISTS {
      VALUES ?class { wd:Q3024240 wd:Q48349 wd:Q133156 wd:Q164142 wd:Q161243 }
      ?state p:P31 ?state_p31 . ?state_p31 ps:P31/wdt:P279* ?class ; wikibase:rank ?state_p31r .
      FILTER(?state_p31r != wikibase:DeprecatedRank)
    }
    OPTIONAL { ?statement pq:P580 ?start }
    OPTIONAL { ?statement pq:P582 ?end }
    OPTIONAL { ?statement pq:P585 ?pit }
  }
columns: {subject: state, property_var: prop, object: language, statement: statement, rank: rank,
          start: start, end: end, point_in_time: pit}
max_rows: 20000
expand_hops: 1
notes: >-
  Class membership uses every non-deprecated P31 statement (p:P31/ps:P31, rank filter), not truthy wdt:P31: many historical items give preferred rank to one class (e.g. historical country Q3024240), which hides their other classes (empire, colony) from wdt:P31 (KGHIST finding, 2026-10-16).
