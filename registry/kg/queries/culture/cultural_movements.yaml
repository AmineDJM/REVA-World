id: culture.cultural_movements
domain: culture
owner: KGCULT
description: >-
  Cultural, art and literary movements (direct instances of Q2198855, Q968159, Q3326717) with at
  least 3 sitelinks, with periods (inception/dissolution, start/end), country of origin, parent
  movement and influences.
purpose: seed_entities
entity_kind: movement
sparql: |
  SELECT DISTINCT ?item WHERE {
    VALUES ?class { wd:Q2198855 wd:Q968159 wd:Q3326717 }
    ?item p:P31 ?item_p31 . ?item_p31 ps:P31 ?class ; wikibase:rank ?item_p31r .
    FILTER(?item_p31r != wikibase:DeprecatedRank)
    ?item wikibase:sitelinks ?links .
    FILTER(?links >= 3)
  }
max_rows: 8000
expand_hops: 1
properties: [P31, P279, P361, P571, P576, P580, P582, P2348, P495, P17, P737, P135, P1365, P1366, P155, P156]
notes: >-
  Class membership uses every non-deprecated P31 statement (p:P31/ps:P31, rank filter), not truthy wdt:P31: many historical items give preferred rank to one class (e.g. historical country Q3024240), which hides their other classes (empire, colony) from wdt:P31 (KGHIST finding, 2026-10-16).
