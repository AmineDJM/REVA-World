id: culture.v6_openlibrary_author_ids
domain: culture
owner: V6CULTURE
description: >-
  Open Library ID (P648) statements of humans with at least 40 sitelinks: the identifier bridge between Wikidata
  people (KGPEOPLE seeds) and the openlibrary:<OLID> author entities of atlas.openlibrary_subjects (whose records
  publish their Wikidata QID in remote_ids). Two independent identifier statements, never a name match.
purpose: statements
entity_kind: person
sparql: |
  SELECT ?person ?statement ?olid ?rank WHERE {
    ?person p:P648 ?statement .
    ?statement ps:P648 ?olid ; wikibase:rank ?rank .
    FILTER(?rank != wikibase:DeprecatedRank)
    ?person wdt:P31 wd:Q5 ; wikibase:sitelinks ?links .
    FILTER(?links >= 40)
    {{qid_filter}}
  }
columns: {subject: person, property: P648, object: olid, statement: statement, rank: rank}
split: {by: qid_prefix, variable: person}
max_rows: 30000
