id: culture.language_families
domain: culture
owner: KGCULT
description: >-
  Every item that is an instance of language family (Q25295), including Glottolog-derived
  subfamilies, so the subclass-of (P279) / part-of (P361) genealogy of languages has its nodes.
purpose: seed_entities
entity_kind: language_family
sparql: |
  SELECT DISTINCT ?item WHERE {
    ?item p:P31 ?item_p31 . ?item_p31 ps:P31 wd:Q25295 ; wikibase:rank ?item_p31r .
    FILTER(?item_p31r != wikibase:DeprecatedRank)
  }
max_rows: 15000
expand_hops: 0
properties: [P31, P279, P361, P1394, P219, P220, P2341, P571]
notes: >-
  Class membership uses every non-deprecated P31 statement (p:P31/ps:P31, rank filter), not truthy wdt:P31: many historical items give preferred rank to one class (e.g. historical country Q3024240), which hides their other classes (empire, colony) from wdt:P31 (KGHIST finding, 2026-10-16).
