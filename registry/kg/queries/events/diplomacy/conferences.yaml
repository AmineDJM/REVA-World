id: history.events.international_conferences
domain: history
owner: EVENTS
description: >-
  International conferences: instances of international conference (Q18564543) or of a subclass (peace conference,
  summit ...), with at least 2 sitelinks: Berlin Conference, Congress of Vienna, Yalta Conference, Bandung
  Conference ... Snapshots keep participants, place, dates, outcomes stated as has effect / significant event, and
  signatories when stated.
purpose: seed_entities
entity_kind: event
sparql: |
  SELECT DISTINCT ?item WHERE {
    VALUES ?root { wd:Q18564543 }
    ?item p:P31 ?st . ?st ps:P31 ?cls ; wikibase:rank ?rank . FILTER(?rank != wikibase:DeprecatedRank)
    ?cls wdt:P279* ?root .
    ?item wikibase:sitelinks ?links . FILTER(?links >= 2)
  }
max_rows: 3000
expand_hops: 1
# Rank-aware selection (p:P31/ps:P31, deprecated excluded; never the truthy wdt:P31 subset). The snapshot
# properties include every causal property (P828/P1542/P1478/P1479/P1536/P1537): Wikidata's causal claims
# arrive with the events (CAUSCORE loads them as T3/T4 claims; REVA asserts none).
properties: [P31, P17, P276, P131, P585, P580, P582, P571, P576, P361, P527, P155, P156, P793, P710, P664, P137, P1120, P828, P1542, P1478, P1479, P1536, P1537, P1891]
# WDQS-free selection (run --via api): same classes, CirrusSearch semantics (every non-deprecated P31 is
# indexed; no sitelink bound is expressible, the 10,000-result window per query is reported if exceeded).
api_search: {instance_of: [Q18564543], subclass_depth: 2}
