models:
  - model_key: belief.source_select
    version: "1.0.0"
    kind: belief_method
    approval_status: approved
    description: >-
      source_select_v1. Filters eligible, semantically compatible observations at the cutoff,
      selects the latest pre-cutoff revision in each lineage, applies the published source
      preference policy for the exact estimand and publishes selected_report with the original
      uncertainty status. Never averages incomparable definitions.
    input_ports: [{name: observations, kind: evidence.observation}]
    output_ports: [{name: estimates, modality: selected_report}]
    applicability: {concepts: "*", modality: selected_report}
    assumptions: [source report is not certain reality, original uncertainty retained]
  - model_key: economic.crude_exposure
    version: "1.0.0"
    kind: scenario
    approval_status: approved
    description: >-
      One-period crude-oil border-value exposure accounting. L1 fixed quantities:
      dM = M(pM-1), dX = X(pX-1), dnet = dM - dX, exposure = 100 dnet / G.
      L2 labelled elasticity sensitivity: M' = M pM^(1+eM), X' = X pX^(1+eX).
      Assumption-conditioned accounting only: not GDP loss, welfare, inflation, fiscal revenue
      or balance-of-payments forecast.
    input_ports:
      - {name: M, concept: trade.hs2709.import_value.world_total, unit: unit.usd, basis: nominal_current, aggregation: period_flow_total}
      - {name: X, concept: trade.hs2709.export_value.world_total, unit: unit.usd, basis: nominal_current, aggregation: period_flow_total}
      - {name: G, concept: economics.gdp.nominal_current_usd, unit: unit.usd, basis: nominal_current, aggregation: period_flow_total}
    output_ports:
      - {name: import_value_change_usd, unit: unit.usd}
      - {name: export_value_change_usd, unit: unit.usd}
      - {name: net_external_cost_change_usd, unit: unit.usd}
      - {name: exposure_percent_baseline_gdp, unit: unit.percent_of_baseline_gdp}
    applicability:
      horizon: {periods: 1, unit: annual_accounting_period}
      reference_years: [2020, 2024]
      multiplier_envelope: {min_exclusive: 0, max: 3}
      import_elasticity_envelope: [-2, 1]
      export_elasticity_envelope: [-1, 2]
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [gdp_loss, unemployment, consumer_inflation, household_welfare, dynamic_multi_year_effects]
    assumptions:
      - same-year source-reported border values in current USD
      - imports CIF / exports FOB as declared by provider; bases kept explicit
      - no general equilibrium; no quantity response at L1
      - elasticities at L2 are scenario assumptions with no probability interpretation
  - model_key: forecast.last_value
    version: "1.0.0"
    kind: forecast
    approval_status: approved
    description: Naive baseline; forecasts the last observed training value. Permanent benchmark.
    input_ports: [{name: series, kind: annual_positive_or_any}]
    output_ports: [{name: point_forecast}]
    applicability: {min_train: 1}
    assumptions: [random-walk point forecast]
  - model_key: forecast.log_drift
    version: "1.0.0"
    kind: forecast
    approval_status: approved
    description: Random walk with drift on log values fitted within the fold; strictly positive series only.
    input_ports: [{name: series, kind: annual_strictly_positive}]
    output_ports: [{name: point_forecast}, {name: prediction_interval}]
    applicability: {min_train: 3, requires_positive: true}
    assumptions: [log transform explicit; zeros not clipped]
  - model_key: forecast.local_level_log
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Gaussian local-level state-space model on log values (statsmodels UnobservedComponents),
      fitted only within each training window; estimand is the future released statistic.
    input_ports: [{name: series, kind: annual_strictly_positive}]
    output_ports: [{name: point_forecast}, {name: prediction_interval}]
    applicability: {min_train: 6, requires_positive: true}
    assumptions: [Gaussian local level on logs; measurement model for latent reality not identified]
  - model_key: population.age_sex_recipe
    version: "1.0.0"
    kind: population
    approval_status: approved
    description: >-
      Population recipe from disjoint age x recorded-sex leaf cells with exact (rational) weight
      allocation; materialises at most 100,000 weighted records in Parquet.
    input_ports: [{name: cells, concept: demography.population.jan1_age_sex}]
    output_ports: [{name: weighted_records}]
    applicability: {attributes: [age, sex], max_records: 100000}
    assumptions: [no attributes beyond age and recorded sex; no household structure]
  # V3 SIMWORLD: version 1.1.0 of the same model (every WPP country). Listed BEFORE 1.0.0 on purpose: the
  # plugin registry keeps 1.0.0 as the default version of the key, and consumers that index this file by
  # model_key alone (later entry wins) keep resolving the 1.0.0 entry.
  - model_key: demography.cohort_component
    version: "1.1.0"
    kind: scenario
    approval_status: candidate
    review_status: maintainer_review_pending
    description: >-
      Version 1.1.0 of the annual cohort-component projection: identical numerics; a required
      assumptions.data_source selects the inputs: "eurostat_demography" (the 1.0.0 path for the 31 EU/EFTA
      countries, values identical to 1.0.0) or "un_wpp2024" (UN World Population Prospects 2024 estimates,
      237 countries/areas; countries ["ALL"] accepted; migration zero or average residual, constant
      fertility by five-year mother's age groups; jump-off at most 1 January 2023). WPP estimates are
      model-based: the published back-test checks consistency with WPP, not truth. A conditional
      projection under stated assumptions, not a forecast.
    input_ports:
      - {name: population, kind: dataset, concept: demography.wpp.population.jan1_age_sex}
      - {name: deaths, kind: dataset, concept: demography.wpp.deaths.age_sex}
      - {name: births, kind: dataset, concept: demography.wpp.live_births.mother_age5_newborn_sex}
      - {name: wpp_indicators, kind: dataset, concept: demography.wpp.indicators_summary, optional: true}
      - {name: population_eurostat, kind: dataset, concept: demography.population.jan1_age_sex, optional: true}
      - {name: deaths_eurostat, kind: dataset, concept: demography.deaths.age_sex, optional: true}
      - {name: births_eurostat, kind: dataset, concept: demography.live_births.mother_age_newborn_sex, optional: true}
    output_ports:
      - {name: population_by_sex_and_broad_age_group, unit: unit.persons, temporal: "point:01-01"}
      - {name: births_deaths_net_migration, unit: unit.persons, temporal: calendar_year}
      - {name: old_age_dependency_ratio_65plus_per_15_64, unit: unit.percent}
      - {name: old_age_dependency_ratio_67plus_per_20_66, unit: unit.percent}
      - {name: population_by_single_age, unit: unit.persons, optional: true}
    applicability:
      data_sources: [eurostat_demography, un_wpp2024]
      countries_un_wpp2024: 237 WPP 2024 countries/areas (reva.models.population.wpp.COUNTRIES); small territories refused when the open age would fall below 85
      horizon: {max_periods: 50, unit: calendar_year}
      open_age: {max: 100, min: 85}
      base_period_must_end_before_jump_off: true
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [forecast, probability_levels, mortality_improvement, economic_effects]
    assumptions:
      - mortality held at base-period rates (no improvement)
      - migrants added at the end of the year
      - residual net migration against WPP estimates = migration implied by WPP's own reconstruction plus survival differences
      - fertility rates by five-year mother's age group applied uniformly within the group (WPP path)
      - births by newborn sex derived from WPP total births and the WPP sex ratio at birth (WPP path)
      - open age groups never split
  - model_key: demography.cohort_component
    version: "1.0.0"
    kind: scenario
    # V2 experimental model (agent POP): runs only because its plugin manifest declares
    # review_status maintainer_review_pending; labelled "experimental model, not yet reviewed".
    approval_status: candidate
    description: >-
      Annual cohort-component population projection by single age (0 to an open group, at most
      100+) and recorded sex: constant base-period mortality (m_x -> q_x with a_x = 1/2 and
      Coale-Demeny a_0), births = age-specific fertility rates x female exposure, sex ratio at
      birth from data, net migration by a labelled assumption (zero, average residual estimate, or
      EUROPOP2023 baseline). A conditional projection under stated assumptions, not a forecast.
    input_ports:
      - {name: population, kind: dataset, concept: demography.population.jan1_age_sex}
      - {name: deaths, kind: dataset, concept: demography.deaths.age_sex}
      - {name: births, kind: dataset, concept: demography.live_births.mother_age_newborn_sex}
      - {name: europop_migration, kind: dataset, concept: demography.assumption.europop2023.net_migration_age_sex, optional: true}
      - {name: europop_fertility, kind: dataset, concept: demography.assumption.europop2023.fertility_rate_age, optional: true}
    output_ports:
      - {name: population_by_sex_and_broad_age_group, unit: unit.persons, temporal: "point:01-01"}
      - {name: births_deaths_net_migration, unit: unit.persons, temporal: calendar_year}
      - {name: old_age_dependency_ratio_65plus_per_15_64, unit: unit.percent}
      - {name: old_age_dependency_ratio_67plus_per_20_66, unit: unit.percent}
      - {name: population_by_single_age, unit: unit.persons, optional: true}
    applicability:
      countries: [AUT, BEL, BGR, CHE, CYP, CZE, DEU, DNK, ESP, EST, FIN, FRA, GRC, HRV, HUN, IRL, ISL, ITA, LIE, LTU, LUX, LVA, MLT, NLD, NOR, POL, PRT, ROU, SVK, SVN, SWE]
      horizon: {max_periods: 50, unit: calendar_year}
      open_age: {max: 100, min: 85}
      base_period_must_end_before_jump_off: true
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [forecast, probability_levels, mortality_improvement, economic_effects]
    assumptions:
      - mortality held at base-period rates (no improvement)
      - migrants added at the end of the year (not exposed to mortality in the arrival year)
      - residual net migration includes statistical adjustment (census revisions, unknown-age events)
      - births with unknown mother's age projected as a separate rate per woman aged 15-49
      - open age groups and unknown ages never spread over single ages
      - sensitivity grid at L2 is assumption sensitivity with no probability interpretation
  - model_key: economic.io_price
    version: "1.0.0"
    kind: scenario
    approval_status: candidate
    review_status: maintainer_review_pending
    description: >-
      Multi-region Leontief cost-push price model on the Eurostat FIGARO inter-country
      industry-by-industry table (dataset input economics.io.figaro_ii_table, subject WORLD).
      Exogenous output-price change of chosen industries (B, C19, D35) in chosen economies;
      every other industry passes on share theta of its unit-cost increase:
      (I - theta A_EE') dp_E = theta A_SE' pi_S. Household basket = P3_S14-weighted average at
      basic prices. First-round cost-push under full pass-through; not an inflation forecast.
    input_ports:
      - {name: io_table, kind: dataset, concept: economics.io.figaro_ii_table, subject: WORLD}
    output_ports:
      - {name: industry_price_change_percent, unit: unit.percent}
      - {name: household_basket_price_change_percent, unit: unit.percent}
      - {name: household_basket_contributions, unit: unit.percent}
    applicability:
      horizon: {periods: 1, unit: annual_accounting_period}
      price_change_percent_envelope: {min_exclusive: -100, max: 200}
      pass_through_envelope: {min_exclusive: 0, max: 1}
      shockable_industries: [B, C19, D35]
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [inflation_forecast, consumer_price_index, gdp_loss, welfare]
    assumptions:
      - fixed technical coefficients of the reference-year table (no substitution)
      - no demand, quantity, wage, exchange-rate or monetary response; one annual period; nominal basic prices
      - shocked industries' output prices change exactly by the stated percentage (exogenous prices)
      - every other industry passes on share theta of its unit-cost increase (L1 theta = 1)
      - household basket weights are P3_S14 purchases at basic prices (no product taxes, no purchases abroad)
      - each basket row also carries a labelled purchasers'-price reading that holds taxes less subsidies on
        products (FIGARO DOM x D21X31 x P3_S14) fixed in money per unit; ad valorem taxes would keep the
        basic-price figure, so the two readings bracket the tax treatment; neither is a CPI
      - a shocked industry is a whole table industry (NACE B is broader than crude petroleum)
  # V3 SIMFIX: version 1.2.0 = 1.1.0 + pension coverage (ILOSTAT SDG 1.3.1); listed before 1.1.0 and 1.0.0
  # (consumers indexing by model_key alone keep resolving the 1.0.0 entry, the last one).
  - model_key: social.retirement_age
    version: "1.2.0"
    kind: scenario
    approval_status: candidate
    review_status: maintainer_review_pending
    description: >-
      Version 1.2.0 of the world retirement-age module: the 1.1.0 inputs, rule tables, eligibility arithmetic
      and cited response grid, with the legal-age change applied only to the pension-covered share of each
      (sex, single age 55-64) cell. Coverage = ILOSTAT SDG indicator 1.3.1 "persons above retirement age
      receiving a pension" (connector ilostat.social_protection), the source's own value of the latest year
      <= the reference year (at most 10 years older), by sex when ILOSTAT gives F and M, else the total for
      both sexes; the uncovered share keeps the observed rates. Countries without a coverage value are refused
      (missing_input), never assumed covered. Coverage counts contributory and non-contributory pensions and
      is measured above pensionable age: results can remain overstated where a social pension with its own
      age drives coverage.
    input_ports:
      - {name: employment_rate, kind: dataset, concept: labour.ilostat.employment_to_population_ratio.age5_sex}
      - {name: activity_rate, kind: dataset, concept: labour.ilostat.labour_force_participation_rate.age5_sex}
      - {name: pension_coverage, kind: dataset, concept: social_protection.ilostat.old_age_pension_coverage.sex}
      - {name: population, kind: dataset, concept: demography.wpp.population.jan1_age_sex}
      - {name: deaths, kind: dataset, concept: demography.wpp.deaths.age_sex}
      - {name: births, kind: dataset, concept: demography.wpp.live_births.mother_age5_newborn_sex}
    output_ports:
      - {name: employed_persons_55_64, unit: unit.persons}
      - {name: employment_change_55_64, unit: unit.persons}
      - {name: pension_recipients_change_55_64, unit: unit.persons}
      - {name: old_age_dependency_ratio, unit: unit.ratio}
      - {name: employment_rate_by_sex_and_group, unit: unit.percent}
    applicability:
      rule_tables: registry/rules/retirement_age (law text) + registry/rules/retirement_age_wbl2026 (WBL 2026)
      countries_refused_capability_gap: registry/rules/retirement_age_wbl2026/wbl2026_gaps.yaml
      countries_refused_missing_input: countries without ILOSTAT SDG 1.3.1 old-age pension coverage within 10 years
      horizon: {max_end_year: 2040, unit: calendar_year}
      reference_year_max: 2022
      ages: [55, 64]
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [pension_recipients, pension_expenditure_change_approx_eur, employed_persons_55_69, gdp_loss, unemployment, wages, household_welfare]
    assumptions:
      - legal-age change applied to the pension-covered share c only (ILOSTAT SDG 1.3.1, source's own value, no coverage variant)
      - coverage measured above pensionable age applied unchanged to ages 55-64 in every year, uniform across ages; by sex when published, else the total for both sexes
      - coverage includes non-contributory pensions (possible overstatement where a social pension with its own age drives it)
      - ILOSTAT rates of the latest complete year (at most 10 years before the reference year) held constant
      - pension-receipt drop = share outside the labour force of the age band (proxy of unknown direction; L2 bounding variants 55-59 / 60-64)
      - employment response = cited European literature value (transferred outside its country, labelled)
      - WBL 2026 age held constant for every claim year (counterfactual reference path; reforms not captured)
      - exceptions to the general eligibility age not represented
  # V3 SIMWORLD: version 1.1.0 (countries outside the Eurostat LFS); listed before 1.0.0 (see above).
  - model_key: social.retirement_age
    version: "1.1.0"
    kind: scenario
    approval_status: candidate
    review_status: maintainer_review_pending
    description: >-
      Version 1.1.0 of the retirement-age module for countries with a rule table (law-text tables for
      FRA DEU ESP NLD; World Bank WBL 2026 tables for 163 more economies, registry/rules/retirement_age_wbl2026,
      age as of 1 October 2025 held constant as a labelled counterfactual reference path, one track per sex),
      UN WPP 2024 population (cohort-component projection) and ILOSTAT employment and participation rates by
      sex and five-year band. Single ages 55-64 only (ILOSTAT has no 65-69 band); employment change, persons
      kept out of / brought into pension receipt (rho proxy), employed persons 55-64, employment rates by band
      and the old-age dependency ratio. Pension recipient levels and expenditure are not computed (refused).
      The employment response is a cited European estimate, transferred and labelled outside its country.
    input_ports:
      - {name: employment_rate, kind: dataset, concept: labour.ilostat.employment_to_population_ratio.age5_sex}
      - {name: activity_rate, kind: dataset, concept: labour.ilostat.labour_force_participation_rate.age5_sex}
      - {name: population, kind: dataset, concept: demography.wpp.population.jan1_age_sex}
      - {name: deaths, kind: dataset, concept: demography.wpp.deaths.age_sex}
      - {name: births, kind: dataset, concept: demography.wpp.live_births.mother_age5_newborn_sex}
    output_ports:
      - {name: employed_persons_55_64, unit: unit.persons}
      - {name: employment_change_55_64, unit: unit.persons}
      - {name: pension_recipients_change_55_64, unit: unit.persons}
      - {name: old_age_dependency_ratio, unit: unit.ratio}
      - {name: employment_rate_by_sex_and_group, unit: unit.percent}
    applicability:
      rule_tables: registry/rules/retirement_age (law text) + registry/rules/retirement_age_wbl2026 (WBL 2026)
      countries_refused_capability_gap: registry/rules/retirement_age_wbl2026/wbl2026_gaps.yaml
      horizon: {max_end_year: 2040, unit: calendar_year}
      reference_year_max: 2022
      ages: [55, 64]
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [pension_recipients, pension_expenditure_change_approx_eur, employed_persons_55_69, gdp_loss, unemployment, wages, household_welfare]
    assumptions:
      - ILOSTAT rates of the latest complete year (at most 10 years before the reference year) held constant
      - pension-receipt drop = share outside the labour force of the age band (proxy of unknown direction; L2 bounding variants 55-59 / 60-64)
      - employment response = cited European literature value (transferred outside its country, labelled)
      - WBL 2026 age held constant for every claim year (counterfactual reference path; reforms not captured)
      - exceptions to the general eligibility age and pension coverage (informality) not represented
  - model_key: social.retirement_age
    version: "1.0.0"
    kind: scenario
    # V2 experimental model (agent PEN): runs only because its plugin manifest declares
    # review_status maintainer_review_pending; labelled "experimental model, not yet reviewed".
    approval_status: candidate
    review_status: maintainer_review_pending
    description: >-
      Pension eligibility-age changes by birth cohort or claim year (rule tables transcribed from
      archived legal text, registry/rules/retirement_age) -> exact share of person-time below the
      eligibility age by single age 55-69 and year -> pension-receipt drop from the country's own
      base-year LFS inactivity (proxy of unknown direction; bounding variants in L2) and employment response = cited literature share
      (registry/assumptions, verified values only) -> employed persons 55-69, pension recipients,
      approximate expenditure change (average old-age pension x recipients change) and the
      old-age dependency ratio from the cohort-component projection. Annual to 2040. A conditional
      projection under stated assumptions, not a forecast.
    input_ports:
      - {name: employment_rate, kind: dataset, concept: labour.employment_rate.lfs_age_sex}
      - {name: activity_rate, kind: dataset, concept: labour.activity_rate.lfs_age_sex}
      - {name: pension_beneficiaries, kind: dataset, concept: social.pension_beneficiaries.esspros_old_age}
      - {name: pension_expenditure, kind: dataset, concept: social.pension_expenditure.esspros}
      - {name: population, kind: dataset, concept: demography.population.jan1_age_sex}
      - {name: deaths, kind: dataset, concept: demography.deaths.age_sex}
      - {name: births, kind: dataset, concept: demography.live_births.mother_age_newborn_sex}
    output_ports:
      - {name: employed_persons_55_69, unit: unit.persons}
      - {name: employment_change_55_69, unit: unit.persons}
      - {name: pension_recipients, unit: unit.persons}
      - {name: pension_recipients_change, unit: unit.persons}
      - {name: pension_expenditure_change_approx_eur, unit: unit.eur}
      - {name: old_age_dependency_ratio, unit: unit.ratio}
      - {name: employment_rate_by_sex_and_group, unit: unit.percent}
    applicability:
      countries_with_rule_tables: [FRA, DEU, ESP, NLD]
      countries_refused_capability_gap: [ITA, BEL, SWE, POL]
      horizon: {max_end_year: 2040, unit: calendar_year}
      ages: [55, 69]
      fidelity_supported: [L0, L1, L2]
      fidelity_reserved: [L3, L4]
      unsupported_outputs: [gdp_loss, unemployment, wages, household_welfare, benefit_substitution, full_rate_age_effects]
    assumptions:
      - base-year LFS employment rates by sex and five-year group held constant
      - pension-receipt drop of an affected cell = base-year share outside the labour force (proxy of unknown direction, own-country data; bounding variants rho 60-64 / 65-69 in L2)
      - employment response share from the literature registry (stated assumption with citation; L2 grid)
      - exceptions to the general eligibility age (long careers, disability, hardship) not represented
      - average pension constant in nominal euro of its year; pension recipients level scales with the 65+ population
  # --- PRED-REGISTRY (V5): baselines of the prospective forecast registry (reva.models.forecasting.registry_baselines)
  # and the attributed IMF WEO reference forecast. Candidates: they are what the registry judges, not judged models.
  - model_key: forecast.registry_persistence
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Random walk / persistence: point = last observed value; Gaussian predictive with sigma = root mean square of the
      historical h-step changes of the final consecutive run (zero-mean random-walk errors). Registry baseline.
    input_ports: [{name: series, kind: regular_frequency_any_sign}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {min_h_step_changes: 8, frequencies: [M, Q, A]}
    assumptions: [random-walk point; zero-mean h-step errors; history = final consecutive run only]
  - model_key: forecast.registry_seasonal_naive
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Seasonal naive: value of the same season in the most recent observed year; Gaussian predictive from the root
      mean square of the historical seasonal-naive errors at the same lag. Monthly and quarterly series only.
    input_ports: [{name: series, kind: regular_frequency_any_sign}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {min_errors: 8, frequencies: [M, Q]}
    assumptions: [same-season persistence; zero-mean errors]
  - model_key: forecast.registry_ar
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      AR(p) with intercept on levels, OLS on the last window (120 months / 80 quarters / 40 years) fitted as of the
      issue time, p <= 6/4/2 by AIC on a common sample; iterated forecast; Gaussian h-step variance from the psi
      weights. A non-stationary fit abstains.
    input_ports: [{name: series, kind: regular_frequency_any_sign}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {min_points: {M: 36, Q: 24, A: 15}, frequencies: [M, Q, A], requires_stationary_fit: true}
    assumptions: [linear Gaussian AR on levels; parameters estimated within the window only]
  - model_key: forecast.registry_hist_quantile
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Historical-quantile baseline: predictive = last value + the empirical distribution of the historical h-step
      changes of the final consecutive run; point = median; binary probabilities by the rule of succession.
    input_ports: [{name: series, kind: regular_frequency_any_sign}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}]
    applicability: {min_h_step_changes: 10, frequencies: [M, Q, A]}
    assumptions: [past h-step changes are exchangeable with the next one]
  - model_key: forecast.reference_imf_weo
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      External reference, attributed to the IMF: the World Economic Outlook projection cell of the WEO vintage pinned
      at issue (atlas.imf.weo). Point only; REVA does not produce it.
    input_ports: [{name: weo_projection_cell, kind: atlas_cell}]
    output_ports: [{name: point_forecast}]
    applicability: {families: [weo.cpi_inflation, weo.gdp_growth, weo.unemployment], question_types: [quantity]}
    assumptions: [IMF staff projection as published; no distribution]
  # --- PRED-FIN (V6): finance benchmarks and candidates of the forecast registry
  # (reva.models.forecasting.finance_models). Research forecasts only: not investment advice, not trading signals.
  # Benchmarks are issued as baselines; candidates issue only on (family, horizon) cells where the finance back-test
  # (reva.evaluation.finance_backtest) shows them significantly better than every benchmark (DM-HLN, Holm).
  - model_key: fin.rw_histvol
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Random walk / martingale benchmark on a daily series: point = latest published value; spread from the
      historical volatility of the last 250 daily changes (log changes for FX and oil, changes for yields), aggregated
      exactly over the weekdays of the target (month end or monthly mean). Log-normal (quantile grid) or Gaussian.
    input_ports: [{name: daily_series, kind: daily_market_series}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}, {name: predictive_normal}]
    applicability: {min_daily_changes: 60, finance_kinds: [fx, yield, spread, oil]}
    assumptions: [martingale point; zero-mean independent daily changes; volatility of the last 250 published days]
  - model_key: fin.fx_forward_cip
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      UIP / covered-interest-parity forward proxy benchmark: expected log change of the rate = (policy rate of the
      quote currency - policy rate of the euro) x time, BIS daily policy rates published at the origin (7-day lag);
      random-walk spread. Market forward points are licensed (not open), hence a proxy.
    input_ports: [{name: daily_series, kind: daily_market_series}, {name: policy_rates, kind: daily_market_series}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}]
    applicability: {finance_kinds: [fx]}
    assumptions: [uncovered interest parity; policy rates stand in for money-market rates of the horizon]
  - model_key: fin.ust_eh_forward
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Expectations-hypothesis benchmark: the forward yield (or spread) implied by the Treasury par curve of the origin
      day, par yields read as zero-coupon yields with linear interpolation in maturity (approximation); random-walk
      spread.
    input_ports: [{name: par_curve, kind: daily_yield_curve}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {finance_kinds: [yield, spread]}
    assumptions: [no term premium; par yields approximately zero-coupon yields]
  - model_key: fin.meeting_base_rate
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Policy-meeting benchmark: share of historical windows of the same length (starting at month ends over the last
      25 years, ending by the origin) in which the policy rate ended higher (lower); rule of succession.
    input_ports: [{name: policy_rate_history, kind: daily_market_series}]
    output_ports: [{name: probability}]
    applicability: {finance_kinds: [meeting], min_windows: 24}
    assumptions: [stationary frequency of moves over the last 25 years]
  - model_key: fin.meeting_momentum
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Policy-meeting benchmark: as fin.meeting_base_rate but only over windows that started in the same state (last
      move in the previous 365 days up, down, or none); rule of succession.
    input_ports: [{name: policy_rate_history, kind: daily_market_series}]
    output_ports: [{name: probability}]
    applicability: {finance_kinds: [meeting], min_windows_in_state: 12}
    assumptions: [rate cycles persist (first-order Markov in the direction of the last move)]
  - model_key: fin.garch11
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Candidate: random-walk point with a Gaussian GARCH(1,1) daily variance (QMLE, variance targeting, last 2,500
      daily changes) aggregated over the target's weekdays. Issued only on back-test winner cells.
    input_ports: [{name: daily_series, kind: daily_market_series}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}, {name: predictive_normal}]
    applicability: {min_daily_changes: 500, finance_kinds: [fx, yield, spread, oil]}
    assumptions: [GARCH(1,1) conditional variance; Gaussian quasi-likelihood; martingale point]
  - model_key: fin.ns_dl
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Candidate: dynamic Nelson-Siegel (Diebold-Li, lambda 0.0609 per month): factors by OLS on month-end par curves,
      AR(1) per factor over the last 120 months, forecast change of the fitted yield/spread added to the latest value;
      random-walk spread. Issued only on back-test winner cells.
    input_ports: [{name: par_curve, kind: daily_yield_curve}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {finance_kinds: [yield, spread], min_month_curves: 36}
    assumptions: [three-factor Nelson-Siegel curve; independent AR(1) factors]
  - model_key: fin.ppp_reversion
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Candidate: PPP real-exchange-rate mean reversion (AR(1) over the last 240 months of published CPI) plus the
      trailing 12-month inflation differential; random-walk spread. Issued only on back-test winner cells.
    input_ports: [{name: daily_series, kind: daily_market_series}, {name: cpi, kind: monthly_index}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}]
    applicability: {finance_kinds: [fx], min_months: 120}
    assumptions: [relative PPP with slow mean reversion; CPI published with its lag]
  - model_key: fin.taylor_logit
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Candidate: Taylor-rule fundamentals for policy meetings: logistic regressions of a move up / down over the
      window on 1.5 x published CPI inflation - policy rate (inflation-only Taylor gap) and the last-move state.
      Issued only on back-test winner cells.
    input_ports: [{name: policy_rate_history, kind: daily_market_series}, {name: inflation, kind: monthly_rate}]
    output_ports: [{name: probability}]
    applicability: {finance_kinds: [meeting], min_windows: 48}
    assumptions: [Taylor (1993) inflation coefficient; no output gap; stable reaction function over 25 years]
  # --- PRED-HEALTH (V6): health forecast registry (reva.models.forecasting.health_quantile, reva.evaluation.health_registry).
  # Quantile forecasts at the 23 US CDC hub levels, scored by WIS. Baselines are always issued; candidates only when the
  # stored back-test flags them as significant winners; the hub ensembles are attributed references, not REVA models.
  - model_key: health.persistence
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Persistence baseline for weekly/annual health series: median = last observed value; other quantiles = last value
      plus the empirical quantiles of the symmetrised h-step changes of the trailing window (156 weeks / 25 years),
      clipped to the family bounds.
    input_ports: [{name: series, kind: weekly_or_annual_nonnegative}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {min_h_step_changes: {W: 20, A: 8}, frequencies: [W, A]}
    assumptions: [random-walk median; symmetric h-step changes exchangeable over the trailing window]
  - model_key: health.climatology
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Seasonal climatology baseline (weekly): empirical quantiles of the values in the same season week (+/- 2 weeks)
      of earlier seasons (observed >= 26 weeks before the target, >= 3 distinct years).
    input_ports: [{name: series, kind: weekly_nonnegative}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {min_years: 3, frequencies: [W]}
    assumptions: [stable seasonality across seasons; current-season level ignored]
  - model_key: health.log_ar
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      AR(2) with intercept on weekly differences of log(y + 1), OLS on the trailing 104 weeks (>= 52 consecutive),
      h-step distribution by residual bootstrap (2000 paths, seed = hash of the training data); abstains outside the
      AR(2) stationarity triangle.
    input_ports: [{name: series, kind: weekly_nonnegative}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {min_consecutive_weeks: 52, frequencies: [W]}
    assumptions: [log-growth momentum; exchangeable residuals]
  - model_key: health.log_drift
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Random walk with drift on log values (annual): drift = mean log change of the last 10 years; quantiles from the
      symmetrised empirical h-step deviations around the drift (trailing 25 years).
    input_ports: [{name: series, kind: annual_strictly_positive}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {min_years: 10, frequencies: [A]}
    assumptions: [constant log drift over the horizon]
  - model_key: health.blend
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: Quantile average (Vincentisation) of the other health models that did not abstain (>= 2).
    input_ports: [{name: component_quantiles, kind: quantiles_hub23}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {min_components: 2, frequencies: [W, A]}
    assumptions: [equal weights]
  - model_key: forecast.reference_flusight_ensemble
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      External reference, attributed to the US CDC FluSight forecast hub: the FluSight-ensemble quantiles of the round
      (atlas.cdc.flusight_ensemble) as published. REVA does not produce it.
    input_ports: [{name: ensemble_cells, kind: atlas_cell}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {families: [nhsn.flu_hosp]}
    assumptions: [hub ensemble as published; attribution requested by CDC (flusight@cdc.gov)]
  - model_key: forecast.reference_covidhub_ensemble
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      External reference, attributed to the US CDC COVID-19 Forecast Hub: the CovidHub-ensemble quantiles of the round
      (atlas.cdc.covidhub_ensemble) as published. REVA does not produce it.
    input_ports: [{name: ensemble_cells, kind: atlas_cell}]
    output_ports: [{name: quantiles_hub23}]
    applicability: {families: [nhsn.covid_hosp]}
    assumptions: [hub ensemble as published; attribution requested by CDC (covidhub@cdc.gov)]
  # --- PRED-CONFLICT (V6): conflict-risk forecasters (reva.evaluation.conflict.models). Country-year RISK ESTIMATES on
  # UCDP state-based fatalities; never predictions of specific attacks, actors or persons. Candidates: judged by the
  # registry; the KG candidate is issued only on as-of back-test winner (family, horizon) pairs.
  - model_key: forecast.conflict_persistence
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Conflict baseline: no-change point (last published UCDP country-year state-based deaths); predictive = last value
      moved by pooled historical log-changes ln(1+y[s+h]) - ln(1+y[s]) of country-years in the same intensity bin;
      probabilities by the rule of succession.
    input_ports: [{name: country_year_deaths, kind: ucdp_orgvio_cy}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}, {name: probability}]
    applicability: {frequencies: [A], min_changes: 30}
    assumptions: [no-change point; intensity-bin log-changes exchangeable across countries and years]
  - model_key: forecast.conflict_base_rate
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Conflict baseline: the country's own history up to the origin -- (k+1)/(n+2) frequency of the family's event
      (onset / escalation: among past years meeting the condition) or the empirical distribution of its annual deaths.
    input_ports: [{name: country_year_deaths, kind: ucdp_orgvio_cy}]
    output_ports: [{name: probability}, {name: predictive_empirical}]
    applicability: {frequencies: [A], min_years: 5}
    assumptions: [stationary country-specific risk]
  - model_key: forecast.conflict_history_logit
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Conflict baseline: pooled ridge logistic regression on conflict history only (log deaths last year and last
      five, UCDP/PRIO armed-conflict recency and 10-year share since 1946, conflict / war level); counts by a hurdle
      model (logit for > 0, ridge log-normal for the positive part).
    input_ports: [{name: country_year_deaths, kind: ucdp_orgvio_cy}, {name: conflict_years, kind: ucdp_acd_cy}]
    output_ports: [{name: probability}, {name: predictive_empirical}]
    applicability: {frequencies: [A], min_train: 50}
    assumptions: [pooled coefficients across countries; ridge lambda 1 on standardised features]
  - model_key: forecast.conflict_kg_logit
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Conflict candidate: history features plus REVA KG/atlas covariates (CShapes neighbours' fatalities and conflict
      level, V-Dem polyarchy and its change, V-Dem physical violence index, WDI GDP per capita, growth and a < -3 %
      shock, population, infant mortality); ridge logit / hurdle. Associations used for prediction, not causal
      claims. Issued only on back-test winner (family, horizon) pairs.
    input_ports: [{name: country_year_deaths, kind: ucdp_orgvio_cy}, {name: covariates, kind: atlas_country_year}]
    output_ports: [{name: probability}, {name: predictive_empirical}]
    applicability: {frequencies: [A], min_train: 50}
    assumptions: [pooled coefficients; missing covariates mean-imputed with missing indicators; CShapes borders of 2019 carried forward]
  - model_key: forecast.reference_views
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      External reference: VIEWS country-month state-based fatality forecasts (Uppsala University / PRIO), attributed
      to VIEWS; REVA sums the 12 monthly point predictions of one run for a calendar-year question (point only;
      abstains on binary country-year questions).
    input_ports: [{name: views_forecasts, kind: atlas_views_cm_sb}]
    output_ports: [{name: point_forecast}]
    applicability: {frequencies: [A]}
    assumptions: [sum of monthly point predictions is not an expected annual total (VIEWS fits on the log scale)]
  # --- PRED-ENERGY (V6): forecasters benchmarked against the EIA Short-Term Energy Outlook on STEO archive vintages
  # (reva.models.forecasting.energy_models, reva.evaluation.energy_backtests). Candidates are issued to the registry
  # only on (series, horizon) pairs where they significantly beat the random walk (registry/forecasts/energy_winners.yaml).
  - model_key: forecast.energy_rw
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Energy benchmark: random walk (no change) on the information set of the STEO issue in force (history as then
      published); log-normal spread for prices, Gaussian for quantities, sigma = sd of monthly (log) changes over 60
      months times sqrt(k). Futures-free (no futures curve).
    input_ports: [{name: steo_information_set, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive}]
    applicability: {frequencies: [M], min_monthly_changes: 24}
    assumptions: [no-change point; zero-mean (log) changes; history as published in the STEO issue in force]
  - model_key: forecast.reference_eia_steo
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      External reference, attributed to the U.S. EIA: the Short-Term Energy Outlook projection for the reference month
      in the STEO issue in force at issue (atlas.vintage_steo.steo_archive). Point only; REVA does not produce it.
    input_ports: [{name: steo_projection_cell, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}]
    applicability: {frequencies: [M], question_types: [quantity]}
    assumptions: [EIA projection as published; no distribution]
  - model_key: forecast.energy_inventory
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Energy candidate (prices): direct k-step OLS of the log price change on the OECD commercial inventory gap (log
      stocks minus the mean of the same month in the previous five years), as-of history, last 120 months.
    input_ports: [{name: price, kind: atlas_vintage_steo}, {name: oecd_stocks, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive_lognormal}]
    applicability: {frequencies: [M], min_train: 36}
    assumptions: [linear association used for prediction, not a causal claim; residual sd as spread]
  - model_key: forecast.energy_ardl
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Energy candidate (prices): direct k-step ARDL of the log price change on last month's and last quarter's log
      price change, the 3-month log change of OECD stocks and the 3-month mean of EIA's implied world stock change.
    input_ports: [{name: price, kind: atlas_vintage_steo}, {name: fundamentals, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive_lognormal}]
    applicability: {frequencies: [M], min_train: 36}
    assumptions: [associations used for prediction, not causal claims; as-of history only]
  - model_key: forecast.energy_drift
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: Energy candidate (quantities) - random walk with the mean monthly change of the last 24 months as drift.
    input_ports: [{name: series, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {frequencies: [M], min_train: 25}
    assumptions: [linear drift; random-walk spread]
  - model_key: forecast.energy_seasonal
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Energy candidate (quantities) - last value plus the mean k-step change from the same calendar month in the last
      five years (seasonal pattern of stocks and production).
    input_ports: [{name: series, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {frequencies: [M], min_years: 3}
    assumptions: [stable seasonal changes; random-walk spread]
  - model_key: forecast.energy_ar_diff
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: Energy candidate (quantities) - AR(p) on monthly changes (p <= 3 by AIC, last 120 months), iterated; psi-weight variance.
    input_ports: [{name: series, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive_normal}]
    applicability: {frequencies: [M], min_train: 48}
    assumptions: [stationary changes; non-stationary fit abstains]
  - model_key: forecast.energy_combo_steo_rw
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      Energy candidate: REVA's equal-weight average of the EIA STEO projection and the random walk (logs for prices),
      random-walk spread. Uses EIA's published number as an input; not an EIA forecast.
    input_ports: [{name: steo_projection_cell, kind: atlas_vintage_steo}, {name: series, kind: atlas_vintage_steo}]
    output_ports: [{name: point_forecast}, {name: predictive}]
    applicability: {frequencies: [M]}
    assumptions: [fixed equal weights chosen before the backtest]
  - model_key: forecast.energy_combo_models
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: Energy candidate - equal-weight average of the REVA energy models available for the series (and the random walk).
    input_ports: [{name: components, kind: forecast}]
    output_ports: [{name: point_forecast}, {name: predictive}]
    applicability: {frequencies: [M], min_components: 2}
    assumptions: [fixed equal weights; mean component spread]
  # ---------------------------------------------------------------- V6 PRED-MODELS candidates (real-time evaluated;
