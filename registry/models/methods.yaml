    input_ports: [{name: component_forecasts, kind: point_or_predictive}, {name: past_errors, kind: published_outcomes}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}]
    applicability: {min_past_errors: 15}
    assumptions: [past and future normalised errors exchangeable (fails under regime change)]
  - model_key: forecast.weo_conformal
    version: "1.0.0"
    kind: forecast
