  - model_key: forecast.combo_weo_ar_persist
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      equal-weight WEO, direct AR and persistence; conformal density. Past errors pooled across series, normalised by each series' own 1-step volatility, only those whose
      outcome was published at the origin (src/reva/evaluation/pred_models/derived.py, models/forecasting/combination.py).
    input_ports: [{name: component_forecasts, kind: point_or_predictive}, {name: past_errors, kind: published_outcomes}]
    output_ports: [{name: point_forecast}, {name: predictive_empirical}]
    applicability: {min_past_errors: 15}
    assumptions: [past and future normalised errors exchangeable (fails under regime change)]
  - model_key: forecast.weo_bias_corrected
    version: "1.0.0"
    kind: forecast
    approval_status: candidate
    description: >-
      CALIBRATED INTERVAL AROUND THE IMF WEO POINT - not a better point forecast (holdout AE ratio vs WEO 0.999; its
      holdout win was against a weak benchmark, N(WEO point, persistence spread); on probation until it beats the fair
