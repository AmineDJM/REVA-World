    kg_kinds: [commodity]
  - id: finance
    fr: Finance, monnaie et budgets publics
    en: Finance, money and public budgets
    themes: [finance]
    sources: [bis, ecb, boe, nyfed, ust, kfrench, cbcal, jst, laeven_valencia, reinhart_rogoff, esrb]
