# Rows the grid cannot place: shown as "Non classé" with their count, never dropped.
other: {id: other, fr: Non classé, en: Unclassified}

# Columns: UN M49 regions/sub-regions as published in registry/entities/country_crosswalk.json (m49_region,
# m49_subregion). Entities without an M49 region there get a REVA placement, labelled as such in the API/UI.
regions:
  Africa: {fr: Afrique}
  Americas: {fr: Amériques}
  Asia: {fr: Asie}
  Europe: {fr: Europe}
  Oceania: {fr: Océanie}
  Antarctica: {fr: Antarctique}
subregions:
  Northern Africa: {fr: Afrique du Nord}
  Sub-Saharan Africa: {fr: Afrique subsaharienne}
  Latin America and the Caribbean: {fr: Amérique latine et Caraïbes}
  Northern America: {fr: Amérique du Nord}
  Central Asia: {fr: Asie centrale}
  Eastern Asia: {fr: Asie de l’Est}
  South-eastern Asia: {fr: Asie du Sud-Est}
  Southern Asia: {fr: Asie du Sud}
  Western Asia: {fr: Asie de l’Ouest}
  Eastern Europe: {fr: Europe de l’Est}
  Northern Europe: {fr: Europe du Nord}
  Southern Europe: {fr: Europe du Sud}
  Western Europe: {fr: Europe de l’Ouest}
  Australia and New Zealand: {fr: Australie et Nouvelle-Zélande}
  Melanesia: {fr: Mélanésie}
  Micronesia: {fr: Micronésie}
  Polynesia: {fr: Polynésie}
  Antarctica: {fr: Antarctique}
region_overrides:
  # REVA placement (not M49): the crosswalk has no m49_region for these four entities.
  ATA: {region: Antarctica, subregion: Antarctica, basis: "M49 lists Antarctica (010) without a region"}
  CHI: {region: Europe, subregion: Northern Europe, basis: "M49 830 Channel Islands is listed under Northern Europe"}
  TWN: {region: Asia, subregion: Eastern Asia, basis: "REVA placement: not listed separately by M49"}
  XKX: {region: Europe, subregion: Southern Europe, basis: "REVA placement: not listed by M49 (World Bank code XKX)"}
