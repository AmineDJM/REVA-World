# REVA V8 coverage domains (agent V8COUVERTURE). The rows of the coverage matrix ("what REVA has loaded per
# domain x place x time"). A domain is a reading grid over what is already stored, never a claim about the world:
# a domain with no loaded source is "not covered", it does not mean the phenomenon is absent.
#
# How an atlas table gets its domain (first match wins, see reva.v8.coverage.domains):
#   1. `tables`: an exact atlas dataset key ("atlas.<source>.<dataset>") listed under a domain;
#   2. `sources`: the table's atlas source key ("ucdp_ged") listed under a domain;
#   3. the majority theme (registry/atlas/themes.yaml) of the catalog concepts whose source order cites the table,
#      mapped through `themes` below (ties: domain order of this file);
#   4. otherwise `other` ("Non classé"), reported as such.
# A KG entity kind gets the domain whose `kg_kinds` lists it (exact kind, or a prefix ending in "*"); else `other`.
# Every theme of themes.yaml must belong to exactly one domain (tests/unit/v8/test_v8_coverage_registry.py).
schema: reva-v8-coverage-domains/1
domains:
  - id: population
    fr: Population et démographie
    en: Population and demography
    themes: [population]
    sources: [un_wpp, un_wup, hyde, cbs, insee, statsjersey, spc]
    kg_kinds: [survey_wave]
  - id: macro
    fr: Macroéconomie et travail
    en: Macroeconomy and labour
    themes: [economy, labour]
    sources: [maddison, vintage_weo, vintage_us, vintage_ea, vintage_oecd, wid, ilostat, gapminder]
    kg_kinds: [occupation, isic_code, crisis_trigger, crisis_outcome, crisis_response]
  - id: prices
