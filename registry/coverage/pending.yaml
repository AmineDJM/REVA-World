# REVA V8 — queued loads and owner decisions (agent V8COUVERTURE, transcribed 2026-10-17 from the agents' reports and
# the lead's integration todo). Machine-readable; validated by tests/unit/v8/test_v8_coverage_registry.py and
# `uv run reva v8 coverage check-pending`. Served by /v1/v8/coverage/pending and /decisions; the console
# (/v8/couverture) shows the queued loads with a live check against the database (connector acquisitions and atlas
# tables), so a load done later is shown "constaté chargé" without editing this file.
#
# type: load (a command the lead runs) | decision (something only the owner can decide or obtain)
# kind: licence | account_key | permission | disk | bigger_machine | attribution_contact | policy_choice
# status (as written in the report): open | queued | blocked | done | dropped
# disk_mb: the report's estimate of raw + stored growth (null when the report gives none). The dev box keeps a
# 5 GB free-disk floor for any ingest (docs/dev/HANDOFF_V3.md); loads are blocked by that floor, not by their size.
# No e-mail address and no personal data in this file (the validator refuses them).
schema: reva-v8-coverage-pending/1
updated: "2026-10-17"
note: "Statuses are those of the reports at transcription time; the live check of each load is computed by the API."
