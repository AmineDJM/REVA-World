# REVA World V3 — interconnection taxonomy (owner: LINKS; schema: link_types.schema.json).
#
# Two sections:
#
# * derived_links    — typed country–country / entity–entity links that src/reva/links/derive.py computes
#                      from KG statements (kg.statement) or atlas rows (atlas tables). Each one says which
#                      source properties / atlas concepts feed it, its temporal semantics, whether it may
#                      carry a weight (only a quantity the source itself reports) and its honesty wording.
# * statement_edges  — KG properties the path engine may traverse directly (one statement = one hop), with
#                      French/English labels for both traversal directions.
#
# Honesty (docs/roadmap/v3_world_graph.md):
# * A link says "connected via <label>". It is never a cause. Causal wording is reserved to statement edges
#   whose property is causal (P828 has cause, P1542 has effect; the immediate-cause / contributing-factor
#   sub-properties follow the same rule) and is always attributed: "selon <source>, X a pour cause Y".
# * A link exists only with evidence (statement ids, or atlas raw_sha256 + selector). No evidence, no link.
# * Missing is missing: no zero-filling, no imputation; an undated statement is "undated", not "always".
# * status: derivable          — the derivation is implemented and its inputs are (or will be) in the KG/atlas
#                                through an existing spec or connector;
#           awaiting_source    — implemented against the stated interface; the owning agent's data is not
#                                delivered yet (the link simply does not exist until it is);
#           no_open_source     — no open, licence-compatible source identified; nothing is derived.
#
# temporal.kind: interval (start/end of the statements, intersected for shared-* links; open bounds stay
# open), point (a dated event), snapshot (one reference year of an atlas row), undated (source gives no date).

version: 1
owner: LINKS

derived_links:
  # ---------------------------------------------------------------- geography
  - id: border_wikidata
    labels: {fr: "frontière commune (Wikidata)", en: "shared border (Wikidata)"}
    scope: country_country
    directed: false
    derivation:
      method: kg_symmetric_property
      properties: [P47]
      sources: [wikidata]
      notes: >-
        Wikidata P47 "shares border with" between two polities. Wikidata does not distinguish land from
        maritime borders on this property: the link says "shared border", never "land border".
    temporal: {kind: interval, description: "P580/P582 qualifiers of the P47 statement(s); undated otherwise"}
    weight: {kind: none}
    honesty: {fr: "relié via : frontière commune (selon Wikidata)", en: "connected via: shared border (per Wikidata)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: land_border
    labels: {fr: "frontière terrestre", en: "land border"}
    scope: country_country
    directed: false
    derivation:
      method: atlas_dyadic
      sources: [naturalearth]
      atlas:
        source: naturalearth
        datasets: [admin0_10m_borders]
        indicator_prefix: "land_border_km|partner="
        partner: flags.partner_iso3
        row_role: subject
        flow: "shared Admin-0 boundary length at 1:10m, measured by A-GEO (both directions stored; merged here)"
      notes: >-
        Natural Earth 1:10m Admin-0 map units (de facto view, release 5.1.1), adjacency and shared boundary length
        computed by A-GEO (Vincenty lengths of shared polygon edges; atlas naturalearth.admin0_10m_borders). The
        table has both directions of each pair; the undirected link keeps both rows as evidence. Borders with
        features outside the crosswalk (Somaliland, Northern Cyprus...) have no ISO3 partner and give no link.
    temporal: {kind: snapshot, description: "retrieval day of the Natural Earth release (NE does not date its boundaries)"}
    weight: {kind: source_quantity, unit: km, notes: "shared boundary length as measured on the 1:10m geometry (scale-dependent)"}
    honesty: {fr: "relié via : frontière terrestre (Natural Earth 1:10m)", en: "connected via: land border (Natural Earth 1:10m)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: land_border_cshapes
    labels: {fr: "frontière terrestre datée (CShapes)", en: "dated land border (CShapes)"}
    scope: country_country
    directed: false
    derivation:
      method: kg_dataset_border
      properties: ["cshapes:shares_border_with", "geopol:corresponds_to_iso3"]
      sources: [cshapes]
      notes: >-
        CShapes 2.0 (ETH Zurich ICR, CC BY-NC-SA 4.0: non-commercial) as loaded by KGGEOPOL: two polities valid at
        the same time share a boundary arc of the simplified topology (land borders only), 1886-2019. Territory
        entities (cshapes:gw:<code>) are mapped to crosswalk countries through their dated
        geopol:corresponds_to_iso3 statements (both statements are evidence); a territory without such a
        statement (historical state) keeps its own node.
    temporal: {kind: interval, description: "overlap of the two polities' validity (day precision), consecutive periods merged"}
    weight: {kind: none}
    honesty: {fr: "relié via : frontière terrestre datée (CShapes)", en: "connected via: dated land border (CShapes)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: maritime_neighbour
    labels: {fr: "voisin maritime", en: "maritime neighbour"}
    scope: country_country
    directed: false
    derivation:
      method: atlas_dyadic
      concepts: [geography.maritime_boundary]
      sources: [marineregions_eez]
      notes: >-
        Candidate source: Flanders Marine Institute, Maritime Boundaries / EEZ v12 (marineregions.org, CC BY
        4.0). Not ingested by any V3 agent yet; requested from A-GEO. Until then no maritime link exists.
    temporal: {kind: snapshot, description: "dataset version year"}
    weight: {kind: none}
    honesty: {fr: "relié via : frontière maritime (Marine Regions)", en: "connected via: maritime boundary (Marine Regions)"}
    causal: false
    status: no_open_source
    path_cost: 1.2

  # ---------------------------------------------------------------- language
  - id: shared_official_language
    labels: {fr: "langue officielle commune", en: "shared official language"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P37]
      sources: [wikidata]
      via: language
    temporal: {kind: interval, description: "intersection of the two P37 statements' P580/P582; undated if either is undated"}
    weight: {kind: none}
    honesty: {fr: "relié via : langue officielle commune ({via})", en: "connected via: shared official language ({via})"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: shared_language_used
    labels: {fr: "langue parlée commune", en: "shared language used"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P2936]
      sources: [wikidata]
      via: language
    temporal: {kind: interval, description: "intersection of the two P2936 statements' qualifiers; usually undated"}
    weight: {kind: none}
    honesty: {fr: "relié via : langue utilisée dans les deux pays ({via})", en: "connected via: language used in both ({via})"}
    causal: false
    status: derivable
    path_cost: 1.2

  - id: shared_language_family
    labels: {fr: "famille de langues commune", en: "shared language family"}
    scope: country_country
    directed: false
    derivation:
      method: kg_language_family
      properties: [P37, P2936, P279, P361, "glottolog:parent", "glottolog:in_group", "glottolog:family", "glottolog:wikidata_item"]
      sources: [wikidata]
      via: language_family
      notes: >-
        The official/used languages of the two countries differ but have a common ancestor through the
        P279 (subclass of) / P361 (part of) genealogy within max_depth steps. The nearest common ancestor is
        the `via` node; every genealogy statement on both chains is evidence.
    temporal: {kind: interval, description: "intersection of the two language statements; genealogy statements are undated"}
    weight: {kind: none}
    honesty: {fr: "relié via : langues de la même famille ({via})", en: "connected via: languages of the same family ({via})"}
    causal: false
    status: derivable
    path_cost: 1.5

  - id: shared_language_glottolog
    labels: {fr: "langue parlée dans les deux pays (Glottolog)", en: "language spoken in both (Glottolog)"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_subject
      properties: ["glottolog:spoken_in"]
      sources: [glottolog]
      via: language
      notes: >-
        KGLANG's Glottolog CLDF load (CC BY 4.0): languoid --glottolog:spoken_in--> country (Glottolog's Countries
        field). Two countries listed for the same language-level languoid. Glottolog lists are not speaker
        numbers and include minority languages. Bounded: a language listed in more than max_members (60)
        countries is not expanded pairwise (hub, recorded), at most 200,000 pairs. WALS / Grambank feature values
        are text values and never become links.
    temporal: {kind: undated, description: "Glottolog lists are undated (state of the release)"}
    weight: {kind: none}
    honesty: {fr: "relié via : langue parlée dans les deux pays selon Glottolog ({via})", en: "connected via: language spoken in both per Glottolog ({via})"}
    causal: false
    status: derivable
    path_cost: 1.3

  # ---------------------------------------------------------------- colonial ties, succession
  - id: colony_of
    labels: {fr: "colonie de", en: "colony of"}
    inverse_labels: {fr: "a pour colonie", en: "has colony"}
    scope: entity_entity
    directed: true
    derivation:
      method: kg_colonial
      properties: [P31, P279, P17, P361, P571, P576]
      sources: [wikidata]
      notes: >-
        Wikidata has no "colony of" property. A subject classified (P31, through P279 subclasses present in
        the KG) as colony Q133156, protectorate Q164142 or dependent territory Q161243, whose P17 (country)
        or P361 (part of) points to a polity, is linked colony_of that polity. Dates: the P17/P361 statement
        qualifiers, else the colony's inception (P571) / dissolution (P576) statements, else undated.
    temporal: {kind: interval, description: "qualifiers of P17/P361, else P571..P576 of the colony"}
    weight: {kind: none}
    honesty: {fr: "relié via : colonie de (classement et appartenance selon Wikidata)", en: "connected via: colony of (classification and membership per Wikidata)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: former_colony_of
    labels: {fr: "ancienne colonie de", en: "former colony of"}
    inverse_labels: {fr: "ancienne puissance coloniale de", en: "former colonial power of"}
    scope: country_country
    directed: true
    derivation:
      method: kg_former_colony
      properties: [P1365, P1366, P155, P156]
      sources: [wikidata]
      via: colony_and_intermediate_states
      notes: >-
        A state S that replaces (P1365 / inverse P1366, or follows P155 / P156) — directly or through at most
        max_chain intermediate states — an entity C that is colony_of P. `via` lists C and the intermediate
        states; the evidence is every succession statement plus the colony_of evidence. It is a chain of
        sourced statements, not a claim about causes or about present-day ties.
    temporal: {kind: interval, description: "the colony_of interval of C"}
    weight: {kind: none}
    honesty: {fr: "relié via : succession d'Etats depuis une colonie ({via})", en: "connected via: succession of states from a colony ({via})"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: colonial_rule_cshapes
    labels: {fr: "territoire sous l'autorité de (CShapes)", en: "territory ruled by (CShapes)"}
    inverse_labels: {fr: "autorité sur le territoire de (CShapes)", en: "ruled the territory of (CShapes)"}
    scope: country_country
    directed: true
    derivation:
      method: kg_dataset_colonial
      properties: ["cshapes:ruled_by", "geopol:corresponds_to_iso3"]
      sources: [cshapes]
      notes: >-
        CShapes 2.0 dependency periods (status colony / protectorate / mandate / occupied) with their owner state,
        loaded by KGGEOPOL as cshapes:ruled_by (dated, status in the qualifiers). The subject is the territory,
        named by the crosswalk country it corresponds to in any year (geopol:corresponds_to_iso3: the territory
        *later became* that state; its borders may differ), the object the ruling state. Status is kept in
        basis.status. Coverage starts in 1886 (earlier colonial rule, e.g. Brazil, is not in CShapes).
    temporal: {kind: interval, description: "the dependency period (day precision)"}
    weight: {kind: none}
    honesty: {fr: "relié via : territoire sous l'autorité de l'autre Etat ({status}, CShapes)", en: "connected via: territory ruled by the other state ({status}, CShapes)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: successor_of
    labels: {fr: "successeur de", en: "successor of"}
    inverse_labels: {fr: "prédécesseur de", en: "predecessor of"}
    scope: entity_entity
    directed: true
    derivation:
      method: kg_succession
      properties: [P1365, P1366, P155, P156]
      sources: [wikidata]
      notes: "S replaces P (P1365) or P is replaced by S (P1366); P155/P156 only between polities."
    temporal: {kind: point, description: "statement P585/P580 qualifier, else undated"}
    weight: {kind: none}
    honesty: {fr: "relié via : succède à", en: "connected via: succeeds"}
    causal: false
    status: derivable
    path_cost: 1.0

  # ---------------------------------------------------------------- organisations, treaties, alliances
  - id: co_member
    labels: {fr: "membres d'une même organisation", en: "co-members of an organisation"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P463]
      sources: [wikidata, kggeopol_memberships]
      via: organisation
      notes: >-
        Overlap of the two dated memberships (P463 with P580/P582). Disjoint memberships give no link.
        Organisations with more members than max_members (UN, UNESCO, WHO...) are not expanded into
        pairwise links: the membership hop through the organisation node remains available to the path
        engine, with hub damping (registry/links/hubs.yaml).
    temporal: {kind: interval, description: "intersection of the two memberships"}
    weight: {kind: none}
    honesty: {fr: "relié via : membres de {via} sur la même période", en: "connected via: both members of {via} over the same period"}
    causal: false
    status: derivable
    path_cost: 1.2

  - id: alliance_co_member
    labels: {fr: "membres d'une même alliance", en: "co-members of an alliance"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P463, P31]
      sources: [wikidata, kggeopol_memberships]
      via: organisation
      notes: "As co_member, restricted to organisations that are instances (P31/P279) of military alliance Q1127126."
    temporal: {kind: interval, description: "intersection of the two memberships"}
    weight: {kind: none}
    honesty: {fr: "relié via : membres de l'alliance {via} sur la même période", en: "connected via: both members of the alliance {via} over the same period"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: co_signatory
    labels: {fr: "co-signataires d'un traité", en: "treaty co-signatories"}
    scope: entity_entity
    directed: false
    derivation:
      method: kg_shared_subject
      properties: [P1891, P585, P571]
      sources: [wikidata]
      via: treaty
      notes: >-
        Two signatories (P1891 on the treaty) of the same treaty. Signatories may be persons (heads of state
        who signed) or states, as Wikidata records them; the link is between what the source names.
    temporal: {kind: point, description: "signature date qualifier (P585) of each signatory statement, else the treaty's P585/P571"}
    weight: {kind: none}
    honesty: {fr: "relié via : signataires de {via}", en: "connected via: signatories of {via}"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: co_party
    labels: {fr: "parties à un même traité (UNTC)", en: "parties to the same treaty (UNTC)"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_subject
      properties: ["untc:party", "untc:former_party"]
      sources: [untc]
      via: treaty
      notes: >-
        Added by LINKWIRE over A-TREATIES' KG statements (source key untc.mtdsg): two states both objects of
        untc:party statements of the same treaty (multilateral treaties deposited with the UN Secretary-General) over
        overlapping periods; start = date of each State's consent instrument as listed by UNTC (entry into force for
        the State may be later), end = the date of effect of a withdrawal when UNTC states one. untc:former_party rows
        (withdrawal without a stated date of effect) and participants outside the crosswalk (untc:participant:*, e.g.
        the European Union) give no link (counted). Near-universal treaties (more than 150 parties) are not expanded
        pairwise (recorded as near_universal_treaty_not_expanded with the party count); at most 200,000 pairs. Treaty
        nodes are mostly untc:treaty:<MTDSG number> (a few have Wikidata QIDs). UN Terms of Use: not an open licence.
    temporal: {kind: interval, description: "intersection of the two party statements (consent instrument .. withdrawal effect)"}
    weight: {kind: none}
    honesty: {fr: "relié via : parties à {via} sur la même période (selon la Collection des traités de l'ONU)", en: "connected via: both parties to {via} over the same period (per the UN Treaty Collection)"}
    causal: false
    status: derivable
    path_cost: 1.2

  # ---------------------------------------------------------------- conflicts
  - id: conflict_co_participant
    labels: {fr: "participants à un même conflit", en: "participants in the same conflict"}
    scope: entity_entity
    directed: false
    derivation:
      method: kg_conflict
      properties: [P710, P1344, P607, P580, P582, P585]
      sources: [wikidata]
      via: conflict
      notes: >-
        Wikidata P710 (participant) / P1344 (participant in) / P607 (conflict) do not record sides. The link
        says "both participants in", never "allies" or "enemies".
    temporal: {kind: interval, description: "the conflict's P580/P582 (or P585), else the statements' qualifiers"}
    weight: {kind: none}
    honesty: {fr: "relié via : tous deux participants à {via} (camps non précisés par la source)", en: "connected via: both participants in {via} (sides not stated by the source)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: conflict_same_side
    labels: {fr: "même camp dans un conflit", en: "same side in a conflict"}
    scope: country_country
    directed: false
    derivation:
      method: kg_dataset_sides
      properties: ["ucdp:primary_party", "ucdp:secondary_party", "geopol:corresponds_to_iso3"]
      sources: [ucdp]
      via: conflict
      notes: >-
        UCDP/PRIO Armed Conflict Dataset (CC BY 4.0) as loaded by KGGEOPOL: ucdp:conflict:<id> has primary or
        secondary party <state> with qualifier side = a | b, as runs of conflict-years. Two states on the
        same side over overlapping years. Secondary parties are states
        supporting a side with troops (UCDP definition); the role is kept in basis. State-code entities are
        mapped to countries through dated geopol:corresponds_to_iso3 statements (evidence too).
    temporal: {kind: interval, description: "overlap of the two parties' conflict-year runs"}
    weight: {kind: none}
    honesty: {fr: "relié via : même camp dans {via} (UCDP)", en: "connected via: same side in {via} (UCDP)"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: conflict_opposing_sides
    labels: {fr: "camps opposés dans un conflit", en: "opposing sides in a conflict"}
    scope: country_country
    directed: false
    derivation:
      method: kg_dataset_sides
      properties: ["ucdp:primary_party", "ucdp:secondary_party", "geopol:corresponds_to_iso3"]
      sources: [ucdp]
      via: conflict
      notes: >-
        UCDP/PRIO Armed Conflict Dataset (CC BY 4.0) as loaded by KGGEOPOL: ucdp:conflict:<id> has primary or
        secondary party <state> with qualifier side = a | b, as runs of conflict-years. Two states on the
        opposite sides over overlapping years. Secondary parties are states
        supporting a side with troops (UCDP definition); the role is kept in basis. State-code entities are
        mapped to countries through dated geopol:corresponds_to_iso3 statements (evidence too).
    temporal: {kind: interval, description: "overlap of the two parties' conflict-year runs"}
    weight: {kind: none}
    honesty: {fr: "relié via : camps opposés dans {via} (UCDP)", en: "connected via: opposing sides in {via} (UCDP)"}
    causal: false
    status: derivable
    path_cost: 1.0

  # ---------------------------------------------------------------- diplomacy, politics
  - id: diplomatic_relation
    labels: {fr: "relations diplomatiques", en: "diplomatic relations"}
    scope: country_country
    directed: false
    derivation:
      method: kg_symmetric_property
      properties: [P530]
      sources: [wikidata]
    temporal: {kind: interval, description: "P580/P582 qualifiers; usually undated in Wikidata"}
    weight: {kind: none}
    honesty: {fr: "relié via : relations diplomatiques (selon Wikidata)", en: "connected via: diplomatic relations (per Wikidata)"}
    causal: false
    status: derivable
    path_cost: 1.5

  - id: shared_head_of_state
    labels: {fr: "même chef d'Etat", en: "shared head of state"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P35]
      sources: [wikidata]
      via: person
      notes: "Personal unions and Commonwealth realms: the same person is head of state (P35) of both, over overlapping periods."
    temporal: {kind: interval, description: "intersection of the two P35 statements"}
    weight: {kind: none}
    honesty: {fr: "relié via : même chef d'Etat ({via}) sur la même période", en: "connected via: same head of state ({via}) over the same period"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: shared_currency
    labels: {fr: "monnaie commune", en: "shared currency"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_object
      properties: [P38]
      sources: [wikidata]
      via: currency
    temporal: {kind: interval, description: "intersection of the two P38 statements"}
    weight: {kind: none}
    honesty: {fr: "relié via : même monnaie ({via})", en: "connected via: same currency ({via})"}
    causal: false
    status: derivable
    path_cost: 1.2

  - id: shared_legal_family
    labels: {fr: "même famille juridique", en: "same legal family"}
    scope: country_country
    directed: false
    derivation:
      method: atlas_shared_value
      concepts: [law.legal_system_family]
      sources: [a_law]
      notes: >-
        Only if A-LAW ingests an open, licence-compatible classification (JuriGlobe's licence does not allow
        redistribution; CIA World Factbook "legal system" text is public domain but free text). Equal
        value_text in the same reference year.
    temporal: {kind: snapshot, description: "reference year of the classification"}
    weight: {kind: none}
    honesty: {fr: "relié via : même famille juridique ({value}) selon {source}", en: "connected via: same legal family ({value}) per {source}"}
    causal: false
    status: awaiting_source
    path_cost: 2.0

  - id: unga_vote_agreement
    labels: {fr: "part de votes identiques à l'AG de l'ONU", en: "share of identical UNGA votes"}
    scope: country_country
    directed: false
    derivation:
      method: atlas_computed
      sources: [unga]
      concepts: [unga.votes, unga.rollcalls]
      notes: >-
        COMPUTED by REVA (method links-vote-agreement/1) from the roll-call votes of Voeten et al. (Harvard
        Dataverse v33.0, CC0; atlas unga.votes + unga.rollcalls, KGGEOPOL): for a pair of states and a period
        (decade, or year in the pair view) and an issue (all roll calls, or Voeten's keyword-based issue codes
        co colonialism, hr human rights, me Palestinian conflict, nu nuclear, di disarmament, ec economic
        development), share = n_identical / n_common, where n_common counts the roll calls on which BOTH cast
        yes, no or abstain (absences and non-membership excluded) and n_identical those with the same position
        (abstain = abstain counts as identical). Requires n_common >= 10. It is a share of identical votes:
        not an alliance, not friendship, not an alignment of interests; roll-call selection and issue coding
        shape it. Historical states keep their own node (e.g. USSR Q15180 until 1991-12-20).
    temporal: {kind: interval, description: "the decade (stored) or the year (pair view) of the roll calls"}
    weight: {kind: derived_index, unit: "share of identical votes (0-1)", notes: "n_common and n_identical always in basis"}
    honesty: {fr: "relié via : part de votes identiques à l'AG de l'ONU (indice calculé, {weight})", en: "connected via: share of identical UNGA votes (computed index, {weight})"}
    causal: false
    status: derivable
    path_cost: 2.0

  # ---------------------------------------------------------------- flows (atlas)
  - id: bilateral_trade
    labels: {fr: "exportations de biens déclarées par l'exportateur", en: "goods exports reported by the exporter"}
    inverse_labels: {fr: "destination des exportations de", en: "export destination of"}
    scope: country_country
    directed: true
    derivation:
      method: atlas_dyadic
      sources: [imf]
      atlas:
        source: imf
        datasets: [imts]
        indicator_prefix: "XG_FOB_USD|partner="
        partner: flags.partner_iso3
        row_role: subject
        flow: "exports FOB as reported by the exporter (IMF IMTS)"
      notes: >-
        IMF International Trade in Goods by partner (IMTS, successor of DOTS; A-IMF table imf.imts): goods exports
        FOB reported by the row country to the partner, US dollars, one year. Mirror flows (imports reported by
        the partner) are a separate link type and are never merged or averaged. A reported zero gives no link
        (counted); a missing cell is missing.
    temporal: {kind: snapshot, description: "reference year"}
    weight: {kind: source_quantity, unit: "US dollars"}
    honesty: {fr: "relié via : exportations déclarées ({weight} {unit}, {year}, FMI IMTS)", en: "connected via: reported exports ({weight} {unit}, {year}, IMF IMTS)"}
    causal: false
    status: derivable
    path_cost: 1.5

