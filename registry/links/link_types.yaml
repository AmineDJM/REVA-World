  # ---------------------------------------------------------------- physical networks (A-INFRA; LINKS3)
  - id: submarine_cable
    labels: {fr: "câbles sous-marins listant les deux pays (Wikidata)", en: "submarine cables listing both countries (Wikidata)"}
    scope: country_country
    directed: false
    derivation:
      method: atlas_dyadic
      sources: [wikidata]
      atlas:
        source: wikidata
        datasets: [submarine_cables]
        indicator_prefix: "CABLES_SHARED|partner="
        partner: flags.partner_iso3
        row_role: subject
        companions: {first_service_year: CABLE_FIRST_SERVICE_YEAR}
        union_selector_key: wikidata_entities
        stored_in_full: true
        mapping_hops: true
        licence: "CC0-1.0 (Wikidata, community-edited, not verified by REVA)"
        caveat:
          fr: >-
            Contribution communautaire Wikidata, non vérifiée : seuls les câbles ayant un élément Wikidata comptent
            (environ 190 sur quelque 600 systèmes), et les pays sont ceux que les contributeurs ont indiqués (P17).
            Les câbles retirés ne sont pas exclus. Absence de lien = aucun élément ne liste les deux pays, pas
            « aucun câble ».
          en: >-
            Community-edited Wikidata, not verified: only cables with a Wikidata item count (about 190 of some 600
            systems), and the countries are those editors listed (P17). Retired cables are not excluded. No link =
            no item lists both countries, not "no cable".
        flow: "Wikidata cable items whose P17 lists both countries (A-INFRA emits both directions; merged here)"
      notes: >-
        A-INFRA table wikidata.submarine_cables (CC0, community-edited): CABLES_SHARED|partner=<ISO3> counts the
        Wikidata items of the cable classes (Q506572 and subclasses) whose P17 lists both countries; the table
        holds both directions of each pair, merged into one undirected link (both rows are evidence; rows that
        disagree give no link). The cable items (QID, label, service year, revision) are in basis.source_flags.cables
        and in the evidence note; CABLE_FIRST_SERVICE_YEAR (earliest P729 service entry, else P571 inception, of
        the shared cables that have one) is basis.first_service_year, cited as a second evidence row. A P17 value
        outside the crosswalk gives no link, except Q55 (Netherlands, constituent country) through the cited
        mapping hop of registry/links/geo_mapping_hops.yaml (Q55 — country (P17) → Q29999 = NLD, applied only when
        that statement is in the KG); when both Q55 and Q29999 rows reach the same pair the link counts the union
        of the listed cable items.
    temporal: {kind: snapshot, description: "retrieval day of the Wikidata items (the earliest service year of the shared cables is in basis, not a validity interval)"}
    weight: {kind: source_quantity, unit: cables, notes: "count of Wikidata cable items listing both countries (derived count of provider records, A-INFRA)"}
    honesty: {fr: "relié via : câbles sous-marins listant les deux pays (selon Wikidata, contribution communautaire)", en: "connected via: submarine cables listing both countries (per Wikidata, community-edited)"}
    causal: false
    status: derivable
    path_cost: 1.5

  - id: air_routes_2014
    labels: {fr: "liaisons aériennes directes recensées en juin 2014 (OpenFlights, données figées)", en: "direct air routes recorded in June 2014 (OpenFlights, frozen data)"}
    inverse_labels: {fr: "destination de liaisons aériennes directes (juin 2014, OpenFlights) depuis", en: "destination of direct air routes (June 2014, OpenFlights) from"}
    scope: country_country
    directed: true
    derivation:
      method: atlas_dyadic
      sources: [openflights]
      atlas:
        source: openflights
        datasets: [routes_2014]
        indicator_prefix: "ROUTES_OPERATED|partner="
        partner: flags.partner_iso3
        row_role: subject
        year_from: period_start
        companions: {airport_pairs: ROUTE_AIRPORT_PAIRS, airlines: ROUTE_AIRLINES}
        stored_in_full: true
        licence: "ODbL-1.0 (OpenFlights.org; a derived database made public must be offered under ODbL 1.0)"
        caveat:
          fr: >-
            Données figées : OpenFlights a cessé de mettre à jour ses routes en juin 2014 (avertissement du
            fournisseur) — c'est le réseau aérien de 2014, pas celui d'aujourd'hui. Licence ODbL 1.0 (attribution
            OpenFlights ; partage à l'identique pour une base dérivée publiée). Un enregistrement = une compagnie ×
            une paire d'aéroports, vols en partage de code exclus.
          en: >-
            Frozen data: OpenFlights stopped updating its routes in June 2014 (provider warning) — this is the 2014
            air network, not today's. Licence ODbL 1.0 (attribute OpenFlights; share-alike for a published derived
            database). One record = one airline × airport pair, codeshares excluded.
        flow: "routes.dat records (airline x airport pair, codeshares excluded) from the origin country to the destination country, June 2014"
      notes: >-
        A-INFRA table openflights.routes_2014 (ODbL 1.0, stale since June 2014): ROUTES_OPERATED|partner=<ISO3>,
        origin country -> destination country (row = origin). The distinct airport pairs and airlines of the same
        country pair (codeshares included) are basis.airport_pairs / basis.airlines, each cited as an evidence row.
        Every link carries the staleness and licence caveat in its basis. A country pair served only by codeshare
        records has no operated route and gives no link.
    temporal: {kind: snapshot, description: "June 2014 (reference year 2014): the provider's route data stopped being updated then"}
    weight: {kind: source_quantity, unit: routes, notes: "count of route records (derived count of provider records, A-INFRA)"}
    honesty: {fr: "relié via : liaisons aériennes directes recensées en juin 2014 (OpenFlights, ODbL ; données figées, pas le réseau actuel)", en: "connected via: direct air routes recorded in June 2014 (OpenFlights, ODbL; frozen data, not today's network)"}
    causal: false
    status: derivable
    path_cost: 2.0

  - id: launch_service
    labels: {fr: "charges utiles lancées depuis un site attribué à", en: "payloads launched from a site attributed to"}
    inverse_labels: {fr: "site de lancement (selon GCAT) de charges utiles de", en: "launch-site state (per GCAT) for payloads of"}
    scope: country_country
    directed: true
    derivation:
      method: atlas_dyadic
      sources: [gcat]
      atlas:
        source: gcat
        datasets: [payloads]
        indicator_prefix: "PAYLOADS_LAUNCHED_FROM|partner="
        partner: flags.partner_iso3
        row_role: subject
        stored_in_full: true
        licence: "CC BY 4.0 (J. C. McDowell, General Catalog of Artificial Space Objects, planet4589.org/space/gcat)"
        caveat:
          fr: >-
            Compilation d'un chercheur (GCAT, J. McDowell), non vérifiée par REVA. Le pays « propriétaire » est
            l'État du propriétaire ou de l'exploitant de la charge utile selon GCAT ; le site est rattaché à l'État
            auquel GCAT attribue l'enregistrement du site (Kourou = Guyane française GUF ; Baïkonour = URSS avant
            1989). Cela ne dit pas qui a fourni le lanceur. URSS et organisations internationales (ESA…) : non
            rattachées à un pays actuel, donc pas de lien.
          en: >-
            One researcher's compilation (GCAT, J. McDowell), not verified by REVA. The owner state is the payload
            owner/operator's state per GCAT; the site belongs to the state GCAT attributes that site record to
            (Kourou = French Guiana GUF; Baikonur = USSR before 1989). It does not say who supplied the launcher.
            USSR and intergovernmental organisations (ESA...) are not mapped to a present country: no link.
        flow: "satcat payloads of the owner state launched from a site attributed to another state, by launch year"
      notes: >-
        A-INFRA table gcat.payloads (CC BY 4.0): PAYLOADS_LAUNCHED_FROM|partner=<ISO3> = satcat payloads (Type P*)
        whose State is the row state and whose launch site (Launch_Tag -> launch.tsv -> sites.tsv StateCode) is
        attributed to the partner state, by year of LDate (objects that reached orbit). Owner -> site state.
    temporal: {kind: snapshot, description: "launch year (year of LDate)"}
    weight: {kind: source_quantity, unit: payloads, notes: "count of catalogued payloads (derived count of provider records, A-INFRA)"}
    honesty: {fr: "relié via : charges utiles de l'un lancées depuis un site attribué à l'autre (GCAT ; ne désigne pas le fournisseur du lanceur)", en: "connected via: payloads of one launched from a site attributed to the other (GCAT; does not name the launcher's supplier)"}
    causal: false
    status: derivable
    path_cost: 2.0

  # ---------------------------------------------------------------- polity territory (KGPOLITY, proposed)
  - id: shared_polity_territory
    labels: {fr: "territoires couverts par une même entité politique", en: "territories covered by the same polity"}
    scope: country_country
    directed: false
    derivation:
      method: kg_shared_subject
      properties: ["geo:covered_territory_of"]
      sources: [cliopatria]
      via: polity
      notes: >-
        Added by KGPOLITY (docs/dev/v3_kgpolity.md). Two present-day countries are the objects of
        geo:covered_territory_of statements with the same subject (a Cliopatria polity) over overlapping periods
        (e.g. Algeria and Tunisia, both partly within the Ottoman Empire's drawn borders). Each statement is a
        DERIVED spatial overlay (reva.kg.overlay) of a Cliopatria polygon (approximate borders, CC BY 4.0) with
        Natural Earth 1:10m Admin-0 (de facto view) and cites both raw artifacts and geometry digests; its
        qualifiers carry the share of the country's area (no weight: computed by REVA, not a source quantity).
        The statements are loaded (source key cliopatria.github); wired by LINKS2 (reva.links.derive.derive_shared_subject):
        polities with more than max_members (60) covered countries are not expanded pairwise (hub rule) and at most
        200,000 pairs are produced; both bounds are recorded in the derivation report.
    temporal: {kind: interval, description: "intersection of the two overlay statements' runs (first FromYear .. last ToYear, astronomical years)"}
    weight: {kind: none}
    honesty: {fr: "relié via : territoires actuels en partie couverts par {via} (superposition calculée, frontières approximatives)", en: "connected via: present-day territories partly covered by {via} (computed overlay, approximate borders)"}
    causal: false
    status: derivable
    path_cost: 1.5

  # ---------------------------------------------------------------- UN peace operations (A-MILITARY)
  - id: peacekeeping_contributor_to_host
    labels: {fr: "a fourni du personnel en uniforme à une mission de l'ONU dans", en: "contributed uniformed personnel to a UN mission in"}
    inverse_labels: {fr: "a accueilli une mission de l'ONU avec du personnel de", en: "hosted a UN mission with personnel from"}
    scope: country_country
    directed: true
    derivation:
      method: kg_dataset_peacekeeping
      properties: ["unpk:contributed_personnel_to", "unpk:mission_country"]
      sources: [unpk]
      via: mission
      notes: >-
        UN Peace and Security Data Hub (CC BY 3.0 IGO, A-MILITARY, source key un.psdata): country -> mission per
        calendar year (unpk:contributed_personnel_to) and mission -> country as reported (unpk:mission_country),
        overlapping periods. Linear in the contribution statements (one link per contribution x reported mission
        country; at most 200,000, cap recorded). The reported maximum of uniformed personnel is kept in basis (a REVA
        sum over personnel types at one reporting date), not as a weight. A deployment under a UN mandate: it says
        nothing about alliances or positions.
    temporal: {kind: interval, description: "overlap of the contribution year (first..last reporting date) and the mission-country statement"}
    weight: {kind: none}
    honesty: {fr: "relié via : personnel en uniforme fourni à {via} (ONU)", en: "connected via: uniformed personnel contributed to {via} (UN)"}
    causal: false
    status: derivable
    path_cost: 1.5

  # ---------------------------------------------------------------- sanctions (A-SANCTIONS; EVMAP)
  - id: sanction_episode
    labels: {fr: "épisodes de sanctions (menace ou imposition) visant", en: "sanctions episodes (threat or imposition) against"}
    inverse_labels: {fr: "cible d'épisodes de sanctions de", en: "target of sanctions episodes by"}
    scope: country_country
    directed: true
    derivation:
      method: atlas_dyadic
      sources: [ties, eusanct]
      atlas:
        source: ties
        extra_sources: [eusanct]
        datasets: [dyad_year]
        indicator_prefix: "CASES_ACTIVE|partner="
        partner: flags.partner_iso3
        row_role: subject
        facet_source: true
        companions: {impositions_active: IMPOSITIONS_ACTIVE}
        stored_in_full: true
        licences:
          ties: "TIES 4.1 (Morgan, Bapat, Kobayashi): no licence stated, citation requested; cite-only, redistribution not stated (maintainer review)"
          eusanct: "CC BY 4.0 (EUSANCT, Weber & Schneider; attribution required)"
        caveat:
          fr: >-
            Comptage par REVA des cas codés par le jeu de données (TIES 1945-2005, EUSANCT 1989-2015) actifs dans
            l'année, de l'émetteur vers la cible : une menace ou une imposition de sanctions, pas leur effet. TIES et
            EUSANCT se recouvrent (EUSANCT reprend des cas TIES) : leurs comptes sont montrés séparément, jamais
            additionnés. Émetteurs UE/ONU (organisations) non rattachés à un pays : pas de lien. Fin non codée : cas
            compté jusqu'à sa dernière mention (« ongoing as of »), ou l'année de début seule.
          en: >-
            REVA count of the dataset's coded cases (TIES 1945-2005, EUSANCT 1989-2015) active in the year, sender to
            target: a threat or imposition of sanctions, not their effect. TIES and EUSANCT overlap (EUSANCT re-uses
            TIES cases): their counts are shown separately, never added. EU/UN senders (organisations) are not
            mapped to a country: no link. No coded end: counted through its last report, or its start year only.
        flow: "coded sanctions cases (threat and/or imposition) of the sender against the target, active in the year"
      notes: >-
        A-SANCTIONS tables ties.dyad_year and eusanct.dyad_year (docs/dev/v3_a_sanctions.md §4): row = sender (COW
        state through the date-aware crosswalk; org:EU / org:UN / cow:1000 are organisations and stay unmapped),
        CASES_ACTIVE|partner=<ISO3> = count of the dataset's cases of that sender against that target active in the
        year (start .. coded end; end basis and case ids in flags). The same year's IMPOSITIONS_ACTIVE is a cited
        companion (basis.impositions_active). One link per source (facet source=ties|eusanct). The case events
        themselves are ties:case:* / eusanct:case:* (event type sanction_episode); coded outcomes are T1 claims of
        those cases, never of this link.
    temporal: {kind: snapshot, description: "case-active year (start .. coded end; end basis in flags)"}
    weight: {kind: source_quantity, unit: cases, notes: "count of coded cases (REVA count of TIES / EUSANCT rows; a derived count of provider records, like A-INFRA's)"}
    honesty: {fr: "relié via : épisodes de sanctions codés ({weight}, {year} ; menace ou imposition, pas un effet)", en: "connected via: coded sanctions episodes ({weight}, {year}; threat or imposition, not an effect)"}
    causal: false
    status: derivable
    path_cost: 1.5

  - id: us_sanctions_program
    labels: {fr: "programme de sanctions américain actif (OFAC) visant", en: "active US sanctions program (OFAC) against"}
    inverse_labels: {fr: "visé par un programme de sanctions américain actif (OFAC)", en: "target of an active US sanctions program (OFAC)"}
    scope: country_country
    directed: true
    derivation:
      method: atlas_dyadic
      sources: [ofac]
      atlas:
        source: ofac
        datasets: [programs]
        indicator_prefix: "ACTIVE_PROGRAMS|partner="
        partner: flags.partner_iso3
        row_role: subject
        stored_in_full: true
        licence: "public domain (US Government work, 17 U.S.C. 105)"
        caveat:
          fr: >-
            Liste des programmes actifs de l'OFAC au jour de la collecte : seuls les programmes dont le titre nomme
            exactement ce pays comptent (20 sur 36) ; les programmes thématiques ou multi-pays (lutte antiterroriste,
            Russie/Ukraine…) ne sont rattachés à aucun pays. Un programme peut viser des personnes ou entités, pas
            l'État entier.
          en: >-
            OFAC's list of active programs on the retrieval day: only programs whose title names exactly this
            country count (20 of 36); thematic or multi-country programs (counter-terrorism, Russia/Ukraine...) are
            not mapped to a country. A program may target persons or entities, not the whole state.
        flow: "active OFAC sanctions programs whose title names the partner country (row = United States)"
      notes: >-
        A-SANCTIONS table ofac.programs: ACTIVE_PROGRAMS|partner=<ISO3> (row USA) = count of active programs
        whose title names that country (registry/atlas/geo_aliases/a_sanctions.yaml); the program slugs are in
        basis.source_flags.programs.
    temporal: {kind: snapshot, description: "retrieval day of the OFAC program list"}
    weight: {kind: source_quantity, unit: programs, notes: "count of active OFAC programs naming the country (derived count of provider records)"}
    honesty: {fr: "relié via : programme de sanctions américain actif nommant ce pays (OFAC, au jour de la collecte)", en: "connected via: active US sanctions program naming this country (OFAC, on the retrieval day)"}
    causal: false
    status: derivable
    path_cost: 2.0

  # ---------------------------------------------------------------- colonial datasets (A-COLONIAL; EVMAP)
  - id: colonised_by_coldat
    labels: {fr: "colonisé par (COLDAT)", en: "colonised by (COLDAT)"}
    inverse_labels: {fr: "puissance coloniale de (COLDAT)", en: "colonial power over (COLDAT)"}
    scope: country_country
    directed: true
    derivation:
      method: kg_dataset_colonial
      properties: ["coldat:colonized_by"]
      sources: [coldat]
      notes: >-
        COLDAT v3.0 (Becker 2019, CC0; A-COLONIAL, source key harvard.dataverse.coldat): present-day country (QID)
        coldat:colonized_by colonizer (one of eight European powers), first .. last year of colonisation, one
        statement per date aggregation (last-date and mean). Statements of both aggregations with the same years
        give one link citing both; different years give one link per aggregation (basis.aggregations). One spell
        per (country, power): interruptions are not coded. Says who ruled, never why anything followed.
    temporal: {kind: interval, description: "first .. last year of colonisation as COLDAT aggregates it (year precision)"}
    weight: {kind: none}
    honesty: {fr: "relié via : colonisé par l'autre État (COLDAT, {aggregation})", en: "connected via: colonised by the other state (COLDAT, {aggregation})"}
    causal: false
    status: derivable
    path_cost: 1.0

  - id: colonial_rule_cow
    labels: {fr: "territoire sous l'autorité de (entités COW)", en: "territory ruled by (COW entities)"}
    inverse_labels: {fr: "autorité sur le territoire de (entités COW)", en: "ruled the territory of (COW entities)"}
    scope: country_country
    directed: true
    derivation:
      method: kg_dataset_colonial
      properties: ["cowent:colony_of", "cowent:protectorate_of", "cowent:mandated_to", "cowent:possession_of", "geopol:corresponds_to_iso3"]
      sources: [cow_terrchange]
      notes: >-
        COW Territorial Change v6 entities list (A-COLONIAL, source key cow.terrchange; COW terms: cite, no
        charging for access): territory cowent:<code> colony_of / protectorate_of / mandated_to / possession_of a
        state, dated as printed (begin .. end year). The territory is named by the one country it corresponds to
        (geopol:corresponds_to_iso3; basis.territory_mapping), like colonial_rule_cshapes. The list starts in 1816
        (left-censored: rule may be older) and its latest end year is 1993. Occupied_by / claimed_by / leased_to /
        part_of spells are not colonial rule and give no link.
    temporal: {kind: interval, description: "the status spell as printed in the COW entities list (year precision)"}
    weight: {kind: none}
    honesty: {fr: "relié via : territoire sous l'autorité de l'autre Etat ({status}, entités COW)", en: "connected via: territory ruled by the other state ({status}, COW entities)"}
    causal: false
    status: derivable
    path_cost: 1.0

  # ---------------------------------------------------------------- natural hazards (A-HAZARDS; EVMAP)
  - id: hazard_shared_event
    labels: {fr: "même événement naturel observé (tsunami : source → pays où des vagues ont été relevées)", en: "same natural event observed (tsunami: source → country where runups were recorded)"}
    inverse_labels: {fr: "vagues relevées d'un tsunami ayant sa source en", en: "runups recorded of a tsunami with its source in"}
    scope: country_country
    directed: true
    derivation:
      method: kg_dataset_hazard
      properties: ["ncei:country", "ncei:runup_country", "ncei:tsunami_validity"]
      sources: [noaa_ncei_hazards]
      via: event
      notes: >-
        NOAA NCEI Global Historical Tsunami Database (A-HAZARDS, source key noaa.ncei_hazards; US Government work):
        one tsunami source record ncei_hazards:tsunami:<id> with its source country (ncei:country) and the countries
        where its runups were observed (ncei:runup_country, runup record count in the qualifiers). One link per
        event and runup country other than the source country, via the event, dated by the event's P585. Records
        NCEI marks erroneous (validity -1) give no link; events with more than 60 runup countries are not expanded
        (counted); at most 200,000 links. The same event observed in two places: not a cause, not an exchange.
    temporal: {kind: point, description: "date of the tsunami source event (NCEI P585)"}
    weight: {kind: none}
    honesty: {fr: "relié via : même événement naturel observé ({via} : source dans l'un, vagues relevées dans l'autre)", en: "connected via: the same natural event observed ({via}: source in one, runups recorded in the other)"}
    causal: false
    status: derivable
    path_cost: 2.5

