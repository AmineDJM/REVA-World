    temporal: {kind: snapshot, description: "reference year"}
    weight: {kind: source_quantity, unit: "US dollars"}
    honesty: {fr: "relié via : importations déclarées ({weight} {unit}, {year}, FMI IMTS)", en: "connected via: reported imports ({weight} {unit}, {year}, IMF IMTS)"}
