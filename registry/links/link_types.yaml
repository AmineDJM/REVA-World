        UN DESA International Migrant Stock 2024 (A-UN table un_desa.ims2024): destination x origin, both sexes.
        Origin is country of birth or, for some destinations, citizenship (flags.data_type). A string zero or a
        '..' cell was never stored; a reported zero gives no link.
    temporal: {kind: snapshot, description: "reference year (1990, 1995, ..., 2020, 2024; as of 1 July)"}
    weight: {kind: source_quantity, unit: persons}
    honesty: {fr: "relié via : migrants nés dans l'un et vivant dans l'autre ({weight}, {year}, ONU DESA)", en: "connected via: migrants born in one living in the other ({weight}, {year}, UN DESA)"}
