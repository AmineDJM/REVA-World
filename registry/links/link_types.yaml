        datasets: [ims2024]
        indicator_prefix: "migrant_stock|origin="
        partner: flags.counterpart_iso3
        row_role: object
        require_dims: {sex: T}
        flow: "persons born in (or citizens of) the origin living in the destination at mid-year, both sexes"
