# REVA effect variables (agent PRED-EFFECT; contract docs/dev/v5_effect_interface.md).
#
# Variables that published effect estimates talk about but that the atlas catalog (registry/atlas/catalog/**)
# does not carry as such. Definitions are REVA's (labelled `definition_by: reva`), written from the sources'
# own variable definitions; each estimate also keeps the source's definition verbatim.
# `atlas_concepts`: a CURATED link to atlas concepts that measure the same quantity (declared by a curator
# with a note; never inferred from names). An empty list means: no atlas concept measures it yet.
schema: reva-effect-variables/1
version: 1
variables:
  - id: output.gap
    labels: {en: Output gap, fr: Écart de production}
    definition: Log real output minus its long-run (trend or potential) level, in percent.
    unit: percent of trend output
    atlas_concepts: []
  - id: output.real_gdp_level
    labels: {en: Real GDP (level), fr: PIB réel (niveau)}
    definition: Real gross domestic product, level (a multiplier relates its change, in currency, to the change of the cause in the same currency).
    unit: constant-price currency
    atlas_concepts: []
  - id: labour.unemployment_gap
    labels: {en: Unemployment gap, fr: Écart de chômage}
    definition: Unemployment rate minus its long-run (trend or natural) level, in percentage points.
    unit: percentage points
    atlas_concepts: []
  - id: labour.unemployment_rate_discounted_sum
    labels: {en: Discounted future sum of the unemployment rate, fr: Somme actualisée future du taux de chômage}
    definition: Discounted sum of current and expected future quarterly unemployment rates (the forcing term of a forward-looking Phillips curve).
    unit: percentage points (discounted sum)
    atlas_concepts: []
  - id: prices.nontradeable_inflation_regional
    labels: {en: Regional non-tradeable inflation, fr: Inflation régionale des biens non échangeables}
    definition: Cumulative four-quarter inflation of a region's (U.S. state's) price index for non-tradeable goods and services.
    unit: percentage points
    atlas_concepts: []
  - id: labour.unemployment_rate_regional
    labels: {en: Regional unemployment rate, fr: Taux de chômage régional}
    definition: Unemployment rate of a sub-national region (U.S. state).
    unit: percent of labour force
    atlas_concepts: []
  - id: oil_price.global
    labels: {en: Global crude oil price, fr: Prix mondial du pétrole brut}
    definition: World crude oil price in U.S. dollars (its percent change is "global oil price inflation").
    unit: USD per barrel
    atlas_concepts: []
  - id: energy_price.all_products
    labels: {en: Energy prices (all energy products), fr: Prix de l'énergie (tous produits énergétiques)}
    definition: Prices of all energy products (coal, crude oil and gas, refined products, electricity, gas and steam supply) as inputs and consumption goods.
    unit: index
    atlas_concepts: []
  - id: prices.consumer_level
    labels: {en: Consumer price level, fr: Niveau des prix à la consommation}
    definition: Level of a consumer price index (CPI / HICP); its percent change over a period is consumer price inflation over that period.
    unit: index
    atlas_concepts: [imf.cpi_index]
    atlas_note: imf.cpi_index is the IMF WEO consumer price index (period average); a source's HICP or CPI-before-taxes differs in coverage.
  - id: prices.producer_level
    labels: {en: Producer price level, fr: Niveau des prix à la production}
    definition: Level of producer (output) prices across branches.
    unit: index
    atlas_concepts: []
  - id: prices.import_level
    labels: {en: Import price level, fr: Niveau des prix à l'importation}
    definition: Level of import prices or the import deflator (total imports unless an estimate says otherwise).
    unit: index
    atlas_concepts: []
  - id: exchange_rate.neer_depreciation
    labels: {en: Nominal effective depreciation of the domestic currency, fr: Dépréciation effective nominale de la monnaie nationale}
    definition: Percent depreciation of the domestic currency's nominal effective exchange rate (a positive value is a depreciation).
    unit: percent
    atlas_concepts: []
  - id: fiscal.government_purchases
    labels: {en: Government purchases, fr: Achats de l'État}
    definition: Real government purchases of goods and services (consumption and investment), level.
    unit: constant-price currency
    atlas_concepts: []
  - id: trade.bilateral_trade_flow
    labels: {en: Bilateral trade flow, fr: Flux commercial bilatéral}
    definition: Value of exports from an origin country to a destination country (the dependent variable of a gravity equation).
    unit: currency
    atlas_concepts: []
  - id: trade.bilateral_trade_cost
    labels: {en: Bilateral trade cost factor, fr: Facteur de coût commercial bilatéral}
    definition: Ad valorem bilateral trade cost factor (one plus the tariff or freight rate); its elasticity is the trade elasticity.
    unit: factor (1 + rate)
    atlas_concepts: []
  - id: trade.bilateral_distance
    labels: {en: Bilateral distance, fr: Distance bilatérale}
    definition: Geographic distance between the origin and destination countries.
    unit: km
    atlas_concepts: []
  - id: trade.rta_membership
    labels: {en: Regional trade agreement in force, fr: Accord commercial régional en vigueur}
    definition: Indicator that the two countries are parties to a common regional or free trade agreement.
    unit: indicator (0/1)
    atlas_concepts: []
  - id: trade.eu_membership
    labels: {en: Both countries in the European Union, fr: Deux pays membres de l'Union européenne}
    definition: Indicator that both countries are EU members.
    unit: indicator (0/1)
    atlas_concepts: []
  - id: trade.common_currency
    labels: {en: Common currency, fr: Monnaie commune}
    definition: Indicator that the two countries share a currency (currency union).
    unit: indicator (0/1)
    atlas_concepts: []
  - id: output.real_gdp_per_capita
    labels: {en: Real GDP per capita, fr: PIB réel par habitant}
    definition: Real gross domestic product per person; its growth rate is the annual percent change.
    unit: constant-price currency per person
    atlas_concepts: []
  - id: output.world_industrial_production
    labels: {en: World industrial production, fr: Production industrielle mondiale}
    definition: Index of industrial production of a broad group of economies used as a measure of world economic activity (e.g. OECD plus six major other countries).
    unit: index
    atlas_concepts: []
  - id: oil.world_production
    labels: {en: World crude oil production, fr: Production mondiale de pétrole brut}
    definition: Quantity of crude oil produced worldwide per period.
    unit: barrels per day
    atlas_concepts: [resources.energy.eia.crude_oil_production]
    atlas_note: "Curated by agent EFFECTS-MORE (2026-10-17): the EIA series INTL.57-1-TBPD.A (crude oil incl. lease condensate, thousand b/d) at the world aggregate measures world crude oil production; sources' own definitions (e.g. 'global crude oil supply') are kept verbatim on each estimate and may differ in coverage (NGLs, condensate)."
  - id: oil.world_consumption
    labels: {en: World oil consumption, fr: Consommation mondiale de pétrole}
    definition: Quantity of crude oil (or oil products) consumed worldwide per period (oil demand).
    unit: barrels per day
    atlas_concepts: []
  - id: trade.export_restriction
    labels: {en: Export restriction, fr: Restriction à l'exportation}
    definition: A government measure restricting exports of a product (ban, quota, minimum export price or export tax); as a cause, the introduction or presence of the restriction.
    unit: indicator or ad valorem equivalent (as the estimate states)
    atlas_concepts: []
  - id: pension.minimum_pension_age
    labels: {en: Minimum pension age, fr: Âge minimum de départ à la retraite}
    definition: Statutory minimum (earliest eligibility) age at which an old-age pension can be claimed.
    unit: years of age
    atlas_concepts: []
  # --- added by agent EFFECTS-MORE (V6, 2026-10-17) ---
  - id: output.industrial_production
    labels: {en: Industrial production, fr: Production industrielle}
    definition: Index of the volume of industrial production (manufacturing, mining, utilities) of an economy or group of economies.
    unit: index
    atlas_concepts: [macro_hf.industrial_production_m_sa]
    atlas_note: "Curated by agent EFFECTS-MORE: the IMF seasonally adjusted industrial production index measures the same quantity; a source's national IP index (e.g. Federal Reserve, ONS) may differ in coverage and base."
  - id: prices.consumption_deflator
    labels: {en: Private consumption deflator, fr: Déflateur de la consommation privée}
    definition: Implicit price deflator of household (private) consumption expenditure in the national accounts.
    unit: index
    atlas_concepts: []
  - id: labour.employment_rate_affected_ages
    labels: {en: Employment rate at the ages affected by a pension-age change, fr: Taux d'emploi aux âges concernés par un changement d'âge de la retraite}
    definition: Share of persons employed among those whose age lies between the old and the new pension eligibility age (or just below the eligibility age), as defined by each study.
    unit: percent of the age group
    atlas_concepts: []
  - id: pension.receipt_rate_affected_ages
    labels: {en: Pension receipt (retirement) rate at the affected ages, fr: Taux de retraités aux âges concernés}
    definition: Share of persons receiving an old-age pension (or classified as retired) among those whose age lies between the old and the new pension eligibility age, as defined by each study.
    unit: percent of the age group
    atlas_concepts: []
  - id: labour.labour_market_exit_age
    labels: {en: Average labour-market exit age, fr: Âge moyen de sortie du marché du travail}
    definition: Average age at which members of a cohort leave employment (exit the labour market), as defined by each study.
    unit: years of age
    atlas_concepts: []
  - id: pension.claiming_age
    labels: {en: Average pension claiming age, fr: Âge moyen de liquidation de la pension}
    definition: Average age at which members of a cohort start drawing an old-age pension.
    unit: years of age
    atlas_concepts: []
  - id: climate.country_temperature
    labels: {en: Country annual mean temperature, fr: Température moyenne annuelle du pays}
    definition: Annual mean near-surface air temperature of a country (area- or population-weighted average of gridded data), degrees Celsius.
    unit: degrees Celsius
    atlas_concepts: [environment.temperature_anomaly]
    atlas_note: "Curated by agent EFFECTS-MORE: the OWID/ERA5 country temperature anomaly differs from the country mean temperature only by a constant (the 1991-2020 mean), so its year-to-year changes in °C equal temperature changes; estimates here use changes (level_change), never levels. Weighting (area vs population) may differ from the source's."
  - id: climate.global_mean_temperature
    labels: {en: Global mean surface temperature, fr: Température moyenne mondiale de surface}
    definition: Global (land and ocean) mean surface temperature, degrees Celsius.
    unit: degrees Celsius
    atlas_concepts: []
  - id: output.agricultural_value_added
    labels: {en: Agricultural value added, fr: Valeur ajoutée agricole}
    definition: Real value added of agriculture (national accounts); its growth rate is the annual percent change.
    unit: constant-price currency
    atlas_concepts: []
  - id: output.industrial_value_added
    labels: {en: Industrial value added, fr: Valeur ajoutée industrielle}
    definition: Real value added of industry (national accounts); its growth rate is the annual percent change.
    unit: constant-price currency
    atlas_concepts: []
  - id: investment.real_investment
    labels: {en: Real investment, fr: Investissement réel}
    definition: Real gross (fixed) investment of an economy; its growth rate is the annual percent change.
    unit: constant-price currency
    atlas_concepts: []
  - id: disaster.cyclone_wind_exposure
    labels: {en: Tropical cyclone wind exposure, fr: Exposition aux vents de cyclones tropicaux}
    definition: Annual nationally averaged maximum wind speed experienced from tropical cyclones (meters per second).
    unit: m/s
    atlas_concepts: []
  - id: trade.import_tariff_factor
    labels: {en: Import tariff factor (one plus the tariff), fr: Facteur tarifaire à l'importation (un plus le droit)}
    definition: One plus the ad valorem import tariff rate on a product (variety); its log change is the tariff shock of trade-war studies.
    unit: factor (1 + rate)
    atlas_concepts: []
  - id: trade.import_tariff_rate
    labels: {en: Import tariff rate, fr: Taux de droit de douane à l'importation}
    definition: Ad valorem import tariff rate applied to a product, in percent (percentage points when it changes).
    unit: percent
    atlas_concepts: []
  - id: trade.export_tariff_factor_abroad
    labels: {en: Foreign retaliatory tariff factor on a country's exports, fr: Facteur tarifaire de rétorsion appliqué à l'étranger sur les exportations}
    definition: One plus the ad valorem tariff that foreign countries apply to a country's exports of a product.
    unit: factor (1 + rate)
    atlas_concepts: []
  - id: prices.import_price_before_duty
    labels: {en: Import price before duty, fr: Prix à l'importation hors droits}
    definition: Price (unit value) charged by foreign exporters for an imported product, excluding import duties.
    unit: currency per unit
    atlas_concepts: []
  - id: prices.import_price_duty_inclusive
    labels: {en: Duty-inclusive import price, fr: Prix à l'importation droits compris}
    definition: Price (unit value or price index) paid by importers for an imported product, including import duties.
    unit: currency per unit or index
    atlas_concepts: []
  - id: trade.import_quantity
    labels: {en: Import quantity, fr: Quantité importée}
    definition: Quantity (volume) of imports of a product (variety) or aggregate.
    unit: physical units
    atlas_concepts: []
  - id: trade.import_value
    labels: {en: Import value, fr: Valeur des importations}
    definition: Value of imports of a product (variety) or aggregate.
    unit: currency
    atlas_concepts: []
  - id: prices.export_price
    labels: {en: Export price, fr: Prix à l'exportation}
    definition: Price (unit value) charged by a country's exporters for an exported product, excluding foreign duties.
    unit: currency per unit
    atlas_concepts: []
  - id: trade.export_quantity
    labels: {en: Export quantity, fr: Quantité exportée}
    definition: Quantity (volume) of exports of a product (variety) or aggregate.
    unit: physical units
    atlas_concepts: []
  - id: trade.export_value
    labels: {en: Export value, fr: Valeur des exportations}
    definition: Value of exports of a product (variety) or aggregate.
    unit: currency
    atlas_concepts: []
  - id: exchange_rate.bilateral_depreciation
    labels: {en: Bilateral depreciation of the importer's currency, fr: Dépréciation bilatérale de la monnaie de l'importateur}
    definition: Percent depreciation of the importing country's currency against the exporter's currency (a positive value is a depreciation).
    unit: percent
    atlas_concepts: []
  - id: trade.export_restriction_share
    labels: {en: Share of world trade covered by export restrictions, fr: Part du commerce mondial couverte par des restrictions à l'exportation}
    definition: Share of world trade in a product that is covered by export restrictions (bans, taxes, quotas, licensing) of exporting countries.
    unit: percent of world trade
    atlas_concepts: []
  - id: trade.price_insulation_global
    labels: {en: Price-insulating trade policy of all countries, fr: Politiques commerciales d'isolement des prix de tous les pays}
    definition: Changes in trade measures (export restrictions or taxes, import tariff cuts) by which governments insulate domestic from international food prices, aggregated over all countries in a period.
    unit: as the estimate states
    atlas_concepts: []
  - id: prices.international_food_commodity
    labels: {en: International price of a food commodity, fr: Prix international d'un produit alimentaire}
    definition: Price of a food commodity on international markets (e.g. a benchmark export price for rice, wheat, maize or edible oils), U.S. dollars.
    unit: USD per tonne
    atlas_concepts: []
  - id: fiscal.tax_revenue
    labels: {en: Tax revenue (tax change), fr: Recettes fiscales (variation des impôts)}
    definition: Government tax revenue; as a cause, an exogenous (legislated) change in taxes, usually measured in percent of GDP.
    unit: currency or percent of GDP
    atlas_concepts: []
  - id: sanctions.intensity_newspaper
    labels: {en: Sanctions intensity (newspaper coverage), fr: Intensité des sanctions (couverture de presse)}
    definition: Index of the intensity of international sanctions on a target country measured from daily newspaper coverage of sanctions (Laudati and Pesaran).
    unit: index
    atlas_concepts: []
  - id: output.real_gdp_growth_quarterly
    labels: {en: Real output growth (quarterly), fr: Croissance trimestrielle de la production réelle}
    definition: Quarter-on-quarter growth rate of real output (GDP), percent per quarter.
    unit: percent per quarter
    atlas_concepts: []
