  identification: "Partial-equilibrium computation from observed annual changes in nominal protection (domestic vs border prices) in up to 103 countries covering over 90 percent of world markets, under stated supply and demand elasticity assumptions (Distortions to Agricultural Incentives database and FAO data)"
  applicability: "REVA note: effect of the 2006-08 insulating behaviour of ALL countries together on the international price (a counterfactual computation for one historical episode), not the effect of a single country's export ban; not scalable to one country without further modelling."
