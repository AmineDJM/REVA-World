defaults:
  method: bvar
  point_kind: median
  pdf_page: 42
  scope: {countries: [WLD], period: {from: "1975-02", to: "2016-12"}, frequency: monthly,
          sample_note: "World oil market; 1958:M1-1975:M1 observations used to inform the prior; benchmark column (1)"}
  identification: "Bayesian structural VAR (oil production, OECD+6 industrial production, real oil price, inventories) with informative priors on the contemporaneous coefficients (elasticities) instead of exact identifying restrictions; posterior median and 68% posterior credibility region"
  applicability: "REVA note: short-run (within-month) world elasticities for 1975-2016; the implied price response to a given supply cut is a composition of the two elasticities (REVA's computation), not a number printed here."
estimates:
  - id: oil_supply_elasticity
    shock_profile: contemporaneous_relation
    cause: {kind: variable, id: oil_price.global, transform: log_change,
            definition: "real price of oil (refiner acquisition cost deflated), in logs"}
    effect: {kind: variable, id: oil.world_production, transform: log_change,
             definition: "world crude oil production, in logs (short-run price elasticity of oil supply αqp)"}
    measure: elasticity
    unit: ratio
    sign: positive
    point: 0.15
    as_printed: "0.15"
    uncertainty: {ci_low: 0.09, ci_high: 0.22, ci_level: 0.68, interval_kind: credible, status: reported}
    horizon: {kind: impact, value: 0, unit: month}
    locator: "Table 3 'Sensitivity of parameter inference ...', panel A 'Short-run price elasticity of oil supply αqp', column (1) Benchmark (printed p.40)"
    quote: "A. Short-run price elasticity of oil supply αqp 0.15 0.11 0.15 0.14 0.14 0.15 0.13 (0.09, 0.22)"
  - id: oil_demand_elasticity
    shock_profile: contemporaneous_relation
    cause: {kind: variable, id: oil_price.global, transform: log_change,
            definition: "real price of oil (refiner acquisition cost deflated), in logs"}
    effect: {kind: variable, id: oil.world_consumption, transform: log_change,
             definition: "world oil consumption demand, in logs (short-run price elasticity of oil demand βqp)"}
    measure: elasticity
    unit: ratio
    sign: negative
    point: -0.35
    as_printed: "-0.35"
    uncertainty: {ci_low: -0.51, ci_high: -0.24, ci_level: 0.68, interval_kind: credible, status: reported}
    horizon: {kind: impact, value: 0, unit: month}
    locator: "Table 3, panel B 'Short-run price elasticity of oil demand βqp', column (1) Benchmark (printed p.40)"
    quote: "B. Short-run price elasticity of oil demand βqp -0.35 -0.47 -0.35 -0.35 -0.35 -0.35 -0.31 (-0.51, -0.24)"
  - id: activity_12m_after_supply_shock_10pct
    shock_profile: one_time_impulse
    cause: {kind: variable, id: oil_price.global, transform: percent_change,
            definition: "oil supply shock that raises real oil price by 10% (structural supply shock at time 0, normalised by its impact on the real oil price)"}
    effect: {kind: variable, id: output.world_industrial_production, transform: log_level,
             definition: "economic activity (extended OECD+6 industrial production index), percent response 12 months later"}
    measure: response
    unit: percent
    shock: {size: 10, unit: percent}
    sign: negative
    point: -0.50
    as_printed: "-0.50"
    uncertainty: {ci_low: -0.91, ci_high: -0.17, ci_level: 0.68, interval_kind: credible, status: reported}
    horizon: {kind: at_horizon, value: 12, unit: month}
    locator: "Table 3, panel C 'Effect of oil supply shock that raises real oil price by 10% on economic activity 12 months later', column (1) Benchmark (printed p.40)"
    quote: "C. Effect of oil supply shock that raises real oil price by 10% on economic activity 12 months later -0.50 -0.62 -0.50 -0.35 -0.52 -0.49 -0.55 (-0.91, -0.17)"
