    method: local_projection
    identification: "Panel local projections of domestic CPI inflation on global oil price inflation interacted with the lagged share of transport in the CPI basket, with country and time fixed effects and two lags of inflation; coefficients rescaled by the average oil share; 90 percent bands shown in Figure 3 (not tabulated)"
    locator: "Section 4.2 'Baseline results' (printed p.12), estimates of Table 2 / Figure 3; same number in the abstract"
    quote: "The estimates suggest that a 10 percent increase in global oil price typically increases domestic inflation by 0.4 percentage point in the short term (i.e. in the year of the oil price shock), and becomes statistically insignificant two years after the shock."
    source_caveats: "We also find that the effect is asymmetric, with positive oil price shocks having a larger effect than negative ones. The impact of oil price shocks, however, has declined over time due in large part to a better conduct of monetary policy."
    applicability: "REVA note: average over 72 economies and 1970-2015; the paper reports a decline over time and cross-country differences linked to the transport share in the CPI and energy subsidies. The uncertainty is only shown graphically (Figure 3), so no standard error is stored."
