estimates:
  - id: industrial_production_month22_peak
    pdf_page: 23
    effect: {kind: variable, id: output.industrial_production, transform: log_level,
             definition: "industrial production relative to its initial value (cumulative impact on log output), maximum effect in month 22"}
    sign: negative
    point: -4.8
    as_printed: "-4.8"
    uncertainty: {ci_low: -7.6, ci_high: -2.0, ci_level: 0.9545, interval_kind: confidence, status: reported}
    horizon: {kind: at_horizon, value: 22, unit: month}
    locator: "Section IV.A (output), discussion of Figure 2 (printed p.20)"
    quote: "The estimated maximum effect is -4.8%. This means that a one-percentage-point rise in the Federal Reserve’s intentions for the funds rate, not taken in response to anticipated developments, results in a reduction in industrial production relative to its initial value of nearly 5 percent. The impact then weakens gradually, reaching -1.2% at month 48. The estimated cumulative impact in the middle months is highly significant: the t-statistic for the estimated cumulative effect in each of months 12 through 29 exceeds 2.5. The two-standard-error confidence interval for the impact in month 22 is (-7.6%, -2.0%)."
    applicability: "REVA note: the interval is printed as a two-standard-error interval; REVA records it with level 0.9545 (plus or minus two standard errors under normality)."
