defaults:
  shock_profile: one_time_impulse
  cause: {kind: atlas_concept, id: imf.policy_rate, transform: pp_change,
          definition: "an unexpected 25 basis point increase in the policy rate (conventional monetary policy shock; primary-study responses standardised to 25 bp)"}
  measure: response
  shock: {size: 0.25, unit: percentage_points}
  sign: negative
  method: meta_analysis
  uncertainty: {status: partial}
  scope: {country_group: "primary studies for a wide range of countries (not just the euro area)", sample_note: "409 primary studies, 4,871 impulse-response graphs, 81,697 point estimates; literature search ended February 2023"}
  meta: {n_studies: 409, n_estimates: 81697}
  identification: "Meta-analysis of published impulse responses to conventional monetary policy shocks (VARs, local projections, various identification schemes), responses standardised to a 25 bp shock and averaged per quarter (mean or median); estimates and standard errors winsorised at the 2nd and 98th percentiles"
  applicability: "REVA note: average across many countries, periods and identification schemes; the authors warn that meta-averages are inflated by publication bias (corrected values are loaded separately) and that responses are wide-banded (68% band excludes zero for output only between 3 and 14 quarters)."
