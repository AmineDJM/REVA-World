# AUDIT4 L5 (FIX6): why the two FIX4B retractions happened and what replaces them; the loader copies each record into
# the retraction detail of a future retraction, and the two existing retractions (load 20) carry it through an
# appended annotation (reva.effects.retired.annotate_existing_retractions).
retired:
  - id: gdp_pc_growth_year1
    reason: "horizon convention (AUDIT3 M5a): the first year of a sanction episode was stored as horizon 1 instead of h = 0 (onset year), and under the GDP-per-capita level variable with a pp unit; replaced by the h = 0..1 lag profile of the growth variable"
    replaced_by: [gdp_pc_growth_years_1_2]
    basis: "docs/dev/v6_fix4b.md (M5a); docs/dev/v5_effect_interface.md 'Horizon convention'"
  - id: gdp_pc_growth_year2
    reason: "horizon convention (AUDIT3 M5a): the second year of a sanction episode was stored as horizon 2 instead of h = 1, and under the GDP-per-capita level variable with a pp unit; replaced by the h = 0..1 lag profile of the growth variable"
    replaced_by: [gdp_pc_growth_years_1_2]
    basis: "docs/dev/v6_fix4b.md (M5a); docs/dev/v5_effect_interface.md 'Horizon convention'"
estimates:
  # FIX4B (audit AUDIT3 M5, 2026-10-17): the two growth numbers are one published lag profile. They were two
  # single-horizon estimates (gdp_pc_growth_year1 / _year2, now withdrawn_by_curator) placed one year late
  # (year 1 stored as horizon 1) and under the GDP-per-capita LEVEL variable with a pp unit. Convention
  # (docs/dev/v5_effect_interface.md, "Horizon convention"): h = 0 is the first year of the episode (onset year).
  - id: gdp_pc_growth_years_1_2
    pdf_page: 14
    effect: {kind: variable, id: output.real_gdp_per_capita_growth, transform: growth_rate,
             definition: "growth rate of GDP per capita in the first (h = 0, onset year) and second (h = 1) year of a sanction episode"}
    unit: percentage_points
    point: -1.50
    as_printed: "-1.50"
    horizon: {kind: at_horizon, value: 1, unit: year}
    irf:
      - {h: 0, unit: year, point: -1.32, as_printed: "-1.32"}
      - {h: 1, unit: year, point: -1.50, as_printed: "-1.50"}
    locator: "Section 4.2 'Results for GDP growth and its main components', Figure 1 coefficients reported in the text (printed p.13)"
    quote: "international sanctions lead to a reduction of GDP growth during the first (−1.32 pp) and second year (−1.50 pp) of a sanction episode"
    applicability: "REVA note: average over sanction episodes 1960-2016 (larger in the Cold War and for US unilateral and financial sanctions per the authors); not specific to a given sender, target or embargo type. Horizon h = 0 is the first year of the episode (the year sanctions are in force for the first time), h = 1 the second year; later years are not reported in the text (never interpolated)."
  - id: gdp_pc_level_first_two_years
    pdf_page: 14
    effect: {kind: variable, id: output.real_gdp_per_capita, transform: log_level,
             definition: "target country's GDP per capita, cumulative drop over the first two years of a sanction episode"}
    unit: percent
    point: -2.82
    as_printed: "2.82"
    printed_transform: negated
    horizon: {kind: cumulative, value: 2, unit: year}
    locator: "Section 4.2 (printed p.13)"
    quote: "The adverse effect of sanctions on GDP growth rates translates into a 2.82 percent drop in the target country’s GDP per capita over the first two years"
