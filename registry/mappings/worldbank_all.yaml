    source_ref: {provider: worldbank, indicator: NY.GDP.MKTP.CD}
    target: {concept_id: economics.gdp.nominal_current_usd, version: "1.0.0"}
    mapping_kind: exact
    version: "1.0.0"
    applicability:
      subjects: *wb_subjects
      years: {from: 2019, to: 2024}
    eligibility: eligible
