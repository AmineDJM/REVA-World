# V2 step 1 (agent ALLC): the reviewed WDI mappings of worldbank.yaml (same indicators,
# same concepts) for connector worldbank.wdi.all_economies, whose subject scope is every
# World Bank economy in registry/entities/country_crosswalk.json (217 entities; WB
# aggregates excluded). Years: the scope this step examined (2019-2024). Generated from the
# crosswalk; tests/unit/test_country_crosswalk.py checks they agree. Review status: pending
# maintainer review of the crosswalk.
connector: {name: worldbank.wdi.all_economies, version: "1.0.0"}
mappings:
  - mapping_key: wb.all.SP.POP.TOTL
    source_ref: {provider: worldbank, indicator: SP.POP.TOTL}
    target: {concept_id: demography.population.wdi_midyear_total, version: "1.0.0"}
    mapping_kind: exact
    version: "1.0.0"
    applicability:
      subjects: &wb_subjects [ABW, AFG, AGO, ALB, AND, ARE, ARG, ARM, ASM, ATG, AUS, AUT, AZE, BDI, BEL, BEN, BFA, BGD, BGR, BHR, BHS, BIH,
        BLR, BLZ, BMU, BOL, BRA, BRB, BRN, BTN, BWA, CAF, CAN, CHE, CHI, CHL, CHN, CIV, CMR, COD, COG, COL,
        COM, CPV, CRI, CUB, CUW, CYM, CYP, CZE, DEU, DJI, DMA, DNK, DOM, DZA, ECU, EGY, ERI, ESP, EST, ETH,
        FIN, FJI, FRA, FRO, FSM, GAB, GBR, GEO, GHA, GIB, GIN, GMB, GNB, GNQ, GRC, GRD, GRL, GTM, GUM, GUY,
        HKG, HND, HRV, HTI, HUN, IDN, IMN, IND, IRL, IRN, IRQ, ISL, ISR, ITA, JAM, JOR, JPN, KAZ, KEN, KGZ,
        KHM, KIR, KNA, KOR, KWT, LAO, LBN, LBR, LBY, LCA, LIE, LKA, LSO, LTU, LUX, LVA, MAC, MAF, MAR, MCO,
