# Exact mappings of the reviewed connector un.wpp (V3 agent SIMWORLD): WPP 2024 bulk CSV files ->
# dataset-input concepts (registry/concepts/demography_wpp.yaml). The connector publishes no scalar
# observations; the mappings record what each dataset input means and for which subjects (the 237 WPP
# countries/areas, crosswalk keys) and years the dataset inputs are eligible for belief releases.
connector: {name: un.wpp, version: 1.0.0}
