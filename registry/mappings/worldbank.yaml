# Mapping 1.1.0: applicability years widened to the series' full WDI coverage
# (1960-2024). Eligibility describes what the reviewed mapping covers, not what
# the connector currently fetches (it fetches 2000-2024).
connector: {name: worldbank.wdi.indicators, version: "1.0.0"}
mappings:
  - mapping_key: wb.SP.POP.TOTL
    source_ref: {provider: worldbank, indicator: SP.POP.TOTL}
    target: {concept_id: demography.population.wdi_midyear_total, version: "1.0.0"}
    mapping_kind: exact
    version: "1.1.0"
    applicability: {subjects: [FRA, DZA, CHN, USA], years: [1960, 2024]}
    eligibility: eligible
  - mapping_key: wb.NY.GDP.MKTP.CD
    source_ref: {provider: worldbank, indicator: NY.GDP.MKTP.CD}
    target: {concept_id: economics.gdp.nominal_current_usd, version: "1.0.0"}
    mapping_kind: exact
    version: "1.1.0"
    applicability: {subjects: [FRA, DZA, CHN, USA], years: [1960, 2024]}
    eligibility: eligible
