    source_ref: {provider: comtrade, cmdCode: "2709", flowCode: M, partnerCode: 0, field: netWgt}
    target: {concept_id: trade.hs2709.import_net_weight.world_total, version: "1.0.0"}
    mapping_kind: exact
    version: "1.0.0"
    applicability:
